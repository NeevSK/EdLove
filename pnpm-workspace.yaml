packages:
  - 'packages/*'
  - 'apps/*'
  - 'tooling/*'

minimumReleaseAge: 0

publicHoistPattern:
  - '*@tanstack/query-core*'
  - '*@react-navigation/*'
  - '*expo-modules-core*'
  - '*@expo/config*'
  - '*@expo/config-plugins*'
  # Expo and React Native singletons — must have exactly one physical copy for RN native builds.
  # publicHoistPattern prevents pnpm from creating workspace-local copies of these packages.
  - 'expo'
  - 'expo-*'
  - '@expo/*'
  - 'react-native'
  - 'react-native-*'
  - '@react-native*'
  - '@shopify/react-native-skia'
  - '@shopify/flash-list'
  - '@sentry/react-native'

dedupePeerDependents: true

overrides:
  "@typescript-eslint/typescript-estree>typescript": "npm:@typescript/typescript6@^6.0.2"
  "@typescript-eslint/parser>typescript": "npm:@typescript/typescript6@^6.0.2"
  "@typescript-eslint/eslint-plugin>typescript": "npm:@typescript/typescript6@^6.0.2"
  "@typescript-eslint/type-utils>typescript": "npm:@typescript/typescript6@^6.0.2"
  "@typescript-eslint/utils>typescript": "npm:@typescript/typescript6@^6.0.2"
  "typescript-eslint>typescript": "npm:@typescript/typescript6@^6.0.2"
  "@eslint-react/core>typescript": "npm:@typescript/typescript6@^6.0.2"
  "@eslint-react/eslint-plugin>typescript": "npm:@typescript/typescript6@^6.0.2"
  "eslint-import-resolver-typescript>typescript": "npm:@typescript/typescript6@^6.0.2"
  "eslint-plugin-deprecation>typescript": "npm:@typescript/typescript6@^6.0.2"
  '@zenstackhq/cli': '3.8.0'
  '@zenstackhq/orm': '3.8.0'
  '@zenstackhq/language': '3.8.0'
  '@zenstackhq/sdk': '3.8.0'
  '@zenstackhq/zod': '3.8.0'
  '@zenstackhq/schema': '3.8.0'
  zod: '4.5.4'
  zod-validation-error: '5.0.0'
  kysely: '0.28.16'
  react: '19.2.3'
  react-dom: '19.2.3'
  react-native: '~0.86.3'
  # Reanimated 4.6.x supports only Worklets 0.12.x. Keep this aligned with
  # the mobile application's explicit sacred pin; a broad older override
  # silently resolved an unsupported runtime pair.
  react-native-worklets: '0.12.2'
  react-test-renderer: '19.2.3'
  '@types/react': '^19.2.18'
  '@types/react-dom': '19.2.1'
  '@types/react-native': 'link:./packages/types-shim'
  '@types/posthog-js': 'npm:posthog-js@*'
  rimraf: '^6.1.3'
  glob: '^13.0.6'
  inflight: '*'
  abab: '*'
  domexception: '*'
  whatwg-encoding: '*'
  nitro-modules: '0.33.9'
  '@sentry/react-native': '~8.23.0'
  '@shopify/react-native-skia': '2.6.5'
  '@react-native-async-storage/async-storage': '2.2.0'
  '@expo/vector-icons': '15.1.1'
  react-native-maps: '^1.29.0'
  expo: '~57.0.22'
  '@expo/log-box': '55.0.7'
  '@expo/ui': '~57.0.18'
  expo-application: '~57.0.3'
  expo-auth-session: '~57.0.12'
  expo-blur: '~57.0.3'
  expo-brightness: '~57.0.2'
  expo-camera: '~57.0.5'
  expo-clipboard: '~57.0.2'
  expo-crypto: '~57.0.3'
  expo-device: '~57.0.2'
  expo-haptics: '~57.0.3'
  expo-image: '~57.0.5'
  expo-image-manipulator: '~57.0.17'
  expo-linear-gradient: '~57.0.2'
  expo-secure-store: '~57.0.4'
  expo-server: '~57.0.3'
  expo-web-browser: '~57.0.3'
  expo-asset: '~57.0.17'
  expo-constants: '~57.0.18'
  expo-file-system: '~57.0.7'
  expo-font: '~57.0.4'
  expo-keep-awake: '~57.0.2'
  expo-modules-core: '~57.0.18'
  '@expo/dom-webview': '~57.0.1'
  expo-image-picker: '~57.0.17'
  expo-location: '~57.0.17'
  expo-sharing: '~57.0.19'
  expo-audio: '~57.0.5'
  expo-linking: '~57.0.10'
  expo-sqlite: '~57.0.3'
  expo-video: '~57.0.4'
  expo-notifications: '~57.0.18'
  expo-symbols: '~57.0.3'
  expo-glass-effect: '~57.0.3'
  expo-media-library: '~57.0.5'
  expo-dev-client: '~57.0.19'
  expo-router: '~57.0.21'
  react-native-reanimated: '4.6.0'
  react-native-safe-area-context: '~5.9.1'
  react-native-screens: '~4.27.0'
  react-native-gesture-handler: '3.3.0'
  react-native-get-random-values: '2.0.0'
  '@react-navigation/core': '^7.21.13'
  '@types/react-test-renderer': '19.1.0'
  '@supabase/supabase-js': '2.102.1'
  '@supabase/postgrest-js': '2.102.1'
  jest-expo: '~57.0.5'
  '@expo/metro-runtime': '~57.0.15'
  # Keep the background-task pair on the same Expo 57 patch line as the mobile app.
  # Mixing task-manager 57.0.2 with the app's 57.0.7 publication makes Gradle
  # autolink two incompatible unimodules-app-loader coordinates (57.0.0/57.0.1).
  expo-background-task: '~57.0.17'
  expo-task-manager: '~57.0.17'
  expo-updates: '~57.0.22'
  expo-widgets: '~57.0.19'
  expo-build-properties: '~57.0.17'
  expo-observe: '~57.0.21'
  '@expo/fingerprint': '~0.20.13'
  lightningcss: '1.30.1'

patchedDependencies:
  '@noble/hashes@1.8.0': 'patches/@noble__hashes@1.8.0.patch'
  color@4.2.3: patches/color@4.2.3.patch
  eslint-plugin-react-native: patches/eslint-plugin-react-native.patch
  react-native-css-interop@0.1.22: patches/react-native-css-interop@0.1.22.patch

allowBuilds:
  '@biomejs/biome': true
  '@fails-components/webtransport-transport-http3-quiche': false
  '@google/genai': true
  '@img/sharp-win32-x64': true
  '@journeyapps/wa-sqlite': true
  '@parcel/watcher': true
  '@playwright/browser-chromium': true
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  '@shopify/react-native-skia': true
  '@swc/core': true
  '@zenstackhq/cli': true
  better-sqlite3: true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  node-pty: true
  onnxruntime-node: true
  prisma: true
  protobufjs: true
  react-native-enriched-markdown: true
  react-native-nitro-modules: true
  sharp: true
  supabase: true
  tesseract.js: true
  tree-sitter: true
  tree-sitter-javascript: true
  tree-sitter-typescript: true
  turbo: true
  unrs-resolver: true
  vd-tool: true
