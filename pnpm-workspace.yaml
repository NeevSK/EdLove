patchedDependencies:
  '@noble/hashes@1.8.0': 'patches/@noble__hashes@1.8.0.patch'
  'react-native-web@0.21.2': 'patches/react-native-web@0.21.2.patch'
  '@react-native-ml-kit/text-recognition': 'patches/@react-native-ml-kit__text-recognition.patch'
  '@react-native-ml-kit/barcode-scanning': 'patches/@react-native-ml-kit__barcode-scanning.patch'
  color@4.2.3: patches/color@4.2.3.patch
  eslint-plugin-react-native: patches/eslint-plugin-react-native.patch
