  '@react-native-async-storage/async-storage': '2.2.0'
  '@expo/vector-icons': '15.1.1'
  react-native-maps: '^1.27.2'
  expo: '~56.0.11'
  '@expo/log-box': '55.0.7'
  expo-application: '~56.0.3'
  expo-auth-session: '~56.0.14'
  expo-blur: '~56.0.3'
  expo-camera: '~56.0.8'
  expo-clipboard: '~56.0.4'
