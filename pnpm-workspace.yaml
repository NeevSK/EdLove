  '@sentry/cli': true
  '@shopify/react-native-skia': true
  '@swc/core': true
  '@zenstackhq/cli': true
  better-sqlite3: true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  onnxruntime-node: true
  prisma: true
  protobufjs: true
  react-native-nitro-modules: true
  sharp: true
  supabase: true
  turbo: true
  unrs-resolver: true
  vd-tool: true
