packages:
  - 'packages/*'
  - 'apps/*'
  - '!packages/trube-art'

minimumReleaseAge: 0
confirmModulesPurge: false

publicHoistPattern:
  - '*@tanstack/query-core*'
  - '*@react-navigation/*'
  - '*expo-modules-core*'
  - '*@expo/config*'
  - '*@expo/config-plugins*'

