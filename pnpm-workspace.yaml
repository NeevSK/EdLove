  "@typescript-eslint/typescript-estree>typescript": "npm:@typescript/typescript6@^6.0.0"
  "@typescript-eslint/parser>typescript": "npm:@typescript/typescript6@^6.0.0"
  "@eslint-react/core>typescript": "npm:@typescript/typescript6@^6.0.0"
  '@zenstackhq/cli': '3.6.4'
  '@zenstackhq/orm': '3.6.4'
  '@zenstackhq/language': '3.6.4'
  '@zenstackhq/sdk': '3.6.4'
  '@zenstackhq/zod': '3.6.4'
  '@zenstackhq/schema': '3.6.4'
  zod: '4.3.6'
  zod-validation-error: '5.0.0'
  kysely: '0.28.16'
  react: '19.2.3'
  react-dom: '19.2.3'
  react-native: '~0.85.3'
  react-native-worklets: '0.8.3'
  react-test-renderer: '19.2.3'
  '@types/react': '^19.2.17'
  '@types/react-dom': '19.2.1'
  '@types/react-native': 'link:./packages/types-shim'
  '@types/posthog-js': 'npm:posthog-js@*'
  rimraf: '^6.1.3'
  glob: '^13.0.6'
  inflight: '*'
  abab: '*'
  domexception: '*'
  whatwg-encoding: '*'
  nitro-modules: '0.33.9'
