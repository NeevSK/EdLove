packages:
  - 'packages/*'
  - 'apps/*'
  - 'tooling/*'

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Owner-approved 2026-11-06: taken inside the 24-hour window. Remove once matured.
  - '@zenstackhq/*'
  - '@sentry/*'
  - 'vitest-native'
  - 'next@16.4.5'
  - '@next/env@16.4.5'
  - '@next/swc-darwin-arm64@16.4.5'
  - '@next/swc-darwin-x64@16.4.5'
  - '@next/swc-linux-arm64-gnu@16.4.5'
  - '@next/swc-linux-arm64-musl@16.4.5'
  - '@next/swc-linux-x64-gnu@16.4.5'
  - '@next/swc-linux-x64-musl@16.4.5'
  - '@next/swc-win32-arm64-msvc@16.4.5'
  - '@next/swc-win32-x64-msvc@16.4.5'
  - 'eas-cli'
  - 'expo'
  - 'expo-*'
  - '@expo/*'
  - 'babel-preset-expo'
  - 'react-native'
  - 'react-native-*'
  - '@react-native*'
  - '@react-native/*'
  - 'react-native-reanimated'
  - 'react-native-worklets'
  - 'react-native-skia'
  - 'react-native-skia-graphite-*'
  - 'jest-expo'
  - '@shopify/flash-list'
  - '@swmansion/*'
  - 'react-native-screens'
  - 'react-native-maps'
  - 'react-native-pager-view'
  - 'react-native-keyboard-controller'
  - 'ai'
  - '@ai-sdk/*'
  - 'posthog-react-native'
  - '@posthog/*'
  - '@tanstack/ai'
  - 'effect'
  - '@effect/*'
  - '@intuitui-labs/*'
  - 'noxcturnal'
  - '@noxcturnal/*'
  - 'zustand'

addMissingPeerTypes: true

skills:
  dirs:
    - .agents/skills/vendor

cargo:
  enabled: true

permissions:
  '@tanstack/react-table':
    skills: false
  '@tanstack/ai':
    skills: true
  'react-native-nitro-google-signin':
    skills: true
  'dotenv':
    skills: false
  'fallow':
    skills: false
  '@swmansion/argent':
    skills: false
  '@supabase/server':
    skills: false
  'expo-sqlite':
    skills: false

sideEffectsCache:
  exclude:
    - 'react-native-skia'
    - 'react-native-nitro-modules'
    - 'react-native-mmkv'
    - 'react-native-worklets'
    - 'better-sqlite3'

publicHoistPattern:
  - '*@tanstack/query-core*'
  - '*@react-navigation/*'
  - '*expo-modules-core*'
  - '*@expo/config*'
  - '*@expo/config-plugins*'
  # Expo and React Native singletons — must have exactly one physical copy for RN native builds.
  # publicHoistPattern prevents pnpm from creating workspace-local copies of these packages.
  - 'expo'
  - 'expo-*'
  - '@expo/*'
  - 'react-native'
  - 'react-native-*'
  - '@react-native*'
  - 'react-native-skia'
  - '@shopify/flash-list'
  - '@sentry/react-native'

dedupePeerDependents: true

overrides:
  "@typescript-eslint/typescript-estree>typescript": "npm:@typescript/typescript6@^6.0.2"
  "@typescript-eslint/parser>typescript": "npm:@typescript/typescript6@^6.0.2"
  "@typescript-eslint/eslint-plugin>typescript": "npm:@typescript/typescript6@^6.0.2"
  "@typescript-eslint/type-utils>typescript": "npm:@typescript/typescript6@^6.0.2"
  "@typescript-eslint/utils>typescript": "npm:@typescript/typescript6@^6.0.2"
  "typescript-eslint>typescript": "npm:@typescript/typescript6@^6.0.2"
  "@eslint-react/core>typescript": "npm:@typescript/typescript6@^6.0.2"
  "@eslint-react/eslint-plugin>typescript": "npm:@typescript/typescript6@^6.0.2"
  "eslint-import-resolver-typescript>typescript": "npm:@typescript/typescript6@^6.0.2"
  "eslint-plugin-deprecation>typescript": "npm:@typescript/typescript6@^6.0.2"
  "@zenstackhq/cli>typescript": "npm:@typescript/typescript6@^6.0.2"
  "@zenstackhq/sdk>typescript": "npm:@typescript/typescript6@^6.0.2"
  "@zenstackhq/orm>typescript": "npm:@typescript/typescript6@^6.0.2"
  "@repo/schema>typescript": "npm:@typescript/typescript6@^6.0.2"
  typescript: '7.1.0-beta'
