[allowlist]
description = "Allowlisted files and paths"
paths = [
    "package.json",
    "pnpm-lock.yaml",
    "node_modules",
    ".git"
]

[[rules]]
description = "Supabase API Key"
id = "supabase-api-key"
regex = '''sbp_[a-f0-9]{40}'''
keywords = ["sbp"]

[[rules]]
description = "Generic Secret"
id = "generic-secret"
regex = '''(?i)(secret|password|passwd|api[_-]?key|auth[_-]?token|credentials)\s*[:=]\s*['"][^'"]+['"]'''
# Generic rule targeting likely hardcoded secret assignments
