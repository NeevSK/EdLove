# Dependency Catalog annotations — curated.
# Docs are generated: pnpm run stack-map:deps
# Fields: category (override heuristic), purpose, notes, sacred (pinned version string)

metadata:
  updated: 2026-08-09

global_tools:
  node:
    category: runtime
    purpose: "JS runtime for the whole monorepo"
    notes: "mise-managed 24.15.0; engines pin >=22.23 <23."
  pnpm:
    category: runtime
    purpose: "Workspace package manager (v11)"
    notes: "mise-managed; preinstall guard enforces pnpm; lockfile committed."
  bun:
    category: runtime
    purpose: "Script runner / bundle experiments"
    notes: "mise-managed 1.3.14; not the primary toolchain."
  dagger:
    category: ci
    purpose: "CI/CD pipelines (dagger.ts SDK)"
    notes: "Node SDK is npm (@dagger.io/dagger); dagger CLI installed separately."
  eas-cli:
    category: mobile
    purpose: "EAS build/submit for the mobile app (.easrc)"
    notes: "Expo application services CLI."
  expo-cli:
    category: mobile
    purpose: "expo prebuild / start / doctor workflows"
    notes: "NEVER run `expo install --fix` in this repo (see AGENTS.md)."
  gradle:
    category: mobile
    purpose: "Android builds (AGP, Kotlin)"
    notes: "android/ is generated — edit only via app.json config plugins."
  xcode:
    category: mobile
    purpose: "iOS builds / cocoapods"
    notes: "ios/ is generated — edit only via app.json config plugins."
  rust:
    category: native
    purpose: "Inline native module spike (spike-rust-inline)"
    notes: "Experimental path for new-arch native code."
  promptfoo:
    category: eval
    purpose: "LLM evaluation suites (promptfooconfig.yaml)"
    notes: "Run via npx/pnpm dlx."

