    category: mobile
    purpose: "Android builds (AGP, Kotlin)"
    notes: "android/ is generated — edit only via app.json config plugins."
  xcode:
    category: mobile
    purpose: "iOS builds / cocoapods"
    notes: "ios/ is generated — edit only via app.json config plugins."
  rust:
    category: native
    purpose: "Inline native module spike (spike-rust-inline)"
    notes: "Experimental path for new-arch native code."
  promptfoo:
    category: eval
    purpose: "LLM evaluation suites (promptfooconfig.yaml)"
    notes: "Run via npx/pnpm dlx."

