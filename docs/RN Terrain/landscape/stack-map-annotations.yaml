overlap_verdicts:
  naming-intuitui-labsform-builder-engine-vs-repoform-builder:
    verdict: watch
    note: "Feature host vs headless engine — keep host thin; engine is the publishable unit."
  naming-repoplatform-mcp-vs-rn-terrainmcp:
    verdict: false-alarm
    note: "Both MCP servers but different scopes: repo control plane vs ecosystem intelligence."

usecase_notes:
  @repo/sanctuary-api:
    summary: "Gurudevi backend API — Hono, @orpc, OpenTelemetry, AI SDK, Cedar authorization."
    coupling: "Binds core (contracts) + database (ZenStack) + policies (Cedar). Web/mobile talk to it; keep contracts in @repo/core."
  apps-edlove-web:
    summary: "edlove.org — public face of the EdLove ecosystem."
    coupling: "Editorial-site class: only config deps by design. Zero domain coupling."
  apps-gurudevi-marketing-web:
    summary: "Marketing web (gurudevi.edlove.org) — forms, analytics, landings."
    coupling: "Consumer shell: core + ui + analytics + form-builder. Must stay a thin site, never absorb domain logic."
  apps-intuitui-web:
    summary: "Intuitui Labs studio — systems intelligence studio presence."
    coupling: "Editorial-site class: only config deps by design. Zero domain coupling."
  apps-neevsk-web:
    summary: "Personal archive & portfolio — 'everything I want to show to the world.'"
    coupling: "Personal-site class: only config deps by design. Zero domain coupling."
  gurudevi-mobile:
    summary: "The Operational Engine — mobile app for teachers, students, and principals. Largest consumer in the workspace."
    coupling: "Pulls 14 domain packages (ai, classroom, payments, people, profile, self, scanner-kit...). Most fragile: sacred native pins + new-arch only; any domain change ripples here."
