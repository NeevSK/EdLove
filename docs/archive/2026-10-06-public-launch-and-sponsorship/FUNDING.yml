# GitHub Funding Configuration
# See https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/displaying-a-sponsor-button-in-your-repository
#
# Update these values when you enable GitHub Sponsors / Ko-fi
# Tier names and amounts can change anytime — this file just points to the platforms.

github: [your-github-username]        # e.g., "NeevSK"
ko_fi: your-ko-fi-username           # e.g., "yourname"
# patreon: your-patreon-username
# open_collective: your-collective-name
# liberapay: your-liberapay-username

# Custom links (shown in GitHub UI)
custom:
  - "https://github.com/sponsors/your-github-username"
  - "https://ko-fi.com/your-ko-fi-username"
  - "https://github.com/NeevSK/EdLove/blob/main/SPONSOR.md"