name: Doppler Contract

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  verify:
    name: Verify Doppler secret contract
    runs-on: ubuntu-latest
    environment: development
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      DOPPLER_PROJECT: gurudevi-mobile
      DOPPLER_CONFIG: dev
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1

      - name: Verify all CI environment contracts without printing values
        run: node scripts/verify-doppler-config.mjs --scope ci --all-ci --require-token
