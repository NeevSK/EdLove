name: Deploy Canary

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - staging
          - production
      feature_flag:
        description: 'Feature flag key to enable'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11.21.0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Type check
        run: pnpm exec tsc --noEmit
      
      - name: Run tests
        run: pnpm test
      
      - name: Build
        run: pnpm build
      
      - name: Deploy to ${{ github.event.inputs.environment }}
        run: |
          echo "Deploying to ${{ github.event.inputs.environment }}"
          # Add your deployment command here
          # e.g., pnpm deploy:${{ github.event.inputs.environment }}
      
      - name: Run smoke tests
        if: github.event.inputs.environment == 'staging'
        run: |
          echo "Running smoke tests against staging..."
          # Add smoke test commands
          curl -f https://staging-api.gurudevi.edlove.org/health/live
          curl -f https://staging-api.gurudevi.edlove.org/health/ready
      
      - name: Enable feature flag (canary)
        if: github.event.inputs.feature_flag != ''
        run: |
          echo "Enabling feature flag ${{ github.event.inputs.feature_flag }} for 5% canary"
          # Add GrowthBook API call to enable flag for 5%
          # curl -X PATCH "https://cdn.growthbook.io/api/features/${{ github.event.inputs.feature_flag }}" \
          #   -H "Authorization: Bearer ${{ secrets.GROWTHBOOK_API_KEY }}" \
          #   -H "Content-Type: application/json" \
          #   -d '{"rules": [{"condition": {"user": {"attributes": {"canary": true}}}, "value": true, "coverage": 0.05}]}'
      
      - name: Monitor canary
        if: github.event.inputs.feature_flag != ''
        run: |
          echo "Monitoring canary for 30 minutes..."
          # In production, this would be a loop checking metrics
          # For now, just wait and check health
          sleep 1800
          curl -f https://${{ github.event.inputs.environment }}-api.gurudevi.edlove.org/health/ready
      
      - name: Progressive rollout
        if: github.event.inputs.feature_flag != ''
        run: |
          echo "Progressive rollout: 25% → 50% → 100%"
          # In production, this would be automated with checks between each step
          # For now, manual steps:
          # 1. Increase to 25% → wait 30m → check metrics
          # 2. Increase to 50% → wait 30m → check metrics
          # 3. Increase to 100%
      
      - name: Final health check
        run: |
          curl -f https://${{ github.event.inputs.environment }}-api.gurudevi.edlove.org/health/ready
          curl -f https://${{ github.event.inputs.environment }}-api.gurudevi.edlove.org/health/live

  rollback:
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Emergency rollback
        run: |
          echo "Rolling back deployment..."
          # Disable feature flag immediately
          # curl -X PATCH "https://cdn.growthbook.io/api/features/${{ github.event.inputs.feature_flag }}" \
          #   -H "Authorization: Bearer ${{ secrets.GROWTHBOOK_API_KEY }}" \
          #   -H "Content-Type: application/json" \
          #   -d '{"defaultValue": false}'
      
      - name: Notify team
        run: |
          echo "Notifying team of rollback..."
          # Send Slack/email notification

  notify:
    runs-on: ubuntu-latest
    needs: [deploy, rollback]
    if: always()
    steps:
      - name: Notify deployment status
        run: |
          STATUS="${{ job.status }}"
          echo "Deployment ${{ github.event.inputs.environment }}: $STATUS"
          # Send Slack/email notification
