name: Browser E2E

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/gurudevi-mobile/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/browser-e2e.yml'
  push:
    branches: [ main ]
    paths:
      - 'apps/gurudevi-mobile/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gurudevi-web:
    name: Gurudevi web / Chromium
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 45
    env:
      DOPPLER_PROJECT: gurudevi-mobile
      DOPPLER_CONFIG: dev
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Verify runner toolchain
        run: node scripts/check-toolchain.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --fetch-timeout 100000

      - name: Load Doppler web environment
        uses: ./.github/actions/load-doppler-env
        with:
          project: ${{ env.DOPPLER_PROJECT }}
          config: ${{ env.DOPPLER_CONFIG }}
          token: ${{ env.DOPPLER_TOKEN }}

      - name: Install Chromium and Linux dependencies
        working-directory: apps/gurudevi-mobile
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: apps/gurudevi-mobile
        run: pnpm exec playwright test --project="Desktop Chrome"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gurudevi-playwright-report
          path: apps/gurudevi-mobile/playwright-report
          if-no-files-found: ignore
          retention-days: 14
