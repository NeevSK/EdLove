name: Sentry Sourcemap Upload

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (1.0.2)'
        required: true
      version_code:
        description: 'Android versionCode (30)'
        required: true
      environment:
        description: 'Doppler/GitHub deployment environment'
        required: true
        default: production
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  sentry-upload:
    runs-on: ubuntu-latest
    continue-on-error: true
    environment: ${{ github.event.inputs.environment || 'production' }}
    env:
      DOPPLER_PROJECT: gurudevi-mobile
      DOPPLER_CONFIG: ${{ github.event.inputs.environment == 'preview' && 'stg' || 'prd' }}
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 🏗 Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.4.2

      - name: 🏗 Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: 🔐 Load Doppler build environment
        uses: ./.github/actions/load-doppler-env
        with:
          project: ${{ env.DOPPLER_PROJECT }}
          config: ${{ env.DOPPLER_CONFIG }}
          token: ${{ env.DOPPLER_TOKEN }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile --fetch-timeout 100000

      # ── Metro bundle (JS only, no Android build) ──────────────────────────
      - name: 📦 Metro bundle
        id: metro
        continue-on-error: true
        env:
          EXPO_NO_DOCTOR: 1
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          mkdir -p /tmp/sentry-artifacts
          echo "=== Starting Metro bundle ==="
          echo "No Android build — JS only"
          echo ""

          cd apps/gurudevi-mobile

          pnpm exec expo export:embed \
            --platform android \
            --entry-file index.ts \
            --bundle-output /tmp/sentry-artifacts/index.android.bundle \
            --sourcemap-output /tmp/sentry-artifacts/index.android.bundle.map \
            --dev false \
            --minify true \
            2>&1

          METRO_EXIT=$?
          echo "metro_exit=$METRO_EXIT" >> $GITHUB_OUTPUT

          echo ""
          echo "=== Metro exit code: $METRO_EXIT ==="

      # ── Verify output ──────────────────────────────────────────────────────
      - name: 🔍 Verify bundle and sourcemap
        id: verify
        if: always()
        run: |
          echo "=== /tmp/sentry-artifacts contents ==="
          ls -lah /tmp/sentry-artifacts/ 2>/dev/null || echo "(directory missing)"
          echo ""

          BUNDLE="/tmp/sentry-artifacts/index.android.bundle"
          MAP="/tmp/sentry-artifacts/index.android.bundle.map"

          if [ -f "$BUNDLE" ] && [ -f "$MAP" ]; then
            echo "✅ Bundle : $(wc -c < $BUNDLE) bytes"
            echo "✅ Map    : $(wc -c < $MAP) bytes"
            echo "available=true" >> $GITHUB_OUTPUT
          else
            [ ! -f "$BUNDLE" ] && echo "❌ Bundle not found"
            [ ! -f "$MAP" ]    && echo "❌ Sourcemap not found"
            echo "available=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      # ── Sentry upload ──────────────────────────────────────────────────────
      - name: 🚀 Sentry sourcemap upload
        id: sentry-upload
        if: steps.verify.outputs.available == 'true'
        env:
          SENTRY_ORG: intuitui-labs
          SENTRY_PROJECT: gurudevi-mobile
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "❌ SENTRY_AUTH_TOKEN not set — refusing an unmapped release"
            exit 1
          fi

          VERSION="${{ github.event.inputs.version }}"
          VERSION_CODE="${{ github.event.inputs.version_code }}"
          RELEASE="app.gurudevi.sanctuary@${VERSION}+${VERSION_CODE}"
          BUNDLE_PATH="/tmp/sentry-artifacts/index.android.bundle"
          MAP_PATH="/tmp/sentry-artifacts/index.android.bundle.map"
          STRIP_PREFIX="$GITHUB_WORKSPACE/apps/gurudevi-mobile"

          echo "=== Sentry sourcemap upload ==="
          echo "   Org     : intuitui-labs"
          echo "   Project : gurudevi-mobile"
          echo "   Release : $RELEASE"
          echo "   Dist    : $VERSION_CODE"
          echo ""

          if [ ! -f "$BUNDLE_PATH" ] || [ ! -f "$MAP_PATH" ]; then
            echo "❌ Required upload artifacts are missing"
            echo "   Bundle path: $BUNDLE_PATH"
            echo "   Map path   : $MAP_PATH"
            exit 1
          fi

          cd apps/gurudevi-mobile
          echo "Attempting modern Expo upload mode (debug-id-reference)..."
          MODERN_OK=0
          for ATTEMPT in 1 2 3; do
            echo "Modern upload attempt $ATTEMPT/3"
            if pnpm exec sentry-cli sourcemaps upload \
              --org "$SENTRY_ORG" \
              --project "$SENTRY_PROJECT" \
              --debug-id-reference \
              --strip-prefix "$STRIP_PREFIX" \
              --validate \
              "$BUNDLE_PATH" \
              "$MAP_PATH"; then
              MODERN_OK=1
              break
            fi
            sleep $((ATTEMPT * 10))
          done

          if [ "$MODERN_OK" -eq 0 ]; then
            echo "⚠️ Modern upload mode failed. Falling back to release/dist mode..."
            for ATTEMPT in 1 2 3; do
              echo "Legacy upload attempt $ATTEMPT/3"
              if pnpm exec sentry-cli sourcemaps upload \
                --org "$SENTRY_ORG" \
                --project "$SENTRY_PROJECT" \
                --release "$RELEASE" \
                --dist "$VERSION_CODE" \
                --strip-prefix "$STRIP_PREFIX" \
                --validate \
                "$BUNDLE_PATH" \
                "$MAP_PATH"; then
                MODERN_OK=1
                break
              fi
              sleep $((ATTEMPT * 10))
            done
          fi

          if [ "$MODERN_OK" -eq 1 ]; then
            UPLOAD_EXIT=0
          else
            UPLOAD_EXIT=1
          fi
          echo ""
          if [ $UPLOAD_EXIT -eq 0 ]; then
            echo "✅ Upload complete"
          else
            echo "⚠️ Upload failed with exit code $UPLOAD_EXIT"
          fi

      # ── Summary ───────────────────────────────────────────────────────────
      - name: 📋 Summary
        if: always()
        run: |
          echo "=== Summary ==="
          echo "Version      : ${{ github.event.inputs.version }}"
          echo "versionCode  : ${{ github.event.inputs.version_code }}"
          echo "Metro bundle : ${{ steps.metro.outcome }}"
          echo "Artifacts    : ${{ steps.verify.outputs.available }}"
          echo "Sentry upload: ${{ steps.sentry-upload.outcome }}"
          if [ "${{ steps.sentry-upload.outcome }}" != "success" ]; then
            echo "::warning::Sentry source-map upload failed or was skipped; the build/bundle remains usable, but Sentry stack traces may be unmapped."
          fi
