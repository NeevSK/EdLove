name: Android EAS Release Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS profile to build remotely
        required: true
        default: preview
        type: choice
        options: [preview, production]
      github_gate:
        description: Confirm the GitHub APK build and device checks already passed
        required: true
        type: choice
        options: [github-apk-verified]

permissions:
  contents: read

jobs:
  trigger-eas:
    name: Trigger isolated EAS Android build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.profile == 'production' && 'production' || 'preview' }}
    if: inputs.github_gate == 'github-apk-verified'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.4.2
      - name: Setup EAS CLI
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e
        with:
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}
      - name: Trigger remote EAS build
        working-directory: apps/gurudevi-mobile
        run: |
          eas build \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --no-wait
