name: Monorepo Clockwork Guard 🦅

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  guard:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Verify runner toolchain
        run: node scripts/check-toolchain.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --fetch-timeout 100000

      - name: Check Icon Bridge Contract
        run: pnpm check:icons

      - name: Run Linter
        run: pnpm lint

      - name: Anti-slop scan (informational)
        if: always()
        continue-on-error: true
        run: |
          pnpm run audit:aislop || true
          pnpm run audit:fallow || true

      - name: Observability ownership boundaries
        run: pnpm run check:observability-boundaries

      - name: Sanctuary experience contract
        run: pnpm run check:sanctuary-experience

      - name: Check Types
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm check-types

      - name: OTA safety check (informational)
        if: always()
        continue-on-error: true
        run: |
          echo "Checking OTA safety..."
          pnpm run check:ota-safety || echo "⚠️ OTA fingerprint drift detected — binary build required before OTA"
