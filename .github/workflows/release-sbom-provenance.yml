name: Release — SBOM & Provenance

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.2.3)'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    outputs:
      sbom_path: ${{ steps.sbom.outputs.path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --fetch-timeout 100000

      - name: Generate SBOM (SPDX JSON)
        id: sbom
        run: |
          VERSION="${{ github.event.release.tag_name || github.event.inputs.version }}"
          pnpm sbom --format=spdx-json > sbom-${VERSION}.spdx.json
          echo "path=sbom-${VERSION}.spdx.json" >> $GITHUB_OUTPUT
          echo "Generated SBOM: sbom-${VERSION}.spdx.json"
          cat sbom-${VERSION}.spdx.json | head -50

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-${{ github.event.release.tag_name || github.event.inputs.version }}
          path: ${{ steps.sbom.outputs.path }}
          retention-days: 90

      - name: Attach SBOM to release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ steps.sbom.outputs.path }}
          asset_name: ${{ steps.sbom.outputs.path }}
          asset_content_type: application/json

  provenance:
    name: Generate SLSA Provenance
    runs-on: ubuntu-latest
    needs: sbom
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --fetch-timeout 100000

      - name: Build all packages
        run: pnpm build

      - name: Generate provenance
        uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a
        with:
          artifact: 'dist'
          provenance-name: 'provenance.intoto.jsonl'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload provenance as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provenance-${{ github.event.release.tag_name || github.event.inputs.version }}
          path: provenance.intoto.jsonl
          retention-days: 90

      - name: Attach provenance to release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: provenance.intoto.jsonl
          asset_name: provenance.intoto.jsonl
          asset_content_type: application/jsonl