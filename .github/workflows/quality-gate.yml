name: Quality Gate (PR Guard)

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: 🏗 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install

      - name: ✨ Lint
        run: pnpm lint

      - name: 🔍 Type-Check (Mobile)
        run: |
          cd apps/gurudevi-mobile
          npx tsc --noEmit

      - name: 🧪 Unit Tests
        run: pnpm test
