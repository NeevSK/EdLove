name: Quality Gate (PR Guard)

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: 🏗 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.9.0

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile --fetch-timeout 100000

      - name: 🔍 Verify Module Resolution (Critical CSS)
        run: |
          cd apps/gurudevi-mobile
          node -e "try { require.resolve('@repo/ui/global.css'); console.log('✅ @repo/ui/global.css is resolvable'); } catch(e) { console.error('❌ @repo/ui/global.css NOT found'); process.exit(1); }"

      - name: ✨ Lint (Oxlint + ESLint)
        run: pnpm lint

      - name: 🩺 React Doctor
        run: pnpm run audit:react-doctor

      - name: 🔍 Type-Check
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm check-types

      - name: 🌐 i18n policy checks
        run: pnpm run i18n:check

      - name: 🧪 Unit Tests
        run: pnpm test

      - name: 📊 Test Coverage
        run: pnpm test --coverage

      - name: 🔒 Security Scan
        run: pnpm run audit:security
