name: Deep Quality Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: deep-quality-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ['24']
      fail-fast: false
    timeout-minutes: 45
    environment: development
    env:
      DOPPLER_PROJECT: gurudevi-mobile
      DOPPLER_CONFIG: dev
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 🏗 Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.4.2

      - name: 🏗 Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile --fetch-timeout 100000

      - name: 🪲 Validate Gurudevi mascot asset manifest
        run: pnpm --filter @repo/ui validate-mascot-assets

      - name: 🧭 Platform production-readiness contract
        run: pnpm check:platform-readiness

      - name: 🏛️ Sanctuary API tests
        run: pnpm --filter @repo/sanctuary-api test

      - name: 🌐 Gurudevi marketing web build
        run: pnpm --filter apps-gurudevi-marketing-web build

      - name: 🔐 Load optional audit environment from Doppler
        if: ${{ env.DOPPLER_TOKEN != '' }}
        uses: ./.github/actions/load-doppler-env
        with:
          project: ${{ env.DOPPLER_PROJECT }}
          config: ${{ env.DOPPLER_CONFIG }}
          token: ${{ env.DOPPLER_TOKEN }}

      - name: 🔍 Check Icon Bridge Contract
        run: pnpm check:icons

      - name: 🔍 Verify Module Resolution (Critical CSS)
        run: |
          cd apps/gurudevi-mobile
          node -e "try { require.resolve('@repo/ui/global.css'); console.log('✅ @repo/ui/global.css is resolvable'); } catch(e) { console.error('❌ @repo/ui/global.css NOT found'); process.exit(1); }"

      - name: 🎨 Validate NativeWind v5 style stack
        working-directory: apps/gurudevi-mobile
        run: |
          pnpm run audit:style-stack
          pnpm run audit:css-interop

      - name: ✨ Lint (Oxlint + ESLint)
        run: pnpm lint

      - name: 🛡️ Anti-slop scan (informational)
        if: always()
        continue-on-error: true
        run: |
          pnpm run audit:aislop || true
          pnpm run audit:fallow || true

      - name: 🔭 Observability ownership boundaries
        run: pnpm run check:observability-boundaries

      - name: 🧭 Sanctuary experience contract
        run: pnpm run check:sanctuary-experience

      - name: 🩺 React Doctor
        run: pnpm run audit:react-doctor

      - name: 🔍 Type-Check
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm check-types

      - name: ♻️ Feature lifecycle contract
        run: pnpm run audit:feature-lifecycle

      - name: 📱 OTA safety check (informational)
        if: always()
        continue-on-error: true
        run: |
          echo "Checking OTA safety..."
          pnpm run check:ota-safety || echo "⚠️ OTA fingerprint drift detected — binary build required before OTA"

      - name: 🔐 ZenStack and Cedar authorization parity
        run: pnpm run audit:authorization-parity

      - name: 🧹 Feature lifecycle archival dry run
        run: pnpm run feature-lifecycle:archive

      - name: 🧪 Feature lifecycle focused tests
        run: pnpm run test:feature-lifecycle

      - name: 🌱 GrowthBook control-plane inventory
        if: ${{ env.DOPPLER_TOKEN != '' }}
        env:
          GROWTHBOOK_FEATURE_SCOPE_PREFIX: ${{ vars.GROWTHBOOK_FEATURE_SCOPE_PREFIX }}
        run: pnpm run audit:feature-lifecycle:control-plane

      - name: 🗄️ Legacy feature schema evidence
        if: ${{ env.DOPPLER_TOKEN != '' }}
        run: pnpm run feature-lifecycle:schema-check -- --execute

      - name: 🌐 i18n policy checks
        run: pnpm run i18n:check

      - name: 🧪 Unit Tests
        run: pnpm test

      - name: 📊 Test Coverage
        run: pnpm test --coverage

      - name: 🔒 Security Scan
        run: pnpm run audit:security

      - name: 🔍 Accessibility Assertions
        run: pnpm test -- --testNamePattern="accessibility|a11y|toBeAccessible|toHaveLabel|toHaveRole" --passWithNoTests

      - name: 📦 Bundle Analysis
        run: pnpm run audit:bundle

      - name: 📱 Maestro E2E (Mobile)
        if: ${{ env.DOPPLER_TOKEN != '' }}
        run: |
          if [ -z "${MAESTRO_KEY:-}" ]; then
            echo "MAESTRO_KEY is not configured in Doppler; skipping Maestro."
            exit 0
          fi
          curl -Ls https://get.maestro.mobile/install.sh | bash
          export PATH="$PATH:$HOME/.maestro/bin"
          maestro test apps/gurudevi-mobile/maestro/flows/

      - name: 🎨 Contrast Validation (WCAG AA)
        run: pnpm run audit:contrast

      - name: 📏 Font Scaling Test (200%)
        run: pnpm run audit:font-scaling
