name: Manual Android Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production
      build_method:
        description: 'Build Method'
        required: true
        default: 'local'
        type: choice
        options:
          - local
          - remote
      build_type:
        description: 'Build Type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
          - both

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event.inputs.build_type }}" == "both" ]; then
            echo "matrix=[\"apk\", \"aab\"]" >> $GITHUB_OUTPUT
          else
            echo "matrix=[\"${{ github.event.inputs.build_type }}\"]" >> $GITHUB_OUTPUT
          fi

  build:
    needs: prep
    runs-on: ubuntu-latest
    strategy:
      matrix:
        type: ${{ fromJson(needs.prep.outputs.matrix) }}
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: 🏗 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 🏗 Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🏗 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🏗 Setup Gradle Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 📦 Install dependencies
        run: pnpm install --fetch-timeout 100000

      - name: 🚀 Build App
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          # 1. Ensure pnpm allows the Sentry CLI to run
          pnpm config set side-effects-cache false
          
          # 2. Approve pnpm build scripts
          pnpm approve-builds --yes || true
          
          cd apps/gurudevi-mobile
          
          # 3. Trigger Build
          # The custom Sentry plugin will handle property injection during prebuild.
          # Ensure you have run: eas secret:create --scope project --name sentry-auth-token --value <token>
          if [ "${{ github.event.inputs.build_method }}" == "local" ]; then
            echo "🏗️ Starting LOCAL EAS Build..."
            eas build --platform android --profile ${{ github.event.inputs.profile }} --non-interactive --local --output=app.${{ matrix.type }} | tee ../../eas_build_log.txt
          else
            echo "☁️ Triggering REMOTE EAS Build..."
            eas build --platform android --profile ${{ github.event.inputs.profile }} --non-interactive --no-wait
          fi

      - name: 📤 Upload Artifact
        if: github.event.inputs.build_method == 'local'
        uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ matrix.type }}
          path: apps/gurudevi-mobile/app.${{ matrix.type }}

      - name: 🚀 Sentry Sourcemap Upload
        if: github.event.inputs.build_method == 'local'
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: intuitui-labs
          SENTRY_PROJECT: gurudevi-mobile
        run: |
          # SENTRY_AUTH_TOKEN must be added to GitHub repo secrets:
          # Settings → Secrets and variables → Actions → New repository secret
          # Name: SENTRY_AUTH_TOKEN
          # EAS secrets do NOT work for local builds — use GitHub secrets here.
          
          cd apps/gurudevi-mobile
          
          # 1. Try extracting versionCode from EAS build log
          # Look for "Incrementing versionCode from X to Y" (remote source)
          # OR "Using versionCode X"
          VERSION_CODE=$(grep -o 'Incrementing versionCode from .* to [0-9]*' ../../eas_build_log.txt | grep -o 'to [0-9]*' | awk '{print $2}' || true)
          
          # 2. Fallback: Extract from merged AndroidManifest.xml if build log failed
          if [ -z "$VERSION_CODE" ]; then
            MANIFEST_PATH="./android/app/build/intermediates/merged_manifests/release/AndroidManifest.xml"
            if [ -f "$MANIFEST_PATH" ]; then
              VERSION_CODE=$(grep 'android:versionCode' "$MANIFEST_PATH" | grep -o 'android:versionCode="[0-9]*"' | grep -o '[0-9]*' | head -n 1 || true)
            fi
          fi
          
          # 3. Last fallback: Read from app.json (might be one behind, but better than nothing)
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode" || echo "1")
          fi
          
          VERSION=$(node -p "require('./app.json').expo.version")
          
          BUNDLE_PATH="./android/app/build/generated/assets/react/release/index.android.bundle"
          MAP_PATH="./android/app/build/generated/sourcemaps/react/release/index.android.bundle.map"
          
          if [ -f "$BUNDLE_PATH" ] && [ -f "$MAP_PATH" ]; then
            echo "📦 Uploading sourcemaps for Release: org.edlove.gurudevi@$VERSION+$VERSION_CODE (dist: $VERSION_CODE)"
            
            pnpm exec sentry-cli sourcemaps upload \
              --release "org.edlove.gurudevi@$VERSION+$VERSION_CODE" \
              --dist "$VERSION_CODE" \
              "$BUNDLE_PATH" "$MAP_PATH"
          else
            echo "⚠️ Bundle or sourcemap not found at standard paths. Skipping Sentry upload."
          fi

