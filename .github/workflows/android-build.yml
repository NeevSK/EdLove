name: Android APK Build (GitHub)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/gurudevi-mobile/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/android-build.yml'

concurrency:
  group: android-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build release-mode APK with debug signing on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reclaim hosted-runner disk
        shell: bash
        run: |
          set -euo pipefail
          echo 'Disk before cleanup:'
          df -h /
          # The standard hosted image is storage-constrained. These tools are
          # not used by this Android/Expo lane and compete with Gradle/NDK.
          sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sudo rm -rf "$android_sdk/ndk" "$android_sdk/ndk-bundle"
          sudo apt-get clean
          docker system prune --all --force || true
          echo 'Disk after cleanup:'
          df -h /
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install pinned Android NDK
        run: sdkmanager "ndk;27.1.12297006"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --fetch-timeout 100000
      - name: Report dependency disk usage
        run: |
          df -h /
          du -sh node_modules apps/gurudevi-mobile/node_modules packages/*/node_modules 2>/dev/null | sort -h | tail -20 || true
      - name: Validate mobile contracts
        working-directory: apps/gurudevi-mobile
        run: |
          pnpm run audit:expo-native-graph
          pnpm run audit:boundaries
          pnpm run audit:style-stack
          pnpm run audit:css-interop
      - name: Generate native project
        working-directory: apps/gurudevi-mobile
        env:
          EXPO_NO_DOCTOR: '1'
        run: pnpm exec expo prebuild --no-install --platform android
      - name: Assemble release-mode APK
        working-directory: apps/gurudevi-mobile/android
        env:
          GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=2'
        run: |
          df -h /
          ./gradlew :app:assembleRelease --stacktrace
      - name: Upload device-test APK
        uses: actions/upload-artifact@v4
        with:
          name: gurudevi-github-device-apk-${{ github.sha }}
          path: apps/gurudevi-mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
