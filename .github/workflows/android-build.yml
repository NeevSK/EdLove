name: Manual Android Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production
      build_method:
        description: 'Build Method'
        required: true
        default: 'local'
        type: choice
        options:
          - local
          - remote
      build_type:
        description: 'Build Type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
          - both

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event.inputs.build_type }}" == "both" ]; then
            echo "matrix=[\"apk\", \"aab\"]" >> $GITHUB_OUTPUT
          else
            echo "matrix=[\"${{ github.event.inputs.build_type }}\"]" >> $GITHUB_OUTPUT
          fi

  build:
    needs: prep
    runs-on: ubuntu-latest
    strategy:
      matrix:
        type: ${{ fromJson(needs.prep.outputs.matrix) }}
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: 🏗 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 🏗 Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🏗 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🏗 Setup Gradle Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 📦 Install dependencies
        run: pnpm install --fetch-timeout 100000

      - name: 🚀 Build App
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: 'intuitui-labs'
          SENTRY_PROJECT: 'gurudevi-mobile'
        run: |
          # 1. Ensure pnpm allows the Sentry CLI to run
          pnpm config set side-effects-cache false
          
          # 2. Approve pnpm build scripts (important for isolated eas local build)
          pnpm approve-builds --yes || true
          
          cd apps/gurudevi-mobile
          
          # 3. Run prebuild (this clears/reinitializes the android folder)
          echo "🚀 Starting Expo Prebuild..."
          npx expo prebuild --platform android --no-install
          
          # 4. Sentry Linking Guard: Ensure plugin is present in build.gradle
          if ! grep -q "sentry.gradle" android/app/build.gradle; then
            echo "⚠️ Sentry plugin missing from build.gradle, injecting manually..."
            echo 'apply from: new File(["node", "--print", "require('\''path'\'').dirname(require.resolve('\''@sentry/react-native/package.json'\''))"].execute().text.trim(), "sentry.gradle")' >> android/app/build.gradle
          else
            echo "✅ Sentry plugin confirmed in build.gradle"
          fi

          # 5. Export Sentry credentials for potential CLI usage
          export SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN
          export SENTRY_ORG=$SENTRY_ORG
          export SENTRY_PROJECT=$SENTRY_PROJECT

          # 6. Trigger Build (Source maps will be generated but not uploaded by Gradle)
          if [ "${{ github.event.inputs.build_method }}" == "local" ]; then
            echo "🏗️ Starting LOCAL EAS Build..."
            eas build --platform android --profile ${{ github.event.inputs.profile }} --non-interactive --local --output=app.${{ matrix.type }}
          else
            echo "☁️ Triggering REMOTE EAS Build..."
            eas build --platform android --profile ${{ github.event.inputs.profile }} --non-interactive --no-wait
          fi

      - name: 📡 Upload Sentry Source Maps
        if: github.event.inputs.build_method == 'local'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: 'intuitui-labs'
          SENTRY_PROJECT: 'gurudevi-mobile'
        run: |
          echo "📡 Manually uploading source maps to Sentry..."
          cd apps/gurudevi-mobile
          
          # Uploading for version 1.0.0 (matches app.json)
          npx @sentry/cli react-native gradle \
            --bundle android/app/build/generated/assets/react/release/index.android.bundle \
            --sourcemap android/app/build/generated/sourcemaps/react/release/index.android.bundle.map \
            --release org.edlove.gurudevi@1.0.0 \
            --dist 19

      - name: 📤 Upload Artifact
        if: github.event.inputs.build_method == 'local'
        uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ matrix.type }}
          path: apps/gurudevi-mobile/app.${{ matrix.type }}

