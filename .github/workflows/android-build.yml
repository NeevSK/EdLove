name: Manual Android Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production
      build_method:
        description: 'Build Method'
        required: true
        default: 'local'
        type: choice
        options:
          - local
          - remote
      build_type:
        description: 'Build Type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
          - both

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1: Determine build matrix
  # ─────────────────────────────────────────────────────────────────────────
  prep:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event.inputs.build_type }}" == "both" ]; then
            echo 'matrix=["apk", "aab"]' >> $GITHUB_OUTPUT
          else
            echo 'matrix=["${{ github.event.inputs.build_type }}"]' >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2: Pre-bundle with Metro to capture sourcemaps
  # ─────────────────────────────────────────────────────────────────────────
  prebundle:
    needs: prep
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      sourcemaps_available: ${{ steps.check.outputs.sourcemaps_available }}
    steps:
      # --- OPTIMIZATION: Maximize space for Pre-bundling ---
      - name: 🧹 Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: false # Keep Android components safe
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: 🏗 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.9.0

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile --fetch-timeout 100000

      - name: 🔍 Verify Module Resolution (Critical CSS)
        run: |
          cd apps/gurudevi-mobile
          node -e "try { require.resolve('@repo/ui/global.css'); console.log('✅ @repo/ui/global.css is resolvable'); } catch(e) { console.error('❌ @repo/ui/global.css NOT found'); process.exit(1); }"

      - name: 🔍 Debug — Runner environment
        run: |
          echo "=== Runner info ==="
          echo "OS: $(uname -a)"
          echo "Node: $(node --version)"
          echo "pnpm: $(pnpm --version)"
          echo "Workspace: $GITHUB_WORKSPACE"
          echo ""
          echo "=== Disk space ==="
          df -h
          echo ""
          echo "=== /tmp contents ==="
          ls -la /tmp/ || true

      - name: 🔍 Debug — Sentry auth token presence
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "❌ SENTRY_AUTH_TOKEN is NOT set."
          else
            TOKEN_LEN=${#SENTRY_AUTH_TOKEN}
            TOKEN_PREVIEW="${SENTRY_AUTH_TOKEN:0:4}...${SENTRY_AUTH_TOKEN: -4}"
            echo "✅ SENTRY_AUTH_TOKEN is set (length: $TOKEN_LEN, preview: $TOKEN_PREVIEW)"
          fi

      - name: 🔍 Debug — sentry-cli version and auth check
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: intuitui-labs
          SENTRY_PROJECT: gurudevi-mobile
        run: |
          cd apps/gurudevi-mobile
          pnpm exec sentry-cli --version || echo "❌ sentry-cli not found"

      - name: 📦 Pre-bundle with Metro
        id: metro
        continue-on-error: true
        env:
          EXPO_NO_DOCTOR: 1
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          EXPO_PUBLIC_INNGEST_EVENT_KEY: ${{ secrets.INNGEST_EVENT_KEY }}
          EXPO_PUBLIC_POWERSYNC_URL: ${{ secrets.POWERSYNC_URL }}
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          mkdir -p /tmp/sentry-artifacts
          cd apps/gurudevi-mobile
          pnpm exec expo export:embed \
            --platform android \
            --entry-file index.ts \
            --bundle-output /tmp/sentry-artifacts/index.android.bundle \
            --sourcemap-output /tmp/sentry-artifacts/index.android.bundle.map \
            --dev false \
            --minify true \
            2>&1

      - name: 🔍 Debug — Verify bundle and sourcemap output
        id: check
        if: always()
        run: |
          BUNDLE="/tmp/sentry-artifacts/index.android.bundle"
          MAP="/tmp/sentry-artifacts/index.android.bundle.map"
          BUNDLE_OK=false
          MAP_OK=false

          if [ -f "$BUNDLE" ]; then BUNDLE_OK=true; fi
          if [ -f "$MAP" ]; then MAP_OK=true; fi

          if [ "$BUNDLE_OK" = true ] && [ "$MAP_OK" = true ]; then
            echo "sourcemaps_available=true" >> $GITHUB_OUTPUT
          else
            echo "sourcemaps_available=false" >> $GITHUB_OUTPUT
          fi

      - name: 📤 Upload sourcemap artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentry-artifacts-prebundle
          path: /tmp/sentry-artifacts/
          if-no-files-found: warn
          retention-days: 3

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3: Build the app (CRITICAL DISK OPTIMIZATION ADDED HERE)
  # ─────────────────────────────────────────────────────────────────────────
  build:
    needs: [prep, prebundle]
    runs-on: ubuntu-latest
    if: always()
    strategy:
      matrix:
        type: ${{ fromJson(needs.prep.outputs.matrix) }}
    steps:
      # --- CRITICAL FIX: Reclaim ~25-30GB of space before compiling native Android code ---
      - name: 🧹 Free Disk Space (Prevent System.IO.IOException)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: false # MUST remain false so your setup-android action can locate native tools
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: 🏗 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.9.0

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: 🏗 Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🏗 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🏗 Setup Gradle Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 📦 Install dependencies
        run: pnpm install --fetch-timeout 100000

      - name: 🔍 Debug — prebundle job outcome
        run: |
          echo "=== Prebundle job result ==="
          echo "prebundle result : ${{ needs.prebundle.result }}"
          echo "sourcemaps_available: ${{ needs.prebundle.outputs.sourcemaps_available }}"

      - name: 📥 Restore pre-built bundle
        if: needs.prebundle.outputs.sourcemaps_available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: sentry-artifacts-prebundle
          path: /tmp/sentry-artifacts

      - name: 🔍 Debug — Confirm bundle restored on this runner
        if: needs.prebundle.outputs.sourcemaps_available == 'true'
        run: |
          echo "=== Restored artifacts on build runner ==="
          ls -lah /tmp/sentry-artifacts/ || echo "(nothing restored)"

      - name: 🔍 Debug — Verify sentry.properties after prebuild
        if: github.event.inputs.build_method == 'local'
        run: |
          find $GITHUB_WORKSPACE -name "sentry.properties" 2>/dev/null || echo "(none found yet)"

      - name: 🚀 Build App
        env:
          EXPO_NO_DOCTOR: 1
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          EXPO_PUBLIC_INNGEST_EVENT_KEY: ${{ secrets.INNGEST_EVENT_KEY }}
          EXPO_PUBLIC_POWERSYNC_URL: ${{ secrets.POWERSYNC_URL }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          pnpm config set side-effects-cache false
          pnpm approve-builds --yes 2>/dev/null || true

          cd apps/gurudevi-mobile

          if [ "${{ github.event.inputs.build_method }}" == "local" ]; then
            echo "🏗️ Starting LOCAL EAS Build..."

            if [ "${{ needs.prebundle.outputs.sourcemaps_available }}" == "true" ]; then
              export EXPO_BUNDLE_APP=0
            fi

            eas build \
              --platform android \
              --profile ${{ github.event.inputs.profile }} \
              --non-interactive \
              --local \
              --output=app.${{ matrix.type }} \
              2>&1 | tee /tmp/eas_build_log.txt

            mkdir -p /tmp/sentry-artifacts
            grep -o 'Incrementing versionCode from .* to [0-9]*' /tmp/eas_build_log.txt \
              | grep -o '[0-9]*$' \
              | tail -n 1 \
              | tr -d '[:space:]' \
              > /tmp/sentry-artifacts/versionCode.txt 2>/dev/null || true

            if [ ! -s /tmp/sentry-artifacts/versionCode.txt ]; then
              grep -o '"versionCode": *"[0-9]*"' /tmp/eas_build_log.txt \
                | grep -o '[0-9]*' \
                | tail -n 1 \
                | tr -d '[:space:]' \
                > /tmp/sentry-artifacts/versionCode.txt 2>/dev/null || true
            fi
          else
            echo "☁️ Triggering REMOTE EAS Build..."
            eas build \
              --platform android \
              --profile ${{ github.event.inputs.profile }} \
              --non-interactive \
              --no-wait
          fi

      - name: 📤 Upload Build Artifact
        if: github.event.inputs.build_method == 'local'
        uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ matrix.type }}
          path: apps/gurudevi-mobile/app.${{ matrix.type }}

      - name: 📤 Re-upload Sentry artifacts with versionCode
        if: |
          github.event.inputs.build_method == 'local' &&
          needs.prebundle.outputs.sourcemaps_available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sentry-artifacts-final-${{ matrix.type }}
          path: /tmp/sentry-artifacts/
          retention-days: 3

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 4: Upload sourcemaps to Sentry
  # ─────────────────────────────────────────────────────────────────────────
  sentry-upload:
    needs: [prep, prebundle, build]
    runs-on: ubuntu-latest
    continue-on-error: true
    if: |
      needs.build.result == 'success' &&
      needs.prebundle.outputs.sourcemaps_available == 'true' &&
      github.event.inputs.build_method == 'local'
    strategy:
      matrix:
        type: ${{ fromJson(needs.prep.outputs.matrix) }}
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: 🏗 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.9.0

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --fetch-timeout 100000

      - name: 📥 Download Sentry artifacts
        uses: actions/download-artifact@v4
        with:
          name: sentry-artifacts-final-${{ matrix.type }}
          path: /tmp/sentry-artifacts

      - name: 🚀 Sentry Sourcemap Upload
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: intuitui-labs
          SENTRY_PROJECT: gurudevi-mobile
        run: |
          BUNDLE_PATH="/tmp/sentry-artifacts/index.android.bundle"
          MAP_PATH="/tmp/sentry-artifacts/index.android.bundle.map"
          STRIP_PREFIX="$GITHUB_WORKSPACE/apps/gurudevi-mobile"

          VERSION_CODE=$(cat /tmp/sentry-artifacts/versionCode.txt 2>/dev/null | tr -d '[:space:]')
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE=$(node -p "require('./apps/gurudevi-mobile/app.json').expo.android.versionCode")
          fi

          VERSION=$(node -p "require('./apps/gurudevi-mobile/app.json').expo.version")
          RELEASE="org.edlove.gurudevi@${VERSION}+${VERSION_CODE}"

          cd apps/gurudevi-mobile

          UPLOAD_OK=0
          for ATTEMPT in 1 2 3; do
            if pnpm exec sentry-cli sourcemaps upload \
              --org "$SENTRY_ORG" \
              --project "$SENTRY_PROJECT" \
              --debug-id-reference \
              --strip-prefix "$STRIP_PREFIX" \
              --validate \
              "$BUNDLE_PATH" \
              "$MAP_PATH"; then
              UPLOAD_OK=1
              break
            fi
            sleep $((ATTEMPT * 10))
          done

          if [ "$UPLOAD_OK" -eq 0 ]; then
            for ATTEMPT in 1 2 3; do
              if pnpm exec sentry-cli sourcemaps upload \
                --org "$SENTRY_ORG" \
                --project "$SENTRY_PROJECT" \
                --release "$RELEASE" \
                --dist "$VERSION_CODE" \
                --strip-prefix "$STRIP_PREFIX" \
                --validate \
                "$BUNDLE_PATH" \
                "$MAP_PATH"; then
                UPLOAD_OK=1
                break
              fi
              sleep $((ATTEMPT * 10))
            done
          fi

          if [ "$UPLOAD_OK" -ne 1 ]; then
            exit 1
          fi