name: Android APK Build (GitHub)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/gurudevi-mobile/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/android-build.yml'

concurrency:
  group: android-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build release-mode APK with debug signing on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # These are public client configuration values. They are injected from
      # existing repository secrets so Metro can build a real device APK
      # without requiring a Doppler service token in GitHub Actions.
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reclaim hosted-runner disk
        shell: bash
        run: |
          set -euo pipefail
          echo 'Disk before cleanup:'
          df -h /
          # The standard hosted image is storage-constrained. These tools are
          # not used by this Android/Expo lane and compete with Gradle/NDK.
          sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/local/share/dotnet /opt/hostedtoolcache/CodeQL
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sudo rm -rf "$android_sdk/ndk" "$android_sdk/ndk-bundle"
          sudo apt-get clean
          docker system prune --all --force || true
          echo 'Disk after cleanup:'
          df -h /
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.4.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: temurin
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install pinned Android NDK
        run: sdkmanager "ndk;27.1.12297006"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --fetch-timeout 100000
      - name: Report dependency disk usage
        run: |
          df -h /
          du -sh node_modules apps/gurudevi-mobile/node_modules packages/*/node_modules 2>/dev/null | sort -h | tail -20 || true
      - name: Validate mobile contracts
        working-directory: apps/gurudevi-mobile
        run: |
          pnpm run audit:expo-native-graph
          pnpm run audit:boundaries
          pnpm run audit:style-stack
          pnpm run audit:css-interop
      - name: Preflight Android JavaScript bundle
        working-directory: apps/gurudevi-mobile
        env:
          EXPO_NO_DOCTOR: '1'
          NODE_ENV: production
        run: |
          node -e "console.log(require.resolve('babel-preset-expo'))"
          pnpm exec expo export:embed \
            --platform android \
            --entry-file index.ts \
            --bundle-output "$RUNNER_TEMP/gurudevi-preflight.android.bundle" \
            --sourcemap-output "$RUNNER_TEMP/gurudevi-preflight.android.bundle.map"
      - name: Generate native project
        working-directory: apps/gurudevi-mobile
        env:
          EXPO_NO_DOCTOR: '1'
        run: pnpm exec expo prebuild --no-install --platform android
      - name: Assemble release-mode APK
        working-directory: apps/gurudevi-mobile/android
        env:
          GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=2'
        run: |
          df -h /
          ./gradlew :app:assembleRelease --stacktrace
      - name: Upload device-test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gurudevi-github-device-apk-${{ github.sha }}
          path: apps/gurudevi-mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
