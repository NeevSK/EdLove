name: Gurudevi Platform — Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Cloudflare Pages deployment target'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

concurrency:
  group: cloudflare-gurudevi-platform-${{ github.event.inputs.environment || 'preview' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and deploy Expo web to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'preview' }}
    env:
      DOPPLER_PROJECT: gurudevi-mobile
      DOPPLER_CONFIG: ${{ github.event.inputs.environment == 'production' && 'prd' || 'stg' }}
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Load Doppler build environment
        uses: ./.github/actions/load-doppler-env
        with:
          project: ${{ env.DOPPLER_PROJECT }}
          config: ${{ env.DOPPLER_CONFIG }}
          token: ${{ env.DOPPLER_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --fetch-timeout 100000

      - name: Build Expo web export
        working-directory: apps/gurudevi-mobile
        env:
          EXPO_PUBLIC_GURUDEVI_MARKETING_URL: https://gurudevi.edlove.org
          EXPO_PUBLIC_GURUDEVI_APP_URL: https://platform.gurudevi.edlove.org
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm build:web

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          command: >-
            pages deploy apps/gurudevi-mobile/dist
            --project-name gurudevi-platform
            --branch ${{ github.event.inputs.environment == 'production' && 'main' || 'preview' }}
            --commit-dirty=true
