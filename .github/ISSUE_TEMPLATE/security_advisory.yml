name: Security Advisory
description: Report a security vulnerability privately
title: "[SECURITY] "
labels: ["security", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Thank you for reporting a security issue responsibly.**

        Please do **not** open a public issue for security vulnerabilities.
        Instead, use this form to report directly to the maintainers.

        For urgent issues, you can also email: **security@edlove.org**

  - type: input
    id: reporter
    attributes:
      label: Your Name / Handle
      description: How should we address you?
      placeholder: "e.g., @username or Jane Doe"
    validations:
      required: true

  - type: input
    id: contact
    attributes:
      label: Contact Email
      description: Where can we reach you for follow-up?
      placeholder: "you@example.com"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Estimated Severity
      description: How severe do you believe this issue is?
      options:
        - Critical (RCE, data breach, auth bypass)
        - High (privilege escalation, significant data exposure)
        - Medium (information disclosure, DoS)
        - Low (minor information leak, cosmetic)
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of the codebase is affected?
      options:
        - Gurudevi Mobile (React Native / Expo)
        - EdLove Web (Astro)
        - Gurudevi Marketing Web (Astro)
        - Sanctuary API (Hono / Node.js)
        - Gurudevi Web (Next.js)
        - Core packages (@repo/core, @repo/ui, etc.)
        - Infrastructure / CI/CD
        - Dependencies (npm supply chain)
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Vulnerability Description
      description: |
        Provide a clear, concise description of the vulnerability.
        Include:
        - What the vulnerability is
        - How it can be exploited
        - What the impact is
        - Any proof-of-concept (if safe to share)
      placeholder: |
        When a user calls the `/api/profile/social-links` endpoint with a malformed UUID...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: |
        Provide step-by-step instructions to reproduce the issue.
        Include code snippets, curl commands, or API requests if applicable.
      placeholder: |
        1. Start the Sanctuary API server
        2. Send POST request to /api/profile/social-links with body: {...}
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact Assessment
      description: |
        What is the potential impact if this vulnerability is exploited?
        Consider: data exposed, users affected, systems compromised, etc.
      placeholder: |
        An attacker could enumerate all user social links without authentication,
        exposing PII for ~50,000 users.
    validations:
      required: true

  - type: textarea
    id: suggested_fix
    attributes:
      label: Suggested Fix (Optional)
      description: |
        If you have ideas for how to fix this, share them here.
        This helps us respond faster.
      placeholder: |
        Add authentication middleware to the /profile/social-links routes...
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: |
        Include relevant environment information:
        - Version/commit hash
        - Deployment environment (local, staging, production)
        - Node.js version, pnpm version
        - OS
      placeholder: |
        - Commit: abc1234
        - Environment: production
        - Node: 22.23.2
        - pnpm: 12.14.0
        - OS: Ubuntu 22.04
    validations:
      required: false

  - type: checkboxes
    id: disclosure
    attributes:
      label: Responsible Disclosure Agreement
      description: |
        By submitting this report, you agree to:
      options:
        - label: I have not disclosed this vulnerability publicly
          required: true
        - label: I will allow reasonable time for a fix before public disclosure
          required: true
        - label: I understand this will be handled privately by maintainers
          required: true