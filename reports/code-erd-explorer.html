<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sanctuary Code-ERD Explorer</title>
  <style>
    :root {
      --bg: #090d16;
      --panel-bg: #111827;
      --card-bg: #1e293b;
      --card-header: #334155;
      --border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --fn: #60a5fa;
      --type: #c084fc;
      --const: #34d399;
      --bedrock: #10b981;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #sidebar {
      width: 380px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    #sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    #sidebar-header h2 {
      margin: 0 0 6px 0;
      font-size: 17px;
      color: var(--accent);
    }
    #sidebar-header p {
      margin: 0 0 12px 0;
      font-size: 12px;
      color: var(--text-muted);
    }
    #search-box {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    #search-box:focus { border-color: var(--accent); }
    #file-tree {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .tree-item {
      padding: 8px 12px;
      border-radius: 6px;
      background: #1e293b;
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s;
    }
    .tree-item:hover {
      background: #283548;
      border-color: #475569;
    }
    .tree-item.active {
      background: #1e3a5f;
      border-color: var(--accent);
    }
    .tree-name {
      font-size: 13px;
      font-weight: 500;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }
    .tree-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #94a3b8;
    }
    .tree-badge.bedrock {
      background: rgba(16, 185, 129, 0.15);
      border-color: #10b981;
      color: #34d399;
      font-weight: 600;
    }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #111a2e 0%, #090d16 100%);
    }
    #main-toolbar {
      padding: 12px 24px;
      background: rgba(17, 24, 39, 0.85);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    .btn {
      background: #1e293b;
      border: 1px solid var(--border);
      color: #f1f5f9;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn:hover {
      background: #334155;
      border-color: var(--accent);
    }
    .btn.active {
      background: var(--accent);
      color: #090d16;
      font-weight: 600;
    }

    #workspace {
      flex: 1;
      overflow: auto;
      padding: 32px;
      display: flex;
      gap: 32px;
      align-items: flex-start;
    }

    /* Code-ERD Table Box */
    .erd-table {
      width: 360px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
      transition: all 0.2s ease;
    }
    .erd-table.focused {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.4), 0 12px 32px rgba(0,0,0,0.7);
      transform: scale(1.02);
    }
    .erd-table.upstream-highlight {
      border-color: #f59e0b;
      box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.4);
    }
    .erd-table.downstream-highlight {
      border-color: #10b981;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.4);
    }
    .erd-header {
      padding: 12px 16px;
      background: var(--card-header);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .erd-title {
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
    }
    .erd-layer {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #0f172a;
      border: 1px solid #475569;
      color: #38bdf8;
    }
    .erd-section {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.5);
    }
    .erd-section-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .erd-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      cursor: pointer;
    }
    .erd-row:hover { background: #1e293b; }
    .erd-row.fn { color: var(--fn); }
    .erd-row.type { color: var(--type); }
    .erd-row.const { color: var(--const); }
    .erd-row-badge {
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 3px;
      background: #0f172a;
      color: #64748b;
    }

    #trace-panel {
      position: absolute;
      bottom: 24px;
      left: 404px;
      right: 24px;
      background: rgba(17, 24, 39, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: none;
      z-index: 50;
    }
    #trace-panel h4 {
      margin: 0 0 8px 0;
      color: var(--accent);
      font-size: 14px;
    }
    .trace-flow {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      font-size: 12px;
    }
    .trace-step {
      background: #1e293b;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .trace-arrow { color: #64748b; font-weight: bold; }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="sidebar-header">
      <h2>Sanctuary Code-ERD</h2>
      <p>Select any file to inspect its internal columns (functions/types) and trace relations to bedrock.</p>
      <input type="text" id="search-box" placeholder="Search file, function, or type..." oninput="filterTree()">
    </div>
    <div id="file-tree"></div>
  </div>

  <div id="main">
    <div id="main-toolbar">
      <div id="current-file-label" style="font-size: 14px; font-weight: 600; color: #f1f5f9">
        Select a file from the sidebar
      </div>
      <div class="btn-group">
        <button class="btn" onclick="traceBedrock()">⚡ Trace to Bedrock (Downstream)</button>
        <button class="btn" onclick="traceUpstream()">🚀 Trace Callers (Upstream)</button>
        <button class="btn" onclick="clearHighlights()">Clear Filter</button>
      </div>
    </div>

    <div id="workspace"></div>

    <div id="trace-panel">
      <button style="float: right; background: transparent; border: none; color: #94a3b8; font-size: 16px; cursor: pointer" onclick="document.getElementById('trace-panel').style.display='none'">✕</button>
      <h4 id="trace-title">Lineage Trace</h4>
      <div class="trace-flow" id="trace-flow-content"></div>
    </div>
  </div>

.ts","isTypeOnly":true,"symbols":["Action","Subject"]},{"source":"@repo/core/types/Identity","canonical":"packages/core/src/types/Identity.ts","isTypeOnly":true,"symbols":["Bond","CitizenshipTier"]}],"content":"import { useAuthority } from '@repo/core/logic/permissions/authority';\nimport {\n  CITIZENSHIP,\n  type FeatureRequirement,\n  type SanctuaryFeatureResult,\n  sanctuaryFeature,\n} from '@repo/core/logic/permissions/sanctuaryFeature';\nimport {\n  resolveFeatureFlagClass,\n  resolveFeatureFlagValue,\n} from '@repo/core/logic/registry/featureLifecycleManifest';\nimport type { Capacity } from '@repo/core/logic/schemas/capacity.schema';\nimport type { UserContext } from '@repo/core/logic/schemas/user.schema';\nimport type { FeatureFlags } from '@repo/core/store/types/featureFlags';\nimport type { Action, Subject } from '@repo/core/types/authorization';\nimport type { Bond, CitizenshipTier } from '@repo/core/types/Identity';\nimport { useMemo } from 'react';\n\nexport type UseSanctuaryFeatureReturn = SanctuaryFeatureResult & {\n  context: UserContext;\n  activeBond: Bond | null;\n  citizenship: CitizenshipTier;\n  primaryCapacity: Capacity | null;\n  effectiveCapacity: Capacity | null;\n  flags: FeatureFlags;\n  can: (action: Action, subject: Subject) => boolean;\n  cannot: (action: Action, subject: Subject) => boolean;\n};\n\nconst DEFAULT_FEATURE_RESULT: SanctuaryFeatureResult = {\n  permitted: true,\n};\n\n/**\n * useSanctuaryFeature\n *\n * The single canonical hook for Sanctuary civic identity, Cedar authorization,\n * and 4-pillar UI presentation gating (Identity, Citizenship, Entitlement, Cedar).\n *\n * Can be called with no arguments to get user context & Cedar `can`/`cannot`,\n * or with (action, subject, requirement) to gate a specific UI feature.\n */\nexport function useSanctuaryFeature(\n  action?: string,\n  subject?: string,\n  requirement?: FeatureRequirement,\n  resourceId?: string,\n): UseSanctuaryFeatureReturn {\n  const { context, can, cannot, getDecision, cedarSnapshotLoaded, entitlement, flags } =\n    useAuthority();\n  const { activeEntitlements, grants, pricingTier, manifestLoaded, readiness } = entitlement;\n\n  // Evaluate feature gate if action & subject are provided\n  const featureResult = useMemo<SanctuaryFeatureResult>(() => {\n    if (!action || !subject) {\n      return DEFAULT_FEATURE_RESULT;\n    }\n\n    const numericCitizenship =\n      context.citizenship === 'FIRST_CLASS'\n        ? CITIZENSHIP.FIRST_CLASS\n        : context.citizenship === 'SECOND_CLASS'\n          ? CITIZENSHIP.SECOND_CLASS\n          : CITIZENSHIP.THIRD_CLASS;\n\n    const cedarDecision: 'allow' | 'deny' | 'no_decision' = context.userId\n      ? getDecision(subject, action)\n      : 'no_decision';\n\n    const req: FeatureRequirement = requirement ?? {\n      citizenshipRequired: CITIZENSHIP.THIRD_CLASS,\n    };\n    const flagKey = req.flagKey ?? `${subject}.${action}`;\n    const flagActive = resolveFeatureFlagValue(flags, flagKey);\n    const flagType = resolveFeatureFlagClass(flagKey);\n\n    return sanctuaryFeature(\n      {\n        userId: context.userId,\n        isLocalOnly: context.isLocalOnly === true,\n        activeBondId: context.activeBond?.id ?? null,\n        activeEntityId: context.activeEntityId,\n        activeEntityType: context.activeEntityType,\n        schoolId: context.schoolId,\n        primaryCapacity: context.activeBond?.capacity ?? context.capacity ?? null,\n        cedarSnapshotLoaded,\n        entitlementManifestLoaded: manifestLoaded,\n        entitlementReadiness: readiness,\n        citizenship: numericCitizenship,\n        entitlement: {\n          pricingTier: pricingTier as 'FREE' | 'PRO' | 'INSTITUTIONAL',\n          activeEntitlements,\n          grants,\n          expirationDate: null,\n        },\n        cedarDecision,\n        flagActive,\n        flagKey,\n        flagType,\n      },\n      req,\n    );\n  }, [\n    action,\n    subject,\n    requirement,\n    context,\n    cedarSnapshotLoaded,\n    getDecision,\n    flags,\n    activeEntitlements,\n    grants,\n    pricingTier,\n    manifestLoaded,\n    readiness,\n  ]);\n\n  return {\n    ...featureResult,\n    context,\n    activeBond: (context.activeBond as Bond) ?? null,\n    citizenship: (context.citizenship as CitizenshipTier) ?? 'THIRD_CLASS',\n    primaryCapacity: (context.primaryCapacity as Capacity) ?? null,\n    effectiveCapacity: (context.capacity as Capacity) ?? null,\n    flags,\n    can,\n    cannot,\n  };\n}\n\nexport const usePermissions = useSanctuaryFeature;\n","layer":13,"isBedrock":false,"downstreamCount":8,"upstreamCount":0},{"path":"packages/core/src/logic/permissions/authority.ts","name":"authority.ts","dir":"packages/core/src/logic/permissions","loc":240,"fns":[{"name":"resolveActiveBond","isExported":true,"params":"perspective: SanctuaryPerspective,\n  availableBonds: readonly Bond[],\n  sessionActiveBond: Bond | null,"},{"name":"resolveAuthorityContext","isExported":true,"params":"inputs: AuthorityInputs"},{"name":"decide","isExported":true,"params":"userId: string | null,\n  decision: CedarDecision,\n  action: string,\n  subject: string,"},{"name":"useAuthority","isExported":true,"params":""},{"name":"useAuthorityStatus","isExported":true,"params":""}],"interfaces":[{"name":"EntitlementInputs","isExported":true},{"name":"AuthorityInputs","isExported":true},{"name":"Authority","isExported":true}],"types":[{"name":"EntitlementSnapshot","isExported":false},{"name":"Capacity","isExported":false},{"name":"TenantKind","isExported":false},{"name":"UserContext","isExported":false},{"name":"CedarDecision","isExported":false},{"name":"Bond","isExported":false},{"name":"AuthUser","isExported":false}],"constants":[{"name":"schoolType","isExported":false},{"name":"activeBond","isExported":false},{"name":"bondScope","isExported":false},{"name":"isPersonal","isExported":false},{"name":"entitlementScope","isExported":false},{"name":"effectiveEntitlement","isExported":f ","canonical":"packages/core/src/store/useAuthStore.ts","isTypeOnly":false,"symbols":["useAuthStore"]},{"source":"@repo/core/store/useCedarDecisionStore","canonical":"packages/core/src/store/useCedarDecisionStore.ts","isTypeOnly":false,"symbols":["CedarDecision","useCedarDecisionStore"]},{"source":"@repo/core/store/useEntitlementStore","canonical":"packages/core/src/store/useEntitlementStore.ts","isTypeOnly":false,"symbols":["useEntitlementStore"]},{"source":"@repo/core/store/useFeatureStore","canonical":"packages/core/src/store/useFeatureStore.ts","isTypeOnly":false,"symbols":["useFeatureStore"]},{"source":"@repo/core/store/usePerspectiveStore","canonical":"packages/core/src/store/usePerspectiveStore.ts","isTypeOnly":false,"symbols":["usePerspectiveStore"]},{"source":"@repo/core/types/authorization","canonical":"packages/core/src/types/authorization.ts","isTypeOnly":true,"symbols":["Action","Subject"]},{"source":"@repo/core/types/Identity","canonical":"packages/core/src/types/Identity.ts","isTypeOnly":false,"symbols":["Bond","resolveBondCitizenship"]},{"source":"@repo/core/types/Perspective","canonical":"packages/core/src/types/Perspective.ts","isTypeOnly":true,"symbols":["SanctuaryPerspective"]}],"content":"import { resolveBondScope } from '@repo/core/logic/permissions/bondScope';\nimport {\n  type EntitlementSnapshot,\n  resolveScopedEntitlement,\n} from '@repo/core/logic/ports/entitlement.port';\nimport { type Capacity, CapacitySchema } from '@repo/core/logic/schemas/capacity.schema';\nimport {\n  type TenantKind,\n  type UserContext,\n  UserContextSchema,\n} from '@repo/core/logic/schemas/user.schema';\nimport { useScopeSessionStore } from '@repo/core/store/scopeSession';\nimport type { FeatureFlags } from '@repo/core/store/types/featureFlags';\nimport { useAuthStore } from '@repo/core/store/useAuthStore';\nimport { type CedarDecision, useCedarDecisionStore } from '@repo/core/store/useCedarDecisionStore';\nimport { useEntitlementStore } from '@repo/core/store/useEntitlementStore';\nimport { useFeatureStore } from '@repo/core/store/useFeatureStore';\nimport { usePerspectiveStore } from '@repo/core/store/usePerspectiveStore';\nimport type { Action, Subject } from '@repo/core/types/authorization';\nimport { type Bond, resolveBondCitizenship } from '@repo/core/types/Identity';\nimport type { SanctuaryPerspective } from '@repo/core/types/Perspective';\nimport { useCallback, useMemo } from 'react';\n\n/**\n * The one authority read on the client.\n *\n * What a person may do comes from the signed permission snapshot (verified in\n * useCedarDecisionStore against signature, expiry, policy version, person and bond), the bond\n * the scope session made active, the perspective, and the entitlement manifest. This module is\n * the only reader of those stores outside `store/`; screens and hooks ask it, through\n * `useAuthority` or `useSanctuaryFeature`. The client only hides what isn't allowed; the server\n * decides. The ratchet's `authorityStoreReads` counts reads anywhere else and only goes down.\n * See docs/architecture/2026-11-11-product-shape-and-tool-ownership.md, section 3.\n */\n\n/** Read subjects open to anyone, guests included, in the personal perspective. */\nexport const PERSONAL_SANCTUARY_READ_SUBJECTS: ReadonlySet<string> = new Set([\n  'SelfJourney',\n  'InnerPulse',\n  'SelfCare',\n  'SelfReflection',\n  'LibraryResource',\n  'CommunityPost',\n]);\n\ntype AuthUser = ReturnType<typeof useAuthStore.getState>['user'];\n\nexport interface EntitlementInputs {\n  readonly pricingTier: EntitlementSnapshot['pricingTier'];\n  readonly activeEntitlements: EntitlementSnapshot['activeEntitlements'];\n  readonly grants: EntitlementSnapshot['grants'];\n}\n\nexport interface AuthorityInputs {\n  readonly user: AuthUser;\n  readonly activePerspective: SanctuaryPerspective;\n  readonly availableBonds: readonly Bond[];\n  readonly sessionActiveBond: Bond | null;\n  readonly entitlement: EntitlementInputs;\n}\n\n/** The bond the active perspective points at, or the scope session's choice. */\nexport function resolveActiveBond(\n  perspective: SanctuaryPerspective,\n  availableBonds: readonly Bond[],\n  sessionActiveBond: Bond | null,\n): Bond | null {\n  if (perspective.kind === 'institutional') {\n    return (\n      availableBonds.find(\n        (b) => b.entity_id === perspective.schoolId && b.entity_type === 'SCHOOL',\n      ) ?? sessionActiveBond\n    );\n  }\n  if (perspective.kind === 'personal') {\n    return availableBonds.find((b) => b.entity_type === 'PERSONAL') ?? sessionActiveBond;\n  }\n  return sessionActiveBond;\n}\n\n/** Pure: the person's context for authority decisions. */\nexport function resolveAuthorityContext(inputs: AuthorityInputs): UserContext {\n  const { user, activePerspective, availableBonds, sessionActiveBond, entitlement } = inputs;\n  const schoolType =\n    activePerspective.kind === 'institutional' ? (activePerspective.schoolType ?? null) : null;\n  const activeBond = resolveActiveBond(activePerspective, availableBonds, sessionActiveBond);\n\n  const personalCapacity: Capacity = CapacitySchema.safeParse(user?.capacity).data ?? 'student';\n  const bondScope = resolveBondScope(activeBond);\n  const isPersonal =\n    bondScope.isPersonal ||\n    schoolType === 'personal_workspace' ||\n    activePerspective.kind === 'personal';\n  const entitlementScope = isPersonal || activeBond === null ? 'individual' : 'active_bond';\n  const effectiveEntitlement = resolveScopedEntitlement(\n    { ...entitlement, expirationDate: null },\n    entitlementScope,\n  );\n  const effectiveCapacity = activeBond?.capacity ?? personalCapacity;\n  const citizenship = resolveBondCitizenship(activeBond);\n\n  const rawContext: UserContext = {\n    userId: user?.id || null,\n    email:\n      user?.email && !user.email.startsWith('anonymous@') && user.email.includes('.')\n        ? user.email\n        : null,\n    bonds: availableBonds as UserContext['bonds'],\n    primaryCapacity: personalCapacity,\n    activeBond: activeBond as UserContext['activeBond'],\n    capacity: effectiveCapacity as UserContext['capacity'],\n    traits: effectiveCapacity ? [`capacity:${effectiveCapacity}`] : ['capacity:student'],\n    tier: user?.tier || 'free',\n    citizenship,\n    pricing_tier:\n      entitlement.pricingTier === 'PRO' || entitlement.pricingTier === 'INSTITUTIONAL'\n        ? entitlement.pricingTier\n        : 'FREE',\n    features: user?.features || [],\n    flags: user?.flags || {},\n\n    schoolId: bondScope.schoolId,\n    activeEntityId: bondScope.activeEntityId,\n    activeEntityType: bondScope.activeEntityType,\n    schoolType: schoolType ?? null,\n    onboarding_completed: Boolean(user?.onboarding_completed),\n    effective_entitlement_scope: entitlementScope,\n    effective_entitlement_tier: effectiveEntitlement.pricingTier,\n    tenancyName: null,\n    tenancy: {\n      kind: 'customer' as TenantKind,\n      isPersonal,\n    },\n    tenantKind: 'customer' as TenantKind,\n    isAnonymous: !user?.id || Boolean(user?.is_anonymous),\n    isLocalOnly: !user?.id || Boolean(user?.is_anonymous) || citizenship === 'THIRD_CLASS',\n    hasGlobalAccess:\n      activeBond?.capacity === 'founder' ||\n      activeBond?.capacity === 'admin' ||\n      activeBond?.capacity === 'developer',\n    isPersonal,\n    sectionId: null,\n    gradeId: null,\n    classroomId: activeBond?.entity_type === 'CLASSROOM' ? activeBond.entity_id : null,\n  };\n\n  const parsed = UserContextSchema.safeParse(rawContext);\n  if (!parsed.success) {\n    console.warn('[authority] Schema parse warning:', parsed.error.issues);\n    return rawContext;\n  }\n  return parsed.data;\n}\n\n/** Pure: may this context do `action` on `subject`, given a snapshot decision. */\nexport function decide(\n  userId: string | null,\n  decision: CedarDecision,\n  action: string,\n  subject: string,\n): boolean {\n  const openRead = action === 'read' && PERSONAL_SANCTUARY_READ_SUBJECTS.has(subject);\n  if (!userId) return openRead;\n  if (decision === 'allow') return true;\n  if (decision === 'deny') return false;\n  return openRead;\n}\n\nexport interface Authority {\n  readonly context: UserContext;\n  readonly can: (action: Action, subject: Subject) => boolean;\n  readonly cannot: (action: Action, subject: Subject) => boolean;\n  readonly getDecision: (subject: string, action: string) => CedarDecision;\n  readonly cedarSnapshotLoaded: boolean;\n  readonly entitlement: EntitlementInputs & {\n    readonly manifestLoaded: boolean;\n    readonly readiness: ReturnType<typeof useEntitlementStore.getState>['readiness'];\n  };\n  readonly flags: FeatureFlags;\n}\n\n/** The person's authority, subscribed to every input it depends on. */\nexport function useAuthority(): Authority {\n  const user = useAuthStore((s) => s.user);\n  const activePerspective = usePerspectiveStore((s) => s.activePerspective);\n  // Subscribed, so switching bonds recomputes the context.\n  const scopeSnapshot = useScopeSessionStore((s) => s.snapshot);\n  const pricingTier = useEntitlementStore((s) => s.pricingTier);\n  const activeEntitlements = useEntitlementStore((s) => s.activeEntitlements);\n  const grants = useEntitlementStore((s) => s.grants);\n  const manifestLoaded = useEntitlementStore((s) => s.manifestLoaded);\n  const readiness = useEntitlementStore((s) => s.readiness);\n  const cedarSnapshotLoaded = useCedarDecisionStore((s) => s.snapshotLoaded);\n  const getDecision = useCedarDecisionStore((s) => s.getDecision);\n  const flags = useFeatureStore((s) => s.flags);\n\n  const context = useMemo(\n    () =>\n      resolveAuthorityContext({\n        user,\n        activePerspective,\n        availableBonds: (scopeSnapshot?.availableBonds as readonly Bond[] | undefined) ?? [],\n        sessionActiveBond: (scopeSnapshot?.activeBond as Bond | null | undefined) ?? null,\n        entitlement: { pricingTier, activeEntitlements, grants },\n      }),\n    [user, activePerspective, scopeSnapshot, pricingTier, activeEntitlements, grants],\n  );\n\n  const can = useCallback(\n    (action: Action, subject: Subject): boolean =>\n      decide(\n        context.userId,\n        context.userId ? getDecision(subject as string, action as string) : 'no_decision',\n        action as string,\n        subject as string,\n      ),\n    [context.userId, getDecision],\n  );\n  const cannot = useCallback((action: Action, subject: Subject) => !can(action, subject), [can]);\n\n  return {\n    context,\n    can,\n    cannot,\n    getDecision,\n    cedarSnapshotLoaded,\n    entitlement: { pricingTier, activeEntitlements, grants, manifestLoaded, readiness },\n    flags,\n  };\n}\n\n/** Whether the permission snapshot is ready, for screens that wait on it. */\nexport function useAuthorityStatus() {\n  const isLoading = useCedarDecisionStore((s) => s.isLoading);\n  const error = useCedarDecisionStore((s) => s.error);\n  const snapshotLoaded = useCedarDecisionStore((s) => s.snapshotLoaded);\n  const loadDecisions = useCedarDecisionStore((s) => s.loadDecisions);\n  return { isLoading, error, snapshotLoaded, loadDecisions };\n}\n","layer":12,"isBedrock":false,"downstreamCount":14,"upstreamCount":1},{"path":"packages/core/src/logic/permissions/sanctuaryFeature.ts","name":"sanctuaryFeature.ts","dir":"packages/core/src/logic/permissions","loc":175,"fns":[{"name":"meetsPricingTier","isExported":true,"params":"current: PricingTier, required: PricingTier"},{"name":"sanctuaryFeature","isExported":true,"params":"ctx: SanctuaryEvaluationContext,\n  requirement: FeatureRequirement,"}],"interfaces":[{"name":"FeatureRequirement","isExported":true}],"types":[{"name":"FeatureAccessContext","isExported":false},{"name":"EntitlementScope","isExported":false},{"name":"EntitlementSnapshot","isExported":false},{"name":"CitizenshipLevel","isExported":false},{"name":"CitizenshipName","isExported":false},{"name":"CitizenshipLevel","isExported":false},{"name":"CitizenshipName","isExported":false},{"name":"PricingTi e' | 'development' | 'beta' | 'experiment';\nexport type FeatureLifecycleState = 'development' | 'beta' | 'live' | 'deprecated';\n\n/** Subscription tiers are ordered; higher tiers include lower-tier access. */\nexport function meetsPricingTier(current: PricingTier, required: PricingTier): boolean {\n  return meetsSubscriptionTier(current, required);\n}\n\nexport type SanctuaryFeatureResult =\n  | { permitted: true; featureKey?: string }\n  | { permitted: false; reason: 'not_initialized'; featureKey?: string }\n  | {\n      permitted: false;\n      reason: 'citizenship';\n      required: CitizenshipLevel;\n      current: CitizenshipLevel;\n      featureKey?: string;\n    }\n  | {\n      permitted: false;\n      reason: 'entitlement';\n      required: PricingTier;\n      current: PricingTier;\n      scope?: EntitlementScope;\n      featureKey?: string;\n    }\n  | { permitted: false; reason: 'authz'; policy?: string; featureKey?: string }\n  | {\n      permitted: false;\n      reason: 'feature';\n      flagKey: string;\n      flagType: FlagType;\n      featureKey?: string;\n    }\n  | { permitted: false; reason: 'platform'; featureKey?: string };\n\nexport type SanctuaryEvaluationContext = FeatureAccessContext;\n\nexport interface FeatureRequirement {\n  action?: string;\n  subject?: string;\n  citizenshipRequired: CitizenshipLevel;\n  platformSupported?: boolean;\n  entitlementModule?: string;\n  entitlementTier?: PricingTier;\n  entitlementScope?: EntitlementScope;\n  flagKey?: string;\n  lifecycleState?: FeatureLifecycleState;\n  /** Allow a safe read-only shell before remote capability hydration completes. */\n  allowDuringBootstrap?: boolean;\n}\n\nexport function sanctuaryFeature(\n  ctx: SanctuaryEvaluationContext,\n  requirement: FeatureRequirement,\n): SanctuaryFeatureResult {\n  const onDeviceSelf = isOnDeviceSelfCapability(requirement.action ?? '', requirement.subject ?? '');\n  if (!isFeatureAccessContextReady(ctx)) {\n    if (onDeviceSelf && Boolean(ctx.userId) && ctx.flagActive) {\n      return { permitted: true };\n    }\n    if (\n      requirement.allowDuringBootstrap &&\n      isBaselineReadCapability(requirement.action ?? '', requirement.subject ?? '') &&\n      Boolean(ctx.userId) &&\n      !requirement.entitlementTier &&\n      !requirement.entitlementModule &&\n      ctx.flagActive &&\n      meetsCitizenship(ctx.citizenship, CITIZENSHIP.THIRD_CLASS)\n    ) {\n      return { permitted: true };\n    }\n    return { permitted: false, reason: 'not_initialized' };\n  }\n\n  if (requirement.platformSupported === false) {\n    return { permitted: false, reason: 'platform' };\n  }\n\n  // Gate 1 — citizenship\n  if (!meetsCitizenship(ctx.citizenship, requirement.citizenshipRequired)) {\n    return {\n      permitted: false,\n      reason: 'citizenship',\n      required: requirement.citizenshipRequired,\n      current: ctx.citizenship,\n    };\n  }\n\n  // Gate 2 — Cedar. Cedar is the authoritative security boundary and must\n  // take precedence over commercial failure reasons for protected UI actions.\n  if (!onDeviceSelf && (ctx.cedarDecision === 'deny' || ctx.cedarDecision === 'no_decision')) {\n    return { permitted: false, reason: 'authz', policy: ctx.cedarPolicy };\n  }\n\n  // Gate 3 — entitlement. Entitlement controls commercial access; it never\n  // grants authorization and is evaluated only after Cedar permits the actor.\n  // A tier is the subscription level; a module is an independent add-on or\n  // capability entitlement. When both are declared, both must pass.\n  const entitlement = resolveScopedEntitlement(\n    ctx.entitlement,\n    requirement.entitlementScope ?? 'individual',\n  );\n  if (\n    requirement.entitlementTier &&\n    !meetsPricingTier(entitlement.pricingTier, requirement.entitlementTier)\n  ) {\n    return {\n      permitted: false,\n      reason: 'entitlement',\n      required: requirement.entitlementTier,\n      current: entitlement.pricingTier,\n      ...(requirement.entitlementScope ? { scope: requirement.entitlementScope } : {}),\n    };\n  }\n\n  if (\n    requirement.entitlementModule &&\n    !entitlement.activeEntitlements.includes(requirement.entitlementModule)\n  ) {\n    return {\n      permitted: false,\n      reason: 'entitlement',\n      required: requirement.entitlementTier ?? 'PRO',\n      current: entitlement.pricingTier,\n      ...(requirement.entitlementScope ? { scope: requirement.entitlementScope } : {}),\n    };\n  }\n\n  // Cross-cut — feature lifecycle and rollout\n  if (requirement.lifecycleState === 'development' || requirement.lifecycleState === 'deprecated') {\n    return {\n      permitted: false,\n      reason: 'feature',\n      flagKey: requirement.flagKey ?? 'lifecycle',\n      flagType: requirement.lifecycleState === 'development' ? 'development' : 'operational',\n    };\n  }\n\n  if (ctx.flagKey && !ctx.flagActive) {\n    return {\n      permitted: false,\n      reason: 'feature',\n      flagKey: ctx.flagKey,\n      flagType: ctx.flagType,\n    };\n  }\n\n  return { permitted: true };\n}\n","layer":2,"isBedrock":false,"downstreamCount":4,"upstreamCount":1},{"path":"packages/core/src/logic/registry/featureLifecycleManifest.ts","name":"featureLifecycleManifest.ts","dir":"packages/core/src/logic/registry","loc":350,"fns":[{"name":"validateFeatureFlagManifest","isExported":true,"params":""},{"name":"resolveGrowthBookKey","isExported":true,"params":"key: string"},{"name":"fallbackForFeatureFlagClass","isExported":true,"params":"flagClass: FeatureFlagMetadata['class'] | undefined,"},{"name":"resolveFeatureFlagClass","isExported":true,"params":"key: string"},{"name":"resolveFeatureFlagValue","isExported":true,"params":"flags: object, key: string"},{"name":"legacyRelease","isExported":true,"params":"owner: string,\n  purpose: string,"},{"name":"legacyBeta","isExported":false,"params":"owner: string,\n  purpose: string,"},{"name":"permanentOperational","isExported":false,"params":"owner: string,\n  permanentJustifica  = FeatureLifecycleSchema.extend({\n  class: FeatureFlagClassSchema,\n  disposition: z.enum(['retire-after-migration', 'retain-operational']),\n  purpose: z.string().min(1),\n  intendedAudience: z.string().min(1),\n  safeDefault: z.boolean(),\n  cleanupNote: z.string().min(1),\n  growthbookKey: z\n    .string()\n    .regex(\n      /^[a-z0-9]+(-[a-z0-9]+)*(\\.[a-z0-9]+(-[a-z0-9]+)*)*$/,\n      'growthbookKey must be namespaced kebab-case, e.g. gurudevi.<domain>.<feature>.',\n    ),\n  legacy: z.boolean().optional(),\n}).superRefine((metadata, context) => {\n  const isOperational = metadata.class === 'operational';\n  const retainsOperational = metadata.disposition === 'retain-operational';\n\n  if (isOperational !== retainsOperational) {\n    context.addIssue({\n      code: 'custom',\n      message: 'Flag class and lifecycle disposition must agree.',\n      path: ['class'],\n    });\n  }\n\n  if (isOperational && !metadata.permanentJustification) {\n    context.addIssue({\n      code: 'custom',\n      message: 'Operational flags require permanentJustification.',\n      path: ['permanentJustification'],\n    });\n  }\n\n  if (!isOperational && !metadata.removalTarget) {\n    context.addIssue({\n      code: 'custom',\n      message: 'Temporary flags require removalTarget.',\n      path: ['removalTarget'],\n    });\n  }\n});\n\nexport const legacyRelease = (\n  owner: string,\n  purpose: string,\n): Omit<FeatureFlagMetadata, 'growthbookKey'> => ({\n  owner,\n  class: 'release',\n  disposition: 'retire-after-migration',\n  purpose,\n  intendedAudience: 'Controlled release cohort',\n  safeDefault: true,\n  cleanupNote:\n    'Remove the release branch and archive the GrowthBook key after general availability.',\n  createdAt: '2026-07-26',\n  reviewAt: '2026-09-30',\n  removalTarget: '2026-09-30',\n  legacy: true,\n});\n\nconst legacyBeta = (\n  owner: string,\n  purpose: string,\n): Omit<FeatureFlagMetadata, 'growthbookKey'> => ({\n  owner,\n  class: 'beta',\n  disposition
