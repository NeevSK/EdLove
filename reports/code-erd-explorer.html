iresAt) {\n    return { valid: false, reason: 'Token expired' };\n  }\n  if (_currentPolicyHash && token.policyVersionHash !== _currentPolicyHash) {\n    return { valid: false, reason: 'Policy version changed since token issuance' };\n  }\n  if (_currentOperationContext && token.operationContext !== _currentOperationContext) {\n    return { valid: false, reason: 'Operation context mismatch' };\n  }\n  return { valid: true };\n}\n\nfunction extractResourceId(builder: any, action: string): string {\n  try {\n    const sqlInfo = builder.toSQL?.();\n    if (!sqlInfo?.params?.length) return 'local-drizzle-write-interceptor';\n\n    if (action === 'create') {\n      return String(sqlInfo.params[0]);\n    }\n\n    if (action === 'update' || action === 'delete') {\n      const match = sqlInfo.sql?.match(/\"id\"\\s*=\\s*(\\?|\\$\\d+)/);\n      if (match) {\n        const placeholder = match[1];\n        if (placeholder === '?') {\n          const idx = sqlInfo.sql.indexOf(match[0]);\n          const before = sqlInfo.sql.slice(0, idx);\n          const qCount = (before.match(/\\?/g) || []).length;\n          return String(sqlInfo.params[qCount]);\n        }\n        const paramIdx = parseInt(placeholder.slice(1), 10) - 1;\n        return String(sqlInfo.params[paramIdx]);\n      }\n      return String(sqlInfo.params[sqlInfo.params.length - 1]);\n    }\n  } catch {\n    // fall through\n  }\n  return 'local-drizzle-write-interceptor';\n}\n\nexport function createSecureDrizzleProxy(db: any): any {\n  if (!db) return db;\n  return new Proxy(db, {\n    get(target, prop, receiver) {\n      const originalValue = Reflect.get(target, prop, receiver);\n\n      // Forward read-only operations directly (no security checks needed)\n      if (prop === 'select' || prop === 'query') {\n        return typeof originalValue === 'function' ? originalValue.bind(target) : originalValue;\n      }\n\n      if (prop === 'insert' || prop === 'update' || prop === 'delete') {\n        return (tableObj: any) => {\n          const tableName = is(tableObj, Table)\n            ? getTableName(tableObj)\n            : tableObj?._?.name || tableObj?.name || 'unknown_table';\n          const action = prop === 'insert' ? 'create' : prop === 'update' ? 'update' : 'delete';\n          const builder = originalValue.apply(target, [tableObj]);\n\n          return new Proxy(builder, {\n            get(builderTarget, builderProp, builderReceiver) {\n              const originalBuilderValue = Reflect.get(builderTarget, builderProp, builderReceiver);\n\n              if (builderProp === 'execute' || builderProp === 'then') {\n                return (...args: any[]) => {\n                  // Priority 1: capability token validation (per ADR-012)\n                  if (_activeToken) {\n                    const validation = isTokenValid(_activeToken);\n                    if (!validation.valid) {\n                      // Token expired or invalid — fall back to per-write validation\n                      _activeToken = null;\n                    } else {\n                      // Token valid — skip per-write WASM evaluation\n                      if (builderProp === 'then') {\n                        const promise = originalBuilderValue.apply(builderTarget, []);\n                        return promise.then(...args);\n                      }\n                      return originalBuilderValue.apply(builderTarget, args);\n                    }\n                  }\n\n                  // Priority 2: per-write permission validator (fallback)\n                  if (!_permissionValidator) {\n                    if (builderProp === 'then') {\n                      const promise = originalBuilderValue.apply(builderTarget, []);\n                      return promise.then(...args);\n                    }\n                    return originalBuilderValue.apply(builderTarget, args);\n                  }\n\n                  const state = useAuthStore.getState();\n                  const activeBond = useScopeSessionStore.getState().snapshot?.activeBond ?? null;\n                  const userContext = {\n                    ...resolveBondScope(activeBond),\n                    userId: state.user?.id || null,\n                    email: state.user?.email || null,\n                    schoolId: state.user?.school_id || null,\n                    activeBond,\n                    capacity: activeBond?.capacity ?? null,\n                    isAnonymous: !state.user || !!state.user?.is_anonymous,\n                  };\n\n                  const resourceType =\n                    tableName.charAt(0).toUpperCase() +\n                    tableName\n                      .slice(1)\n                      .replace(/_([a-z])/g, (_: string, letter: string) => letter.toUpperCase());\n\n                  return _permissionValidator({\n                    action: action as any,\n                    resourceType: resourceType as any,\n                    resourceId: extractResourceId(builderTarget, action),\n                    userContext,\n                  }).then((isAllowed) => {\n                    if (!isAllowed) {\n                      throw new SovereignError({\n                        title: 'Unauthorized Local Mutation',\n                        detail: `Access denied. Direct local database write to table \"${tableName}\" is blocked for action \"${action}\".`,\n                        status: 403,\n                        category: ErrorCategory.AUTHORIZATION,\n                        code: 'LOCAL_WRITE_VIOLATION',\n                      });\n                    }\n                    if (builderProp === 'then') {\n                      const promise = originalBuilderValue.apply(builderTarget, []);\n                      return promise.then(...args);\n                    }\n                    return originalBuilderValue.apply(builderTarget, args);\n                  });\n                };\n              }\n              return typeof originalBuilderValue === 'function'\n                ? originalBuilderValue.bind(builderTarget)\n                : originalBuilderValue;\n            },\n          });\n        };\n      }\n\n      if (prop === 'transaction') {\n        return (callback: any, config: any) => {\n          const secureCallback = async (tx: any) => {\n            const secureTx = createSecureDrizzleProxy(tx);\n            return callback(secureTx);\n          };\n          return originalValue.apply(target, [secureCallback, config]);\n        };\n      }\n\n      return typeof originalValue === 'function' ? originalValue.bind(target) : originalValue;\n    },\n  });\n}\n","layer":8,"isBedrock":false,"downstreamCount":5,"upstreamCount":1},{"path":"packages/core/src/adapters/powersync/singleActivePowerSyncRuntime.ts","name":"singleActivePowerSyncRuntime.ts","dir":"packages/core/src/adapters/powersync","loc":125,"fns":[],"interfaces":[{"name":"ManagedPowerSyncDatabase","isExported":true},{"name":"PowerSyncRuntimeOwnership","isExported":true}],"types":[],"constants":[{"name":"database","isExported":false},{"name":"current","isExported":false},{"name":"next","isExported":false},{"name":"current","isExported":false}],"imports":[],"content":"/**\n * Serializes PowerSync ownership across account switches.\n *\n * The device may remember multiple account-scoped databases, but only one\n * database can be connected and active at a time. The queue is intentional:\n * React effect cleanup and the next account's initialization can overlap.\n */\nexport interface ManagedPowerSyncDatabase {\n  close?: (options?: { disconnect?: boolean }) => Promise<void>;\n  disconnect?: () => Promise<void>;\n  disconnectAndClear?: (options?: { clearLocal?: boolean }) => Promise<void>;\n}\n\nexport interface PowerSyncRuntimeOwnership {\n  isActive: () => boolean;\n  release: (clear: boolean) => Promise<void>;\n}\n\nexport class SingleActivePowerSyncRuntime<TDatabase extends ManagedPowerSyncDatabase> {\n  private active: {\n    accountId: string;\n    database: TDatabase;\n    releasing: boolean;\n    clearRequested: boolean;\n    remote: AbortController | null;\n  } | null = null;\n  private transition: Promise<void> = Promise.resolve();\n\n  activate(accountId: string, create: () => Promise<TDatabase>): Promise<TDatabase> {\n    if (this.active && this.active.accountId !== accountId) {\n      this.active.releasing = true;\n      this.active.remote?.abort();\n    }\n    return this.enqueue(async () => {\n      if (this.active?.accountId === accountId && !this.active.releasing)\n        return this.active.database;\n\n      await this.closeActive(false);\n      const database = await create();\n      this.active = { accountId, database, releasing: false, clearRequested: false, remote: null };\n      return database;\n    });\n  }\n\n  deactivate(clear = false): Promise<void> {\n    if (this.active) {\n      this.active.releasing = true;\n      this.active.remote?.abort();\n    }\n    return this.enqueue(() => this.closeActive(clear));\n  }\n\n  deactivateIfCurrent(database: TDatabase, clear = false): Promise<void> {\n    if (this.active?.database === database) {\n      this.active.releasing = true;\n      this.active.remote?.abort();\n    }\n    return this.enqueue(async () => {\n      if (this.active?.database === database) await this.closeActive(clear);\n    });\n  }\n\n  get activeAccountId(): string | null {\n    return this.active?.accountId ?? null;\n  }\n\n  isActive(accountId: string, database: TDatabase): boolean {\n    return (\n      this.active?.accountId === accountId &&\n      this.active.database === database &&\n      !this.active.releasing\n    );\n  }\n\n  runIfActive(\n    accountId: string,\n    database: TDatabase,\n    controller: AbortController,\n    operation: () => Promise<void>,\n  ): Promise<void> {\n    return this.enqueue(async () => {\n      const current = this.active;\n      if (!current || controller.signal.aborted || !this.isActive(accountId, database)) return;\n      current.remote = controller;\n      try {\n        await operation();\n      } finally {\n        if (current.remote === controller) current.remote = null;\n      }\n    });\n  }\n\n  private enqueue<T>(operation: () => Promise<T>): Promise<T> {\n    const next = this.transition.then(operation, operation);\n    this.transition = next.then(\n      () => undefined,\n      () => undefined,\n    );\n    return next;\n  }\n\n  private async closeActive(clear: boolean): Promise<void> {\n    const current = this.active;\n    if (!current) return;\n    current.releasing = true;\n    current.clearRequested ||= clear;\n\n    if (current.clearRequested) {\n      if (!current.database.disconnectAndClear)\n        throw new Error('PowerSync runtime cannot clear account data');\n      await current.database.disconnectAndClear();\n      current.clearRequested = false;\n    }\n\n    if (current.database.close) {\n      await current.database.close({ disconnect: true });\n    } else if (current.database.disconnect) {\n      await current.database.disconnect();\n    } else {\n      throw new Error('PowerSync runtime cannot release its database');\n    }\n    this.active = null;\n  }\n}\n","layer":0,"isBedrock":true,"downstreamCount":0,"upstreamCount":2},{"path":"packages/core/src/logic/runtimeRegistry.ts","name":"runtimeRegistry.ts","dir":"packages/core/src/logic","loc":118,"fns":[],"interfaces":[],"types":[],"constants":[{"name":"coreRuntime","isExported":true}],"imports":[{"source":"@repo/core/types/runtime","canonical":"packages/core/src/types/runtime.ts","isTypeOnly":true,"symbols":["CoreRuntimeEnvironment"]}],"content":"import type { CoreRuntimeEnvironment } from '@repo/core/types/runtime';\n\nlet runtime: CoreRuntimeEnvironment | null = null;\n\nexport const coreRuntime = {\n  register(env: CoreRuntimeEnvironment) {\n    runtime = env;\n  },\n\n  get storage() {\n    if (!runtime)\n      throw new Error(\n        'CoreRuntime: Storage provider not registered. Call coreRuntime.registe uring app initialization.',\n      );\n    return runtime.secureStorage;\n  },\n\n  get backgroundTask() {\n    if (!runtime)\n      throw new Error(\n        'CoreRuntime: BackgroundTask provider not registered. Call coreRuntime.register() during app initialization.',\n      );\n    return runtime.backgroundTask;\n  },\n\n  get asset() {\n    if (!runtime)\n      throw new Error(\n        'CoreRuntime: Asset provider not registered. Call coreRuntime.register() during app initialization.',\n      );\n    return runtime.asset;\n  },\n\n  get notification() {\n    if (!runtime)\n      throw new Error(\n        'CoreRuntime: Notification provider not registered. Call coreRuntime.register() during app initialization.',\n      );\n    return runtime.notification;\n  },\n\n  isRegistered() {\n    return runtime !== null;\n  },\n};\n","layer":1,"isBedrock":false,"downstreamCount":1,"upstreamCount":1},{"path":"packages/core/src/adapters/supabaseClient.ts","name":"supabaseClient.ts","dir":"packages/core/src/adapters","loc":89,"fns":[{"name":"getExpoPublicRuntime","isExported":false,"params":""},{"name":"urlStringFromInput","isExported":false,"params":"url: Parameters<typeof fetch>[0]"},{"name":"sanitizeSupabaseUrl","isExported":false,"params":"url: Parameters<typeof fetch>[0]"}],"interfaces":[],"types":[{"name":"PublicRuntimeConfig","isExported":false}],"constants":[{"name":"Constants","isExported":false},{"name":"publicRuntime","isExported":false},{"name":"urlStr","isExported":false},{"name":"urlObj","isExported":false},{"name":"sanitizedUrl","isExported":false},{"name":"supabaseClient","isExported":true}],"imports":[{"source":"@repo/core/lib/authStorage","canonical":"packages/core/src/lib/authStorage.ts","isTypeOnly":false,"symbols":["supabaseAuthStorage"]},{"source":"../lib/security/transportSecurity","canonical":"packages/core/src/lib/security/transportSecurity.ts","isTypeOnly":false,"symbols":["assertSecureApiUrl","secureApiFetch"]}],"content":"import { supabaseAuthStorage } from '@repo/core/lib/authStorage';\nimport { createClient } from '@supabase/supabase-js';\nimport { assertSecureApiUrl, secureApiFetch } from '../lib/security/transportSecurity';\n\ntype PublicRuntimeConfig = {\n  supabaseUrl?: string;\n  supabasePublishableKey?: string;\n};\n\nconst getExpoPublicRuntime = (): PublicRuntimeConfig | undefined => {\n  try {\n    // Only access global Expo constants if available\n    const Constants = (globalThis as any).expo?.modules?.ExponentConstants ?? null;\n    return Constants?.expoConfig?.extra?.publicRuntime;\n  } catch {\n    return undefined;\n  }\n};\n\nconst publicRuntime = getExpoPublicRuntime();\n\nlet supabaseUrl =\n  process.env.NEXT_PUBLIC_SUPABASE_URL ||\n  process.env.EXPO_PUBLIC_SUPABASE_URL ||\n  process.env.SUPABASE_URL ||\n  publicRuntime?.supabaseUrl;\nlet supabasePublishableKey =\n  process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY ||\n  process.env.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY ||\n  process.env.SUPABASE_ANON_KEY ||\n  publicRuntime?.supabasePublishableKey;\nconst urlStringFromInput = (url: Parameters<typeof fetch>[0]): string =>\n  typeof url === 'string'\n    ? url\n    : typeof Request !== 'undefined' && url instanceof Request\n      ? url.url\n      : String(url);\n\nconst sanitizeSupabaseUrl = (url: Parameters<typeof fetch>[0]): string => {\n  const urlStr = urlStringFromInput(url);\n  try {\n    const urlObj = new URL(urlStr);\n    if (!urlObj.searchParams.has('onboarding_status')) return urlStr;\n    urlObj.searchParams.delete('onboarding_status');\n    if (typeof globalThis !== 'undefined' && (globalThis as any).__DEV__) {\n      console.warn(`[Supabase] Stripped ghost param 'onboarding_status' from ${urlObj.pathname}`);\n    }\n    return urlObj.toString();\n  } catch {\n    return urlStr;\n  }\n};\n\nif (!supabaseUrl || !supabasePublishableKey) {\n  if (\n    process.env.NODE_ENV === 'test' ||\n    typeof window !== 'undefined' ||\n    process.env.NODE_ENV === 'development'\n  ) {\n    supabaseUrl = supabaseUrl || 'https://mock-supabase-url.supabase.co';\n    supabasePublishableKey = supabasePublishableKey || 'mock-supabase-key';\n  } else {\n    throw new Error(\n      'Missing Supabase credentials. Please check your .env file.\\n' +\n        'Required: EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY',\n    );\n  }\n}\n\nassertSecureApiUrl(supabaseUrl);\n\nconst supabaseOptions: any = {\n  auth: {\n    storage: supabaseAuthStorage,\n    autoRefreshToken: true,\n    persistSession: true,\n    detectSessionInUrl: typeof globalThis.window !== 'undefined',\n  },\n  global: {\n    fetch: (url: Parameters<typeof fetch>[0], options?: Parameters<typeof fetch>[1]) => {\n      const sanitizedUrl = sanitizeSupabaseUrl(url);\n      return secureApiFetch(sanitizedUrl, options);\n    },\n  },\n};\n\n/** Canonical client owned by the Supabase adapter boundary. */\nexport const supabaseClient = createClient(supabaseUrl, supabasePublishableKey, supabaseOptions);\n","layer":2,"isBedrock":false,"downstreamCount":2,"upstreamCount":1},{"path":"packages/core/src/lib/devicePreferences.ts","name":"devicePreferences.ts","dir":"packages/core/src/lib","loc":46,"fns":[{"name":"isDeviceThemeMode","isExported":true,"params":"value: unknown"},{"name":"migrateDeviceTheme","isExported":false,"params":""},{"name":"ensureDeviceThemePreference","isExported":true,"params":""}],"interfaces":[],"types":[{"name":"DeviceThemeMode","isExported":true}],"constants":[{"name":"DEVICE_THEME_MODE_KEY","isExported":true},{"name":"legacy","isExported":false},{"name":"state","isExported":false},{"name":"mode","isExported":false}],"imports":[{"source":"@repo/core/lib/storage","canonical":"packages/core/src/lib/storage.ts","isTypeOnly":false,"symbols":["storage"]}],"content":"import { storage } from '@repo/core/lib/storage';\n\nexport const DEVICE_THEME_MODE_KEY = '@gurudevi/theme_mode';\nexport type DeviceThemeMode = 'light' | 'dark' | 'system' | 'auto';\n\nexport function isDeviceThemeMode(value: unknown): value is DeviceThemeMode {\n  return value === 'light' || value === 'dark' || value === 'system' || value === 'auto';\n}\n\nlet themeMigration: Promise<void> | null = null;\n\nasync function migrateDeviceTheme(): Promise<void> {\n  if ((await storage.getStringAsync(DEVICE_THEME_MODE_KEY)) !== undefined) return;\n  const legacy = await storage.getStringAsync('gurudevi-ui-storage');\n  if (!legacy) return;\n  let value: unknown;\n  try {\n    value = JSON.parse(legacy);\n  } catch {\n    return;\n  }\n  if (!value || typeof value !== 'object' || !('state' in value)) return;\n  const state = value.state;\n  if (!state || typeof state !== 'object') return;\n  const mode =\n    'themeMode' in state && isDeviceThemeMode(state.themeMode)\n      ? state.themeMode\n      : 'theme' in state && isDeviceThemeMode(state.theme)\n        ? state.theme\n        : undefined;\n  if (mode === undefined) return;\n  // A concurrent explicit settings write takes precedence over the old hint.\n  if ((await storage.getStringAsync(DEVICE_THEME_MODE_KEY)) !== undefined) return;\n  await storage.setAsync(DEVICE_THEME_MODE_KEY, mode);\n}\n\n/** Preserve the old device choice before the mixed UI record can be rewritten. */\nexport function ensureDeviceThemePreference(): Promise<void> {\n  if (!themeMigration) {\n    themeMigration = migrateDeviceTheme().finally(() => {\n      themeMigration = null;\n    });\n  }\n  return themeMigration;\n}\n","layer":1,"isBedrock":false,"downstreamCount":1,"upstreamCount":1},{"path":"packages/core/src/platform/drivers/networkMonitor.ts","name":"networkMonitor.ts","dir":"packages/core/src/platform/drivers","loc":70,"fns":[],"interfaces":[],"types":[],"constants":[{"name":"adapter","isExported":false},{"name":"unsubscribe","isExported":false},{"name":"next","isExported":false},{"name":"networkMonitor","isExported":true}],"imports":[{"source":"@repo/core/logic/interfaces/network.port","canonical":"packages/core/src/logic/interfaces/network.port.ts","isTypeOnly":true,"symbols":["INetwork","NetworkSnapshot"]}],"content":"import type { INetwork, NetworkSnapshot } from '@repo/core/logic/interfaces/network.port';\n\nconst UNKNOWN_SNAPSHOT: NetworkSnapshot = Object.freeze({\n  status: 'unknown',\n  source: 'none',\n  connection: null,\n});\n\n/** Owns the single platform observation and publishes a stable external-store snapshot. */\nexport class NetworkMonitor implements INetwork {\n  private adapter: INetwork | null = null;\n  private adapterUnsubscribe: (() => void) | null = null;\n  private snapshot: NetworkSnapshot = UNKNOWN_SNAPSHOT;\n  private readonly listeners = new Set<() => void>();\n\n  registerAdapter(adapter: INetwork): void {\n    this.adapterUnsubscribe?.();\n    this.adapterUnsubscribe = null;\n    this.adapter = adapter;\n    this.snapshot = adapter.getSnapshot();\n    if (this.listeners.size > 0) this.subscribeToAdapter();\n    this.notifyListeners();\n  }\n\n  getSnapshot = (): NetworkSnapshot => {\n    return this.snapshot;\n  };\n\n  subscribe(listener: () => void): () => void {\n    this.listeners.add(listener);\n    if (this.listeners.size === 1) this.subscribeToAdapter();\n\n    return () => {\n      this.listeners.delete(listener);\n      if (this.listeners.size === 0) {\n        this.adapterUnsubscribe?.();\n        this.adapterUnsubscribe = null;\n      }\n    };\n  }\n\n  /** Unknown is not permission to attempt a network-only operation. */\n  async isConnected(): Promise<boolean> {\n    return this.snapshot.status === 'online';\n  }\n\n  private subscribeToAdapter(): void {\n    if (!this.adapter || this.adapterUnsubscribe) return;\n    const adapter = this.adapter;\n    const unsubscribe = adapter.subscribe(() => {\n      if (this.adapter !== adapter) return;\n      const next = adapter.getSnapshot();\n      if (next === this.snapshot) return;\n      this.snapshot = next;\n      this.notifyListeners();\n    });\n    if (this.adapter !== adapter || this.listeners.size === 0) {\n      unsubscribe();\n      return;\n    }\n    this.adapterUnsubscribe = unsubscribe;\n  }\n\n  private notifyListeners(): void {\n    for (const listener of this.listeners) listener();\n  }\n}\n\nexport const networkMonitor = new NetworkMonitor();\n","layer":1,"isBedrock":false,"downstreamCount":1,"upstreamCount":1},{"path":"packages/core/src/lib/scopedStateStorage.ts","name":"scopedStateStorage.ts","dir":"packages/core/src/lib","loc":69,"fns":[{"name":"currentOwner","isExported":false,"params":""},{"name":"storageKey","isExported":false,"params":"name: string, owner: Owner"},{"name":"createScopedStateStorage","isExported":true,"params":""},{"name":"sameOwner","isExported":false,"params":"owner: Owner"}],"interfaces":[],"types":[{"name":"Owner","isExported":false}],"constants":[{"name":"accountId","isExported":false},{"name":"owner","isExported":false},{"name":"value","isExported":false},{"name":"owner","isExported":false},{"name":"owner","isExported":false},{"name":"current","isExported":false}],"imports":[{"source":"@repo/core/lib/accountScope","canonical":"packages/core/src/lib/accountScope.ts","isTypeOnly":false,"symbols":["getActiveAccountId","getAccountScopeRevision","scopeStorageKey"]},{"source":"@repo/core/native/guestScope","canonical":"packages/core/src/native/guestScope.ts","isTypeOnly":false,"symbols":["getGuestScope","getGuestScopeRevision","guestStorageKey"]},{"source":"@repo/core/lib/storage","canonical":"packages/core/src/lib/storage.ts","isTypeOnly":false,"symbols":["storage"]}],"content":"import {\n  getActiveAccountId,\n  getAccountScopeRevision,\n  scopeStorageKey,\n} from '@repo/core/lib/accountScope';\nimport {\n  getGuestScope,\n  getGuestScopeRevision,\n  guestStorageKey,\n} from '@repo/core/native/guestScope';\nimport { storage } from '@repo/core/lib/storage';\nimport type { StateStorage } from 'zustand/middleware';\n\ntype Owner =\n  | { kind: 'account'; id: string; revision: number }\n  | { kind: 'guest'; id: string; revision: number };\nlet writesPaused = 0;\n\nexport function withScopedStateWritesPaused<T>(operation: () => T): T {\n  writesPaused += 1;\n  try {\n    return operation();\n  } finally {\n    writesPaused -= 1;\n  }\n}\n\nfunction currentOwner(): Owner {\n  const accountId = getActiveAccountId();\n  return accountId\n    ? { kind: 'account', id: accountId, revision: getAccountScopeRevision() }\n    : { kind: 'guest', id: getGuestScope(), revision: getGuestScopeRevision() };\n}\n\nfunction storageKey(name: string, owner: Owner): string {\n  return owner.kind === 'account'\n    ? scopeStorageKey(name, owner.id)\n    : guestStorageKey(name, owner.id);\n}\n\n/** Zustand persistence isolated by canonical account or the current guest lease. */\nexport function createScopedStateStorage(): StateStorage {\n  return {\n    getItem: async (name) => {\n      const owner = currentOwner();\n      const value = await storage.getStringAsync(storageKey(name, owner));\n      return sameOwner(owner) ? (value ?? null) : null;\n    },\n    setItem: async (name, value) => {\n      if (writesPaused > 0) return;\n      const owner = currentOwner();\n      await storage.setAsync(storageKey(name, owner), value);\n    },\n    removeItem: async (name) => {\n      const owner = currentOwner();\n      await storage.deleteAsync(storageKey(name, owner));\n    },\n  };\n}\n\nfunction sameOwner(owner: Owner): boolean {\n  const current = currentOwner();\n  return (\n    current.kind === owner.kind &&\n    current.id === owner.id &&\n    current.revision === owner.revision\n  );\n}\n","layer":1,"isBedrock":false,"downstreamCount":3,"upstreamCount":1},{"path":"packages/core/src/types/API.ts","name":"API.ts","dir":"packages/core/src/types","loc":42,"fns":[],"interfaces":[{"name":"PaginationParams","isExported":true},{"name":"PaginatedResponse","isExported":true}],"types":[],"constants":[{"name":"normalizedCode","isExported":false}],"imports":[{"source":"@repo/core/types/Errors","canonical":"packages/core/src/types  any,\n    callback: (location: any) => void,\n  ) => Promise<{ remove: () => void }>;\n  Accuracy: Record<string, any>;\n}\n\nexport interface NetworkProvider {\n  fetch(): Promise<{\n    isConnected: boolean | null;\n    type: string;\n    details?: any;\n  }>;\n}\n\nexport interface ShareOptions {\n  title?: string;\n  message?: string;\n  url?: string;\n}\n\nexport interface ShareProvider {\n  share(options: ShareOptions): Promise<void>;\n}\n\nexport interface UIProvider {\n  setStatusBarHidden(hidden: boolean, animation?: 'none' | 'fade' | 'slide'): void;\n}\n\nexport interface ClipboardProvider {\n  getStringAsync(): Promise<string>;\n  setStringAsync(content: string): Promise<boolean>;\n}\n\nexport interface SecureStorageOptions {\n  requireAuthentication?: boolean;\n}\n\nexport interface SecureStorageProvider {\n  getItemAsync(key: string, options?: SecureStorageOptions): Promise<string | null>;\n  setItemAsync(key: string, value: string, options?: SecureStorageOptions): Promise<void>;\n  deleteItemAsync(key: string): Promise<void>;\n}\n\nexport interface BackgroundTaskOptions {\n  minimumInterval?: number;\n  stopOnTerminate?: boolean;\n  startOnBoot?: boolean;\n}\n\nexport enum BackgroundTaskResult {\n  NewData = 1,\n  NoData = 2,\n  Failed = 3,\n}\n\nexport enum BackgroundTaskStatus {\n  Available = 1,\n  Restricted = 2,\n  Denied = 3,\n}\n\nexport interface BackgroundTaskProvider {\n  defineTask(name: string, task: () => Promise<BackgroundTaskResult>): void;\n  registerTaskAsync(name: string, options?: BackgroundTaskOptions): Promise<void>;\n  unregisterTaskAsync(name: string): Promise<void>;\n  getStatusAsync(): Promise<BackgroundTaskStatus>;\n  isTaskRegisteredAsync(name: string): Promise<boolean>;\n  triggerTaskWorkerForTestingAsync?(name: string): Promise<void>;\n}\n\nexport interface AssetProvider {\n  loadAsync(assets: Record<string, any> | any[]): Promise<void>;\n}\n\nexport interface NotificationProvider {\n  getPushTokenAsync(): Promise<string | null>;\n  getPermissionsAsync(): Promise<{\n    status: string;\n    canAskAgain: boolean;\n    expires: number | 'never';\n  }>;\n  requestPermissionsAsync(): Promise<{\n    status: string;\n    canAskAgain: boolean;\n    expires: number | 'never';\n  }>;\n  setBadgeCountAsync(count: number): Promise<boolean>;\n  getBadgeCountAsync(): Promise<number>;\n}\n\nexport interface NotificationPermissionResponse {\n  status: 'granted' | 'denied' | 'undetermined';\n  canAskAgain: boolean;\n  expires: 'never' | number;\n}\n\nexport interface PushNotificationProvider {\n  getPushTokenAsync(): Promise<string | null>;\n  getPermissionsAsync(): Promise<NotificationPermissionResponse>;\n  requestPermissionsAsync(): Promise<NotificationPermissionResponse>;\n  setBadgeCountAsync(count: number): Promise<void>;\n  getBadgeCountAsync(): Promise<number>;\n\n  // Listeners\n  addPushTokenListener(callback: (token: string) => void): () => void;\n  addNotificationReceivedListener(callback: (notification: any) => void): () => void;\n  addNotificationResponseReceivedListener(callback: (response: any) => void): () => void;\n}\n\nexport interface CoreRuntimeEnvironment {\n  storage: StorageProvider;\n  device: DeviceProvider;\n  haptics: HapticsProvider;\n  linking: LinkingProvider;\n  location: LocationProvider;\n  network: NetworkProvider;\n  share: ShareProvider;\n  ui: UIProvider;\n  clipboard: ClipboardProvider;\n  secureStorage: SecureStorageProvider;\n  backgroundTask: BackgroundTaskProvider;\n  asset: AssetProvider;\n  notification: PushNotificationProvider;\n}\n","layer":0,"isBedrock":true,"downstreamCount":0,"upstreamCount":2},{"path":"packages/core/src/types/User.ts","name":"User.ts","dir":"packages/core/src/types","loc":117,"fns":[],"interfaces":[{"name":"ProfileStats","isExported":true},{"name":"User","isExported":true},{"name":"AuthSession","isExported":true},{"name":"SignUpData","isExported":true},{"name":"LoginData","isExported":true}],"types":[],"constants":[],"imports":[{"s nboarded' | 'verified' | string | null;\n  profile_completed?: boolean; // Flag for \"No Trust\" barrier\n  bio?: string | null; // User bio\n  capacity_label?: string | null; // Personalized capacity label (e.g. \"Physics Teacher\")\n  index_number?: string | null; // Mandatory for students\n  nic_number?: string | null; // Mandatory for teachers\n  organization_name?: string | null; // Name of the user's organization/school\n  school_name?: string | null; // Alias for organization_name\n  tenant_kind?: TenantKind | null; // Distinguishes internal, customer, demo, and sandbox tenants\n  tier?: string | null;\n  citizenship?: 'WANDERER' | 'SECOND_CLASS' | 'FIRST_CLASS' | string | null;\n  pricing_tier?: 'FREE' | 'PRO' | 'INSTITUTIONAL' | string | null;\n  features?: string[];\n  flags?: Record<string, boolean | string>;\n  onboarding_completed?: boolean | null; // Flag indicating if user has completed onboarding\n  onboarding_completed_at?: string | Date | null; // Timestamp when onboarding was completed\n  public_profile?: boolean | null; // Visibility flag for community profile (optional  defaults to false if absent)\n  section_id?: string | null;\n  grade_id?: string | null;\n  classroom_id?: string | null;\n\n  // Profile specific fields\n  is_thuthimal?: boolean;\n  thuthimal_gifter?: string;\n  thuthimal_gifted_at?: string;\n  level?: number;\n  phone?: string;\n  experience_years?: number;\n  subjects_taught?: string | string[];\n  qualifications?: string | string[];\n  social_links?: SocialLink[];\n\n  /**\n   * Private orientation fingerprint  4-dimensional learning tendency vector.\n   * Set during onboarding orientation step and updated via behavioral inference.\n   * Never surfaced as a type label; used only for silent UX personalisation.\n   * Keys: depth_breadth | reflect_act | solo_social | steady_surge (all 0100).\n   */\n  orientation_seeds?: {\n    depth_breadth: number;\n    reflect_act: number;\n    solo_social: number;\n    steady_surge: number;\n    source: 'seeded' | 'inferred' | 'mixed';\n    seeded_at?: string;\n    last_updated?: string;\n  } | null;\n}\n\n/**\n * Auth Session (from Supabase)\n */\nexport interface AuthSession {\n  access_token: string;\n  refresh_token: string;\n  expires_in: number;\n  expires_at?: number;\n  token_type: string;\n  user: User;\n}\n\n/**\n * Sign Up Data\n * Data required to create a new user account\n */\nexport interface SignUpData {\n  email: string;\n  password: string;\n  avatar_url: string | null;\n  username: string | null;\n  full_name: string;\n  initialCapacity?: string; // Optional - used to seed the first bond\n  school_id?: string; // Optional - can be selected or created during signup\n}\n\n/**\n * Login Data\n */\nexport interface LoginData {\n  email: string;\n  password: string;\n}\n","layer":4,"isBedrock":false,"downstreamCount":3,"upstreamCount":1},{"path":"packages/core/src/logic/ports/authz.port.ts","name":"authz.port.ts","dir":"packages/core/src/logic/ports","loc":42,"fns":[],"interfaces":[{"name":"AuthorizationRequest","isExported":true},{"name":"AuthorizationDecision","isExported":true},{"name":"TokenContext","isExported":true},{"name":"CapabilityToken","isExported":true},{"name":"TokenValidation","isExported":true},{"name":"IAuthorizationPort","isExported":true}],"types":[],"constants":[],"imports":[],"content":"export interface AuthorizationRequest {\n  principalId: string;\n  action: string;\n  resourceType: string;\n  resourceId: string;\n  context?: Record<string, any>;\n}\n\nexport interface AuthorizationDecision {\n  permitted: boolean;\n  reason?: string;\n}\n\nexport interface TokenContext {\n  principalId: string;\n  tenantId: string;\n  operationContext: string;\n  deviceId?: string;\n}\n\nexport interface CapabilityToken {\n  tokenId: string;\n  principalId: string;\n  tenantId: string;\n  operationContext: string;\n  deviceId: string;\n  issuedAt: number;\n  expiresAt: number;\n  policyVersionHash: string;\n}\n\nexport interface T   retryAfter?: number;\n  };\n}\n\nexport class SovereignError extends Error {\n  public readonly details: ProblemDetails;\n  public override readonly cause?: unknown;\n\n  constructor(details: Partial<ProblemDetails>, cause?: unknown) {\n    super(details.title || 'An unexpected error occurred');\n    this.name = 'SovereignError';\n    this.cause = cause ?? details.devDetails;\n\n    this.details = {\n      type: 'https://polymath.network/errors/unknown',\n      title: 'Unknown Error',\n      status: 500,\n      category: ErrorCategory.UNKNOWN,\n      code: 'INTERNAL_ERROR',\n      ...details,\n    };\n\n    const isDevelopment =\n      (typeof __DEV__ !== 'undefined' && __DEV__) ||\n      (typeof process !== 'undefined' && process.env?.NODE_ENV === 'development');\n\n    // Auto-sanitize dev details if not in development\n    if (!isDevelopment) {\n      delete this.details.devDetails;\n    }\n  }\n\n  /**\n   * Factory for Validation Errors (Zod integration)\n   */\n  static validation(detail: string, issues?: any): SovereignError {\n    return new SovereignError({\n      title: 'Validation Failed',\n      detail,\n      status: 400,\n      category: ErrorCategory.VALIDATION,\n      code: 'INVALID_INPUT',\n      devDetails: issues,\n      userMessage: 'Please check the information you entered.',\n      agentAction: {\n        suggestedAction: 'CHECK_SCHEMA_AND_RETRY',\n      },\n    });\n  }\n\n  /**\n   * Factory for Authorization Errors (CASL/POA integration)\n   */\n  static unauthorized(action: string, subject: string): SovereignError {\n    return new SovereignError({\n      title: 'Access Denied',\n      detail: `You do not have permission to ${action} this ${subject}.`,\n      status: 403,\n      category: ErrorCategory.AUTHORIZATION,\n      code: 'UNAUTHORIZED',\n      userMessage: 'You are not authorized to perform this action.',\n      agentAction: {\n        suggestedAction: 'UPGRADE_CITIZENSHIP_OR_SWITCH_BOND',\n      },\n    });\n  }\n\n  static authenticationRequired(): SovereignError {\n    return new SovereignError({\n      type: 'https://polymath.network/errors/authentication-required',\n      title: 'Authentication Required',\n      detail: 'A valid authenticated session is required for this operation.',\n      status: 401,\n      category: ErrorCategory.AUTHORIZATION,\n      code: 'AUTHENTICATION_REQUIRED',\n      userMessage: 'Please sign in and try again.',\n      agentAction: { suggestedAction: 'AUTHENTICATE_AND_RETRY' },\n    });\n  }\n\n  static notFound(resource = 'Resource'): SovereignError {\n    return new SovereignError({\n      type: 'https://polymath.network/errors/not-found',\n      title: `${resource} Not Found`,\n      detail: 'The requested resource could not be found.',\n      status: 404,\n      category: ErrorCategory.UNKNOWN,\n      code: 'RESOURCE_NOT_FOUND',\n      userMessage: 'That resource is no longer available.',\n      agentAction: { suggestedAction: 'REFRESH_RESOURCE_AND_RETRY' },\n    });\n  }\n\n  static unavailable(code = 'DEPENDENCY_UNAVAILABLE'): SovereignError {\n    return new SovereignError({\n      type: 'https://polymath.network/errors/dependency-unavailable',\n      title: 'Service Unavailable',\n      detail: 'A required platform dependency is unavailable.',\n      status: 503,\n      category: ErrorCategory.NETWORK,\n      code,\n      userMessage: 'The service is temporarily unavailable. Please try again shortly.',\n      agentAction: { suggestedAction: 'RETRY_WITH_BACKOFF' },\n    });\n  }\n\n  static conflict(code = 'CONFLICT'): SovereignError {\n    return new SovereignError({\n      type: 'https://polymath.network/errors/conflict',\n      title: 'Conflict',\n      detail: 'The requested change conflicts with the current resource state.',\n      status: 409,\n      category: ErrorCategory.DATABASE,\n      code,\n      userMessage: 'That change could not be applied because the data has changed.',\n      agentAction: { suggestedAction: 'REFRESH_RESOURCE_AND_RETRY' },\n    });\n  }\n\n  static invalidInput(detail = 'One or more fields are invalid.'): SovereignError {\n    return new SovereignError({\n      type: 'https://polymath.network/errors/invalid-input',\n      title: 'Invalid Request',\n      detail,\n      status: 400,\n      category: ErrorCategory.VALIDATION,\n      code: 'INVALID_INPUT',\n      userMessage: 'Please check the information you entered.',\n      agentAction: { suggestedAction: 'CHECK_INPUT_AND_RETRY' },\n    });\n  }\n\n  static rateLimited(retryAfter?: number): SovereignError {\n    return new SovereignError({\n      type: 'https://polymath.network/errors/rate-limited',\n      title: 'Too Many Requests',\n      detail: 'The request rate limit has been exceeded.',\n      status: 429,\n      category: ErrorCategory.NETWORK,\n      code: 'RATE_LIMITED',\n      userMessage: 'Please wait a moment before trying again.',\n      agentAction: { suggestedAction: 'RETRY_WITH_BACKOFF', retryAfter },\n    });\n  }\n}\n","layer":0,"isBedrock":true,"downstreamCount":0,"upstreamCount":2},{"path":"packages/core/src/lib/authStorage.ts","name":"authStorage.ts","dir":"packages/core/src/lib","loc":36,"fns":[],"interfaces":[],"types":[],"constants":[{"name":"AUTH_STORAGE_PREFIX","isExported":false},{"name":"supabaseAuthStorage","isExported":true},{"name":"storageKey","isExported":false},{"name":"syncVal","isExported":false},{"name":"asyncVal","isExported":false},{"name":"storageKey","isExported":false},{"name":"storageKey","isExported":false}],"imports":[{"source":"@repo/core/lib/storage","canonical":"packages/core/src/lib/storage.ts","isTypeOnly":false,"symbols":["storage"]}],"content":"import { storage } from '@repo/core/lib/storage';\n\nconst AUTH_STORAGE_PREFIX = 'supabase-auth-';\n\nexport const supabaseAuthStorage = {\n  async getItem(key: string): Promise<string | null> {\n    const storageKey = `${AUTH_STORAGE_PREFIX}${key}`;\n    try {\n      const syncVal = storage.getString(storageKey);\n      if (syncVal !== undefined) return syncVal;\n      const asyncVal = await storage.getStringAsync(storageKey);\n      return asyncVal ?? null;\n    } catch {\n      throw new Error('Auth credential storage read failed');\n    }\n  },\n\n  async setItem(key: string, value: string): Promise<void> {\n    const storageKey = `${AUTH_STORAGE_PREFIX}${key}`;\n    try {\n      storage.set(storageKey, value);\n    } catch {\n      throw new Error('Auth credential storage write failed');\n    }\n  },\n\n  async removeItem(key: string): Promise<void> {\n    const storageKey = `${AUTH_STORAGE_PREFIX}${key}`;\n    try {\n      storage.delete(storageKey);\n    } catch {\n      throw new Error('Auth credential storage removal failed');\n    }\n  },\n};\n","layer":1,"isBedrock":false,"downstreamCount":1,"upstreamCount":1},{"path":"packages/core/src/lib/security/transportSecurity.ts","name":"transportSecurity.ts","dir":"packages/core/src/lib/security","loc":71,"fns":[{"name":"isPrivateIpv4","isExported":false,"params":"hostname: string"},{"name":"isLocalDevelopmentHost","isExported":false,"params":"hostname: string"},{"name":"assertSecureApiUrl","isExported":true,"params":"input: string | URL"},{"name":"secureApiFetch","isExported":true,"params":"input: RequestInfo | URL,\n  init?: RequestInit,"}],"interfaces":[],"types":[],"constants":[{"name":"DEVELOPMENT_ENVIRONMENTS","isExported":false},{"name":"octets","isExported":false},{"name":"host","isExported":false},{"name":"nodeEnvironment","isExported":false},{"name":"requestUrl","isExported":false}],"imports":[],"content":"const DEVELOPMENT_ENVIRONMENTS = new Set(['development', 'test']);\n\nfunction isPrivateIpv4(hostname: string): boolean {\n  const octets = hostname.split('.').map(Number);\n  if (\n    octets.length !== 4 ||\n    octets.some((octet) => !Number.isInteger(octet) || octet < 0 || octet > 255)\n  ) {\n    return false;\n  }\n\n  const [first, second] = octets;\n  return (\n    first === 10 ||\n    first === 127 ||\n    (first === 172 && second !== undefined && second >= 16 && second <= 31) ||\n    (first === 192 && second === 168)\n  );\n}\n\nfunction isLocalDevelopmentHost(hostname: string): boolean {\n  const host = hostname.toLowerCase().replace(/^\\[|\\]$/g, '');\n  return host === 'localhost' || host === '::1' || isPrivateIpv4(host);\n}\n\nexport function assertSecureApiUrl(input: string | URL): void {\n  if (typeof process !== 'undefined' && process.env.NODE_TLS_REJECT_UNAUTHORIZED === '0') {\n    throw new Error('TLS certificate verification must remain enabled.');\n  }\n\n  let url: URL;\n  try {\n    url = input instanceof URL ? new URL(input.href) : new URL(input);\n  } catch {\n    throw new Error('The API URL must be an absolute HTTPS URL.');\n  }\n\n  if (\n    (url.protocol !== 'https:' && url.protocol !== 'http:') ||\n    url.username.length > 0 ||\n    url.password.length > 0 ||\n    url.href.includes('#')\n  ) {\n    throw new Error('The API URL is invalid or unsafe.');\n  }\n\n  if (url.protocol === 'https:') return;\n\n  const nodeEnvironment = typeof process !== 'undefined' ? process.env.NODE_ENV : undefined;\n  if (\n    !DEVELOPMENT_ENVIRONMENTS.has(nodeEnvironment ?? '') ||\n    !isLocalDevelopmentHost(url.hostname)\n  ) {\n    throw new Error('The API URL must use HTTPS outside local development.');\n  }\n}\n\nexport async function secureApiFetch(\n  input: RequestInfo | URL,\n  init?: RequestInit,\n): Promise<Response> {\n  const requestUrl =\n    typeof input === 'string' || input instanceof URL\n      ? input\n      : typeof Request !== 'undefined' && input instanceof Request\n        ? input.url\n        : String(input);\n  assertSecureApiUrl(requestUrl);\n  return globalThis.fetch(input, { ...init, redirect: 'error' });\n}\n","layer":0,"isBedrock":true,"downstreamCount":0,"upstreamCount":1},{"path":"packages/core/src/logic/interfaces/network.port.ts","name":"network.port.ts","dir":"packages/core/src/logic/interfaces","loc":25,"fns":[],"interfaces":[{"name":"NetworkConne es/Tenancy.ts","to":"packages/core/src/logic/schemas/capacity.schema.ts","symbols":["Capacity"],"isTypeOnly":true},{"from":"packages/core/src/types/Tenancy.ts","to":"packages/core/src/logic/schemas/user.schema.ts","symbols":["TenantKind"],"isTypeOnly":true}];

    const nodeMap = new Map();
    for (const n of nodes) nodeMap.set(n.path, n);

    let activeFilePath = nodes[0].path;

    function renderTree(filterText = '') {
      const tree = document.getElementById('file-tree');
      tree.innerHTML = '';
      const filtered = nodes.filter(n => 
        n.name.toLowerCase().includes(filterText.toLowerCase()) ||
        n.fns.some(f => f.name.toLowerCase().includes(filterText.toLowerCase())) ||
        n.types.some(t => t.name.toLowerCase().includes(filterText.toLowerCase()))
      );

      for (const n of filtered) {
        const item = document.createElement('div');
        item.className = 'tree-item' + (n.path === activeFilePath ? ' active' : '');
        item.onclick = () => selectFile(n.path);
        item.innerHTML = `
          <span class="tree-name">${n.name}</span>
          <span class="tree-badge ${n.isBedrock ? 'bedrock' : ''}">
            ${n.isBedrock ? 'BEDROCK' : 'L' + n.layer}
          </span>
        `;
        tree.appendChild(item);
      }
    }

    function filterTree() {
      const q = document.getElementById('search-box').value;
      renderTree(q);
    }

    function selectFile(filePath) {
      activeFilePath = filePath;
      renderTree(document.getElementById('search-box').value);
      renderWorkspace();
    }

    function renderWorkspace() {
      const ws = document.getElementById('workspace');
      ws.innerHTML = '';
      const focusNode = nodeMap.get(activeFilePath);
      if (!focusNode) return;

      document.getElementById('current-file-label').innerHTML = `
        Focus: <span style="color:#38bdf8">${focusNode.name}</span> 
        <span style="font-size:12px; color:#94a3b8; font-weight:normal; margin-left: 10px;">
          (Layer ${focusNode.layer} • ${focusNode.loc} lines • ${focusNode.downstreamCount} imports • ${focusNode.upstreamCount} callers)
        </span>
      `;

      // Render Focus ERD Table
      ws.appendChild(createERDTable(focusNode, 'focused'));

      // Render 1-hop downstream tables
      const downstreamFiles = edges.filter(e => e.from === focusNode.path).map(e => e.to);
      const uniqueDown = [...new Set(downstreamFiles)];
      for (const dPath of uniqueDown) {
        const dNode = nodeMap.get(dPath);
        if (dNode) ws.appendChild(createERDTable(dNode, 'downstream'));
      }
    }

    function createERDTable(node, statusClass = '') {
      const card = document.createElement('div');
      card.className = 'erd-table ' + statusClass;
      card.id = 'erd-' + node.path.replace(/[^a-zA-Z0-9]/g, '_');

      let fnsHtml = '';
      if (node.fns.length > 0) {
        fnsHtml = '<div class="erd-section"><div class="erd-section-title">Functions (' + node.fns.length + ')</div>' +
          node.fns.map(f => `<div class="erd-row fn"><span>${f.name}()</span><span class="erd-row-badge">${f.isExported ? 'pub' : 'priv'}</span></div>`).join('') +
          '</div>';
      }

      let typesHtml = '';
      const allTypes = [...node.interfaces, ...node.types];
      if (allTypes.length > 0) {
        typesHtml = '<div class="erd-section"><div class="erd-section-title">Types & Interfaces (' + allTypes.length + ')</div>' +
          allTypes.map(t => `<div class="erd-row type"><span>${t.name}</span><span class="erd-row-badge">${t.isExported ? 'pub' : 'priv'}</span></div>`).join('') +
          '</div>';
      }

      let importsHtml = '';
      if (node.imports.length > 0) {
        importsHtml = '<div class="erd-section"><div class="erd-section-title">Imports (' + node.imports.length + ')</div>' +
          node.imports.map(i => `<div class="erd-row" style="color:#94a3b8" onclick="selectFile('${i.canonical}')"><span>${i.canonical.split('/').pop()}</span><span class="erd-row-badge">${i.symbols.length} sym</span></div>`).join('') +
          '</div>';
      }

      card.innerHTML = `
        <div class="erd-header">
          <span class="erd-title">${node.name}</span>
          <span class="erd-layer">${node.isBedrock ? 'BEDROCK' : 'Layer ' + node.layer}</span>
        </div>
        ${fnsHtml}
        ${typesHtml}
        ${importsHtml}
      `;

      return card;
    }

    function traceBedrock() {
      const panel = document.getElementById('trace-panel');
      const content = document.getElementById('trace-flow-content');
      document.getElementById('trace-title').innerText = 'Downstream Lineage Trace to Bedrock for: ' + nodeMap.get(activeFilePath).name;

      const visitedPaths = [];
      function crawl(p, currentLineage) {
        const nexts = edges.filter(e => e.from === p).map(e => e.to);
        if (nexts.length === 0) {
          visitedPaths.push([...currentLineage, p]);
          return;
        }
        for (const nxt of nexts) {
          if (!currentLineage.includes(nxt)) {
            crawl(nxt, [...currentLineage, p]);
          }
        }
      }
      crawl(activeFilePath, []);

      content.innerHTML = visitedPaths.slice(0, 5).map(line => 
        '<div style="margin: 6px 0; width: 100%">' +
        line.map((step, idx) => {
          const n = nodeMap.get(step);
          return `<span class="trace-step ${n?.isBedrock ? 'style="border-color:#10b981; color:#34d399"' : ''}">${n?.name || step} (L${n?.layer ?? '?'})</span>` +
            (idx < line.length - 1 ? ' <span class="trace-arrow">➔</span> ' : '');
        }).join('') +
        '</div>'
      ).join('') || '<div>This file is already at bedrock! (0 downstream dependencies)</div>';

      panel.style.display = 'block';
    }

    function traceUpstream() {
      const panel = document.getElementById('trace-panel');
      const content = document.getElementById('trace-flow-content');
      document.getElementById('trace-title').innerText = 'Upstream Callers for: ' + nodeMap.get(activeFilePath).name;

      const callers = edges.filter(e => e.to === activeFilePath).map(e => nodeMap.get(e.from));
      content.innerHTML = callers.length > 0
        ? callers.map(c => `<span class="trace-step" style="border-color:#f59e0b; color:#fbbf24" onclick="selectFile('${c.path}')">${c.name} (Layer ${c.layer})</span>`).join('')
        : '<div>No upstream files in this subsystem import this file directly.</div>';

      panel.style.display = 'block';
    }

    function clearHighlights() {
      document.getElementById('trace-panel').style.display = 'none';
      renderWorkspace();
    }

    // Init
    renderTree();
    selectFile(activeFilePath);
  </script>
</body>
</html>
