ean'\n          ? value.onboardingCompleted\n          : false,\n  };\n  if (!isProfile(candidate))\n    throw new Error('Stored identity profile is invalid; original record retained.');\n  return { user: candidate };\n}\n\nasync function retainLegacyProfile(name: string, raw: string): Promise<void> {\n  const backup = `${name}:legacy-retained-v1`;\n  const retained = await SafeZustandStorage.getItem(backup);\n  if (retained && retained !== raw)\n    throw new Error(\n      'Different legacy profile bytes already retained; migration requires reconciliation.',\n    );\n  if (!retained) {\n    await SafeZustandStorage.setItem(backup, raw);\n    if ((await SafeZustandStorage.getItem(backup)) !== raw)\n      throw new Error('Identity migration backup verification failed.');\n  }\n}\n\nasync function migrateLegacyExplorer(legacy: unknown): Promise<void> {\n  if (\n    !isRecord(legacy) ||\n    !isRecord(legacy.user) ||\n    typeof legacy.user.id !== 'string' ||\n    typeof legacy.isExplorerMode !== 'boolean'\n  )\n    return;\n  const key =\n    legacy.user.is_anonymous === true || isGuestUserId(legacy.user.id)\n      ? guestStorageKey('gurudevi-experience-state', legacy.user.id)\n      : scopeStorageKey('gurudevi-experience-state', legacy.user.id);\n  if (await SafeZustandStorage.getItem(key)) return;\n  const migrated = JSON.stringify({\n    state: { isExplorerMode: legacy.isExplorerMode },\n    version: 1,\n  });\n  await SafeZustandStorage.setItem(key, migrated);\n  if ((await SafeZustandStorage.getItem(key)) !== migrated)\n    throw new Error('Experience migration verification failed.');\n}\n\n/** Retain old bytes before narrowing the persisted profile and moving explorer preference. */\nexport const authProfileStorage = {\n  async getItem(name: string): Promise<string | null> {\n    const generation = ++profileReadGeneration;\n    profileWritesReady = false;\n    const raw = await SafeZustandStorage.getItem(name);\n    if (raw) {\n      const decoded: unknown = JSON.parse(raw);\n      if (!isRecord(decoded)) throw new Error('Stored identity envelope is invalid.');\n      if (typeof decoded.version === 'number' && decoded.version > 2)\n        throw new Error(\n          'Stored identity profile requires a newer reader; original record retained.',\n        );\n      restoreIdentityProfile(decoded.state);\n      if (decoded.version !== 2) {\n        await retainLegacyProfile(name, raw);\n        await migrateLegacyExplorer(decoded.state);\n      }\n    }\n    await useExperienceState.persist.rehydrate();\n    if (generation === profileReadGeneration) profileWritesReady = true;\n    return raw;\n  },\n  setItem(name: string, value: string): Promise<void> {\n    const pending = profileWritesReady\n      ? Promise.resolve(SafeZustandStorage.setItem(name, value)).then(() => undefined)\n      : Promise.reject(\n          new Error('Profile persistence blocked until ownership migration succeeds.'),\n        );\n    void pending.catch((error) => console.error('[Identity persistence]', error));\n    return pending;\n  },\n  removeItem: SafeZustandStorage.removeItem,\n};\n","layer":6,"isBedrock":false,"downstreamCount":5,"upstreamCount":1},{"path":"packages/core/src/store/slices/auth.slice.ts","name":"auth.slice.ts","dir":"packages/core/src/store/slices","loc":21,"fns":[],"interfaces":[{"name":"AuthSlice","isExported":true}],"types":[],"constants":[],"imports":[{"source":"@repo/core/monitoring","canonical":"packages/core/src/monitoring/index.ts","isTypeOnly":false,"symbols":["leaveBreadcrumb"]},{"source":"@repo/core/types","canonical":"packages/core/src/types/index.ts","isTypeOnly":true,"symbols":["User"]}],"content":"import { leaveBreadcrumb } from '@repo/core/monitoring';\nimport type { User } from '@repo/core/types';\nimport type { StateCreator } from 'zustand';\n\nexport interface AuthSlice {\n  user: User | null;\n  setUser(user: User | null): void;\n  isStoreHydrated: boolean;\n  setStoreHydrated(hydrated: boolean): void;\n}\n\nexport const createAuthSlice: StateCreator<AuthSlice, [], [], AuthSlice> = (set) => ({\n  user: null,\n  setUser: (user) => {\n    leaveBreadcrumb('auth', user ? `User set: ${user.id}` : 'User cleared', 'info');\n    set({ user });\n  },\n  isStoreHydrated: false,\n  setStoreHydrated: (isStoreHydrated) => set({ isStoreHydrated }),\n});\n","layer":6,"isBedrock":false,"downstreamCount":2,"upstreamCount":1},{"path":"packages/core/src/adapters/powersync/database.ts","name":"database.ts","dir":"packages/core/src/adapters/powersync","loc":122,"fns":[{"name":"assertPowerSyncBootstrapReady","isExported":true,"params":""},{"name":"assertBrowserPowerSyncReady","isExported":false,"params":""},{"name":"getPowerSyncDB","isExported":true,"params":""},{"name":"getDrizzleDB","isExported":true,"params":""},{"name":"injectNativePowerSyncDB","isExported":true,"params":"nativeDb: any,\n  nativeDrizzleDb: any,\n  ownership?: PowerSyncRuntimeOwnership,"},{"name":"getActivePowerSyncDB","isExported":true,"params":""},{"name":"disconnectPowerSync","isExported":true,"params":"options?: { clear?: boolean }"},{"name":"clearPowerSyncAccount","isExported":true,"params":""}],"interfaces":[],"types":[],"constants":[{"name":"registry","isExported":false}],"imports":[{"source":"@repo/core/adapters/powersync/databaseRegistry","canonical":"packages/core/src/adapters/powersync/databaseRegistry.ts","isTypeOnly":false,"symbols":["PowerSyncDatabaseRegistry"]},{"source":"@repo/core/adapters/powersync/powersync-shim","canonical":"packages/core/src/adapters/powersync/powersync-shim.ts","isTypeOnly":false,"symbols":["PowerSyncDatabase as MockPowerSyncDatabase"]},{"source":"@repo/core/adapters/powersync/schema","canonical":"packages/core/src/adapters/powersync/schema.ts","isTypeOnly":false,"symbols":["AppSchema"]},{"source":"@repo/core/adapters/powersync/secureDrizzleProxy","canonical":"packages/core/src/adapters/powersync/secureDrizzleProxy.ts","isTypeOnly":false,"symbols":["createSecureDrizzleProxy"]},{"source":"@repo/core/adapters/powersync/singleActivePowerSyncRuntime","canonical":"packages/core/src/adapters/powersync/singleActivePowerSyncRuntime.ts","isTypeOnly":true,"symbols":["PowerSyncRuntimeOwnership"]},{"source":"@repo/core/logic/runtimeRegistry","canonical":"packages/core/src/logic/runtimeRegistry.ts","isTypeOnly":false,"symbols":["coreRuntime"]}],"content":"/* eslint-disable @typescript-eslint/no-explicit-any */\n/**\n * PowerSync Database Instance — May 2026\n *\n * Singleton PowerSyncDatabase with the AppSchema.\n * Exported as a lazy singleton — only initialised when first accessed.\n *\n * This uses a Dependency Injection pattern to support running in both Hono\n * server-side Node.js environment (which loads a mock database) and the native\n * Expo React Native environment (which injects the real hardware-accelerated JSI C++ instance).\n *\n * Import pattern:\n *   import { getPowerSyncDB, getDrizzleDB } from '@repo/core/powersync';\n *   const db = getDrizzleDB();\n *   const rows = await db.select().from(students);\n */\n\nimport type { CommonPowerSyncDatabase } from '@powersync/common';\nimport { wrapPowerSyncWithDrizzle } from '@powersync/drizzle-driver';\nimport { PowerSyncDatabaseRegistry } from '@repo/core/adapters/powersync/databaseRegistry';\nimport { PowerSyncDatabase as MockPowerSyncDatabase } from '@repo/core/adapters/powersync/powersync-shim';\nimport { AppSchema } from '@repo/core/adapters/powersync/schema';\nimport { createSecureDrizzleProxy } from '@repo/core/adapters/powersync/secureDrizzleProxy';\nimport type { PowerSyncRuntimeOwnership } from '@repo/core/adapters/powersync/singleActivePowerSyncRuntime';\nimport { coreRuntime } from '@repo/core/logic/runtimeRegistry';\n\nexport function assertPowerSyncBootstrapReady() {\n  // Hermes exposes `window` on React Native, but only browser runtimes provide\n  // `document`. Keep this guard scoped to actual web bootstrap.\n  if (typeof window === 'undefined' || typeof document === 'undefined') return;\n\n  throw new Error(\n    'PowerSync bootstrap guard: browser code touched PowerSync before the app was ready. Use the direct API highway for bootstrap and identity, and only enter PowerSync after the runtime is intentionally registered.',\n  );\n}\n\nexport {\n  registerOperationContext,\n  registerPermissionValidator,\n  registerPolicyVersionHash,\n  resetSecureDrizzleState,\n  setActiveCapabilityToken,\n} from '@repo/core/adapters/powersync/secureDrizzleProxy';\n\nconst registry = new PowerSyncDatabaseRegistry<\n  ReturnType<typeof wrapPowerSyncWithDrizzle<typeof AppSchema>>\n>(createSecureDrizzleProxy);\n\nfunction assertBrowserPowerSyncReady() {\n  assertPowerSyncBootstrapReady();\n\n  if (!coreRuntime.isRegistered()) {\n    throw new Error(\n      'PowerSync bootstrap guard: browser code touched PowerSync before runtime registration. Initialize the runtime before accessing PowerSync.',\n    );\n  }\n}\n\n/**\n * Returns the active PowerSync database instance.\n * Automatically initializes the mock database under server-side Node.js or test environments\n * unless a native JSI instance has been injected via injectNativePowerSyncDB().\n */\nexport function getPowerSyncDB(): CommonPowerSyncDatabase {\n  assertBrowserPowerSyncReady();\n  let database = registry.database;\n  if (!database) {\n    if (typeof window === 'undefined' || process.env.NODE_ENV === 'test') {\n      database = new MockPowerSyncDatabase({\n        schema: AppSchema as any,\n        database: {\n          dbFilename: 'gurudevi-powersync.db',\n        },\n      }) as unknown as CommonPowerSyncDatabase;\n      registry.inject(database, null);\n    } else {\n      throw new Error(\n        'PowerSync runtime is not initialized. Inject the native or web database instance via injectNativePowerSyncDB() before calling getPowerSyncDB().',\n      );\n    }\n  }\n  return database;\n}\n\n/**\n * Returns the active Drizzle ORM client wrapper instance.\n * Automatically wraps the active PowerSync database instance.\n */\nexport function getDrizzleDB(): ReturnType<typeof wrapPowerSyncWithDrizzle<typeof AppSchema>> {\n  assertBrowserPowerSyncReady();\n  return registry.getDrizzle(() =>\n    wrapPowerSyncWithDrizzle(getPowerSyncDB(), { schema: AppSchema }),\n  );\n}\n\n/**\n * Injects the real native React Native JSI C++ database and Drizzle instances\n * at runtime when booting the mobile client.\n */\nexport function injectNativePowerSyncDB(\n  nativeDb: any,\n  nativeDrizzleDb: any,\n  ownership?: PowerSyncRuntimeOwnership,\n): void {\n  registry.inject(nativeDb, nativeDrizzleDb, ownership);\n}\n\n/** Returns the injected active runtime without creating a fallback database. */\nexport function getActivePowerSyncDB(): CommonPowerSyncDatabase | null {\n  return registry.activeDatabase;\n}\n\n/** Close the active runtime; clear is reserved for explicit account removal. */\nexport function disconnectPowerSync(options?: { clear?: boolean }): Promise<void> {\n  return registry.disconnect(options);\n}\n\n/** Explicit destructive cleanup for account removal or sign-out-all. */\nexport async function clearPowerSyncAccount(): Promise<void> {\n  await disconnectPowerSync({ clear: true });\n}\n","layer":9,"isBedrock":false,"downstreamCount":6,"upstreamCount":2},{"path":"packages/core/src/adapters/powersync/schema.ts","name":"schema.ts","dir":"packages/core/src/adapters/powersync","loc":700,"fns":[{"name":"isLocalOnlyTable","isExported":true,"params":"table: string"}],"interfaces":[],"types":[{"name":"Attendance","isExported":true},{"name":"InsertAttendance","isExported":true},{"name":"Bond","isExported":true},{"name":"InsertBond","isExported":true},{"name":"ClassroomStudent","isExported":true},{"name":"InsertClassroomStudent","isExported":true},{"name":"SchoolMembership","isExported":true},{"name":"InsertSchoolMembership","isExported":true},{"name":"Student","isExported":true},{"name":"InsertStudent","isExported":true},{"name":"Classroom","isExported":true},{"name":"InsertClassroom","isExported":true},{"name":"MoodLog","isExported":true},{"name":"InsertMoodLog","isExported":true},{"name":"ThoughtRecord","isExported":true},{"name":"InsertThoughtRecord","isExported":true},{"name":"School","isExported":true},{"name":"InsertSchool","isExported":true},{"name":"CedarPolicy","isExported":true},{"name":"InsertCedarPolicy","isExported":true},{"name":"DrizzleFormTemplate","isExported":true},{"name":"InsertDrizzleFormTemplate","isExported":true},{"name":"DrizzleFormResponse","isExported":true},{"name":"InsertDrizzleFormResponse","isExported":true},{"name":"PermissionSnapshot","isExported":true},{"name":"InsertPermissionSnapshot","isExported":true},{"name":"PricingManifest","isExported":true},{"name":"InsertPricingManifest","isExported":true},{"name":"UserEntitlementGrant","isExported":true},{"name":"InsertUserEntitlementGrant","isExported":true},{"name":"UserPreference","isExported":true},{"name":"InsertUserPreference","isExported":true},{"name":"PolicyVersion","isExported":true},{"name":"InsertPolicyVersion","isExported":true},{"name":"TuitionInstitute","isExported":true},{"name":"InsertTuitionInstitute","isExported":true},{"name":"TuitionBatch","isExported":true},{"name":"InsertTuitionBatch","isExported":true},{"name":"GuardianBond","isExported":true},{"name":"InsertGuardianBond","isExported":true},{"name":"JoyMoment","isExported":true},{"name":"InsertJoyMoment","isExported":true},{"name":"GratitudeGlimmer","isExported":true},{"name":"InsertGratitudeGlimmer","isExported":true},{"name":"SleepLog","isExported":true},{"name":"InsertSleepLog","isExported":true},{"name":"TimetablePeriod","isExported":true},{"name":"InsertTimetablePeriod","isExported":true},{"name":"DailyPrepItem","isExported":true},{"name":"InsertDailyPrepItem","isExported":true},{"name":"PersonalReminder","isExported":true},{"name":"InsertPersonalReminder","isExported":true},{"name":"TodoList","isExported":true},{"name":"InsertTodoList","isExported":true},{"name":"Todo","isExported":true},{"name":"InsertTodo","isExported":true},{"name":"JurisdictionNode","isExported":true},{"name":"InsertJurisdictionNode","isExported":true}],"constants":[{"name":"pricingManifest","isExported":true},{"name":"userEntitlementGrants","isExported":true},{"name":"userPreferences","isExported":true},{"name":"bonds","isExported":true},{"name":"classroomStudents","isExported":true},{"name":"schoolMemberships","isExported":true},{"name":"attendance","isExported":true},{"name":"students","isExported":true},{"name":"classrooms","isExported":true},{"name":"moodLogs","isExported":true},{"name":"thoughtRecords","isExported":true},{"name":"learningReflections","isExported":true},{"name":"jurisdictionNodes","isExported":true},{"name":"schools","isExported":true},{"name":"cedarPolicies","isExported":true},{"name":"permissionSnapshots","isExported":true},{"name":"policyVersion","isExported":true},{"name":"formTemplates","isExported":true},{"name":"formResponses","isExported":true},{"name":"tuitionInstitutes","isExported":true},{"name":"tuitionBatches","isExported":true},{"name":"guardianBonds","isExported":true},{"name":"joyMoments","isExported":true},{"name":"gratitudeGlimmers","isExported":true},{"name":"sleepLogs","isExported":true},{"name":"timetablePeriods","isExported":true},{"name":"dailyPrepItems","isExported":true},{"name":"personalReminders","isExported":true},{"name":"lists","isExported":true},{"name":"todos","isExported":true},{"name":"AppSchema","isExported":true},{"name":"LOCAL_ONLY_TABLES","isExported":true}],"imports":[],"content":"export const pricingManifest = sqliteTable(\n  'pricing_manifest',\n  {\n    id: text('id').primaryKey(),\n    tier: text('tier').notNull(), // 'FREE' | 'PRO' | 'INSTITUTIONAL'\n    features: text('features').notNull(), // JSON array of entitlement keys\n    updatedAt: text('updated_at').notNull(),\n  },\n  (table) => [index('pricing_manifest_tier_idx').on(table.tier)],\n);\n\nexport const userEntitlementGrants = sqliteTable(\n  'user_entitlement_grants',\n  {\n    id: text('id').primaryKey(),\n    userId: text('user_id').notNull(),\n    bondId: text('bond_id'),\n    entityId: text('entity_id'),\n    entityType: text('entity_type'),\n    scopeType: text('scope_type').notNull(),\n    tier: text('tier').notNull(),\n    modules: text('modules').notNull(),\n    source: text('source').notNull(),\n    status: text('status').notNull(),\n    startsAt: text('starts_at').notNull(),\n    expiresAt: text('expires_at'),\n    updatedAt: text('updated_at').notNull(),\n  },\n  (table) => [\n    index('user_entitlement_grants_user_scope_idx').on(table.userId, table.scopeType),\n    index('user_entitlement_grants_user_bond_idx').on(table.userId, table.bondId),\n  ],\n);\n\nexport const userPreferences = sqliteTable(\n  'user_preferences',\n  {\n    id: text('id').primaryKey(),\n    userId: text('user_id').notNull(),\n    favoriteFeatures: text('favorite_features').notNull(),\n    hiddenFeatures: text('hidden_features').notNull(),\n    morningCheckTime: text('morning_check_time'),\n    afternoonCheckTime: text('afternoon_check_time'),\n    eveningWindDownTime: text('evening_wind_down_time'),\n    enableContextualPrompts: integer('enable_contextual_prompts', { mode: 'boolean' })\n      .notNull()\n      .default(true),\n    enableUsageTracking: integer('enable_usage_tracking', { mode: 'boolean' })\n      .notNull()\n      .default(true),\n    notificationSettings: text('notification_settings'),\n    updatedAt: text('updated_at').notNull(),\n    createdAt: text('created_at').notNull(),\n  },\n  (table) => [index('user_preferences_user_idx').on(table.userId)],\n);\n\n/**\n * PowerSync Schema — Client-Side Drizzle SQLite Table Definitions (May 2026)\n *\n * Defines the type-safe SQLite database schema using Drizzle ORM.\n * These tables are replicated from Supabase Postgres down to the local\n * SQLCipher SQLite file on the device.\n *\n * Since this file uses pure Drizzle sqliteTable definitions with no native\n * JSI C++ dependencies, it compiles cleanly across both server (Node/Vitest)\n * and mobile (React Native/Expo) environments.\n *\n * @see https://docs.powersync.com/usage/use-case-examples/drizzle\n */\nimport { index, integer, real, sqliteTable, text } from 'drizzle-orm/sqlite-core';\n\nexport const bonds = sqliteTable(\n  'bonds',\n  {\n    id: text('id').primaryKey(),\n    userId: text('user_id').notNull(),\n    entityId: text('entity_id').notNull(),\n    entityType: text('entity_type').notNull(),\n    capacity: text('capacity').notNull(),\n    metadata: text('metadata'),\n    createdAt: text('created_at').notNull(),\n    updatedAt: text('updated_at').notNull(),\n  },\n  (table) => [\n    index('bonds_user_idx').on(table.userId),\n    index('bonds_entity_idx').on(table.entityId, table.entityType),\n  ],\n);\n\nexport const classroomStudents = sqliteTable(\n  'classroom_students',\n  {\n    id: text('id').primaryKey(),\n    classroomId: text('classroom_id').notNull(),\n    studentId: text('student_id'),\n    fullName: text('full_name'),\n    inviteCode: text('invite_code'),\n    rollNumber: integer('roll_number'),\n    enrolledAt: text('enrolled_at').notNull(),\n    claimedAt: text('claimed_at'),\n    status: text('status').notNull(),\n    joinedAt: text('joined_at').notNull(),\n    notes: text('notes'),\n  },\n  (table) => [\n    index('classroom_students_classroom_status_idx').on(table.classroomId, table.status),\n    index('classroom_students_student_status_idx').on(table.studentId, table.status),\n  ],\n);\n\nexport const schoolMemberships = sqliteTable(\n  'school_memberships',\n  {\n    id: text('id').primaryKey(),\n    userId: text('user_id').notNull(),\n    schoolId: text('school_id').notNull(),\n    role: text('role').notNull(),\n    status: text('status').notNull(),\n    startDate: text('start_date'),\n    endDate: text('end_date'),\n    isPrimary: integer('is_primary', { mode: 'boolean' }),\n    deletedAt: text('deleted_at'),\n    createdAt: text('created_at'),\n    updatedAt: text('updated_at'),\n    deletedBy: text('deleted_by'),\n    deletionReason: text('deletion_reason'),\n    joinedAt: text('joined_at'),\n    leftAt: text('left_at'),\n  },\n  (table) => [\n    index('school_memberships_user_idx').on(table.userId),\n    index('school_memberships_school_status_idx').on(table.schoolId, table.status),\n  ],\n);\n\nexport const attendance = sqliteTable(\n  'attendance',\n  {\n    id: text('id').primaryKey(),\n    studentId: text('student_id').notNull(),\n    classroomId: text('classroom_id').notNull(),\n    date: text('date').notNull(), // ISO date string (YYYY-MM-DD)\n    status: text('status').notNull(), // 'present' | 'absent' | 'late' | 'excused'\n    markedBy: text('marked_by').notNull(),\n    note: text('note'),\n    createdAt: text('created_at').notNull(),\n    updatedAt: text('updated_at').notNull(),\n    occurredAt: text('occurred_at'),\n    academicCycleId: text('academic_cycle_id'),\n  },\n  (table) => [\n    // Compound index on classroom, date, and status for lightning-fast attendance sheets\n    index('attendance_classroom_date_idx').on(table.classroomId, table.date),\n    index('attendance_classroom_date_status_idx').on(table.classroomId, table.date, table.status),\n    index('attendance_student_idx').on(table.studentId),\n  ],\n);\n\nexport const students = sqliteTable(\n  'students',\n  {\n    id: text('id').primaryKey(),\n    fullName: text('full_name').notNull(),\n    classroomId: text('classroom_id').notNull(),\n    schoolId: text('school_id').notNull(),\n    gradeId: text('grade_id'),\n    sectionId: text('section_id'),\n    admissionNumber: text('admission_number'),\n    // Mode boolean handles 0/1 integer conversion automatically at the database level!\n    isActive: integer('is_active', { mode: 'boolean' }).notNull().default(true),\n    createdAt: text('created_at').notNull(),\n    updatedAt: text('updated_at').notNull(),\n  },\n  (table) => [\n    index('students_classroom_idx').on(table.classroomId),\n    index('students_school_idx').on(table.schoolId),\n  ],\n);\n\nexport const classrooms = sqliteTable(\n  'classrooms',\n  {\n    id: text('id').primaryKey(),\n    name: text('name').notNull(),\n    schoolId: text('school_id').notNull(),\n    gradeId: text('grade_id'),\n    sectionId: text('section_id'),\n    teacherId: text('teacher_id'),\n    academicYear: text('academic_year').notNull(),\n    isArchived: integer('is_archived', { mode: 'boolean' }).notNull().default(false),\n    createdAt: text('created_at').notNull(),\n    updatedAt: text('updated_at').notNull(),\n  },\n  (table) => [\n    index('classrooms_school_idx').on(table.schoolId),\n    index('classrooms_school_academic_year_idx').on(table.schoolId, table.academicYear),\n    index('classrooms_teacher_idx').on(table.teacherId),\n  ],\n);\n\nexport const moodLogs = sqliteTable(\n  'mood_logs',\n  {\n    id: text('id').primaryKey(),\n    userId: text('user_id').notNull(),\n    moodScore: integer('mood_score').notNull(),\n    mood: text('mood'),\n    note: text('note'),\n    createdAt: text('created_at').notNull(),\n  },\n  (table) => [\n    index('mood_logs_user_idx').on(table.userId),\n    index('mood_logs_created_idx').on(table.createdAt),\n  ],\n);\n\nexport const thoughtRecords = sqliteTable(\n  'thought_records',\n  {\n    id: text('id').primaryKey(),\n    userId: text('user_id').notNull(),\n    thought: text('thought').notNull(),\n    situation: text('situation'),\n    emotion: text('emotion'), // JSON\n    trapIds: text('trap_ids'), // JSON array of trap ids\n    evidenceFor: text('evidence_for'),\n    evidenceAgainst: text('evidence_against'),\n    reframe: text('reframe'),\n    moodBefore: integer('mood_before'),\n    moodAfter: integer('mood_after'),\n    postOutcome: text('post_outcome'),\n    followUp: text('follow_up'), // JSON\n    createdAt: text('created_at').notNull(),\n  },\n  (table) => [\n    index('thought_records_user_idx').on(table.userId),\n    index('thought_records_created_idx').on(table.createdAt),\n  ],\n);\n\nexport const learningReflections = sqliteTable(\n  'learning_reflections',\n  {\n    id: text('id').primaryKey(),\n    userId: text('user_id').notNull(),\n    classroomId: text('classroom_id'),\n    assignmentId: text('assignment_id'),\n    thought: text('thought').notNull(),\n    situation: text('situation'),\n    emotion: text('emotion'), // JSON\n    trapIds: text('trap_ids'), // JSON array of trap ids\n    evidenceFor: text('evidence_for'),\n    evidenceAgainst: text('evidence_against'),\n    reframe: text('reframe'),\n    moodBefore: integer('mood_before'),\n    moodAfter: integer('mood_after'),\n    postOutcome: text('post_outcome'),\n    followUp: text('follow_up'), // JSON\n    createdAt: text('created_at').notNull(),\n  },\n  (table) => [\n    index('learning_reflections_user_idx').on(table.userId),\n    index('learning_reflections_classroom_idx').on(table.classroomId),\n    index('learning_reflections_created_idx').on(table.createdAt),\n  ],\n);\n\nexport const jurisdictionNodes = sqliteTable(\n  'jurisdiction_nodes',\n  {\n    id: text('id').primaryKey(),\n    level: text('level').notNull(),\n    code: text('code').notNull(),\n    nameEn: text('name_en').notNull(),\n    nameSi: text('name_si'),\n    nameTa: text('name_ta'),\n    parentId: text('parent_id'),\n    createdAt: text('created_at').notNull(),\n    updatedAt: text('updated_at').notNull(),\n  },\n  (table) => [\n    index('jurisdiction_nodes_level_idx').on(table.level),\n    index('jurisdiction_nodes_parent_idx').on(table.parentId),\n    index('jurisdiction_nodes_code_idx').on(table.code),\n  ],\n);\n\nexport const schools = sqliteTable('schools', {\n  id: text('id').primaryKey(),\n  name: text('name').notNull(),\n  type: text('type'),\n  subscriptionTier: text('subscription_tier'),\n  isActive: integer('is_active', { mode: 'boolean' }).notNull().default(true),\n  createdAt: text('created_at').notNull(),\n});\n\nexport const cedarPolicies = sqliteTable(\n  'cedar_policies',\n  {\n    id: text('id').primaryKey(), // policy ID\n    name: text('name').notNull(), // e.g. 'school/principal.cedar'\n    content: text('content').notNull(), // Cedar DSL string\n    updatedAt: text('updated_at').notNull(),\n  },\n  (table) => [index('cedar_policies_name_idx').on(table.name)],\n);\n\nexport const permissionSnapshots = sqliteTable(\n  'permission_snapshots',\n  {\n    userId: text('user_id').notNull(),\n    activeBondId: text('active_bond_id').notNull(),\n    activeEntityId: text('active_entity_id').notNull(),\n    activeEntityType: text('active_entity_type').notNull(),\n    schoolId: text('school_id'),\n    policyVersion: text('policy_version').notNull(),\n    generatedAt: text('generated_at').notNull(),\n    expiresAt: text('expires_at').notNull(),\n    permissions: text('permissions').notNull(), // Serialized JSON: Record<Resource, Record<Action, boolean>>\n    temporalHints: text('temporal_hints'), // Optional temporal lease details/hints (JSON string or null)\n    signature: text('signature').notNull(), // Ed25519 server signature\n  },\n  (table) => [index('permission_snapshots_user_idx').on(table.userId)],\n);\n\nexport const policyVersion = sqliteTable('policy_version', {\n  id: text('id').primaryKey(),\n  hash: text('hash').notNull(),\n  updatedAt: text('updated_at').notNull(),\n});\n\nexport const formTemplates = sqliteTable(\n  'form_templates',\n  {\n    id: text('id').primaryKey(),\n    ownerId: text('owner_id').notNull(),\n    title: text('title').notNull(),\n    description: text('description'),\n    config: text('config').notNull(), // Serialised JSON string of FieldDefinition[]\n    isPublished: integer('is_published', { mode: 'boolean' }).notNull().default(false),\n    slug: text('slug'),\n    category: text('category'),\n    createdAt: text('created_at').notNull(),\n    updatedAt: text('updated_at').notNull(),\n  },\n  (table) => [\n    index('form_templates_owner_idx').on(table.ownerId),\n    index('form_templates_slug_idx').on(table.slug),\n  ],\n);\n\nexport const formResponses = sqliteTable(\n  'form_responses',\n  {\n    id: text('id').primaryKey(),\n    templateId: text('template_id').notNull(),\n    responderId: text('responder_id'),\n    data: text('data').notNull(), // Serialised JSON string of response object\n    submittedAt: text('submitted_at').notNull(),\n  },\n  (table) => [index('form_responses_template_idx').on(table.templateId)],\n);\n\nexport const tuitionInstitutes = sqliteTable(\n  'tuition_institutes',\n  {\n    id: text('id').primaryKey(),\n    name: text('name').notNull(),\n    address: text('address'),\n    city: text('city'),\n    isIndependent: integer('is_independent', { mode: 'boolean' }).notNull().default(false),\n    createdBy: text('created_by'),\n    createdAt: text('created_at').notNull(),\n    updatedAt: text('updated_at').notNull(),\n  },\n  (table) => [index('tuition_institutes_created_by_idx').on(table.createdBy)],\n);\n\nexport const tuitionBatches = sqliteTable(\n  'tuition_batches',\n  {\n    id: text('id').primaryKey(),\n    instituteId: text('institute_id'),\n    tutorUserId: text('tutor_user_id').notNull(),\n    subjectName: text('subject_name').notNull(),\n    gradeLevel: text('grade_level').notNull(),\n    medium: text('medium').notNull(), // 'sinhala' | 'english' | 'tamil'\n    format: text('format').notNull().default('physical'),\n    schedule: text('schedule').notNull(),\n    monthlyFee: text('monthly_fee'),\n    customAlias: text('custom_alias'),\n    role: text('role').notNull().default('lead_tutor'),\n    isActive: integer('is_active', { mode: 'boolean' }).notNull().default(true),\n    createdAt: text('created_at').notNull(),\n    updatedAt: text('updated_at').notNull(),\n  },\n  (table) => [\n    index('tuition_batches_tutor_idx').on(table.tutorUserId),\n    index('tuition_batches_institute_idx').on(table.instituteId),\n    index('tuition_batches_active_idx').on(table.tutorUserId, table.isActive),\n  ],\n);\n\n boolean> {\n  try {\n    // 1. Reconstruct the exact JSON payload generated on the server (preserving order of keys)\n    const payload = {\n      generatedAt: snapshot.generatedAt,\n      expiresAt: snapshot.expiresAt,\n      userId: snapshot.userId,\n      activeBondId: snapshot.activeBondId,\n      activeEntityId: snapshot.activeEntityId,\n      activeEntityType: snapshot.activeEntityType,\n      schoolId: snapshot.schoolId,\n      policyVersion: snapshot.policyVersion,\n      permissions: JSON.parse(snapshot.permissions),\n      temporalHints: snapshot.temporalHints ? JSON.parse(snapshot.temporalHints) : {},\n    };\n\n    const publicKey =\n      process.env.EXPO_PUBLIC_SNAPSHOT_SIGNING_PUBLIC_KEY ||\n      process.env.NEXT_PUBLIC_SNAPSHOT_SIGNING_PUBLIC_KEY;\n    if (!publicKey || !snapshot.signature.startsWith('ed25519:')) return false;\n\n    // 2. Verify with a public key shipped in the client. The private key never\n    // leaves the server/operator environment.\n    const enc = new TextEncoder();\n    const messageData = enc.encode(JSON.stringify(payload));\n    const signatureBytes = decodeBase64(snapshot.signature.slice('ed25519:'.length));\n\n    const importedKey = await crypto.subtle.importKey(\n      'raw',\n      decodeBase64(publicKey) as unknown as BufferSource,\n      { name: 'Ed25519' },\n      false,\n      ['verify'],\n    );\n\n    const valid = await crypto.subtle.verify(\n      { name: 'Ed25519' },\n      importedKey,\n      signatureBytes as unknown as BufferSource,\n      messageData,\n    );\n    if (valid) return true;\n\n    // The legacy generator emits the registry order and empty temporal hints.\n    // Restore that order after JSONB storage without discarding any signed data.\n    if (\n      !payload.permissions ||\n      typeof payload.permissions !== 'object' ||\n      Array.isArray(payload.permissions) ||\n      !payload.temporalHints ||\n      typeof payload.temporalHints !== 'object' ||\n      Array.isArray(payload.temporalHints) ||\n      Object.keys(payload.temporalHints).length !== 0\n    )\n      return false;\n    const resourceNames = Object.keys(payload.permissions);\n    if (\n      resourceNames.some((name) => !(AUTHORIZATION_RESOURCES as readonly string[]).includes(name))\n    )\n      return false;\n    const permissions: Record<string, Record<string, boolean>> = {};\n    for (const resource of AUTHORIZATION_RESOURCES) {\n      if (!Object.hasOwn(payload.permissions, resource)) continue;\n      const actions = payload.permissions[resource];\n      if (!actions || typeof actions !== 'object' || Array.isArray(actions)) return false;\n      if (\n        Object.keys(actions).some(\n          (name) =>\n            !(AUTHORIZATION_ACTIONS as readonly string[]).includes(name) ||\n            typeof actions[name] !== 'boolean',\n        )\n      )\n        return false;\n      permissions[resource] = {};\n      for (const action of AUTHORIZATION_ACTIONS) {\n        if (Object.hasOwn(actions, action)) permissions[resource][action] = actions[action];\n      }\n    }\n    const recovered = {\n      ...payload,\n      generatedAt: new Date(payload.generatedAt).toISOString(),\n      expiresAt: new Date(payload.expiresAt).toISOString(),\n      permissions,\n    };\n    return await crypto.subtle.verify(\n      { name: 'Ed25519' },\n      importedKey,\n      signatureBytes as unknown as BufferSource,\n      enc.encode(JSON.stringify(recovered)),\n    );\n  } catch (err) {\n    console.error('[Signature] Signature verification system error:', err);\n    return false;\n  }\n}\n","layer":0,"isBedrock":true,"downstreamCount":0,"upstreamCount":1},{"path":"packages/core/src/native/localGuestSession.ts","name":"localGuestSession.ts","dir":"packages/core/src/native","loc":96,"fns":[{"name":"isLocalGuestSessionId","isExported":true,"params":"value: unknown"},{"name":"parseLocalGuestSession","isExported":false,"params":"raw: string"},{"name":"createOpaqueId","isExported":false,"params":""},{"name" .parse(raw);\n  } catch {\n    return null;\n  }\n\n  if (!value || typeof value !== 'object' || Array.isArray(value)) return null;\n  const record = value as Record<string, unknown>;\n  if (\n    record.version !== LOCAL_GUEST_SESSION_VERSION ||\n    typeof record.id !== 'string' ||\n    Object.keys(record).length !== 2 ||\n    !isLocalGuestSessionId(record.id)\n  ) {\n    return null;\n  }\n\n  return { version: LOCAL_GUEST_SESSION_VERSION, id: record.id };\n}\n\nfunction createOpaqueId(): string {\n  const randomUUID = globalThis.crypto?.randomUUID;\n  if (typeof randomUUID !== 'function') {\n    throw new LocalGuestSessionError(\n      'Cannot create a local guest session: crypto.randomUUID is unavailable.',\n    );\n  }\n  return `${LOCAL_GUEST_ID_PREFIX}${randomUUID.call(globalThis.crypto)}`;\n}\n\n/** Reads guest ownership without changing the active storage scope. */\nexport async function readLocalGuestSession(): Promise<LocalGuestSession | null> {\n  const raw = await SafeZustandStorage.getItem(LOCAL_GUEST_SESSION_KEY);\n  return raw === null ? null : parseLocalGuestSession(raw);\n}\n\n/** Restores the persisted device-local guest session and activates its data scope. */\nexport async function restoreLocalGuestSession(): Promise<LocalGuestSession | null> {\n  const raw = await SafeZustandStorage.getItem(LOCAL_GUEST_SESSION_KEY);\n  const session = raw === null ? null : parseLocalGuestSession(raw);\n  if (raw !== null && session === null) {\n    await SafeZustandStorage.removeItem(LOCAL_GUEST_SESSION_KEY);\n  }\n  setGuestScope(session?.id ?? null);\n  return session;\n}\n\n/** Returns the existing device-local guest session or creates and persists one. */\nexport async function getOrCreateLocalGuestSession(): Promise<LocalGuestSession> {\n  const existing = await restoreLocalGuestSession();\n  if (existing) return existing;\n\n  const session: LocalGuestSession = {\n    version: LOCAL_GUEST_SESSION_VERSION,\n    id: createOpaqueId(),\n  };\n  await SafeZustandStorage.setItem(LOCAL_GUEST_SESSION_KEY, JSON.stringify(session));\n  setGuestScope(session.id);\n  return session;\n}\n\n/** Removes the persisted local guest session and resets its data namespace. */\nexport async function clearLocalGuestSession(): Promise<void> {\n  await SafeZustandStorage.removeItem(LOCAL_GUEST_SESSION_KEY);\n  setGuestScope(null);\n}\n","layer":3,"isBedrock":false,"downstreamCount":2,"upstreamCount":1},{"path":"packages/core/src/adapters/supabase/supabaseEntitlement.adapter.ts","name":"supabaseEntitlement.adapter.ts","dir":"packages/core/src/adapters/supabase","loc":172,"fns":[{"name":"getUserPricingTier","isExported":false,"params":"userId: string"},{"name":"normalizeTier","isExported":false,"params":"value: unknown"},{"name":"queryManifest","isExported":false,"params":"tier: string"},{"name":"normalizeModules","isExported":false,"params":"value: unknown"},{"name":"mapGrant","isExported":false,"params":"row: Record<string, unknown>,\n  scope: EntitlementScopeContext,"},{"name":"poll","isExported":false,"params":""}],"interfaces":[],"types":[],"constants":[{"name":"db","isExported":false},{"name":"rows","isExported":false},{"name":"scopeType","isExported":false},{"name":"now","isExported":false},{"name":"startsAt","isExported":false},{"name":"expiresAt","isExported":false},{"name":"matchesBond","isExported":false},{"name":"matchesEntity","isExported":false},{"name":"matchesAddOn","isExported":false},{"name":"matchesIndividual","isExported":false},{"name":"tier","isExported":false},{"name":"mappedScope","isExported":false},{"name":"status","isExported":false},{"name":"userTier","isExported":false},{"name":"grants","isExported":false},{"name":"individualGrant","isExported":false},{"name":"tier","isExported":false},{"name":"entitlements","isExported":false}],"imports":[{"source":"@repo/core/adapters/powersync/database","canonical":"packages/core/src/adapters/powersync/database.ts","isTypeOnly":false,"symbols":["getDrizzleDB"]},{"source":"@repo/core/adapters/powersync/schema","canonical":"packages/core/src/adapters/powersync/schema.ts","isTypeOnly":false,"symbols":["pricingManifest"]},{"source":"@repo/core/adapters/supabaseClient","canonical":"packages/core/src/adapters/supabaseClient.ts","isTypeOnly":false,"symbols":["supabaseClient"]},{"source":"@repo/core/logic/ports/entitlement.port","canonical":"packages/core/src/logic/ports/entitlement.port.ts","isTypeOnly":true,"symbols":["EntitlementGrant","EntitlementScopeContext","EntitlementSnapshot","IEntitlementPort","SubscriptionTier"]}],"content":"import { getDrizzleDB } from '@repo/core/adapters/powersync/database';\nimport { pricingManifest } from '@repo/core/adapters/powersync/schema';\nimport { supabaseClient } from '@repo/core/adapters/supabaseClient';\nimport type {\n  EntitlementGrant,\n  EntitlementScopeContext,\n  EntitlementSnapshot,\n  IEntitlementPort,\n  SubscriptionTier,\n} from '@repo/core/logic/ports/entitlement.port';\nimport { eq } from 'drizzle-orm';\n\nasync function getUserPricingTier(userId: string): Promise<string> {\n  const { data, error } = await supabaseClient\n    .from('users')\n    .select('pricing_tier')\n    .eq('id', userId)\n    .maybeSingle();\n\n  if (error) {\n    throw error;\n  }\n\n  return data?.pricing_tier ?? 'FREE';\n}\n\nfunction normalizeTier(value: unknown): SubscriptionTier {\n  return value === 'PRO' || value === 'INSTITUTIONAL' ? value : 'FREE';\n}\n\nasync function queryManifest(tier: string): Promise<string[]> {\n  const db = getDrizzleDB();\n  const rows = await db\n    .select()\n    .from(pricingManifest)\n    .where(eq(pricingManifest.tier, tier))\n    .limit(1);\n\n  if (rows.length > 0) {\n    return JSON.parse(rows[0]?.features ?? '[]') as string[];\n  }\n\n  return [];\n}\n\nfunction normalizeModules(value: unknown): string[] {\n  if (Array.isArray(value)) return value.filter((item): item is string => typeof item === 'string');\n  if (typeof value === 'string') {\n    try {\n      return normalizeModules(JSON.parse(value));\n    } catch {\n      return [];\n    }\n  }\n  return [];\n}\n\nfunction mapGrant(\n  row: Record<string, unknown>,\n  scope: EntitlementScopeContext,\n): EntitlementGrant | null {\n  const scopeType = row.scope_type;\n  const now = Date.now();\n  const startsAt = typeof row.starts_at === 'string' ? Date.parse(row.starts_at) : Number.NaN;\n  const expiresAt = typeof row.expires_at === 'string' ? Date.parse(row.expires_at) : Number.NaN;\n  if (Number.isFinite(startsAt) && startsAt > now) return null;\n  if (Number.isFinite(expiresAt) && expiresAt <= now) return null;\n  const matchesBond = scopeType === 'BOND' && row.bond_id === scope.activeBondId;\n  const matchesEntity =\n    scopeType === 'ENTITY' &&\n    row.entity_id === scope.activeEntityId &&\n    row.entity_type === scope.activeEntityType;\n  const matchesAddOn =\n    scopeType === 'ADD_ON' && (!row.entity_id || row.entity_id === scope.activeEntityId);\n  const matchesIndividual = scopeType === 'INDIVIDUAL';\n  if (!matchesBond && !matchesEntity && !matchesAddOn && !matchesIndividual) return null;\n\n  const tier = normalizeTier(row.tier);\n  const mappedScope =\n    scopeType === 'BOND'\n      ? 'active_bond'\n      : scopeType === 'ENTITY'\n        ? 'active_entity'\n        : scopeType === 'ADD_ON'\n          ? 'add_on'\n          : 'individual';\n  const status = row.status;\n  if (status !== 'ACTIVE' && status !== 'SUSPENDED' && status !== 'REVOKED') return null;\n  return {\n    id: String(row.id),\n    scope: mappedScope,\n    scopeId:\n      typeof row.bond_id === 'string'\n        ? row.bond_id\n        : typeof row.entity_id === 'string'\n          ? row.entity_id\n          : null,\n    tier: tier as SubscriptionTier,\n    modules: normalizeModules(row.modules),\n    startsAt: typeof row.starts_at === 'string' ? row.starts_at : undefined,\n    expiresAt: typeof row.expires_at === 'string' ? row.expires_at : null,\n    status,\n  };\n}\n\nexport class SupabaseEntitlementAdapter implements IEntitlementPort {\n  async getEntitlements(\n    userId: string,\n    scope: EntitlementScopeContext = {},\n  ): Promise<EntitlementSnapshot> {\n    const userTier = normalizeTier(await getUserPricingTier(userId));\n    const { data, error } = await supabaseClient\n      .from('user_entitlement_grants')\n      .select(\n        'id, bond_id, entity_id, entity_type, scope_type, tier, modules, status, starts_at, expires_at',\n      )\n      .eq('user_id', userId)\n      .in('status', ['ACTIVE', 'SUSPENDED']);\n    if (error) throw error;\n\n    const grants = (data ?? [])\n      .map((row) => mapGrant(row as Record<string, unknown>, scope))\n      .filter((grant): grant is EntitlementGrant => grant !== null && grant.status === 'ACTIVE');\n    const individualGrant = grants.find((grant) => grant.scope === 'individual');\n    const tier = individualGrant?.tier ?? userTier;\n    const entitlements = [\n      ...(await queryManifest(tier)),\n      ...(individualGrant?.modules ?? []),\n    ].filter((value, index, values) => values.indexOf(value) === index);\n    return {\n      pricingTier: tier,\n      activeEntitlements: entitlements,\n      expirationDate: null,\n      grants,\n      refreshedAt: new Date().toISOString(),\n    };\n  }\n\n  async syncPurchases(\n    userId: string,\n    scope?: EntitlementScopeContext,\n  ): Promise<EntitlementSnapshot> {\n    return this.getEntitlements(userId, scope);\n  }\n\n  subscribeToEntitlementChanges(\n    userId: string,\n    callback: (snapshot: EntitlementSnapshot) => void,\n    scope?: EntitlementScopeContext,\n  ): () => void {\n    let cancelled = false;\n    const poll = async () => {\n      while (!cancelled) {\n        await new Promise((r) => setTimeout(r, 60000));\n        if (!cancelled) {\n          try {\n            callback(await this.getEntitlements(userId, scope));\n          } catch {\n            // ignore\n          }\n        }\n      }\n    };\n    // Fire-and-forget poller: rejections are swallowed by its internal catch,\n    // and the returned disposer below is what stops the loop.\n    void poll();\n    return () => {\n      cancelled = true;\n    };\n  }\n}\n","layer":10,"isBedrock":false,"downstreamCount":4,"upstreamCount":1},{"path":"packages/core/src/lib/storageWrapper.ts","name":"storageWrapper.ts","dir":"packages/core/src/lib","loc":37,"fns":[{"name":"observePersistenceFailure","isExported":false,"params":"operation: 'write' | 'remove',\n  result: Promise<void>,"}],"interfaces":[],"types":[],"constants":[{"name":"value","isExported":false}],"imports":[{"source":"@repo/core/lib/storage","canonical":"packages/core/src/lib/storage.ts","isTypeOnly":false,"symbols":["storage"]},{"source":"@repo/core/lib/devicePreferences","canonical":"packages/core/src/lib/devicePreferences.ts","isTypeOnly":false,"symbols":["ensureDeviceThemePreference"]}],"content":"import { storage } from '@repo/core/lib/storage';\nimport { ensureDeviceThemePreference } from '@repo/core/lib/devicePreferences';\nimport type { StateStorage } from 'zustand/middleware';\n\nfunction observePersistenceFailure(\n  operation: 'write' | 'remove',\n  result: Promise<void>,\n): Promise<void> {\n  void result.catch((error: unknown) => {\n    console.error(`Storage: Zustand persistence ${operation} failed`, error);\n  });\n  return result;\n}\n\n/**\n * A architecture-compliant storage wrapper for Zustand.\n * It utilizes the Sovereign StorageManager (Adapter Pattern) to ensure\n * persistence works across Web and Native without direct pollution.\n */\nexport const SafeZustandStorage: StateStorage = {\n  getItem: (name: string): string | null | Promise<string | null> => {\n    if (name === 'gurudevi-ui-storage') {\n      return ensureDeviceThemePreference().then(async () => (await storage.getStringAsync(name)) ?? null);\n    }\n    // Attempt sync retrieval (MMKV or Cached AsyncStorage)\n    const value = storage.getString(name);\n    if (value !== undefined) return value;\n\n    // Fallback to async retrieval through the manager\n    return storage.getStringAsync(name).then((v) => v ?? null);\n  },\n  setItem: (name: string, value: string): Promise<void> =>\n    observePersistenceFailure('write', storage.setAsync(name, value)),\n  removeItem: (name: string): Promise<void> =>\n    observePersistenceFailure('remove', storage.deleteAsync(name)),\n};\n","layer":2,"isBedrock":false,"downstreamCount":2,"upstreamCount":4},{"path":"packages/core/src/lib/accountScope.ts","name":"accountScope.ts","dir":"packages/core/src/lib","loc":27,"fns":[{"name":"getActiveAccountId","isExported":true,"params":""},{"name":"setActiveAccountId","isExported":true,"params":"accountId: string | null"},{"name":"getAccountScopeRevision","isExported":true,"params":""},{"name":"getActiveAccountScope","isExported":true,"params":""},{"name":"scopeStorageKey","isExported":true,"params":"name: string, accountId: string | null = activeAccountId"}],"interfaces":[],"types":[],"constants":[{"name":"ANONYMOUS_SCOPE","isExported":false},{"name":"scope","isExported":false}],"imports":[],"content":"let activeAccountId: string | null = null;\nlet accountScopeRevision = 0;\n\nconst ANONYMOUS_SCOPE = 'anonymous';\n\nexport function getActiveAccountId(): string | null {\n  return activeAccountId;\n}\n\nexport function setActiveAccountId(accountId: string | null) {\n  if (activeAccountId !== accountId) accountScopeRevision += 1;\n  activeAccountId = accountId;\n}\n\nexport function getAccountScopeRevision(): number {\n  return accountScopeRevision;\n}\n\nexport function getActiveAccountScope(): string {\n  return activeAccountId ?? ANONYMOUS_SCOPE;\n}\n\nexport function scopeStorageKey(name: string, accountId: string | null = activeAccountId): string {\n  const scope = accountId ?? ANONYMOUS_SCOPE;\n  return `gurudevi:${scope}:${name}`;\n}\n","layer":0,"isBedrock":true,"downstreamCount":0,"upstreamCount":3},{"path":"packages/core/src/lib/featureRolloutSnapshot.ts","name":"featureRolloutSnapshot.ts","dir":"packages/core/src/lib","loc":43,"fns":[{"name":"normalizeFeatureRolloutSnapshot","isExported":true,"params":"snapshot: FeatureRolloutSnapshot,\n  now = Date.now("},{"name":"toBoolean","isExported":false,"params":"value: boolean | string"},{"name":"projectFeatureFlags","isExported":true,"params":"overrides: Record<string, boolean | string>"}],"interfaces":[],"types":[{"name":"FeatureFlags","isExported":false}],"constants":[{"name":"FEATURE_ROLLOUT_SNAPSHOT_MAX_AGE_MS","isExported":true},{"name":"refreshedAt","isExported":false},{"name":"stale","isExported":false},{"name":"flags","isExported":false},{"name":"metadata","isExported":false},{"name":"result","isExported":false},{"name":"value","isExported":false}],"imports":[{"source":"@repo/core/logic/ports/featureRollout.port","canonical":"packages/core/src/logic/ports/featureRollout.port.ts","isTypeOnly":true,"symbols":["FeatureRolloutSnapshot"]},{"source":"@repo/core/logic/registry/featureLifecycleManifest","canonical":"packages/core/src/logic/registry/featureLifecycleManifest.ts","isTypeOnly":false,"symbols":["FEATURE_FLAG_MANIFEST"]},{"source":"@repo/core/store/types/featureFlags","canonical":"packages/core/src/store/types/featureFlags.ts","isTypeOnly":false,"symbols":["DEFAULT_FEATURE_FLAGS","FeatureFlags"]}],"content":"import type { FeatureRolloutSnapshot } from '@repo/core/logic/ports/featureRollout.port';\nimport { FEATURE_FLAG_MANIFEST } from '@repo/core/logic/registry/featureLifecycleManifest';\nimport { DEFAULT_FEATURE_FLAGS, type FeatureFlags } from '@repo/core/store/types/featureFlags';\n\n/** Maximum time a persisted rollout snapshot can influence temporary flags. */\nexport const FEATURE_ROLLOUT_SNAPSHOT_MAX_AGE_MS = 7 * 24 * 60 * 60 * 1000;\n\nexport function normalizeFeatureRolloutSnapshot(\n  snapshot: FeatureRolloutSnapshot,\n  now = Date.now(),\n): FeatureRolloutSnapshot {\n  const refreshedAt = Date.parse(snapshot.refreshedAt);\n  const stale =\n    !Number.isFinite(refreshedAt) ||\n    refreshedAt > now ||\n    now - refreshedAt >= FEATURE_ROLLOUT_SNAPSHOT_MAX_AGE_MS;\n\n  if (!stale) return { ...snapshot, stale: false };\n\n  const flags = Object.fromEntries(\n    Object.entries(snapshot.flags).filter(([key]) => {\n      const metadata = FEATURE_FLAG_MANIFEST[key as keyof typeof FEATURE_FLAG_MANIFEST];\n      return metadata?.class === 'operational';\n    }),\n  );\n\n  return { ...snapshot, flags, stale: true };\n}\n\nfunction toBoolean(value: boolean | string): boolean {\n  if (typeof value === 'boolean') return value;\n  return value === 'true';\n}\n\nexport function projectFeatureFlags(overrides: Record<string, boolean | string>): FeatureFlags {\n  const result = { ...DEFAULT_FEATURE_FLAGS };\n  for (const key of Object.keys(result) as (keyof FeatureFlags)[]) {\n    const value = overrides[key];\n    if (value !== undefined) result[key] = toBoolean(value);\n  }\n  return result;\n}\n","layer":4,"isBedrock":false,"downstreamCount":3,"upstreamCount":1},{"path":"packages/core/src/lib/storage.ts","name":"storage.ts","dir":"packages/core/src/lib","loc":40,"fns":[{"name":"buildPartitionedKey","isExported":true,"params":"options: PartitionKeyOptions"}],"interfaces":[{"name":"PartitionKeyOptions","isExported":true}],"types":[],"constants":[{"name":"StorageKeys","isExported":true},{"name":"tenant","isExported":false},{"name":"user","isExported":false},{"name":"entity","isExported":false},{"name":"version","isExported":false}],"imports":[],"content":"/**\n * Unified Storage Gateway\n *\n * This file serves as the public API for key-value storage.\n * It delegates to StorageDriver using the Port/Adapter pattern to maintain platform agnosticism.\n */\nexport { storage, storageDriver, StorageDriver } from '@repo/core/platform/drivers/storageDriver';\n\nexport const StorageKeys = {\n  USER_PREFERENCES: 'user_preferences',\n  LAST_SYNC: 'last_sync',\n  CACHED_COMMUNITY_POSTS: 'cached_community_posts',\n  CACHED_GROUPS: 'cached_groups',\n  DRAFT_FORM: 'draft_form',\n  DRAFT_STUDENTS: 'draft_students',\n  DRAFT_THOUGHT_RECORD: 'draft_thought_record',\n};\n\nexport interface PartitionKeyOptions {\n  tenantId?: string | null;\n  userId?: string | null;\n  entityId?: string | null;\n  feature: string;\n  version?: string;\n}\n\n/**\n * Generates a strictly partitioned storage key.\n * Prevents cross-tenant leaks, shared device bleed, and multi-classroom collisions.\n *\n * Format: `<tenant>:<user>:<entity>:<feature>:<version>`\n */\nexport function buildPartitionedKey(options: PartitionKeyOptions): string {\n  const tenant = options.tenantId?.trim() || 'global';\n  const user = options.userId?.trim() || 'guest';\n  const entity = options.entityId?.trim() || 'root';\n  const version = options.version?.trim() || 'v6';\n  return `${tenant}:${user}:${entity}:${options.feature}:${version}`;\n}\n","layer":0,"isBedrock":true,"downstreamCount":0,"upstreamCount":6},{"path":"packages/core/src/adapters/feature-rollout/growthBookFeatureRollout.adapter.ts","name":"growthBookFeatureRollout.adapter.ts","dir":"packages/core/src/adapters/feature-rollout","loc":235,"fns":[{"name":"nextDelay","isExported":false,"params":""},{"name":"refresh","isExported":false,"params":""}],"interfaces":[],"types":[],"constants":[{"name":"result","isExported":false},{"name":"attributes","isExported":false},{"name":"elapsed","isExported":false},{"name":"result","isExported":false},{"name":"previousPayload","isExported":false},{"name":"value","isExported":false},{"name":"owner","isExported":false},{"name":"unsubscribeNetwork","isExported":false},{"name":"growthBookFeatureRolloutAdapter","isExported":true}],"imports":[{"source":"@repo/core/lib/storage","canonical":"packages/core/src/lib/storage.ts","isTypeOnly":false,"symbols":["storage"]},{"source":"@repo/core/platform/drivers/networkMonitor","canonical":"packages/core/src/platform/drivers/networkMonitor.ts","isTypeOnly":false,"symbols":["networkMonitor"]},{"source":"@repo/core/logic/ports/featureRollout.port","canonical":"packages/core/src/logic/ports/featureRollout.port.ts","isTypeOnly":true,"symbols":["FeatureRolloutSnapshot","IFeatureRolloutPort"]},{"source":"@repo/core/logic/registry/featureLifecycleManifest","canonical":"packages/core/src/logic/registry/featureLifecycleManifest.ts","isTypeOnly":false,"symbols":["FEATURE_FLAG_MANIFEST"]},{"source":"@repo/core/logic/schemas/user.schema","canonical":"packages/core/src/logic/schemas/user.schema.ts","isTypeOnly":true,"symbols":["UserContext"]},{"source":"@repo/core/monitoring","canonical":"packages/core/src/monitoring/index.ts","isTypeOnly":false,"symbols":["trackProductEvent"]}],"content":"import { GrowthBook, setPolyfills } from '@growthbook/growthbook';\nimport { storage } from '@repo/core/lib/storage';\nimport { networkMonitor } from '@repo/core/platform/drivers/networkMonitor';\nimport type {\n  FeatureRolloutSnapshot,\n  IFeatureRolloutPort,\n} from '@repo/core/logic/ports/featureRollout.port';\nimport { FEATURE_FLAG_MANIFEST } from '@repo/core/logic/registry/featureLifecycleManifest';\nimport type { UserContext } from '@repo/core/logic/schemas/user.schema';\nimport { trackProductEvent } from '@repo/core/monitoring';\n\n// Apply the platform-agnostic storage polyfill for GrowthBook cache persistence\nsetPolyfills({\n  localStorage: {\n    getItem: async (key: string) => (await storage.getStringAsync(key)) ?? null,\n    setItem: (key: string, value: string) => storage.setAsync(key, value),\n  },\n});\n\nexport class GrowthBookFeatureRolloutAdapter implements IFeatureRolloutPort {\n  private growthbook: GrowthBook;\n  private initialized = false;\n  private refreshedAt: string | null = null;\n  private loadingPayload = false;\n  private currentContext: UserContext | null = null;\n  private evaluation: Promise<void> = Promise.resolve();\n  private rendererOwner: object | null = null;\n  private static readonly POLL_INTERVAL_MS = 15 * 60 * 1000;\n\n  constructor(apiHost?: string, clientKey?: string) {\n    this.growthbook = new GrowthBook({\n      apiHost:\n        apiHost ||\n        process.env.EXPO_PUBLIC_GROWTHBOOK_API_HOST ||\n        process.env.NEXT_PUBLIC_GROWTHBOOK_API_HOST ||\n        'https://cdn.growthbook.io',\n      clientKey:\n        clientKey ||\n        process.env.EXPO_PUBLIC_GROWTHBOOK_CLIENT_KEY ||\n        process.env.NEXT_PUBLIC_GROWTHBOOK_CLIENT_KEY,\n      enableDevMode: process.env.NODE_ENV === 'development',\n      trackingCallback: (experiment, result) => {\n        this.trackExposure(experiment.key, result.key);\n      },\n    });\n  }\n\n  resolveFlags(context: UserContext): Promise<FeatureRolloutSnapshot> {\n    // setAttributes can await sticky buckets. Serialize the shared SDK so one\n    // context cannot read another context's attributes after that await.\n    const result = this.evaluation.then(() => this.evaluateContext(context));\n    this.evaluation = result.then(\n      () => undefined,\n      () => undefined,\n    );\n    return result;\n  }\n\n  private async evaluateContext(context: UserContext): Promise<FeatureRolloutSnapshot> {\n    await this.refreshPayload();\n    this.currentContext = context;\n\n    // Map UserContext to GrowthBook attributes\n    const attributes = {\n      id: context.userId || undefined,\n      email: context.email || undefined,\n      pricing_tier: context.pricing_tier,\n      citizenship: context.citizenship,\n      schoolId: context.schoolId,\n      primaryCapacity: context.primaryCapacity,\n      activeBond: context.activeBond,\n      bonds: context.bonds,\n      school_type: context.schoolType,\n      effective_entitlement_scope: context.effective_entitlement_scope,\n      effective_entitlement_tier: context.effective_entitlement_tier,\n      isAnonymous: context.isAnonymous,\n      hasGlobalAccess: context.hasGlobalAccess,\n    };\n\n    await this.growthbook.setAttributes(attributes);\n\n    return this.readSnapshot();\n  }\n\n  private async refreshPayload(): Promise<void> {\n    if (networkMonitor.getSnapshot().status !== 'online') return;\n    const elapsed = this.refreshedAt ? Date.now() - Date.parse(this.refreshedAt) : Infinity;\n    if (elapsed >= 0 && elapsed < GrowthBookFeatureRolloutAdapter.POLL_INTERVAL_MS) return;\n    this.loadingPayload = true;\n    try {\n      await this.loadPayload();\n      this.refreshedAt = new Date().toISOString();\n    } finally {\n      this.loadingPayload = false;\n    }\n  }\n\n  private async loadPayload(): Promise<void> {\n    if (!this.initialized) {\n      const result = await this.growthbook.init({\n        streaming: false,\n        skipCache: true,\n        timeout: 10_000,\n      });\n      this.initialized = true;\n      if (!result.success || result.source !== 'network') {\n        throw result.error ?? new Error(`Feature payload load failed (${result.source}).`);\n      }\n    } else {\n      // Installed refreshFeatures changes the payload only when it received data.\n      // Its void return cannot itself attest a successful network response.\n      const previousPayload = this.growthbook.getPayload();\n      await this.growthbook.refreshFeatures({ skipCache: true, timeout: 10_000 });\n      if (this.growthbook.getPayload() === previousPayload) {\n        throw new Error('Feature payload refresh did not receive a new network response.');\n      }\n    }\n  }\n\n  private readSnapshot(): FeatureRolloutSnapshot {\n    const flags: Record<string, boolean | string> = {};\n\n    // The manifest is the SSOT for the GrowthBook key mapping (ADR-012). The\n    // snapshot is keyed by app flag keys so slices, registries, and permission\n    // gates never see the remote naming scheme.\n    for (const [appKey, metadata] of Object.entries(FEATURE_FLAG_MANIFEST)) {\n      const value = this.growthbook.evalFeature(metadata.growthbookKey).value;\n      if (typeof value === 'boolean' || typeof value === 'string') flags[appKey] = value;\n    }\n\n    return {\n      flags,\n      source: this.refreshedAt ? 'remote' : 'computed',\n      refreshedAt: this.refreshedAt ?? new Date(0).toISOString(),\n    };\n  }\n\n  subscribeToFlagChanges(\n    context: UserContext,\n    callback: (snapshot: FeatureRolloutSnapshot) => void,\n  ): () => void {\n    const owner = {};\n    this.rendererOwner = owner;\n    let timer: ReturnType<typeof setTimeout> | undefined;\n    let refreshing = false;\n    const nextDelay = () =>\n      this.refreshedAt\n        ? Math.max(\n            1,\n            Date.parse(this.refreshedAt) +\n              GrowthBookFeatureRolloutAdapter.POLL_INTERVAL_MS -\n              Date.now(),\n          )\n        : GrowthBookFeatureRolloutAdapter.POLL_INTERVAL_MS;\n    const refresh = () => {\n      clearTimeout(timer);\n      if (this.rendererOwner !== owner || networkMonitor.getSnapshot().status !== 'online') return;\n      if (refreshing) return;\n      refreshing = true;\n      let succeeded = false;\n      void this.resolveFlags(context)\n        .then((snapshot) => {\n          succeeded = true;\n          if (this.rendererOwner === owner) callback(snapshot);\n        })\n        .catch((error: unknown) => {\n          if (this.rendererOwner === owner)\n            console.warn('[FeatureRollout] payload refresh failed', error);\n        })\n        .finally(() => {\n          refreshing = false;\n          if (this.rendererOwner === owner && networkMonitor.getSnapshot().status === 'online') {\n            timer = setTimeout(\n              refresh,\n              succeeded ? nextDelay() : GrowthBookFeatureRolloutAdapter.POLL_INTERVAL_MS,\n            );\n          }\n        });\n    };\n    this.growthbook.setRenderer(() => {\n      // setAttributes invokes this renderer, so writing attributes here would\n      // create an endless microtask loop and prevent native input processing.\n      if (\n        this.rendererOwner === owner &&\n        this.currentContext === context &&\n        this.refreshedAt &&\n        !this.loadingPayload\n      )\n        callback(this.readSnapshot());\n    });\n    const unsubscribeNetwork = networkMonitor.subscribe(refresh);\n    if (networkMonitor.getSnapshot().status === 'online') {\n      timer = setTimeout(refresh, nextDelay());\n    }\n\n    return () => {\n      clearTimeout(timer);\n      unsubscribeNetwork();\n      if (this.rendererOwner === owner) {\n        this.rendererOwner = null;\n        this.growthbook.setRenderer(null);\n      }\n    };\n  }\n\n  trackExposure(flagKey: string, value: boolean | string): void {\n    trackProductEvent(\n      'feature_exposed',\n      {\n        feature_id: flagKey,\n        flag_value: value,\n      },\n      {\n        identity_mode: this.currentContext?.isAnonymous ? 'anonymous' : 'authenticated',\n        citizenship: this.currentContext?.citizenship,\n        onboarding_completed: Boolean(this.currentContext?.onboarding_completed),\n        active_capacity: this.currentContext?.activeBond?.capacity ?? null,\n        active_entity_type: this.currentContext?.activeEntityType ?? null,\n        school_type: this.currentContext?.schoolType ?? null,\n        personal_pricing_tier:\n          this.currentContext?.pricing_tier === 'PRO' ||\n          this.currentContext?.pricing_tier === 'INSTITUTIONAL'\n            ? this.currentContext.pricing_tier\n            : 'FREE',\n        effective_entitlement_scope:\n          this.currentContext?.effective_entitlement_scope ?? 'individual',\n        effective_entitlement_tier: this.currentContext?.effective_entitlement_tier ?? 'FREE',\n        analytics_schema_version: 1,\n      },\n    );\n  }\n}\n\nexport const growthBookFeatureRolloutAdapter = new GrowthBookFeatureRolloutAdapter();\n","layer":4,"isBedrock":false,"downstreamCount":6,"upstreamCount":1},{"path":"packages/core/src/logic/ports/featureRollout.port.ts","name":"featureRollout.port.ts","dir":"packages/core/src/logic/ports","loc":20,"fns":[],"interfaces":[{"name":"FeatureRolloutSnapshot","isExported":true},{"name":"IFeatureRolloutPort","isExported":true}],"types":[],"constants":[],"imports":[{"source":"@repo/core/logic/schemas/user.schema","canonical":"packages/core/src/logic/schemas/user.schema.ts","isTypeOnly":true,"symbols":["UserContext"]}],"content":"import type { UserContext } from '@repo/core/logic/schemas/user.schema';\n\nexport interface FeatureRolloutSnapshot {\n  flags: Record<string, boolean | string>;\n  source: 'cache' | 'remote' | 'computed';\n  /** Last verified network payload load; reevaluation must never renew this time. */\n  refreshedAt: string;\n  /** True when the snapshot exceeded the local offline continuity window. */\n  stale?: boolean;\n}\n\nexport interface IFeatureRolloutPort {\n  resolveFlags(context: UserContext): Promise<FeatureRolloutSnapshot>;\n  subscribeToFlagChanges(\n    context: UserContext,\n    callback: (snapshot: FeatureRolloutSnapshot) => void,\n  ): () => void;\n  trackExposure(flagKey: string, value: boolean | string): void;\n}\n","layer":3,"isBedrock":false,"downstreamCount":1,"upstreamCount":3},{"path":"packages/core/src/monitoring/breadcrumbs.ts","name":"breadcrumbs.ts","dir":"packages/core/src/monitoring","loc":62,"fns":[{"name":"leaveBreadcrumb","isExported":true,"params":"category: string,\n  message: string,\n  level: Breadcrumb['level'] = 'info',\n  data?: Record<string, unknown>,"},{"name":"getBreadcrumbs","isExported":true,"params":"count = 20"},{"name":"clearBreadcrumbs","isExported":true,"params":""}],"interfaces":[],"types":[{"name":"Breadcrumb","isExported":true}],"constants":[{"name":"MAX_BREADCRUMBS","isExported":false}],"imports":[],"content":"/**\n * State-change breadcrumbs for error context.\n *\n * Lightweight ring buffer that captures key state transitions.\n * When an error occurs, the last N breadcrumbs provide context\n * for what happened before the crash.\n *\n * Usage:\n *   import { leaveBreadcrumb, getBreadcrumbs } from '@repo/core/monitoring/breadcrumbs';\n *\n *   leaveBreadcrumb('auth', 'user logged in', 'info', { userId: '123' });\n *   // In error handler:\n *   Sentry.setExtra('breadcrumbs', getBreadcrumbs());\n */\n\nexport type Breadcrumb = {\n  timestamp: number;\n  category: string;\n  message: string;\n  level: 'info' | 'warning' | 'error';\n  data?: Record<string, unknown>;\n};\n\nconst MAX_BREADCRUMBS = 50;\nconst breadcrumbs: Breadcrumb[] = [];\n\n/**\n * Log a state-change breadcrumb. Captures context for the next error.\n */\nexport function leaveBreadcrumb(\n  category: string,\n  message: string,\n  level: Breadcrumb['level'] = 'info',\n  data?: Record<string, unknown>,\n) {\n  const entry: Breadcrumb = {\n    timestamp: Date.now(),\n    category,\n    message,\n    level,\n    data,\n  };\n  breadcrumbs.push(entry);\n  if (breadcrumbs.length > MAX_BREADCRUMBS) {\n    breadcrumbs.shift();\n  }\n}\n\n/**\n * Get the last N breadcrumbs (for error reporting).\n */\nexport function getBreadcrumbs(count = 20): Breadcrumb[] {\n  return breadcrumbs.slice(-count);\n}\n\n/**\n * Clear breadcrumbs (e.g., on logout).\n */\nexport function clearBreadcrumbs() {\n  breadcrumbs.length = 0;\n}\n","layer":0,"isBedrock":true,"downstreamCount":0,"upstreamCount":1},{"path":"packages/core/src/native/guestScope.ts","name":"guestScope.ts","dir":"packages/core/src/native","loc":38,"fns":[{"name":"setGuestScope","isExported":true,"params":"userId: string | null"},{"name":"getGuestScopeRevision","isExported":true,"params":""},{"name":"getGuestScope","isExported":true,"params":""},{"name":"guestStorageKey","isExported":true,"params":"name: string, userId: string = activeGuestUserId"},{"name":"isGuestUserId","isExported":true,"params":"userId?: string | null"}],"interfaces":[],"types":[],"constants":[{"name":"nextScope","isExported":false}],"imports":[],"content":"/** Namespace for the currently active anonymous identity's local data. */\nlet activeGuestUserId = 'anonymous';\nlet guestScopeRevision = 0;\n\nexport function setGuestScope(userId: string | null): void {\n  const nextScope = userId ?? 'anonymous';\n  if (activeGuestUserId !== nextScope) guestScopeRevision += 1;\n  activeGuestUserId = nextScope;\n}\n\nexport function getGuestScopeRevision(): number {\n  return guestScopeRevision;\n}\n\nexport function getGuestScope(): string {\n  return activeGuestUserId;\n}\n\nexport function guestStorageKey(name: string, userId: string = activeGuestUserId): string {\n  return `guest:${userId}:${name}`;\n}\n\n/** Determines if a user ID represents an unauthenticated, anonymous, or sandbox guest. */\nexport function isGuestUserId(userId?: string | null): boolean {\n  if (!userId) return true;\n  if (\n    userId === 'guest' ||\n    userId === 'anonymous' ||\n    userId === 'explore' ||\n    userId === 'explore-local' ||\n    userId.startsWith('guest:') ||\n    userId.startsWith('local-')\n  ) {\n    return true;\n  }\n  return userId === activeGuestUserId;\n}\n","layer":0,"isBedrock":true,"downstreamCount":0,"upstreamCount":4},{"path":"packages/core/src/lib/sync/eventBus.ts","name":"eventBus.ts","dir":"packages/core/src/lib/sync","loc":169,"fns":[],"interfaces":[{"name":"SovereignEventMap","isExported":true}],"types":[{"name":"SovereignEvent","isExported":true},{"name":"SovereignEventPayload","isExported":true},{"name":"Listener","isExported":false}],"constants":[{"name":"sovereignBus","isExported":true}],"imports":[],"content":"/**\n * Sovereign Internal Event Bus (May 2026)\n *\n * A type-safe, memory-leak-safe pub/sub bus for cross-module communication\n * on the device. Uses the \"Map of Sets\" pattern for O(1) subscribe/emit.\n *\n * ROLE: This is NOT a replacement for Zustand. It serves a different purpose:\n *  - Zustand: \"What is the current state?\" (pull-based)\n *  - Event Bus: \"Something just happened, react to it.\" (push-based)\n *\n * Key use cases:\n *  1. SyncOrchestrator notifies UI of sync success/failure → UI shows indicator\n *  2. Conflict detected → UI opens ConflictResolutionSheet\n *  3. Background Task completes → Foreground screen re-fetches data\n */\n\n// ─── Event Catalogue ─────────────────────────────────────────────────────────\n// Add new event types here. The type system enforces payload shapes everywhere.\n\nexport interface SovereignEventMap {\n  'feedback:toast': { message: string; type: 'success' | 'error' | 'info'; duration: number };\n  'feedback:clear': Record<string, never>;\n  // Sync lifecycle\n  'sync:started': { queueLength: number };\n  'sync:completed': { processedCount: number; failedCount: number };\n  'sync:failed': { error: string; mutationId: string };\n  'sync:item_succeeded': { mutationId: string; name: string; scope: string };\n  'sync:item_moved_to_dlq': { mutationId: string; name: string; reason: string };\n  'sync:auth_required': { mutationId?: string; reason?: string };\n\n  // Fleet & Version Gating Lifecycle\n  'app:version_gated': {\n    status: 'HARD_BLOCK' | 'SOFT_NUDGE' | 'UP_TO_DATE';\n    currentVersion: string;\n    minSupportedVersion: string;\n    latestVersion: string;\n    updateUrl?: string;\n    releaseNotes?: string;\n  };\n\n  // Conflict lifecycle\n  'conflict:detected': { mutationId: string; scope: string; name: string };\n  'conflict:resolved': { mutationId: string };\n\n  // Network lifecycle\n  'network:online': { timestamp: number };\n  'network:offline': { timestamp: number };\n\n  // Background Task\n  'background:pulse': {\n    itemsDrained: number;\n    itemsFailed: number;\n    queueLength: number;\n    deadLetterLength: number;\n  };\n  'foreground:sync': { itemsDrained: number; itemsFailed: number; queueLength: number };\n\n  // Auth / Session\n  'auth:session_expired': Record<string, never>;\n  'auth:user_switched': { newUserId: string };\n\n  // Sanctuary scope lifecycle\n  'perspective:transition_started': {\n    from: unknown;\n    to: unknown;\n  };\n  'perspective:transition_completed': {\n    activePerspective: unknown;\n  };\n\n  // PowerSync (future-ready — no-op until adapter is wired)\n  'powersync:sync_complete': { tablesAffected: string[] };\n  'powersync:first_sync_complete': { accountId: string };\n  'powersync:status': {\n    accountId: string;\n    connected: boolean;\n    connecting: boolean;\n    downloading: boolean;\n    uploading: boolean;\n    hasSynced?: boolean;\n    error: string | null;\n  };\n  'powersync:unavailable': {\n    reason: 'quota_exceeded' | 'service_down' | 'account_switched' | 'disabled';\n  };\n}\n\nexport type SovereignEvent = keyof SovereignEventMap;\nexport type SovereignEventPayload<K extends SovereignEvent> = SovereignEventMap[K];\ntype Listener<K extends SovereignEvent> = (payload: SovereignEventPayload<K>) => void;\n\n// ─── Bus Implementation ───────────────────────────────────────────────────────\n\nclass SovereignBus {\n  private listeners = new Map<SovereignEvent, Set<Listener<any>>>();\n\n  /**\n   * Subscribe to an event. Returns an unsubscribe function.\n   * Always call the returned function in your useEffect cleanup to prevent leaks.\n   *\n   * @example\n   * useEffect(() => {\n   *   return sovereignBus.on('sync:completed', ({ processedCount }) => {\n   *     setLastSyncTime(Date.now());\n   *   });\n   * }, []);\n   */\n  on<K extends SovereignEvent>(event: K, listener: Listener<K>): () => void {\n    if (!this.listeners.has(event)) {\n      this.listeners.set(event, new Set());\n    }\n    this.listeners.get(event)!.add(listener as Listener<any>);\n\n    // Return a stable unsubscribe function\n    return () => {\n      this.listeners.get(event)?.delete(listener as Listener<any>);\n    };\n  }\n\n  /**\n   * Emit an event to all subscribers.\n   * Type-safe: payload shape is enforced by the EventMap.\n   */\n  emit<K extends SovereignEvent>(event: K, payload: SovereignEventPayload<K>): void {\n    this.listeners.get(event)?.forEach((listener) => {\n      try {\n        listener(payload);\n      } catch (err) {\n        // Listeners must not crash the bus\n        console.error(`[SovereignBus] Listener error on event \"${event}\":`, err);\n      }\n    });\n  }\n\n  /**\n   * Subscribe to all events (wildcard). Used for debugging.\n   * Remove from production builds.\n   */\n  onAll(listener: (event: SovereignEvent, payload: unknown) => void): () => void {\n    const wrappedListeners: Array<() => void> = [];\n    for (const event of Object.keys({}) as SovereignEvent[]) {\n      wrappedListeners.push(this.on(event, (payload) => listener(event, payload)));\n    }\n    return () => {\n      wrappedListeners.forEach((unsub) => {\n        unsub();\n      });\n    };\n  }\n\n  /** Remove all listeners for a specific event (useful in tests). */\n  off(event: SovereignEvent): void {\n    this.listeners.delete(event);\n  }\n\n  /** Full reset — use in tests only. */\n  reset(): void {\n    this.listeners.clear();\n  }\n}\n\n// ─── Singleton Export ─────────────────────────────────────────────────────────\n\n/**\n * The single, global event bus instance.\n * Import this directly in any module that needs to emit or subscribe.\n */\nexport const sovereignBus = new SovereignBus();\n","layer":0,"isBedrock":true,"downstreamCount":0,"upstreamCount":1},{"path":"packages/core/src/constants/SriLankanSchools.ts","name":"SriLankanSchools.ts","dir":"packages/core/src/constants","loc":874,"fns":[{"name":"getSchoolTypeLabel","isExported":true,"params":"type: SchoolType, language: 'en' | 'si' | 'ta' = 'en'"},{"name":"getSectionLabel","isExported":true,"params":"section: SectionType, language: 'en' | 'si' | 'ta' = 'en'"},{"name":"getGradesForSection","isExported":true,"params":"section: SectionType"},{"name":"getSectionForGrade","isExported":true,"params":"gradeNumber: number"}],"interfaces":[],"types":[{"name":"SchoolType","isExported":true},{"name":"SectionType","isExported":true},{"name":"ProvinceID","isExported":true},{"name":"DistrictID","isExported":true}],"constants":[{"name":"SRI_LANKAN_SCHOOL_TYPES","isExported":true},{"name":"SCHOOL_SECTIONS","isExported":true},{"name":"SRI_LANKAN_PROVINCES","isExported":true},{"name":" ype = ValueOf<typeof edloveUuidV8Subtype>;\n\nexport type EdloveUuidV8Parts = {\n  issuedAtUnixMilliseconds: number;\n  domain: EdloveUuidV8Domain;\n  subtype: EdloveUuidV8Subtype;\n  mintOrigin: EdloveUuidV8MintOrigin;\n  entropy: Uint8Array;\n};\n\nexport type ParsedEdloveUuidV8 = EdloveUuidV8Parts;\n\nconst UUID_BYTE_LENGTH = 16;\nconst ENTROPY_BYTE_LENGTH = 7;\nconst MAX_TIMESTAMP = 0xffff_ffff_ffff;\nconst UUID_TEXT_PATTERN = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;\n\nfunction hasKnownDomain(value: number): value is EdloveUuidV8Domain {\n  return Object.values(edloveUuidV8Domain).includes(value as EdloveUuidV8Domain);\n}\n\nfunction hasKnownMintOrigin(value: number): value is EdloveUuidV8MintOrigin {\n  return Object.values(edloveUuidV8MintOrigin).includes(value as EdloveUuidV8MintOrigin);\n}\n\nfunction hasKnownSubtype(domain: EdloveUuidV8Domain, subtype: number): boolean {\n  return Object.values(edloveUuidV8Subtype).some(\n    (candidate) => candidate.domain === domain && candidate.value === subtype,\n  );\n}\n\nfunction assertParts(parts: EdloveUuidV8Parts): void {\n  if (\n    !Number.isSafeInteger(parts.issuedAtUnixMilliseconds) ||\n    parts.issuedAtUnixMilliseconds < 0 ||\n    parts.issuedAtUnixMilliseconds > MAX_TIMESTAMP\n  ) {\n    throw new RangeError('issuedAtUnixMilliseconds must fit in the UUIDv8 48-bit timestamp field.');\n  }\n\n  if (!hasKnownDomain(parts.domain) || !hasKnownSubtype(parts.domain, parts.subtype.value)) {\n    throw new TypeError('domain and subtype must be a registered EdLove UUIDv8 entity kind.');\n  }\n\n  if (parts.subtype.domain !== parts.domain || !hasKnownMintOrigin(parts.mintOrigin)) {\n    throw new TypeError('subtype must belong to domain and mintOrigin must be registered.');\n  }\n\n  if (parts.entropy.length !== ENTROPY_BYTE_LENGTH) {\n    throw new RangeError('entropy must contain exactly 56 bits (7 bytes).');\n  }\n}\n\nfunction formatUuid(bytes: Uint8Array): string {\n  const hex = type).find(\n    (candidate) => candidate.domain === domain && candidate.value === subtypeValue,\n  );\n  if (!subtype) return null;\n\n  let issuedAtUnixMilliseconds = 0;\n  for (let index = 0; index < 6; index += 1) {\n    issuedAtUnixMilliseconds = issuedAtUnixMilliseconds * 256 + byteAt(bytes, index);\n  }\n\n  return {\n    issuedAtUnixMilliseconds,\n    domain,\n    subtype,\n    mintOrigin,\n    entropy: bytes.slice(9),\n  };\n}\n\nexport function isEdloveUuidV8(value: string): boolean {\n  return parseEdloveUuidV8(value) !== null;\n}\n\n/** Canonical accounts accept only the registered central Identity/account profile. */\nexport function isEdloveAccountId(value: string): boolean {\n  const parts = parseEdloveUuidV8(value);\n  return (\n    parts !== null &&\n    parts.domain === edloveUuidV8Domain.identity &&\n    parts.subtype.value === edloveUuidV8Subtype.account.value &&\n    (parts.mintOrigin === edloveUuidV8MintOrigin.centralProduction ||\n      parts.mintOrigin === edloveUuidV8MintOrigin.nonProduction)\n  );\n}\n","layer":0,"isBedrock":true,"downstreamCount":0,"upstreamCount":1},{"path":"packages/core/src/lib/experienceState.ts","name":"experienceState.ts","dir":"packages/core/src/lib","loc":83,"fns":[],"interfaces":[{"name":"DemoIntent","isExported":true},{"name":"ExperienceState","isExported":false}],"types":[],"constants":[{"name":"useExperienceState","isExported":true},{"name":"scoped","isExported":false}],"imports":[{"source":"@repo/core/lib/scopedStateStorage","canonical":"packages/core/src/lib/scopedStateStorage.ts","isTypeOnly":false,"symbols":["createScopedStateStorage"]}],"content":"import { createScopedStateStorage } from '@repo/core/lib/scopedStateStorage';\nimport { create } from 'zustand';\nimport { createJSONStorage, persist } from 'zustand/middleware';\n\nexport interface DemoIntent {\n  module: string;\n  method: string;\n  payload: unknown;\n  timestamp: number;\n}\ninterface ExperienceState {\n  isDemoMode: boolean;\n  isExplorerMod
