<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sanctuary Code-ERD Explorer</title>
  <style>
    :root {
      --bg: #090d16;
      --panel-bg: #111827;
      --card-bg: #1e293b;
      --card-header: #334155;
      --border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --fn: #60a5fa;
      --type: #c084fc;
      --const: #34d399;
      --bedrock: #10b981;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #sidebar {
      width: 380px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    #sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    #sidebar-header h2 {
      margin: 0 0 6px 0;
      font-size: 17px;
      color: var(--accent);
    }
    #sidebar-header p {
      margin: 0 0 12px 0;
      font-size: 12px;
      color: var(--text-muted);
    }
    #search-box {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    #search-box:focus { border-color: var(--accent); }
    #file-tree {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .tree-item {
      padding: 8px 12px;
      border-radius: 6px;
      background: #1e293b;
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s;
    }
    .tree-item:hover {
      background: #283548;
      border-color: #475569;
    }
    .tree-item.active {
      background: #1e3a5f;
      border-color: var(--accent);
    }
    .tree-name {
      font-size: 13px;
      font-weight: 500;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }
    .tree-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #94a3b8;
    }
    .tree-badge.bedrock {
      background: rgba(16, 185, 129, 0.15);
      border-color: #10b981;
      color: #34d399;
      font-weight: 600;
    }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #111a2e 0%, #090d16 100%);
    }
    #main-toolbar {
      padding: 12px 24px;
      background: rgba(17, 24, 39, 0.85);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    .btn {
      background: #1e293b;
      border: 1px solid var(--border);
      color: #f1f5f9;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn:hover {
      background: #334155;
      border-color: var(--accent);
    }
    .btn.active {
      background: var(--accent);
      color: #090d16;
      font-weight: 600;
    }

    #workspace {
      flex: 1;
      overflow: auto;
      padding: 32px;
      display: flex;
      gap: 32px;
      align-items: flex-start;
    }

    /* Code-ERD Table Box */
    .erd-table {
      width: 360px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
      transition: all 0.2s ease;
    }
    .erd-table.focused {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.4), 0 12px 32px rgba(0,0,0,0.7);
      transform: scale(1.02);
    }
    .erd-table.upstream-highlight {
      border-color: #f59e0b;
      box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.4);
    }
    .erd-table.downstream-highlight {
      border-color: #10b981;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.4);
    }
    .erd-header {
      padding: 12px 16px;
      background: var(--card-header);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .erd-title {
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
    }
    .erd-layer {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #0f172a;
      border: 1px solid #475569;
      color: #38bdf8;
    }
    .erd-section {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.5);
    }
    .erd-section-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .erd-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      cursor: pointer;
    }
    .erd-row:hover { background: #1e293b; }
    .erd-row.fn { color: var(--fn); }
    .erd-row.type { color: var(--type); }
    .erd-row.const { color: var(--const); }
    .erd-row-badge {
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 3px;
      background: #0f172a;
      color: #64748b;
    }

    #trace-panel {
      position: absolute;
      bottom: 24px;
      left: 404px;
      right: 24px;
      background: rgba(17, 24, 39, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: none;
      z-index: 50;
    }
    #trace-panel h4 {
      margin: 0 0 8px 0;
      color: var(--accent);
      font-size: 14px;
    }
    .trace-flow {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      font-size: 12px;
    }
    .trace-step {
      background: #1e293b;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .trace-arrow { color: #64748b; font-weight: bold; }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="sidebar-header">
      <h2>Sanctuary Code-ERD</h2>
      <p>Select any file to inspect its internal columns (functions/types) and trace relations to bedrock.</p>
      <input type="text" id="search-box" placeholder="Search file, function, or type..." oninput="filterTree()">
    </div>
    <div id="file-tree"></div>
  </div>

  <div id="main">
    <div id="main-toolbar">
      <div id="current-file-label" style="font-size: 14px; font-weight: 600; color: #f1f5f9">
        Select a file from the sidebar
      </div>
      <div class="btn-group">
        <button class="btn" onclick="traceBedrock()">⚡ Trace to Bedrock (Downstream)</button>
        <button class="btn" onclick="traceUpstream()">🚀 Trace Callers (Upstream)</button>
        <button class="btn" onclick="clearHighlights()">Clear Filter</button>
      </div>
    </div>

    <div id="workspace"></div>

    <div id="trace-panel">
      <button style="float: right; background: transparent; border: none; color: #94a3b8; font-size: 16px; cursor: pointer" onclick="document.getElementById('trace-panel').style.display='none'">✕</button>
      <h4 id="trace-title">Lineage Trace</h4>
      <div class="trace-flow" id="trace-flow-content"></div>
    </div>
  </div>

  <script>
    const nodes = [{"path":"packages/self/src/components/GratitudeGlimmers.tsx","name":"GratitudeGlimmers.tsx","dir":"packages/self/src/components","loc":304,"fns":[{"name":"GratitudeGlimmers","isExported":false,"params":"{\n  userId,\n  disabled: componentDisabled,\n}: GratitudeGlimmersProps"},{"name":"handleSave","isExported":false,"params":""}],"interfaces":[{"name":"GratitudeGlimmersProps","isExported":false}],"types":[],"constants":[{"name":"router","isExported":false},{"name":"activeUserId","isExported":false},{"name":"categories","isExported":false},{"name":"cat","isExported":false}],"imports":[{"source":"@repo/core/hooks","canonical":"packages/core/src/hooks/index.ts","isTypeOnly":false,"symbols":["useSafeMutation"]},{"source":"@repo/core/logic","canonical":"packages/core/src/logic/index.ts","isTypeOnly":false,"symbols":["usePermissions"]},{"source":"@repo/ui/components/native","canonical":"packages/ui/src/components/native/index.ts","isTypeOnly":false,"symbols":["Button","Surface","Text as KitText"]},{"source":"@repo/ui/icons","canonical":"packages/ui/src/icons.ts","isTypeOnly":false,"symbols":["ChevronLeft","Heart","LogIn","MessageCircle","Plus","Save","Sparkles","User"]},{"source":"@repo/ui/theme/native","canonical":"packages/ui/src/theme/native/index.ts","isTypeOnly":false,"symbols":["useWorld"]},{"source":"@repo/ui/utils/haptics","canonical":"packages/ui/src/utils/haptics.ts","isTypeOnly":false,"symbols":["hapticLight","hapticSuccess"]}],"content":"/**\n * GRATITUDE GLIMMERS\n * Morning check-in: small moments that made you smile.\n * Standardized to October 29+ UI Kit architecture.\n */\n\nimport { useSafeMutation } from '@repo/core/hooks';\nimport { usePermissions } from '@repo/core/logic';\nimport { useGratitude } from '@repo/self/hooks/useGratitude';\nimport { Button, Surface, Text as KitText } from '@repo/ui/components/native';\nimport { ChevronLeft, Heart, LogIn, MessageCircle, Plus, Save, Sparkles, User } from '@repo/ui/icons';\nimport { useWorld } from '@repo/ui/theme/native';\nimport { hapticLight, hapticSuccess } from '@repo/ui/utils/haptics';\nimport { useRouter } from 'expo-router';\nimport { useState } from 'react';\nimport { useTranslation } from 'react-i18next';\nimport { Pressable, ScrollView, Text, TextInput, View } from 'react-native';\nimport Animated, { FadeInRight, FadeInUp } from 'react-native-reanimated';\n\ninterface GratitudeGlimmersProps {\n  userId?: string;\n  disabled?: boolean;\n}\n\nexport default function GratitudeGlimmers({\n  userId,\n  disabled: componentDisabled,\n}: GratitudeGlimmersProps) {\n  const router = useRouter();\n  const { t } = useTranslation();\n  const { context } = usePermissions();\n  const activeUserId = userId || context.userId;\n  const { tokens } = useWorld();\n\n  const { entries, refreshData, isLoading, addGratitudeEntry, error } = useGratitude(\n    activeUserId ?? undefined,\n  );\n\n  const [showForm, setShowForm] = useState(false);\n  const [content, setContent] = useState('');\n  const [category, setCategory] = useState<'student-said' | 'colleague-kindness' | 'personal-win'>(\n    'student-said',\n  );\n\n  const { mutate, isPending: isSaving } = useSafeMutation(\n    async (variables: { content: string; category: string }) => {\n      await addGratitudeEntry({\n        content: variables.content,\n        category: variables.category as any,\n      });\n    },\n    {\n      mutationKey: 'addGratitudeEntry',\n      scope: 'self',\n      mutationType: 'CREATE',\n      onSuccess: () => {\n        hapticSuccess();\n        setContent('');\n        setShowForm(false);\n        refreshData();\n      },\n    },\n  );\n\n  const handleSave = async () => {\n    if (!activeUserId || !content.trim() || isSaving) return;\n    hapticLight();\n    await mutate({\n      content: content.trim(),\n      category,\n    });\n  };\n\n  const categories = [\n    {\n      id: 'student-said',\n      label: t('self.studentSaid') || 'Student Joy',\n      emoji: '💬',\n      icon: MessageCircle,\n    },\n    {\n      id: 'colleague-kindness',\n      label: t('self.colleagueKindness') || 'Team Synergy',\n      emoji: '🤝',\n      icon: User,\n    },\n    {\n      id: 'personal-win',\n      label: t('self.personalWin') || 'Personal Win',\n      emoji: '🌟',\n      icon: Sparkles,\n    },\n  ];\n\n  if (isLoading && activeUserId) {\n    return (\n      <View className=\"p-4 gap-4\">\n        <Surface tone=\"raised\" style={{ height: 48, borderRadius: 12 }} />\n        <Surface tone=\"raised\" style={{ height: 80, borderRadius: 16 }} />\n        <Surface tone=\"raised\" style={{ height: 80, borderRadius: 16 }} />\n      </View>\n    );\n  }\n\n  if (!activeUserId) {\n    return (\n      <Surface tone=\"raised\" style={{ padding: 24, alignItems: 'center', borderRadius: 16 }}>\n        <Heart size={36} color={tokens.lamp} />\n        <KitText kind=\"title\" align=\"center\" style={{ marginTop: 12 }}>\n          {t('invitation.guestTitle') || 'Gratitude Glimmers'}\n        </KitText>\n        <KitText kind=\"body\" tone=\"soft\" align=\"center\" style={{ marginTop: 6 }}>\n          {t('invitation.guestDesc') || 'Sign in to record and cherish small moments that brought light to your day.'}\n        </KitText>\n        <View style={{ marginTop: 16 }}>\n          <Button label=\"Sign In\" icon={LogIn} onPress={() => router.push('/auth')} />\n        </View>\n      </Surface>\n    );\n  }\n\n  return (\n    <View className=\"gap-6\">\n      {/* Header */}\n      <View className=\"gap-1\">\n        <View className=\"flex-row items-center gap-2\">\n          <Heart size={24} color={tokens.lamp} />\n          <Text className=\"text-sacredWhite text-xl font-bold\">\n            {t('self.gratitude') || 'Gratitude Glimmers'}\n          </Text>\n        </View>\n        <Text className=\"text-mistGray text-sm\">\n          {t('self.gratitudeDesc') || 'Small moments that brought light to your day.'}\n        </Text>\n      </View>\n\n      {!showForm ? (\n        <View className=\"gap-4\">\n          {error ? (\n            <View className=\"flex-row items-center justify-between gap-3 rounded-2xl border border-emberRed/30 bg-emberRed/10 p-4\">\n              <Text className=\"flex-1 text-sm text-mistGray\" accessibilityRole=\"alert\">\n                {error} Showing the last available entries.\n              </Text>\n              <Pressable\n                onPress={() => void refreshData()}\n                accessibilityRole=\"button\"\n                accessibilityLabel=\"Retry loading gratitude history\"\n              >\n                <Text className=\"font-bold text-sanctuarySaffron\">Retry</Text>\n              </Pressable>\n            </View>\n          ) : null}\n\n          <Button\n            label={t('self.addGratitude') || 'Record a Glimmer'}\n            icon={Plus}\n            variant=\"primary\"\n            size=\"lg\"\n            disabled={componentDisabled}\n            onPress={() => {\n              hapticLight();\n              setShowForm(true);\n            }}\n          />\n\n          <ScrollView className=\"max-h-[500px]\" showsVerticalScrollIndicator={false}>\n            <View className=\"gap-4 pb-20\">\n              {entries.map((entry, index) => {\n                const cat = categories.find((c) => c.id === entry.category);\n                return (\n                  <Animated.View key={entry.id} entering={FadeInRight.delay(index * 100)}>\n                    <View className=\"p-4 rounded-2xl border border-white/5 bg-white/5 border-l-4 border-l-sanctuarySaffron\">\n                      <View className=\"gap-2\">\n                        <View className=\"flex-row justify-between items-center\">\n                          <View className=\"flex-row gap-2 items-center\">\n                            <Text className=\"text-lg\">{cat?.emoji}</Text>\n                            <Text className=\"text-[10px] uppercase font-black tracking-widest text-sanctuarySaffron\">\n                              {cat?.label}\n                            </Text>\n                          </View>\n                          <Text className=\"text-dimGray text-[10px] italic\">\n                            {new Date(entry.created_at).toLocaleDateString(undefined, {\n                              month: 'short',\n                              day: 'numeric',\n                              year: 'numeric',\n                            })}\n                          </Text>\n                        </View>\n                        <Text className=\"text-sacredWhite/90 text-[15px] leading-relaxed font-medium\">\n                          \"{entry.content}\"\n                        </Text>\n                      </View>\n                    </View>\n                  </Animated.View>\n                );\n              })}\n\n              {entries.length === 0 && (\n                <Surface tone=\"raised\" style={{ padding: 24, alignItems: 'center', borderRadius: 16 }}>\n                  <Heart size={32} color={tokens.lamp} />\n                  <KitText kind=\"title\" align=\"center\" style={{ marginTop: 8 }}>\n                    {t('self.whatSmiledToday') || 'Capture your first light today.'}\n                  </KitText>\n                  <KitText kind=\"caption\" tone=\"soft\" align=\"center\" style={{ marginTop: 4 }}>\n                    Small moments of gratitude ground your practice.\n                  </KitText>\n                </Surface>\n              )}\n            </View>\n          </ScrollView>\n        </View>\n      ) : (\n        <Animated.View entering={FadeInUp.duration(400)}>\n          <View className=\"gap-6 bg-white/5 p-5 rounded-2xl border border-white/10\">\n            {/* Category Selection */}\n            <View>\n              <Text className=\"text-mistGray text-xs uppercase font-black tracking-widest mb-3\">\n                {t('self.category') || 'Source of Joy'}\n              </Text>\n              <View className=\"flex-row gap-2 flex-wrap\">\n                {categories.map((cat) => (\n                  <Pressable\n                    key={cat.id}\n                    onPress={() => {\n                      hapticLight();\n                      setCategory(cat.id as any);\n                    }}\n                    accessibilityRole=\"radio\"\n                    accessibilityLabel={cat.label}\n                    accessibilityState={{ selected: category === cat.id }}\n                    className={`flex-row items-center gap-2 px-4 py-2.5 rounded-xl border-2 ${\n                      category === cat.id\n                        ? 'bg-sanctuarySaffron border-sanctuarySaffron'\n                        : 'bg-white/5 border-white/10'\n                    }`}\n                  >\n                    <Text className=\"text-lg\">{cat.emoji}</Text>\n                    <Text\n                      className={`text-xs font-bold ${\n                        category === cat.id ? 'text-obsidian' : 'text-mistGray'\n                      }`}\n                    >\n                      {cat.label}\n                    </Text>\n                  </Pressable>\n                ))}\n              </View>\n            </View>\n\n            {/* Content Area */}\n            <View className=\"gap-3\">\n              <Text className=\"text-mistGray text-xs uppercase font-black tracking-widest\">\n                {t('self.whatSmiled') || 'The Reflection'}\n              </Text>\n              <View className=\"bg-white/5 rounded-xl border border-white/10 p-3 min-h-[120px]\">\n                <TextInput\n                  placeholder={t('self.gratitudePlaceholder') || 'What warmed your heart?'}\n                  value={content}\n                  onChangeText={setContent}\n                  multiline\n                  accessibilityLabel=\"Gratitude reflection\"\n                  accessibilityHint=\"Write what warmed your heart\"\n                  className=\"text-sacredWhite text-base\"\n ":""},{"name":"hapticMedium","isExported":true,"params":""},{"name":"hapticHeavy","isExported":true,"params":""},{"name":"hapticSuccess","isExported":true,"params":""},{"name":"hapticWarning","isExported":true,"params":""},{"name":"hapticError","isExported":true,"params":""},{"name":"hapticSelection","isExported":true,"params":""},{"name":"hapticBreathing","isExported":true,"params":""},{"name":"haptic","isExported":true,"params":"kind: import('../theme/feedback'"}],"interfaces":[],"types":[{"name":"HapticImpact","isExported":true}],"constants":[{"name":"now","isExported":false}],"imports":[],"content":"/**\n * Haptic Feedback Utilities\n * Consistent haptic patterns across the app\n */\n\nimport * as Haptics from 'expo-haptics';\nimport { Platform } from 'react-native';\n\nexport type HapticImpact = 'light' | 'medium' | 'heavy';\n\nlet lastImpact: { kind: HapticImpact; at: number } | null = null;\nlet hapticsEnabled = true;\n\nexport function setHapticsEnabled(enabled: boolean) {\n  hapticsEnabled = enabled;\n}\n\nfunction runHaptic(label: string, callback: () => void | Promise<void>) {\n  if (!hapticsEnabled || Platform.OS === 'web') return;\n\n  try {\n    void Promise.resolve(callback()).catch((error: unknown) => {\n      console.warn(`[Haptics] ${label} failed`, error);\n    });\n  } catch (error) {\n    console.warn(`[Haptics] ${label} failed`, error);\n  }\n}\n\n/**\n * Fires an impact haptic while coalescing the same impact emitted twice by a\n * shared control and its existing action handler.\n */\nexport function hapticImpact(kind: HapticImpact) {\n  if (!hapticsEnabled) return;\n\n  const now = Date.now();\n  if (lastImpact?.kind === kind && now - lastImpact.at < 80) return;\n  lastImpact = { kind, at: now };\n\n  runHaptic(`impact.${kind}`, () => {\n    switch (kind) {\n      case 'light':\n        return Haptics.impactAsync(Haptics.ImpactFeedbackStyle.Light);\n      case 'medium':\n        return Haptics.impactAsync(Haptics.ImpactFeedbackStyle.Medium);\n      case 'heavy':\n        return Haptics.impactAsync(Haptics.ImpactFeedbackStyle.Heavy);\n    }\n  });\n}\n\n/**\n * Light haptic feedback\n * Use for: Button presses, taps, toggles\n */\nexport function hapticLight() {\n  hapticImpact('light');\n}\n\n/**\n * Medium haptic feedback\n * Use for: Important actions, confirmations, selection changes\n */\nexport function hapticMedium() {\n  hapticImpact('medium');\n}\n\n/**\n * Heavy haptic feedback\n * Use for: Destructive actions, warnings, errors\n */\nexport function hapticHeavy() {\n  hapticImpact('heavy');\n}\n\n/**\n * Success haptic feedback\n * Use for: Successful operations, achievements, completion\n */\nexport function hapticSuccess() {\n  runHaptic('notification.success', () => {\n    return Haptics.notificationAsync(Haptics.NotificationFeedbackType.Success);\n  });\n}\n\n/**\n * Warning haptic feedback\n * Use for: Warnings, attention needed\n */\nexport function hapticWarning() {\n  runHaptic('notification.warning', () => {\n    return Haptics.notificationAsync(Haptics.NotificationFeedbackType.Warning);\n  });\n}\n\n/**\n * Error haptic feedback\n * Use for: Errors, validation failures\n */\nexport function hapticError() {\n  runHaptic('notification.error', () => {\n    return Haptics.notificationAsync(Haptics.NotificationFeedbackType.Error);\n  });\n}\n\n/**\n * Selection haptic feedback\n * Use for: Scrolling through lists, picker changes\n */\nexport function hapticSelection() {\n  runHaptic('selection', () => {\n    return Haptics.selectionAsync();\n  });\n}\n\n/**\n * Custom haptic pattern (breathing rhythm for Lotus companion)\n * Creates a gentle pulse pattern\n */\nexport async function hapticBreathing() {\n  hapticImpact('light');\n  await new Promise((resolve) => setTimeout(resolve, 200));\n  hapticImpact('light');\n}\n\n/**\n * One entry point for the kit's feedback grammar (`theme/feedback.ts`): play a\n * haptic by kind. Components name an event; `useFeedback` picks the kind.\n */\nexport function haptic(kind: import('../theme/feedback').HapticKind) {\n  switch (kind) {\n    case 'selection':\n      return hapticSelection();\n    case 'success':\n      return hapticSuccess();\n    case 'warning':\n      return hapticWarning();\n    case 'error':\n      return hapticError();\n    default:\n      return hapticImpact(kind);\n  }\n}\n","layer":0,"isBedrock":true,"downstreamCount":0,"upstreamCount":1}];
    const edges = [{"from":"packages/self/src/components/GratitudeGlimmers.tsx","to":"packages/core/src/hooks/index.ts","symbols":["useSafeMutation"],"isTypeOnly":false},{"from":"packages/self/src/components/GratitudeGlimmers.tsx","to":"packages/core/src/logic/index.ts","symbols":["usePermissions"],"isTypeOnly":false},{"from":"packages/self/src/components/GratitudeGlimmers.tsx","to":"packages/ui/src/components/native/index.ts","symbols":["Button","Surface","Text as KitText"],"isTypeOnly":false},{"from":"packages/self/src/components/GratitudeGlimmers.tsx","to":"packages/ui/src/icons.ts","symbols":["ChevronLeft","Heart","LogIn","MessageCircle","Plus","Save","Sparkles","User"],"isTypeOnly":false},{"from":"packages/self/src/components/GratitudeGlimmers.tsx","to":"packages/ui/src/theme/native/index.ts","symbols":["useWorld"],"isTypeOnly":false},{"from":"packages/self/src/components/GratitudeGlimmers.tsx","to":"packages/ui/src/utils/haptics.ts","symbols":["hapticLight","hapticSuccess"],"isTypeOnly":false}];

    const nodeMap = new Map();
    for (const n of nodes) nodeMap.set(n.path, n);

    let activeFilePath = nodes[0].path;

    function renderTree(filterText = '') {
      const tree = document.getElementById('file-tree');
      tree.innerHTML = '';
      const filtered = nodes.filter(n => 
        n.name.toLowerCase().includes(filterText.toLowerCase()) ||
        n.fns.some(f => f.name.toLowerCase().includes(filterText.toLowerCase())) ||
        n.types.some(t => t.name.toLowerCase().includes(filterText.toLowerCase()))
      );

      for (const n of filtered) {
        const item = document.createElement('div');
        item.className = 'tree-item' + (n.path === activeFilePath ? ' active' : '');
        item.onclick = () => selectFile(n.path);
        item.innerHTML = `
          <span class="tree-name">${n.name}</span>
          <span class="tree-badge ${n.isBedrock ? 'bedrock' : ''}">
            ${n.isBedrock ? 'BEDROCK' : 'L' + n.layer}
          </span>
        `;
        tree.appendChild(item);
      }
    }

    function filterTree() {
      const q = document.getElementById('search-box').value;
      renderTree(q);
    }

    function selectFile(filePath) {
      activeFilePath = filePath;
      renderTree(document.getElementById('search-box').value);
      renderWorkspace();
    }

    function renderWorkspace() {
      const ws = document.getElementById('workspace');
      ws.innerHTML = '';
      const focusNode = nodeMap.get(activeFilePath);
      if (!focusNode) return;

      document.getElementById('current-file-label').innerHTML = `
        Focus: <span style="color:#38bdf8">${focusNode.name}</span> 
        <span style="font-size:12px; color:#94a3b8; font-weight:normal; margin-left: 10px;">
          (Layer ${focusNode.layer} • ${focusNode.loc} lines • ${focusNode.downstreamCount} imports • ${focusNode.upstreamCount} callers)
        </span>
      `;

      // Render Focus ERD Table
      ws.appendChild(createERDTable(focusNode, 'focused'));

      // Render 1-hop downstream tables
      const downstreamFiles = edges.filter(e => e.from === focusNode.path).map(e => e.to);
      const uniqueDown = [...new Set(downstreamFiles)];
      for (const dPath of uniqueDown) {
        const dNode = nodeMap.get(dPath);
        if (dNode) ws.appendChild(createERDTable(dNode, 'downstream'));
      }
    }

    function createERDTable(node, statusClass = '') {
      const card = document.createElement('div');
      card.className = 'erd-table ' + statusClass;
      card.id = 'erd-' + node.path.replace(/[^a-zA-Z0-9]/g, '_');

      let fnsHtml = '';
      if (node.fns.length > 0) {
        fnsHtml = '<div class="erd-section"><div class="erd-section-title">Functions (' + node.fns.length + ')</div>' +
          node.fns.map(f => `<div class="erd-row fn"><span>${f.name}()</span><span class="erd-row-badge">${f.isExported ? 'pub' : 'priv'}</span></div>`).join('') +
          '</div>';
      }

      let typesHtml = '';
      const allTypes = [...node.interfaces, ...node.types];
      if (allTypes.length > 0) {
        typesHtml = '<div class="erd-section"><div class="erd-section-title">Types & Interfaces (' + allTypes.length + ')</div>' +
          allTypes.map(t => `<div class="erd-row type"><span>${t.name}</span><span class="erd-row-badge">${t.isExported ? 'pub' : 'priv'}</span></div>`).join('') +
          '</div>';
      }

      let importsHtml = '';
      if (node.imports.length > 0) {
        importsHtml = '<div class="erd-section"><div class="erd-section-title">Imports (' + node.imports.length + ')</div>' +
          node.imports.map(i => `<div class="erd-row" style="color:#94a3b8" onclick="selectFile('${i.canonical}')"><span>${i.canonical.split('/').pop()}</span><span class="erd-row-badge">${i.symbols.length} sym</span></div>`).join('') +
          '</div>';
      }

      card.innerHTML = `
        <div class="erd-header">
          <span class="erd-title">${node.name}</span>
          <span class="erd-layer">${node.isBedrock ? 'BEDROCK' : 'Layer ' + node.layer}</span>
        </div>
        ${fnsHtml}
        ${typesHtml}
        ${importsHtml}
      `;

      return card;
    }

    function traceBedrock() {
      const panel = document.getElementById('trace-panel');
      const content = document.getElementById('trace-flow-content');
      document.getElementById('trace-title').innerText = 'Downstream Lineage Trace to Bedrock for: ' + nodeMap.get(activeFilePath).name;

      const visitedPaths = [];
      function crawl(p, currentLineage) {
        const nexts = edges.filter(e => e.from === p).map(e => e.to);
        if (nexts.length === 0) {
          visitedPaths.push([...currentLineage, p]);
          return;
        }
        for (const nxt of nexts) {
          if (!currentLineage.includes(nxt)) {
            crawl(nxt, [...currentLineage, p]);
          }
        }
      }
      crawl(activeFilePath, []);

      content.innerHTML = visitedPaths.slice(0, 5).map(line => 
        '<div style="margin: 6px 0; width: 100%">' +
        line.map((step, idx) => {
          const n = nodeMap.get(step);
          return `<span class="trace-step ${n?.isBedrock ? 'style="border-color:#10b981; color:#34d399"' : ''}">${n?.name || step} (L${n?.layer ?? '?'})</span>` +
            (idx < line.length - 1 ? ' <span class="trace-arrow">➔</span> ' : '');
        }).join('') +
        '</div>'
      ).join('') || '<div>This file is already at bedrock! (0 downstream dependencies)</div>';

      panel.style.display = 'block';
    }

    function traceUpstream() {
      const panel = document.getElementById('trace-panel');
      const content = document.getElementById('trace-flow-content');
      document.getElementById('trace-title').innerText = 'Upstream Callers for: ' + nodeMap.get(activeFilePath).name;

      const callers = edges.filter(e => e.to === activeFilePath).map(e => nodeMap.get(e.from));
      content.innerHTML = callers.length > 0
        ? callers.map(c => `<span class="trace-step" style="border-color:#f59e0b; color:#fbbf24" onclick="selectFile('${c.path}')">${c.name} (Layer ${c.layer})</span>`).join('')
        : '<div>No upstream files in this subsystem import this file directly.</div>';

      panel.style.display = 'block';
    }

    function clearHighlights() {
      document.getElementById('trace-panel').style.display = 'none';
      renderWorkspace();
    }

    // Init
    renderTree();
    selectFile(activeFilePath);
  </script>
