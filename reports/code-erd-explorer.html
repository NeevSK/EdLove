t type EntitlementScope = 'individual' | 'active_bond' | 'active_entity' | 'add_on';\n\nexport interface EntitlementGrant {\n  id: string;\n  scope: EntitlementScope;\n  scopeId: string | null;\n  tier: SubscriptionTier;\n  modules: readonly string[];\n  startsAt?: string;\n  expiresAt: string | null;\n  status: 'ACTIVE' | 'SUSPENDED' | 'REVOKED';\n}\n\nexport interface EntitlementScopeContext {\n  activeBondId?: string | null;\n  activeEntityId?: string | null;\n  activeEntityType?: string | null;\n}\n\nexport interface EntitlementRequirement {\n  tierAtLeast?: SubscriptionTier;\n  modulesAllOf?: readonly string[];\n  /** Defaults to the individual plan; institutional access must opt in. */\n  scope?: EntitlementScope;\n}\n\nexport interface EntitlementSnapshot {\n  pricingTier: SubscriptionTier;\n  activeEntitlements: string[];\n  expirationDate: string | null;\n  refreshedAt?: string;\n  /** Grants are already restricted to the current user's available scopes. */\n  grants?: readonly EntitlementGrant[];\n}\n\nconst TIER_RANK: Record<SubscriptionTier, number> = { FREE: 0, PRO: 1, INSTITUTIONAL: 2 };\n\nexport function resolveScopedEntitlement(\n  snapshot: EntitlementSnapshot,\n  scope: EntitlementScope = 'individual',\n): { pricingTier: SubscriptionTier; activeEntitlements: string[] } {\n  if (scope === 'individual') {\n    return {\n      pricingTier: snapshot.pricingTier,\n      activeEntitlements: snapshot.activeEntitlements,\n    };\n  }\n\n  const grants = (snapshot.grants ?? []).filter(\n    (grant) => grant.scope === scope && grant.status === 'ACTIVE',\n  );\n  const tier = grants.reduce<SubscriptionTier>(\n    (highest, grant) => (TIER_RANK[grant.tier] > TIER_RANK[highest] ? grant.tier : highest),\n    'FREE',\n  );\n  const modules = [...new Set(grants.flatMap((grant) => grant.modules))];\n  return { pricingTier: tier, activeEntitlements: modules };\n}\n\nexport function meetsSubscriptionTier(\n  current: SubscriptionTier,\n  required: SubscriptionTier,\n): boolean {\n  const rank: Record<SubscriptionTier, number> = { FREE: 0, PRO: 1, INSTITUTIONAL: 2 };\n  return rank[current] >= rank[required];\n}\n\nexport function satisfiesEntitlementRequirement(\n  snapshot: EntitlementSnapshot,\n  requirement: EntitlementRequirement,\n): boolean {\n  const scoped = resolveScopedEntitlement(snapshot, requirement.scope);\n  const tierSatisfied = requirement.tierAtLeast\n    ? meetsSubscriptionTier(scoped.pricingTier, requirement.tierAtLeast)\n    : true;\n  const modulesSatisfied = requirement.modulesAllOf\n    ? requirement.modulesAllOf.every((module) => scoped.activeEntitlements.includes(module))\n    : true;\n  return tierSatisfied && modulesSatisfied;\n}\n\nexport interface IEntitlementPort {\n  getEntitlements(userId: string, scope?: EntitlementScopeContext): Promise<EntitlementSnapshot>;\n  syncPurchases(userId: string, scope?: EntitlementScopeContext): Promise<EntitlementSnapshot>;\n  subscribeToEntitlementChanges(\n    userId: string,\n    callback: (snapshot: EntitlementSnapshot) => void,\n    scope?: EntitlementScopeContext,\n  ): () => void;\n}\n","layer":0,"isBedrock":true,"downstreamCount":0,"upstreamCount":5},{"path":"packages/core/src/store/scopeSession.ts","name":"scopeSession.ts","dir":"packages/core/src/store","loc":165,"fns":[{"name":"isSamePerspective","isExported":false,"params":"candidate: SanctuaryPerspective,\n  perspective: SanctuaryPerspective,"},{"name":"tenantIdFor","isExported":false,"params":"perspective: SanctuaryPerspective"},{"name":"bondMatchesPerspective","isExported":false,"params":"bond: Bond, perspective: SanctuaryPerspective"},{"name":"createScopeSessionSnapshot","isExported":true,"params":"input: {\n  principalId: string | null;\n  activePerspective: SanctuaryPerspective;\n  availablePerspectives: readonly SanctuaryPerspective[];\n  availableBonds: readonly Bond[];\n  selectedBond?: Bond | null;\n}"}],"interfaces":[{"name":"ScopeSessionSnapshot","isExported":true},{"name":"ScopeSessionState","isExported":true}],"types":[],"constants":[{"name":"principalId","isExported":false},{"name":"schoolBond","isExported":false},{"name":"schoolBond","isExported":false},{"name":"selectedBond","isExported":false},{"name":"activeBond","isExported":false},{"name":"useScopeSessionStore","isExported":true}],"imports":[{"source":"@repo/core/types/Identity","canonical":"packages/core/src/types/Identity.ts","isTypeOnly":true,"symbols":["Bond"]},{"source":"@repo/core/types/Perspective","canonical":"packages/core/src/types/Perspective.ts","isTypeOnly":true,"symbols":["SanctuaryPerspective"]}],"content":"import type { Bond } from '@repo/core/types/Identity';\nimport type { SanctuaryPerspective } from '@repo/core/types/Perspective';\nimport { create } from 'zustand';\n\nexport const PERSONAL_SCOPE_PERSPECTIVE: SanctuaryPerspective = {\n  id: 'personal',\n  kind: 'personal',\n  displayName: 'Personal Sanctuary',\n};\n\nexport interface ScopeSessionSnapshot {\n  readonly principalId: string | null;\n  readonly activePerspective: SanctuaryPerspective;\n  /** A workspace lens never implies authorization; only a validated Bond does. */\n  readonly authorityKind: 'bond' | 'workspace';\n  readonly availablePerspectives: readonly SanctuaryPerspective[];\n  readonly availableBonds: readonly Bond[];\n  readonly activeBond: Bond | null;\n  readonly tenantId: string | null;\n}\n\nexport interface ScopeSessionState {\n  readonly snapshot: ScopeSessionSnapshot | null;\n  readonly isTransitioning: boolean;\n  beginTransition: () => void;\n  commit: (snapshot: ScopeSessionSnapshot) => void;\n  abortTransition: () => void;\n  clear: () => void;\n}\n\nfunction isSamePerspective(\n  candidate: SanctuaryPerspective,\n  perspective: SanctuaryPerspective,\n): boolean {\n  return candidate.id === perspective.id;\n}\n\nfunction tenantIdFor(perspective: SanctuaryPerspective): string | null {\n  if (perspective.kind === 'institutional') return perspective.schoolId;\n  if (perspective.kind === 'commercial') return perspective.instituteId;\n  return null;\n}\n\nfunction bondMatchesPerspective(bond: Bond, perspective: SanctuaryPerspective): boolean {\n  if (perspective.kind !== 'institutional') return false;\n  return (\n    bond.id === perspective.id &&\n    bond.entity_type === 'SCHOOL' &&\n    bond.entity_id === perspective.schoolId &&\n    bond.capacity === perspective.capacity\n  );\n}\n\n/**\n * Creates the sole mutable scope snapshot. It deliberately accepts no fallback\n * selection: a requested perspective must be present in the supplied list.\n */\nexport function createScopeSessionSnapshot(input: {\n  principalId: string | null;\n  activePerspective: SanctuaryPerspective;\n  availablePerspectives: readonly SanctuaryPerspective[];\n  availableBonds: readonly Bond[];\n  selectedBond?: Bond | null;\n}): ScopeSessionSnapshot {\n  const principalId = input.principalId?.trim() || null;\n  if (input.availablePerspectives.length === 0) {\n    throw new Error('Scope session requires an explicit available-perspectives list.');\n  }\n  if (principalId === null && input.activePerspective.kind !== 'personal') {\n    throw new Error('A non-personal scope requires an authenticated principal.');\n  }\n  if (\n    !input.availablePerspectives.some((candidate) =>\n      isSamePerspective(candidate, input.activePerspective),\n    )\n  ) {\n    throw new Error('Scope session cannot commit a perspective outside the available list.');\n  }\n  if (\n    principalId === null &&\n    input.availablePerspectives.some((perspective) => perspective.kind !== 'personal')\n  ) {\n    throw new Error('An anonymous scope cannot include shared workspace perspectives.');\n  }\n  if (input.activePerspective.kind === 'institutional') {\n    const schoolBond = input.availableBonds.find(\n      (bond) => bond.id === input.activePerspective.id,\n    );\n    if (\n      !schoolBond ||\n      schoolBond.entity_type !== 'SCHOOL' ||\n      schoolBond.entity_id !== input.activePerspective.schoolId ||\n      schoolBond.capacity !== input.activePerspective.capacity\n    ) {\n      throw new Error('Institutional perspective must match an account-owned school bond.');\n    }\n  }\n  for (const perspective of input.availablePerspectives) {\n    if (perspective.kind !== 'institutional') continue;\n    const schoolBond = input.availableBonds.find(\n      (bond) => bond.id === perspective.id,\n    );\n    if (\n      !schoolBond ||\n      schoolBond.entity_type !== 'SCHOOL' ||\n      schoolBond.entity_id !== perspective.schoolId ||\n      schoolBond.capacity !== perspective.capacity\n    ) {\n      throw new Error('Institutional availability must match an account-owned school bond.');\n    }\n  }\n  if (principalId !== null && input.availableBonds.some((bond) => bond.user_id !== principalId)) {\n    throw new Error('Scope session cannot include bonds owned by another principal.');\n  }\n  if (principalId === null && input.availableBonds.length > 0) {\n    throw new Error('An anonymous scope cannot include bonds.');\n  }\n\n  const selectedBond =\n    input.selectedBond === undefined\n      ? null\n      : (input.availableBonds.find((bond) => bond.id === input.selectedBond?.id) ?? null);\n  if (input.selectedBond && selectedBond === null) {\n    throw new Error('Scope session cannot commit an active bond outside the available list.');\n  }\n  if (\n    selectedBond &&\n    input.activePerspective.kind !== 'personal' &&\n    !bondMatchesPerspective(selectedBond, input.activePerspective)\n  ) {\n    throw new Error('Scope session cannot pair an active bond with a different perspective.');\n  }\n  if (\n    selectedBond &&\n    input.activePerspective.kind === 'personal' &&\n    selectedBond.entity_type !== 'PERSONAL'\n  ) {\n    throw new Error('Personal Sanctuary cannot activate a non-personal bond.');\n  }\n  const activeBond = selectedBond;\n  if (input.activePerspective.kind === 'institutional' && activeBond === null) {\n    throw new Error('Scope session cannot commit an institutional perspective without its bond.');\n  }\n\n  return {\n    principalId,\n    activePerspective: input.activePerspective,\n    authorityKind: activeBond === null ? 'workspace' : 'bond',\n    availablePerspectives: [...input.availablePerspectives],\n    availableBonds: [...input.availableBonds],\n    activeBond,\n    tenantId: tenantIdFor(input.activePerspective),\n  };\n}\n\nexport const useScopeSessionStore = create<ScopeSessionState>()((set) => ({\n  snapshot: null,\n  isTransitioning: false,\n  beginTransition: () => set({ isTransitioning: true }),\n  commit: (snapshot) => set({ snapshot, isTransitioning: false }),\n  abortTransition: () => set({ isTransitioning: false }),\n  clear: () => set({ snapshot: null, isTransitioning: false }),\n}));\n\n","layer":2,"isBedrock":false,"downstreamCount":2,"upstreamCount":2},{"path":"packages/core/src/store/useAuthStore.ts","name":"useAuthStore.ts","dir":"packages/core/src/store","loc":28,"fns":[],"interfaces":[],"types":[{"name":"AuthSlice","isExported":false}],"constants":[{"name":"useAuthStore","isExported":true}],"imports":[{"source":"@repo/core/lib/authProfileStorage","canonical":"packages/core/src/lib/authProfileStorage.ts","isTypeOnly":false,"symbols":["authProfileStorage","restoreIdentityProfile"]},{"source":"@repo/core/store/slices/auth.slice","canonical":"packages/core/src/store/slices/auth.slice.ts","isTypeOnly":false,"symbols":["AuthSlice","createAuthSlice"]}],"content":"import { authProfileStorage, restoreIdentityProfile } from '@repo/core/lib/authProfileStorage';\nimport { type AuthSlice, createAuthSlice } from '@repo/core/store/slices/auth.slice';\nimport { create } from 'zustand';\nimport { createJSONStorage, persist } from 'zustand/middleware';\n\n/** Canonical profile observable. Credentials belong to AuthProvider; scope to scopeSession. */\nexport const useAuthStore = create<AuthSlice>()(\n  persist(\n    (set, get, api) => ({\n      ...createAuthSlice(set, get, api),\n    }),\n    {\n      name: 'gurudevi-auth-storage',\n      version: 2,\n      storage: createJSONStorage(() => authProfileStorage),\n      partialize: (state) => ({ user: state.user }),\n      migrate: (value) => restoreIdentityProfile(value),\n      merge: (value, current) => ({ ...current, ...restoreIdentityProfile(value) }),\n      onRehydrateStorage: () => (_state, error) => {\n        if (error) {\n          console.error('[AuthStore] Rehydration failed:', error);\n        }\n        useAuthStore.getState().setStoreHydrated(true);\n      },\n    },\n  ),\n);\n","layer":7,"isBedrock":false,"downstreamCount":2,"upstreamCount":3},{"path":"packages/core/src/store/useCedarDecisionStore.ts","name":"useCedarDecisionStore.ts","dir":"packages/core/src/store","loc":250,"fns":[{"name":"cancelSnapshotExpiry","isExported":false,"params":""},{"name":"scheduleExpiry","isExported":false,"params":""}],"interfaces":[{"name":"CedarDecisionState","isExported":true}],"types":[{"name":"CedarDecision","isExported":true},{"name":"DecisionMap","isExported":true}],"constants":[{"name":"useCedarDecisionStore","isExported":true},{"name":"generation","isExported":false},{"name":"db","isExported":false},{"name":"record","isExported":false},{"name":"currentPolicyVersion","isExported":false},{"name":"isSignatureValid","isExported":false},{"name":"expiresAt","isExported":false},{"name":"rawPermissions","isExported":false},{"name":"remaining","isExported":false}],"imports":[{"source":"@repo/core/adapters/powersync/database","canonical":"packages/core/src/adapters/powersync/database.ts","isTypeOnly":false,"symbols":["getDrizzleDB"]},{"source":"@repo/core/adapters/powersync/schema","canonical":"packages/core/src/adapters/powersync/schema.ts","isTypeOnly":false,"symbols":["permissionSnapshots","policyVersion"]},{"source":"@repo/core/logic/permissions/signature","canonical":"packages/core/src/logic/permissions/signature.ts","isTypeOnly":false,"symbols":["verifySnapshotSignature"]},{"source":"@repo/core/native/localGuestSession","canonical":"packages/core/src/native/localGuestSession.ts","isTypeOnly":false,"symbols":["isLocalGuestSessionId"]}],"content":"/**\n * useCedarDecisionStore — Zustand store for Cedar authorization decisions.\n *\n * Replaces usePermissionStore as the data source for useSanctuaryFeature.\n *\n * Migration path:\n *   Phase 1.1 — reads from permissionSnapshots table (same source as old store,\n *               but decouples the component dependency)\n *   Phase 4.x — switches to direct Cedar WASM evaluation from synced policies\n *\n * Lifecycle:\n *   loadDecisions()   → called during boot hydration after user authenticated\n *   getDecision()     → synchronous read ('allow' | 'deny' | 'no_decision')\n *   clearDecisions()  → called on logout / account swap\n */\n\nimport { getDrizzleDB } from '@repo/core/adapters/powersync/database';\nimport { permissionSnapshots, policyVersion } from '@repo/core/adapters/powersync/schema';\nimport { verifySnapshotSignature } from '@repo/core/logic/permissions/signature';\nimport { isLocalGuestSessionId } from '@repo/core/native/localGuestSession';\nimport { cedarActionFor } from '@repo/policies/authorizationRegistry';\nimport { and, eq } from 'drizzle-orm';\nimport { create } from 'zustand';\n\nexport type CedarDecision = 'allow' | 'deny' | 'no_decision';\nexport type DecisionMap = Record<string, Record<string, CedarDecision>>;\n\nlet decisionLoadGeneration = 0;\nlet snapshotExpiry: number | null = null;\nlet expiryTimer: ReturnType<typeof setTimeout> | null = null;\n\nfunction cancelSnapshotExpiry(): void {\n  if (expiryTimer !== null) clearTimeout(expiryTimer);\n  expiryTimer = null;\n  snapshotExpiry = null;\n}\n\nexport interface CedarDecisionState {\n  decisions: DecisionMap | null;\n  snapshotLoaded: boolean;\n  isLoading: boolean;\n  error: string | null;\n  snapshotScopeId: string | null;\n\n  loadDecisions: (userId: string, scopeId?: string | null) => Promise<void>;\n\n  getDecision: (subject: string, action: string) => CedarDecision;\n\n  clearDecisions: () => void;\n}\n\nexport const useCedarDecisionStore = create<CedarDecisionState>((set, get) => ({\n  decisions: null,\n  snapshotLoaded: false,\n  isLoading: false,\n  error: null,\n  snapshotScopeId: null,\n\n  loadDecisions: async (userId: string, scopeId?: string | null) => {\n    const generation = ++decisionLoadGeneration;\n    cancelSnapshotExpiry();\n    if (!userId) {\n      set({\n        decisions: null,\n        snapshotLoaded: false,\n        isLoading: false,\n        snapshotScopeId: null,\n        error: null,\n      });\n      return;\n    }\n\n    if (isLocalGuestSessionId(userId)) {\n      set({\n        decisions: null,\n        snapshotLoaded: false,\n        isLoading: false,\n        error: null,\n        snapshotScopeId: scopeId ?? null,\n      });\n      return;\n    }\n\n    set({\n      decisions: null,\n      snapshotLoaded: false,\n      isLoading: true,\n      error: null,\n      snapshotScopeId: scopeId ?? null,\n    });\n\n    try {\n      const db = getDrizzleDB();\n      const record = await db.query.permissionSnapshots.findFirst({\n        where: scopeId\n          ? and(\n              eq(permissionSnapshots.userId, userId),\n              eq(permissionSnapshots.activeBondId, scopeId),\n            )\n          : eq(permissionSnapshots.userId, userId),\n      });\n\n      if (generation !== decisionLoadGeneration) return;\n\n      if (!record) {\n        set({\n          decisions: null,\n          snapshotLoaded: false,\n          isLoading: false,\n          snapshotScopeId: scopeId ?? null,\n        });\n        return;\n      }\n\n      if (record.userId !== userId || (scopeId && record.activeBondId !== scopeId)) {\n        set({\n          decisions: null,\n          snapshotLoaded: false,\n          isLoading: false,\n          snapshotScopeId: scopeId ?? null,\n          error:\n            record.userId !== userId\n              ? 'Permission snapshot principal mismatch'\n              : 'Permission snapshot scope mismatch',\n        });\n        return;\n      }\n\n      const currentPolicyVersion = await db.query.policyVersion?.findFirst?.();\n      if (generation !== decisionLoadGeneration) return;\n      if (\n        (scopeId &&\n          (!currentPolicyVersion?.hash ||\n            !record.policyVersion ||\n            record.policyVersion !== currentPolicyVersion.hash)) ||\n        (!scopeId &&\n          currentPolicyVersion?.hash &&\n          record.policyVersion !== currentPolicyVersion.hash)\n      ) {\n        set({\n          decisions: null,\n          snapshotLoaded: false,\n          isLoading: false,\n          snapshotScopeId: scopeId ?? null,\n          error: 'Permission snapshot policy version is stale',\n        });\n        return;\n      }\n\n      // Ed25519 signature verification\n      const isSignatureValid = await verifySnapshotSignature(record);\n      if (generation !== decisionLoadGeneration) return;\n      if (!isSignatureValid) {\n        console.error('[CedarDecisionStore] Cryptographic tamper detected on permission snapshot');\n        set({\n          decisions: null,\n          snapshotLoaded: false,\n          error: 'Cryptographic tamper detected on permission snapshot',\n          isLoading: false,\n          snapshotScopeId: scopeId ?? null,\n        });\n        return;\n      }\n\n      // Expiration check\n      const expiresAt = new Date(record.expiresAt);\n      if (!Number.isFinite(expiresAt.getTime()) || expiresAt.getTime() <= Date.now()) {\n        set({\n          decisions: null,\n          snapshotLoaded: false,\n          error: 'Permission snapshot has expired',\n          isLoading: false,\n          snapshotScopeId: scopeId ?? null,\n        });\n        return;\n      }\n\n      const rawPermissions = JSON.parse(record.permissions) as Record<\n        string,\n        Record<string, unknown>\n      >;\n\n      // Convert boolean map to CedarDecision map\n      const decisions: DecisionMap = {};\n      for (const [subject, actions] of Object.entries(rawPermissions)) {\n        decisions[subject] = {};\n        for (const [action, allowed] of Object.entries(actions)) {\n          if (typeof allowed === 'boolean') {\n            decisions[subject][action] = allowed ? 'allow' : 'deny';\n          } else {\n            decisions[subject][action] = 'no_decision';\n          }\n        }\n      }\n\n      snapshotExpiry = expiresAt.getTime();\n      const scheduleExpiry = () => {\n        const remaining = expiresAt.getTime() - Date.now();\n        if (generation !== decisionLoadGeneration) return;\n        if (remaining <= 0) {\n          cancelSnapshotExpiry();\n          set({ decisions: null, snapshotLoaded: false, error: 'Permission snapshot has expired' });\n          return;\n        }\n        expiryTimer = setTimeout(scheduleExpiry, Math.min(remaining, 2_147_483_647));\n      };\n      set({\n        decisions,\n        snapshotLoaded: true,\n        isLoading: false,\n        error: null,\n        snapshotScopeId: scopeId ?? record.activeBondId ?? record.schoolId,\n      });\n      scheduleExpiry();\n    } catch (err) {\n      if (generation !== decisionLoadGeneration) return;\n      console.error('[CedarDecisionStore] Error loading decisions:', err);\n      set({\n        decisions: null,\n        snapshotLoaded: false,\n        error: err instanceof Error ? err.message : String(err),\n        isLoading: false,\n        snapshotScopeId: scopeId ?? null,\n      });\n    }\n  },\n\n  getDecision: (subject: string, action: string): CedarDecision => {\n    const { decisions } = get();\n    if (!decisions || snapshotExpiry === null || Date.now() >= snapshotExpiry) return 'no_decision';\n    return (\n      decisions[subject]?.[action] ??\n      decisions[subject]?.[cedarActionFor(action, subject)] ??\n      'no_decision'\n    );\n  },\n\n  clearDecisions: () => {\n    decisionLoadGeneration += 1;\n    cancelSnapshotExpiry();\n    set({\n      decisions: null,\n      snapshotLoaded: false,\n      isLoading: false,\n      error: null,\n      snapshotScopeId: null,\n    });\n  },\n}));\n","layer":10,"isBedrock":false,"downstreamCount":4,"upstreamCount":2},{"path":"packages/core/src/store/useEntitlementStore.ts","name":"useEntitlementStore.ts","dir":"packages/core/src/store","loc":166,"fns":[{"name":"isEntitlementSnapshotFresh","isExported":true,"params":"refreshedAt: string | null, now = Date.now("},{"name":"snapshotFields","isExported":false,"params":"snapshot: EntitlementSnapshot,\n  userId: string,\n  scope: EntitlementScopeContext,"}],"interfaces":[{"name":"EntitlementState","isExported":true}],"types":[],"constants":[{"name":"ENTITLEMENT_SNAPSHOT_MAX_AGE_MS","isExported":true},{"name":"_adapter","isExported":false},{"name":"parsed","isExported":false},{"name":"useEntitlementStore","isExported":true},{"name":"generation","isExported":false},{"name":"current","isExported":false},{"name":"snapshot","isExported":false},{"name":"cached","isExported":false},{"name":"canUseCache","isExported":false},{"name":"fresh","isExported":false}],"imports":[{"source":"@repo/core/adapters/supabase/supabaseEntitlement.adapter","canonical":"packages/core/src/adapters/supabase/supabaseEntitlement.adapter.ts","isTypeOnly":false,"symbols":["SupabaseEntitlementAdapter"]},{"source":"@repo/core/lib/storageWrapper","canonical":"packages/core/src/lib/storageWrapper.ts","isTypeOnly":false,"symbols":["SafeZustandStorage"]},{"source":"@repo/core/logic/ports/entitlement.port","canonical":"packages/core/src/logic/ports/entitlement.port.ts","isTypeOnly":true,"symbols":["EntitlementGrant","EntitlementReadiness","EntitlementScopeContext","EntitlementSnapshot"]}],"content":"import { SupabaseEntitlementAdapter } from '@repo/core/adapters/supabase/supabaseEntitlement.adapter';\nimport { SafeZustandStorage } from '@repo/core/lib/storageWrapper';\nimport type {\n  EntitlementGrant,\n  EntitlementReadiness,\n  EntitlementScopeContext,\n  EntitlementSnapshot,\n} from '@repo/core/logic/ports/entitlement.port';\nimport { create } from 'zustand';\nimport { createJSONStorage, persist } from 'zustand/middleware';\n\n/** Cached commercial access may support offline continuity for one day. */\nexport const ENTITLEMENT_SNAPSHOT_MAX_AGE_MS = 24 * 60 * 60 * 1000;\n\nexport interface EntitlementState {\n  activeEntitlements: string[];\n  grants: EntitlementGrant[];\n  pricingTier: 'FREE' | 'PRO' | 'INSTITUTIONAL';\n  manifestLoaded: boolean;\n  readiness: EntitlementReadiness;\n  snapshotRefreshedAt: string | null;\n  snapshotUserId: string | null;\n  snapshotActiveBondId: string | null;\n  isLoading: boolean;\n  error: string | null;\n\n  loadEntitlements: (userId: string, scope?: EntitlementScopeContext) => Promise<void>;\n\n  clearEntitlements: () => void;\n}\n\nconst _adapter = new SupabaseEntitlementAdapter();\n\nexport function isEntitlementSnapshotFresh(refreshedAt: string | null, now = Date.now()): boolean {\n  if (!refreshedAt) return false;\n  const parsed = Date.parse(refreshedAt);\n  return Number.isFinite(parsed) && now - parsed <= ENTITLEMENT_SNAPSHOT_MAX_AGE_MS;\n}\n\nfunction snapshotFields(\n  snapshot: EntitlementSnapshot,\n  userId: string,\n  scope: EntitlementScopeContext,\n) {\n  return {\n    activeEntitlements: snapshot.activeEntitlements,\n    grants: [...(snapshot.grants ?? [])],\n    pricingTier: snapshot.pricingTier,\n    manifestLoaded: true,\n    readiness: 'verified' as const,\n    snapshotRefreshedAt: snapshot.refreshedAt ?? new Date().toISOString(),\n    snapshotUserId: userId,\n    snapshotActiveBondId: scope.activeBondId ?? null,\n    isLoading: false,\n    error: null,\n  };\n}\n\nexport const useEntitlementStore = create<EntitlementState>()(\n  persist(\n    (set, get) => {\n      let loadGeneration = 0;\n\n      return {\n        activeEntitlements: [],\n        grants: [],\n        pricingTier: 'FREE',\n        manifestLoaded: false,\n        readiness: 'unknown',\n        snapshotRefreshedAt: null,\n        snapshotUserId: null,\n        snapshotActiveBondId: null,\n        isLoading: false,\n        error: null,\n\n        loadEntitlements: async (userId: string, scope: EntitlementScopeContext = {}) => {\n          const generation = ++loadGeneration;\n          const current = get();\n          if (!userId) {\n            get().clearEntitlements();\n            return;\n          }\n\n          if (current.snapshotUserId && current.snapshotUserId !== userId) {\n            set({\n              activeEntitlements: [],\n              grants: [],\n              pricingTier: 'FREE',\n              manifestLoaded: false,\n              readiness: 'unknown',\n              snapshotRefreshedAt: null,\n              snapshotUserId: null,\n              snapshotActiveBondId: null,\n            });\n          } else if (current.snapshotActiveBondId !== (scope.activeBondId ?? null)) {\n            set({ manifestLoaded: false, readiness: 'unknown', grants: [] });\n          } else if (\n            current.manifestLoaded &&\n            !isEntitlementSnapshotFresh(current.snapshotRefreshedAt)\n          ) {\n            set({ readiness: 'stale', manifestLoaded: false });\n          }\n\n          set({ isLoading: true, error: null });\n\n          try {\n            const snapshot = await _adapter.getEntitlements(userId, scope);\n            if (generation !== loadGeneration) return;\n            set(snapshotFields(snapshot, userId, scope));\n          } catch (err) {\n            if (generation !== loadGeneration) return;\n            const cached = get();\n            const canUseCache =\n              cached.snapshotUserId === userId &&\n              isEntitlementSnapshotFresh(cached.snapshotRefreshedAt);\n            set({\n              manifestLoaded: canUseCache,\n              readiness: canUseCache ? 'cached' : 'error',\n              isLoading: false,\n              error: err instanceof Error ? err.message : String(err),\n            });\n          }\n        },\n\n        clearEntitlements: () => {\n          loadGeneration += 1;\n          set({\n            activeEntitlements: [],\n            grants: [],\n            pricingTier: 'FREE',\n            manifestLoaded: false,\n            readiness: 'unknown',\n            snapshotRefreshedAt: null,\n            snapshotUserId: null,\n            snapshotActiveBondId: null,\n            isLoading: false,\n            error: null,\n          });\n        },\n      };\n    },\n    {\n      name: 'gurudevi-entitlement-storage',\n      storage: createJSONStorage(() => SafeZustandStorage),\n      partialize: (state) => ({\n        activeEntitlements: state.activeEntitlements,\n        grants: state.grants,\n        pricingTier: state.pricingTier,\n        manifestLoaded: state.manifestLoaded,\n        readiness: state.readiness,\n        snapshotRefreshedAt: state.snapshotRefreshedAt,\n        snapshotUserId: state.snapshotUserId,\n        snapshotActiveBondId: state.snapshotActiveBondId,\n      }),\n      onRehydrateStorage: () => (state) => {\n        if (!state?.snapshotUserId || !state.manifestLoaded) return;\n        const fresh = isEntitlementSnapshotFresh(state.snapshotRefreshedAt);\n        useEntitlementStore.setState({\n          manifestLoaded: fresh,\n          readiness: fresh ? 'cached' : 'stale',\n        });\n      },\n    },\n  ),\n);\n","layer":11,"isBedrock":false,"downstreamCount":3,"upstreamCount":1},{"path":"packages/core/src/store/useFeatureStore.ts","name":"useFeatureStore.ts","dir":"packages/core/src/store","loc":126,"fns":[{"name":"clear","isExported":false,"params":""},{"name":"isCurrent","isExported":false,"params":""},{"name":"publish","isExported":false,"params":"snapshot: FeatureRolloutSnapshot"},{"name":"accept","isExported":false,"params":"snapshot: FeatureRolloutSnapshot"}],"interfaces":[{"name":"FeatureState","isExported":false}],"types":[{"name":"FeatureFlags","isExported":false}],"constants":[{"name":"SavedRollout","isExported":false},{"name":"useFeatureStore","isExported":true},{"name":"owner","isExported":false},{"name":"accountRevision","isExported":false},{"name":"guestRevision","isExported":false},{"name":"fingerprint","isExported":false},{"name":"key","isExported":false},{"name":"normalized","isExported":false},{"name":"signature","isExported":false},{"name":"unsubscribe","isExported":false},{"name":"saved","isExported":false}],"imports":[{"source":"@repo/core/lib/accountScope","canonical":"packages/core/src/lib/accountScope.ts","isTypeOnly":false,"symbols":["getAccountScopeRevision","scopeStorageKey"]},{"source":"@repo/core/lib/featureRolloutSnapshot","canonical":"packages/core/src/lib/featureRolloutSnapshot.ts","isTypeOnly":false,"symbols":["FEATURE_ROLLOUT_SNAPSHOT_MAX_AGE_MS","normalizeFeatureRolloutSnapshot","projectFeatureFlags"]},{"source":"@repo/core/lib/storage","canonical":"packages/core/src/lib/storage.ts","isTypeOnly":false,"symbols":["storage"]},{"source":"@repo/core/adapters/feature-rollout/growthBookFeatureRollout.adapter","canonical":"packages/core/src/adapters/feature-rollout/growthBookFeatureRollout.adapter.ts","isTypeOnly":false,"symbols":["growthBookFeatureRolloutAdapter as featureFlags"]},{"source":"@repo/core/logic/ports/featureRollout.port","canonical":"packages/core/src/logic/ports/featureRollout.port.ts","isTypeOnly":true,"symbols":["FeatureRolloutSnapshot"]},{"source":"@repo/core/logic/schemas/user.schema","canonical":"packages/core/src/logic/schemas/user.schema.ts","isTypeOnly":true,"symbols":["UserContext"]},{"source":"@repo/core/monitoring/breadcrumbs","canonical":"packages/core/src/monitoring/breadcrumbs.ts","isTypeOnly":false,"symbols":["leaveBreadcrumb"]},{"source":"@repo/core/native/guestScope","canonical":"packages/core/src/native/guestScope.ts","isTypeOnly":false,"symbols":["getGuestScopeRevision","guestStorageKey"]},{"source":"@repo/core/store/types/featureFlags","canonical":"packages/core/src/store/types/featureFlags.ts","isTypeOnly":false,"symbols":["DEFAULT_FEATURE_FLAGS","FeatureFlags"]}],"content":"import { getAccountScopeRevision, scopeStorageKey } from '@repo/core/lib/accountScope';\nimport {\n  FEATURE_ROLLOUT_SNAPSHOT_MAX_AGE_MS,\n  normalizeFeatureRolloutSnapshot,\n  projectFeatureFlags,\n} from '@repo/core/lib/featureRolloutSnapshot';\nimport { storage } from '@repo/core/lib/storage';\nimport { growthBookFeatureRolloutAdapter as featureFlags } from '@repo/core/adapters/feature-rollout/growthBookFeatureRollout.adapter';\nimport type { FeatureRolloutSnapshot } from '@repo/core/logic/ports/featureRollout.port';\nimport type { UserContext } from '@repo/core/logic/schemas/user.schema';\nimport { leaveBreadcrumb } from '@repo/core/monitoring/breadcrumbs';\nimport { getGuestScopeRevision, guestStorageKey } from '@repo/core/native/guestScope';\nimport { DEFAULT_FEATURE_FLAGS, type FeatureFlags } from '@repo/core/store/types/featureFlags';\nimport { z } from 'zod';\nimport { create } from 'zustand';\n\nconst SavedRollout = z.object({\n  version: z.literal(2),\n  context: z.string(),\n  snapshot: z.object({\n    flags: z.record(z.string(), z.union([z.boolean(), z.string()])),\n    source: z.enum(['cache', 'remote', 'computed']),\n    refreshedAt: z.string(),\n  }),\n});\n\ninterface FeatureState {\n  flags: FeatureFlags;\n  snapshot: FeatureRolloutSnapshot | null;\n  bindContext: (context: UserContext) => () => void;\n  clear: () => void;\n}\n\n/** One current SDK evaluation. Flags are an atomic projection, never a persisted authority. */\nexport const useFeatureStore = create<FeatureState>((set) => {\n  let generation = 0;\n  let dispose: (() => void) | undefined;\n  const clear = () => {\n    generation += 1;\n    dispose?.();\n    dispose = undefined;\n    set({ flags: DEFAULT_FEATURE_FLAGS, snapshot: null });\n  };\n  return {\n    flags: DEFAULT_FEATURE_FLAGS,\n    snapshot: null,\n    clear,\n    bindContext: (context) => {\n      clear();\n      leaveBreadcrumb('flags', 'Recomputing feature flags', 'info');\n      const owner = generation;\n      const accountRevision = getAccountScopeRevision();\n      const guestRevision = getGuestScopeRevision();\n      const fingerprint = JSON.stringify(context);\n      const key =\n        context.userId && !context.isLocalOnly\n          ? scopeStorageKey('feature-rollout:v2', context.userId)\n          : guestStorageKey('feature-rollout:v2');\n      let timer: ReturnType<typeof setTimeout> | undefined;\n      let sdkPublished = false;\n      let lastAccepted: string | undefined;\n      const isCurrent = () =>\n        owner === generation &&\n        accountRevision === getAccountScopeRevision() &&\n        guestRevision === getGuestScopeRevision();\n      const publish = (snapshot: FeatureRolloutSnapshot) => {\n        if (!isCurrent()) return;\n        clearTimeout(timer);\n        const normalized = normalizeFeatureRolloutSnapshot(snapshot);\n        set({ snapshot: normalized, flags: projectFeatureFlags(normalized.flags) });\n        if (!normalized.stale) {\n          timer = setTimeout(\n            () => publish(snapshot),\n            Date.parse(snapshot.refreshedAt) + FEATURE_ROLLOUT_SNAPSHOT_MAX_AGE_MS - Date.now(),\n          );\n        }\n      };\n      const accept = (snapshot: FeatureRolloutSnapshot) => {\n        if (!isCurrent()) return;\n        // An SDK without a loaded payload has not superseded a saved evaluation.\n        if (snapshot.source === 'computed' && Object.keys(snapshot.flags).length === 0) return;\n        const signature = JSON.stringify(snapshot);\n        if (signature === lastAccepted) return;\n        lastAccepted = signature;\n        sdkPublished = true;\n        publish(snapshot);\n        leaveBreadcrumb('flags', 'Feature flags applied', 'info', {\n          flagCount: Object.keys(snapshot.flags).length,\n        });\n        void storage\n          .setAsync(key, JSON.stringify({ version: 2, context: fingerprint, snapshot }))\n          .catch((error: unknown) => {\n            console.warn('[FeatureRollout] snapshot write failed', error);\n          });\n      };\n      const unsubscribe = featureFlags.subscribeToFlagChanges(context, accept);\n      dispose = () => {\n        clearTimeout(timer);\n        unsubscribe();\n      };\n      void storage\n        .getStringAsync(key)\n        .then((raw) => {\n          if (!raw || !isCurrent() || sdkPublished) return;\n          const saved = SavedRollout.parse(JSON.parse(raw));\n          if (saved.context === fingerprint) publish({ ...saved.snapshot, source: 'cache' });\n        })\n        .catch((error: unknown) => {\n          console.warn('[FeatureRollout] snapshot read failed; record retained', error);\n        });\n      void featureFlags\n        .resolveFlags(context)\n        .then(accept)\n        .catch((error: unknown) => {\n          if (isCurrent()) {\n            console.warn('[FeatureRollout] refresh failed; keeping current snapshot', error);\n            leaveBreadcrumb('flags', 'Recompute failed', 'error', { error: String(error) });\n          }\n        });\n      return () => {\n        if (owner === generation) clear();\n      };\n    },\n  };\n});\n","layer":5,"isBedrock":false,"downstreamCount":9,"upstreamCount":1},{"path":"packages/core/src/store/usePerspectiveStore.ts","name":"usePerspectiveStore.ts","dir":"packages/core/src/store","loc":207,"fns":[],"interfaces":[{"name":"PerspectiveStoreState","isExported":true}],"types":[],"constants":[{"name":"usePerspectiveStore","isExported":true},{"name":"currentActive","isExported":false},{"name":"matchingActive","isExported":false},{"name":"exists","isExported":false},{"name":"filtered","isExported":false},{"name":"nextActive","isExported":false},{"name":"updatedPerspectives","isExported":false},{"name":"nextActive","isExported":false},{"name":"personal","isExported":false},{"name":"combined","isExported":false},{"name":"currentActive","isExported":false},{"name":"stillValidActive","isExported":false},{"name":"targetPerspective","isExported":false},{"name":"previousPerspective","isExported":false},{"name":"userId","isExported":false},{"name":"targetScopeId","isExported":false}],"imports":[{"source":"@repo/core/lib/storageWrapper","canonical":"packages/core/src/lib/storageWrapper.ts","isTypeOnly":false,"symbols":["SafeZustandStorage"]},{"source":"@repo/core/lib/sync/eventBus","canonical":"packages/core/src/lib/sync/eventBus.ts","isTypeOnly":false,"symbols":["sovereignBus"]},{"source":"@repo/core/store/useAuthStore","canonical":"packages/core/src/store/useAuthStore.ts","isTypeOnly":false,"symbols":["useAuthStore"]},{"source":"@repo/core/store/useCedarDecisionStore","canonical":"packages/core/src/store/useCedarDecisionStore.ts","isTypeOnly":false,"symbols":["useCedarDecisionStore"]},{"source":"@repo/core/types/Perspective","canonical":"packages/core/src/types/Perspective.ts","isTypeOnly":true,"symbols":["SanctuaryPerspective"]}],"content":"import { SafeZustandStorage } from '@repo/core/lib/storageWrapper';\nimport { sovereignBus } from '@repo/core/lib/sync/eventBus';\nimport { useAuthStore } from '@repo/core/store/useAuthStore';\nimport { useCedarDecisionStore } from '@repo/core/store/useCedarDecisionStore';\nimport type { SanctuaryPerspective } from '@repo/core/types/Perspective';\nimport { create } from 'zustand';\nimport { createJSONStorage, persist } from 'zustand/middleware';\n\nexport interface PerspectiveStoreState {\n  activePerspective: SanctuaryPerspective;\n  availablePerspectives: SanctuaryPerspective[];\n  isTransitioning: boolean;\n\n  // Actions\n  setAvailablePerspectives: (perspectives: SanctuaryPerspective[]) => void;\n  switchPerspective: (perspectiveId: string) => Promise<void>;\n  resetToPersonalPerspective: () => void;\n  addPerspective: (perspective: SanctuaryPerspective) => void;\n  removePerspective: (perspectiveId: string) => void;\n  updatePerspective: (perspectiveId: string, updates: Partial<SanctuaryPerspective>) => void;\n  hydratePerspectivesFromDatabase: (\n    userId: string,\n    dependencies: {\n      getInstitutionalBonds?: () => Promise<SanctuaryPerspective[]>;\n      getCommercialBatches?: () => Promise<SanctuaryPerspective[]>;\n      getGuardianBonds?: () => Promise<SanctuaryPerspective[]>;\n    },\n  ) => Promise<void>;\n}\n\nexport const DEFAULT_PERSONAL_PERSPECTIVE: SanctuaryPerspective = {\n  id: 'personal',\n  kind: 'personal',\n  displayName: 'Personal Sanctuary',\n};\n\n/**\n * usePerspectiveStore\n *\n * Sovereign, atomic store for managing Sanctuary Perspectives (Personal vs School vs Guardian).\n * Handles synchronous in-memory state eviction and Cedar permission tree swapping on perspective transition.\n */\nexport const usePerspectiveStore = create<PerspectiveStoreState>()(\n  persist(\n    (set, get) => ({\n      activePerspective: DEFAULT_PERSONAL_PERSPECTIVE,\n      availablePerspectives: [DEFAULT_PERSONAL_PERSPECTIVE],\n      isTransitioning: false,\n\n      setAvailablePerspectives: (perspectives) => {\n        const currentActive = get().activePerspective;\n        const matchingActive =\n          perspectives.find((p) => p.id === currentActive.id) ??\n          perspectives[0] ??\n          DEFAULT_PERSONAL_PERSPECTIVE;\n\n        set({\n          availablePerspectives:\n            perspectives.length > 0 ? perspectives : [DEFAULT_PERSONAL_PERSPECTIVE],\n          activePerspective: matchingActive,\n        });\n      },\n\n      addPerspective: (perspective) => {\n        set((state) => {\n          const exists = state.availablePerspectives.some((p) => p.id === perspective.id);\n          if (exists) {\n            return {\n              availablePerspectives: state.availablePerspectives.map((p) =>\n                p.id === perspective.id ? perspective : p,\n              ),\n            };\n          }\n          return {\n            availablePerspectives: [...state.availablePerspectives, perspective],\n          };\n        });\n      },\n\n      removePerspective: (perspectiveId) => {\n        if (perspectiveId === 'personal') return; // Cannot delete personal sanctuary\n        set((state) => {\n          const filtered = state.availablePerspectives.filter((p) => p.id !== perspectiveId);\n          const nextActive =\n            state.activePerspective.id === perspectiveId\n              ? DEFAULT_PERSONAL_PERSPECTIVE\n              : state.activePerspective;\n          return {\n            availablePerspectives: filtered.length > 0 ? filtered : [DEFAULT_PERSONAL_PERSPECTIVE],\n            activePerspective: nextActive,\n          };\n        });\n      },\n\n      updatePerspective: (perspectiveId, updates) => {\n        set((state) => {\n          const updatedPerspectives = state.availablePerspectives.map((p) =>\n            p.id === perspectiveId ? ({ ...p, ...updates } as SanctuaryPerspective) : p,\n          );\n          const nextActive =\n            state.activePerspective.id === perspectiveId\n              ? ({ ...state.activePerspective, ...updates } as SanctuaryPerspective)\n              : state.activePerspective;\n          return {\n            availablePerspectives: updatedPerspectives,\n            activePerspective: nextActive,\n          };\n        });\n      },\n\n      hydratePerspectivesFromDatabase: async (userId, dependencies) => {\n        try {\n          const personal = DEFAULT_PERSONAL_PERSPECTIVE;\n          const [institutional = [], commercial = [], guardian = []] = await Promise.all([\n            dependencies.getInstitutionalBonds\n              ? dependencies.getInstitutionalBonds()\n              : Promise.resolve([]),\n            dependencies.getCommercialBatches\n              ? dependencies.getCommercialBatches()\n              : Promise.resolve([]),\n            dependencies.getGuardianBonds ? dependencies.getGuardianBonds() : Promise.resolve([]),\n          ]);\n\n          const combined = [personal, ...institutional, ...commercial, ...guardian];\n          const currentActive = get().activePerspective;\n          const stillValidActive = combined.find((p) => p.id === currentActive.id) ?? personal;\n\n          set({\n            availablePerspectives: combined,\n            activePerspective: stillValidActive,\n          });\n        } catch (error) {\n          console.error('[usePerspectiveStore] Error hydrating perspectives from database:', error);\n        }\n      },\n\n      switchPerspective: async (perspectiveId: string) => {\n        const { availablePerspectives, activePerspective } = get();\n        if (activePerspective.id === perspectiveId) return;\n\n        const targetPerspective = availablePerspectives.find((p) => p.id === perspectiveId);\n        if (!targetPerspective) {\n          console.warn(\n            `[usePerspectiveStore] Target perspective '${perspectiveId}' not found in available perspectives.`,\n          );\n          return;\n        }\n\n        set({ isTransitioning: true });\n\n        try {\n          const previousPerspective = activePerspective;\n\n          // 1. Evict / Invalidate previous Cedar permission decision snapshot\n          useCedarDecisionStore.getState().clearDecisions();\n\n          // 2. Emit perspective transition event over Sovereign Event Bus for cache flushing\n          sovereignBus.emit('perspective:transition_started' as any, {\n            from: previousPerspective,\n            to: targetPerspective,\n          });\n\n          // 3. Atomically update active perspective pointer\n          set({\n            activePerspective: targetPerspective,\n          });\n\n          // 4. Reload Cedar decisions for the new perspective scope if user is available\n          const userId = useAuthStore.getState().user?.id;\n          if (userId) {\n            const targetScopeId =\n              targetPerspective.kind === 'institutional'\n                ? targetPerspective.schoolId\n                : targetPerspective.id;\n\n            await useCedarDecisionStore.getState().loadDecisions(userId, targetScopeId);\n          }\n\n          sovereignBus.emit('perspective:transition_completed' as any, {\n            activePerspective: targetPerspective,\n          });\n        } catch (error) {\n          console.error('[usePerspectiveStore] Error during perspective switch:', error);\n        } finally {\n          set({ isTransitioning: false });\n        }\n      },\n\n      resetToPersonalPerspective: () => {\n        useCedarDecisionStore.getState().clearDecisions();\n        set({\n          activePerspective: DEFAULT_PERSONAL_PERSPECTIVE,\n          isTransitioning: false,\n        });\n      },\n    }),\n    {\n      name: 'gurudevi-perspective-storage',\n      storage: createJSONStorage(() => SafeZustandStorage),\n      partialize: (state) => ({\n        activePerspective: state.activePerspective,\n        availablePerspectives: state.availablePerspectives,\n      }),\n    },\n  ),\n);\n","layer":11,"isBedrock":false,"downstreamCount":5,"upstreamCount":1},{"path":"packages/core/src/types/Perspective.ts","name":"Perspective.ts","dir":"packages/core/src/types","loc":104,"fns":[],"interfaces":[{"name":"BasePerspective","isExported":true},{"name":"PersonalPerspective","isExported":true},{"name":"CommercialPerspective","isExported":true},{"name":"InstitutionalBondPerspective","isExported":true},{"name":"GuardianBondPerspective","isExported":true},{"name":"PerspectiveState","isExported":true}],"types":[{"name":"SectorKind","isExported":true},{"name":"PerspectiveKind","isExported":true},{"name":"MediumOfInstruction","isExported":true},{"name":"CommercialClassFormat","isExported":true},{"name":"SanctuaryPerspective","isExported":true}],"constants":[],"imports":[{"source":"@repo/core/constants/SriLankanSchools","canonical":"packages/core/src/constants/SriLankanSchools.ts","isTypeOnly":true,"symbols":["SchoolType"]},{"source":"@repo/core/logic/schemas/capacity.schema","canonical":"packages/core/src/logic/schemas/capacity.schema.ts","isTypeOnly":true,"symbols":["Capacity"]},{"source":"./CivicRole","canonical":"packages/core/src/types/CivicRole.ts","isTypeOnly":true,"symbols":["CivicRoleId"]}],"content":"import type { SchoolType } from '@repo/core/constants/SriLankanSchools';\nimport type { Capacity } from '@repo/core/logic/schemas/capacity.schema';\nimport type { CivicRoleId } from './CivicRole';\n\n/**\n * Sovereign Sector: The legal covenant / ReBAC bond boundary.\n * - 'personal': Autonomous, self-governed studio or personal sanctuary (SECOND_CLASS).\n * - 'institutional': Formal school / classroom bond under institutional ReBAC & Cedar (FIRST_CLASS).\n * - 'commercial': Tuition institute / private tutoring batch contract.\n * - 'community': Peer or civic social circles.\n */\nexport type SectorKind =\n  | 'personal'\n  | 'commercial'\n  | 'institutional'\n  | 'community';\n\n/**\n * PerspectiveKind is canonically aliased to SectorKind.\n * Note: 'guardian' is a Civic Role (human capacity caring for a ward) inside an\n * institutional or family covenant, retained as an optional backward-compatible alias.\n */\nexport type PerspectiveKind = SectorKind | 'guardian';\n\nexport type MediumOfInstruction = 'sinhala' | 'english' | 'tamil';\n\nexport type CommercialClassFormat = 'physical' | 'online' | 'hybrid' | 'paper_class';\n\nexport interface BasePerspective {\n  id: string; // 'personal' or unique bond ID\n  kind: PerspectiveKind;\n  displayName: string;\n  /** Explicit civic role if specified on the perspective */\n  civicRole?: CivicRoleId;\n}\n\nexport interface PersonalPerspective extends BasePerspective {\n  kind: 'personal';\n  id: 'personal';\n  displayName: string;\n  studioType?: 'general' | 'educator' | 'learner';\n  civicRole?: CivicRoleId;\n  personalClassrooms?: Array<{\n    id: string;\n    name: string;\n    subject?: string;\n    studentCount?: number;\n  }>;\n}\n\nexport interface CommercialPerspective extends BasePerspective {\n  kind: 'commercial';\n  id: string; // e.g. \"commercial:apex_nugegoda:phys_2026_sun\"\n  instituteId: string;\n  instituteName: string;\n  isIndependentStudio?: boolean;\n  subjectId: string;\n  subjectName: string;\n  grade: string; // e.g. \"2026 A/L\", \"Grade 11\"\n  medium: MediumOfInstruction;\n  format?: CommercialClassFormat;\n  batchId: string;\n  batchName: string;\n  role: 'founder' | 'lead_tutor' | 'assistant_tutor' | 'paper_marker';\n  civicRole?: 'teacher';\n  customAlias?: string | null;\n  displayTitle: string; // Computed alias or formatted title\n  academicCycleId?: string | null;\n}\n\nexport interface InstitutionalBondPerspective extends BasePerspective {\n  kind: 'institutional';\n  id: string; // bond ID (e.g. bond:school_123:teacher)\n  schoolId: string;\n  schoolName: string;\n  schoolType?: SchoolType | string | null;\n  capacity: Capacity; // Primary active capacity (e.g. 'teacher', 'principal', 'student', 'guardian')\n  roles: Capacity[]; // Plural roles/capacities in this institution\n  civicRole?: CivicRoleId;\n  academicCycleId?: string | null;\n}\n\nexport interface GuardianBondPerspective extends BasePerspective {\n  kind: 'guardian';\n  id: string; // bond ID\n  wardUserId: string;\n  wardName: string;\n  schoolId?: string | null;\n  civicRole?: 'guardian';\n}\n\nexport type SanctuaryPerspective =\n  | PersonalPerspective\n  | CommercialPerspective\n  | InstitutionalBondPerspective\n  | GuardianBondPerspective;\n\nexport interface PerspectiveState {\n  activePerspective: SanctuaryPerspective;\n  availablePerspectives: SanctuaryPerspective[];\n  isTransitioning: boolean;\n}\n\n","layer":1,"isBedrock":false,"downstreamCount":3,"upstreamCount":3},{"path":"packages/core/src/logic/permissions/accessContext.ts","name":"accessContext.ts","dir":"packages/core/src/logic/permissions","loc":39,"fns":[{"name":"isFeatureAccessContextReady","isExported":true,"params":"ctx: FeatureAccessContext"}],"interfaces":[{"name":"FeatureAccessContext","isExported":true}],"types":[],"constants":[{"name":"entitlementReady","isExported":false}],"imports":[{"source":"@repo/core/logic/ports/entitlement.port","canonical":"packages/core/src/logic/ports/entitlement.port.ts","isTypeOnly":true,"symbols":["EntitlementReadiness","EntitlementSnapshot"]},{"source":"@repo/core/logic/registry/citizenship","canonical":"packages/core/src/logic/registry/citizenship.ts","isTypeOnly":true,"symbols":["CitizenshipLevel"]}],"content":"import type {\n  EntitlementReadiness,\n  EntitlementSnapshot,\n} from '@repo/core/logic/ports/entitlement.port';\nimport type { CitizenshipLevel } from '@repo/core/logic/registry/citizenship';\n\n/**\n * Shared, pure access context consumed by local presentation and operation\n * gates. Adapters populate this context; the evaluator never reads stores,\n * headers, or network state directly.\n */\nexport interface FeatureAccessContext {\n  userId?: string | null;\n  isLocalOnly?: boolean;\n  activeBondId?: string | null;\n  activeEntityId?: string | null;\n  activeEntityType?: string | null;\n  schoolId?: string | null;\n  primaryCapacity?: string | null;\n  cedarSnapshotLoaded: boolean;\n  entitlementManifestLoaded: boolean;\n  entitlementReadiness?: EntitlementReadiness;\n  citizenship: CitizenshipLevel;\n  entitlement: EntitlementSnapshot;\n  cedarDecision: 'allow' | 'deny' | 'no_decision';\n  cedarPolicy?: string;\n  flagActive: boolean;\n  flagKey: string;\n  flagType: 'operational' | 'release' | 'development' | 'beta' | 'experiment';\n}\n\nexport function isFeatureAccessContextReady(ctx: FeatureAccessContext): boolean {\n  const entitlementReady = ctx.entitlementReadiness\n    ? ctx.entitlementReadiness === 'verified' || ctx.entitlementReadiness === 'cached'\n    : ctx.entitlementManifestLoaded;\n\n  return ctx.cedarSnapshotLoaded && entitlementReady;\n}\n","layer":1,"isBedrock":false,"downstreamCount":2,"upstreamCount":1},{"path":"packages/core/src/logic/permissions/baselineCapabilities.ts","name":"baselineCapabilities.ts","dir":"packages/core/src/logic/permissions","loc":47,"fns":[{"name":"isOnDeviceSelfCapability","isExported":true,"params":"action: Action | string, subject: string"},{"name":"isBaselineReadCapability","isExported":true,"params":"action: Action | string, subject: string"},{"name":"isLocalOnlyMutation","isExported":true,"params":"action: Action | string, subject: string"}],"interfaces":[],"types":[],"constants":[],"imports":[{"source":"@repo/core/types/authorization","canonical":"packages/core/src/types/authorization.ts","isTypeOnly":true,"symbols":["Action"]}],"content":"import type { Action } from '@repo/core/types/authorization';\n\n/**\n * Read-only surfaces that remain useful while remote capability state hydrates.\n *\n * This is presentation policy only. It does not authorize writes or replace\n * server-side Cedar checks for protected data operations.\n */\nconst BASELINE_READ_SUBJECTS: ReadonlySet<string> = new Set([\n  'SelfJourney',\n  'InnerPulse',\n  'SelfCare',\n  'SelfReflection',\n  'CommunityFeed',\n  'CommunityGroups',\n  'CommunityPost',\n  'Library',\n  'LibraryResource',\n  'LibrarySearch',\n  'PublicLibrary',\n]);\n\nconst LOCAL_ONLY_MUTATION_SUBJECTS: ReadonlySet<string> = new Set([\n  'SelfJourney',\n  'InnerPulse',\n  'SelfCare',\n  'SelfReflection',\n]);\n\n/** Self work that stays on the person's device. Anything reaching the server still needs Cedar. */\nexport function isOnDeviceSelfCapability(action: Action | string, subject: string) {\n  return (\n    ['read', 'create', 'update', 'delete'].includes(action) &&\n    LOCAL_ONLY_MUTATION_SUBJECTS.has(subject)\n  );\n}\n\nexport function isBaselineReadCapability(action: Action | string, subject: string) {\n  return action === 'read' && BASELINE_READ_SUBJECTS.has(subject);\n}\n\nexport function isLocalOnlyMutation(action: Action | string, subject: string) {\n  return (\n    ['create', 'update', 'delete'].includes(action) && LOCAL_ONLY_MUTATION_SUBJECTS.has(subject)\n  );\n}\n","layer":1,"isBedrock":false,"downstreamCount":1,"upstreamCount":1},{"path":"packages/core/src/logic/registry/citizenship.ts","name":"citizenship.ts","dir":"packages/core/src/logic/registry","loc":54,"fns":[{"name":"meetsCitizenship","isExported":true,"params":"userCitizenship: CitizenshipLevel,\n  required: CitizenshipLevel,"},{"name":"citizenshipName","isExported":true,"params":"level: CitizenshipLevel"}],"interfaces":[],"types":[{"name":"CitizenshipLevel","isExported":true},{"name":"CitizenshipName","isExported":true}],"constants":[{"name":"CITIZENSHIP","isExported":true},{"name":"entry","isExported":false}],"imports":[],"content":"/**\n * Citizenship model — registration depth, not pricing.\n *\n * FIRST_CLASS  = 1  Highest access. Bonded to a real school entity.\n * SECOND_CLASS = 2  Authenticated personal-use registration.\n * THIRD_CLASS  = 3  Lowest authenticated registration level.\n *\n * There is no guest citizenship. The persisted WANDERER value is a legacy\n * alias normalized to THIRD_CLASS during context hydration/migration.\n *\n * Lower number = more access.\n * Never write the comparison inline — always call meetsCitizenship().\n */\n\nexport const CITIZENSHIP = {\n  FIRST_CLASS: 1,\n  SECOND_CLASS: 2,\n  THIRD_CLASS: 3,\n} as const;\n\nexport type CitizenshipLevel = (typeof CITIZENSHIP)[keyof typeof CITIZENSHIP];\n// resolves to: 1 | 2 | 3\n\nexport type CitizenshipName = keyof typeof CITIZENSHIP;\n// resolves to: 'FIRST_CLASS' | 'SECOND_CLASS' | 'THIRD_CLASS'\n\n/**\n * meetsCitizenship — the only place the comparison is written.\n *\n * Returns true if the user's citizenship level is sufficient\n * for the required level.\n *\n * Examples:\n *   meetsCitizenship(1, 1) → true   (First Class meets First Class req)\n *   meetsCitizenship(2, 1) → false  (Second Class does not meet First Class req)\n *   meetsCitizenship(3, 3) → true   (Third Class meets Third Class req)\n *   meetsCitizenship(1, 3) → true   (First Class meets any requirement)\n */\nexport function meetsCitizenship(\n  userCitizenship: CitizenshipLevel,\n  required: CitizenshipLevel,\n): boolean {\n  return userCitizenship <= required;\n}\n\n/**\n * citizenshipName — readable name for display and logging.\n */\nexport function citizenshipName(level: CitizenshipLevel): CitizenshipName {\n  const entry = Object.entries(CITIZENSHIP).find(([, v]) => v === level);\n  if (!entry) throw new Error(`Unknown citizenship level: ${level}`);\n  return entry[0] as CitizenshipName;\n}\n","layer":0,"isBedrock":true,"downstreamCount":0,"upstreamCount":3},{"path":"packages/core/src/logic/registry/domainEntry.ts","name":"domainEntry.ts","dir":"packages/core/src/logic/registry","loc":306,"fns":[{"name":"defineFeatureLifecycle","isExported":true,"params":"lifecycle: FeatureLifecycle"}],"interfaces":[],"types":[{"name":"DomainEntry","isExported":true},{"name":"ChannelAffordance","isExported":true},{"name":"FeatureState","isExported":true},{"name":"FeatureFlagClass","isExported":true},{"name":"FeatureLifecycle","isExported":true},{"name":"TabDomain","isExported":true},{"name":"WorkspaceRolePersona","isExported":true},{"name":"FeatureLifecycleStage","isExported":true},{"name":"ScreenSequenceStep","isExported":true},{"name":"SensoryFeedbackProfile","isExported":true},{"name":"FeatureJourneySpec","isExported":true},{"name":"FlowTrigger","isExported":true},{"name":"FlowFallbackCondition","isExported":true},{"name":"FlowFallbackEdge","isExported":true},{"name":"FlowNodeStep","isExported":true},{"name":"FeatureJTBDGraph","isExported":true}],"constants":[{"name":"FeatureStateSchema","isExported":true},{"name":"FeatureFlagClassSchema","isExported":true},{"name":"FeatureLifecycleSchema","isExported":true},{"name":"CitizenshipLevelSchema","isExported":true},{"name":"TabDomainSchema","isExported":true},{"name":"WorkspaceRolePersonaSchema","isExported":true},{"name":"FeatureLifecycleStageSchema","isExported":true},{"name":"ScreenSequenceStepSchema","isExported":true},{"name":"SensoryFeedbackProfileSchema","isExported":true},{"name":"FeatureJourneySchema","isExported":true},{"name":"FlowTriggerSchema","isExported":true},{"name":"FlowFallbackConditionSchema","isExported":true},{"name":"FlowFallbackEdgeSchema","isExported":true},{"name":"FlowNodeStepSchema","isExported":true},{"name":"JourneyPilotSchema","isExported":true},{"name":"FeatureJTBDGraphSchema","isExported":true},{"name":"ChannelAffordanceSchema","isExported":true},{"name":"DomainEntrySchema","isExported":true}],"imports":[{"source":"@repo/core/logic/registry/citizenship","canonical":"packages/core/src/logic/registry/citizenship.ts","isTypeOnly":false,"symbols":["CITIZENSHIP"]}],"content":"import { CITIZENSHIP } from '@repo/core/logic/registry/citizenship';\nimport { z } from 'zod';\n\n/**\n * DomainEntry — the canonical definition of one domain/tab/surface\n * in the Gurudevi app.\n *\n * Each domain package defines its own entries conforming to this type.\n * The AppCatalog assembles them all at boot.\n *\n * Rules:\n * - Never put gate logic here. Declare requirements only.\n * - Never check isPro, pricing_tier, or capacity here.\n * - Never import from ports or store here. Pure data.\n */\n\nexport const FeatureStateSchema = z.enum([\n  'development', // not shipped to any user\n  'beta', // early access, opt-in rollout\n  'live', // fully shipped and stable\n  'deprecated', // being phased out\n]);\n\nexport const FeatureFlagClassSchema = z.enum(['release', 'experiment', 'beta', 'operational']);\n\nexport const FeatureLifecycleSchema = z\n  .object({\n    owner: z.string().min(1),\n    createdAt: z.iso.date(),\n    reviewAt: z.iso.date(),\n    removalTarget: z.iso.date().optional(),\n    permanentJustification: z.string().min(1).optional(),\n    flagClass: FeatureFlagClassSchema.optional(),\n  })\n  .refine(({ removalTarget, permanentJustification }) => removalTarget || permanentJustification, {\n    message: 'Lifecycle metadata requires a removalTarget or permanentJustification.',\n  });\n\nexport function defineFeatureLifecycle(lifecycle: FeatureLifecycle): FeatureLifecycle {\n  return FeatureLifecycleSchema.parse(lifecycle);\n}\n\nexport const CitizenshipLevelSchema = z.union([\n  z.literal(CITIZENSHIP.FIRST_CLASS),\n  z.literal(CITIZENSHIP.SECOND_CLASS),\n  z.literal(CITIZENSHIP.THIRD_CLASS),\n]);\n\nexport const TabDomainSchema = z.enum(['self', 'workspace', 'community', 'library', 'profile']);\n\nexport const WorkspaceRolePersonaSchema = z.enum([\n  'founder',\n  'principal',\n  'assistantPrincipal',\n  'sectionHead',\n  'gradeHead',\n  'teacher',\n  'student',\n  'guardian',\n  'parent',\n  'developer',\n]);\n\nexport const FeatureLifecycleStageSchema = z.enum([\n  'day_0_onboarding',\n  'daily_circadian',\n  'mastery_governance',\n]);\n\nexport const ScreenSequenceStepSchema = z.object({\n  step: z.number().int().nonnegative(),\n  screenId: z.string(),\n  route: z.string(),\n  title: z.string(),\n  purpose: z.enum(['on_ramp', 'primary_action', 'sub_detail', 'feedback_completion']),\n  fallbackRoute: z.string().optional(),\n});\n\nexport const SensoryFeedbackProfileSchema = z.object({\n  tutiiMode: z.enum(['guiding', 'celebrating', 'resting', 'somatic_calm', 'alert']),\n  tutiiRole: z.enum(['guide', 'companion', 'sentinel']).optional(),\n  haptic: z.enum(['light', 'medium', 'success', 'warning', 'selection']),\n  soundChime: z.enum(['arrival', 'celebration', 'pulse', 'subtle_tap']).optional(),\n  scaffoldDismissalKey: z.string().optional(),\n  scaffoldThreshold: z.number().int().positive().optional(),\n});\n\nexport const FeatureJourneySchema = z.object({\n  featureId: z.string(),\n  targetPersonas: z.array(WorkspaceRolePersonaSchema),\n  stage: FeatureLifecycleStageSchema,\n  entryRoute: z.string(),\n  sequence: z.array(ScreenSequenceStepSchema),\n  feedback: SensoryFeedbackProfileSchema,\n});\n\nexport const FlowTriggerSchema = z.discriminatedUnion('type', [\n  z.object({\n    type: z.literal('deep_link'),\n    urlPattern: z.string().min(1),\n  }),\n  z.object({\n    type: z.literal('tab_navigation'),\n    tab: TabDomainSchema,\n    floor: z.string().min(1),\n  }),\n  z.object({\n    type: z.literal('dashboard_action'),\n    buttonId: z.string().min(1),\n    surfaceId: z.string().optional(),\n  }),\n  z.object({\n    type: z.literal('push_notification'),\n    category: z.string().min(1),\n    payloadKey: z.string().optional(),\n  }),\n  z.object({\n    type: z.literal('scaffold_onboarding'),\n    dayStage: FeatureLifecycleStageSchema,\n  }),\n]);\n\nexport const FlowFallbackConditionSchema = z.enum([\n  'offline_no_cache',\n  'permission_denied',\n  'prerequisite_missing',\n  'account_unlinked',\n  'server_503',\n  'feature_disabled',\n]);\n\nexport const FlowFallbackEdgeSchema = z.object({\n  condition: FlowFallbackConditionSchema,\n  fallbackScreenId: z.string().min(1),\n  fallbackRoute: z.string().min(1),\n  guidancePrompt: z.string().min(1),\n  recoveryAction: z.enum([\n    'retry',\n    'switch_role',\n    'open_demo_sandbox',\n    'link_account',\n    'view_cached',\n  ]),\n});\n\nexport const FlowNodeStepSchema = z.object({\n  stepId: z.string().min(1),\n  title: z.string().min(1),\n  purpose: z.enum([\n    'on_ramp',\n    'input_form',\n    'preview_confirm',\n    'sub_detail',\n    'terminal_success',\n  ]),\n  mobileRoute: z.string().min(1),\n  webRoute: z.string().min(1),\n  primaryAction: z.string().min(1),\n  fallbacks: z.array(FlowFallbackEdgeSchema).default([]),\n});\n\n// Product contract and traceability metadata; these declarations do not grant authority.\nexport const JourneyPilotSchema = z.object({\n  status: z.enum(['proposed', 'implemented']),\n  intent: z.string().min(1),\n  developmentContext: z.object({\n    mode: z.enum(['greenfield', 'brownfield', 'mixed']),\n    existingBehavior: z.array(z.string().min(1)),\n    integrationPoints: z.array(z.object({ reference: z.string().min(1), role: z.string().min(1) })),\n    invariants: z.array(z.string().min(1)).min(1),\n    openQuestions: z.array(z.string().min(1)),\n  }).optional(),\n  entryStep: z.string().min(1),\n  steps: z.array(z.object({\n    id: z.string().min(1),\n    title: z.string().min(1),\n    interaction: z.string().min(1),\n    terminal: z.boolean(),\n  })).min(1),\n  transitions: z.array(z.object({\n    id: z.string().min(1),\n    from: z.string().min(1),\n    to: z.string().min(1),\n    action: z.string().min(1),\n    feedback: z.string().min(1),\n  })).min(1),\n  scenarios: z.array(z.object({\n    id: z.string().min(1),\n    title: z.string().min(1),\n    transitions: z.array(z.string().min(1)).min(1),\n    evidence: z.array(z.object({ reference: z.string().min(1), tier: z.string().min(1) })),\n  })).min(1),\n  bindings: z.array(z.object({\n    kind: z.enum(['web', 'mobile', 'api', 'data', 'authorization']),\n    status: z.enum(['unknown', 'planned', 'implemented', 'verified']),\n    reference: z.string().min(1).optional(),\n    note: z.string().min(1),\n  })).min(1),\n});\n\nexport const FeatureJTBDGraphSchema = z.object({\n  featureId: z.string().min(1),\n  jobTitle: z.string().min(1),\n  jobStory: z.string().min(1),\n  targetPersonas: z.array(WorkspaceRolePersonaSchema).min(1),\n  lifecycleStage: FeatureLifecycleStageSchema,\n  triggers: z.array(FlowTriggerSchema).min(1),\n  nodes: z.array(FlowNodeStepSchema).min(1),\n  completion: z.object({\n    sensoryProfile: SensoryFeedbackProfileSchema,\n    nextCircadianRoute: z.string().min(1),\n    scaffoldDismissalKey: z.string().optional(),\n  }),\n  journeyPilot: JourneyPilotSchema.optional(),\n});\n\nexport const ChannelAffordanceSchema = z.object({\n  web: z.boolean().default(true),\n  mobile: z.boolean().default(true),\n  whatsapp: z\n    .object({\n      intent: z.string(),\n      requiresApproval: z.boolean().default(true),\n    })\n    .optional(),\n  agent_mcp: z\n    .object({\n      toolName: z.string(),\n      readOnly: z.boolean().default(false),\n    })\n    .optional(),\n});\n\nexport const DomainEntrySchema = z.object({\n  // ── Identity ────────────────────────── uuid().nullable().optional(),\n    membership_id: z.uuid().nullable().optional(),\n    citizenship: z.string().optional(),\n    message: z.string().optional(),\n  })\n  .catchall(z.unknown());\n\nexport type SchoolJoinApproval = z.infer<typeof SchoolJoinApprovalSchema>;\n\nconst normalizePerspectiveInput = (value: unknown) => {\n  if (!value || typeof value !== 'object') return value;\n  const input = value as Record<string, unknown>;\n\n  return {\n    ...input,\n    activeBond: input.activeBond ?? null,\n    availableBonds: input.availableBonds ?? [],\n  };\n};\n\nexport const PerspectiveSchema = z.preprocess(\n  normalizePerspectiveInput,\n  z.object({\n    activeBond: BondSchema.nullable(),\n    availableBonds: z.array(BondSchema),\n  }),\n);\n\nexport type Perspective = z.infer<typeof PerspectiveSchema>;\n","layer":1,"isBedrock":false,"downstreamCount":1,"upstreamCount":1},{"path":"packages/core/src/lib/authProfileStorage.ts","name":"authProfileStorage.ts","dir":"packages/core/src/lib","loc":114,"fns":[{"name":"isRecord","isExported":false,"params":"value: unknown"},{"name":"isProfile","isExported":false,"params":"value: unknown"},{"name":"restoreIdentityProfile","isExported":true,"params":"value: unknown"},{"name":"retainLegacyProfile","isExported":false,"params":"name: string, raw: string"},{"name":"migrateLegacyExplorer","isExported":false,"params":"legacy: unknown"}],"interfaces":[],"types":[],"constants":[{"name":"candidate","isExported":false},{"name":"backup","isExported":false},{"name":"retained","isExported":false},{"name":"key","isExported":false},{"name":"migrated","isExported":false},{"name":"authProfileStorage","isExported":true},{"name":"generation","isExported":false},{"name":"raw","isExported":false},{"name":"pending","isExported":false}],"imports":[{"source":"@repo/core/lib/accountScope","canonical":"packages/core/src/lib/accountScope.ts","isTypeOnly":false,"symbols":["scopeStorageKey"]},{"source":"@repo/core/lib/experienceState","canonical":"p
