<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sanctuary Code-ERD Explorer</title>
  <style>
    :root {
      --bg: #090d16;
      --panel-bg: #111827;
      --card-bg: #1e293b;
      --card-header: #334155;
      --border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --fn: #60a5fa;
      --type: #c084fc;
      --const: #34d399;
      --bedrock: #10b981;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #sidebar {
      width: 380px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    #sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    #sidebar-header h2 {
      margin: 0 0 6px 0;
      font-size: 17px;
      color: var(--accent);
    }
    #sidebar-header p {
      margin: 0 0 12px 0;
      font-size: 12px;
      color: var(--text-muted);
    }
    #search-box {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    #search-box:focus { border-color: var(--accent); }
    #file-tree {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .tree-item {
      padding: 8px 12px;
      border-radius: 6px;
      background: #1e293b;
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s;
    }
    .tree-item:hover {
      background: #283548;
      border-color: #475569;
    }
    .tree-item.active {
      background: #1e3a5f;
      border-color: var(--accent);
    }
    .tree-name {
      font-size: 13px;
      font-weight: 500;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }
    .tree-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #94a3b8;
    }
    .tree-badge.bedrock {
      background: rgba(16, 185, 129, 0.15);
      border-color: #10b981;
      color: #34d399;
      font-weight: 600;
    }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #111a2e 0%, #090d16 100%);
    }
    #main-toolbar {
      padding: 12px 24px;
      background: rgba(17, 24, 39, 0.85);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    .btn {
      background: #1e293b;
      border: 1px solid var(--border);
      color: #f1f5f9;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn:hover {
      background: #334155;
      border-color: var(--accent);
    }
    .btn.active {
      background: var(--accent);
      color: #090d16;
      font-weight: 600;
    }

    #workspace {
      flex: 1;
      overflow: auto;
      padding: 32px;
      display: flex;
      gap: 32px;
      align-items: flex-start;
    }

    /* Code-ERD Table Box */
    .erd-table {
      width: 360px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
      transition: all 0.2s ease;
    }
    .erd-table.focused {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.4), 0 12px 32px rgba(0,0,0,0.7);
      transform: scale(1.02);
    }
    .erd-table.upstream-highlight {
      border-color: #f59e0b;
      box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.4);
    }
    .erd-table.downstream-highlight {
      border-color: #10b981;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.4);
    }
    .erd-header {
      padding: 12px 16px;
      background: var(--card-header);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .erd-title {
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
    }
    .erd-layer {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #0f172a;
      border: 1px solid #475569;
      color: #38bdf8;
    }
    .erd-section {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.5);
    }
    .erd-section-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .erd-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      cursor: pointer;
    }
    .erd-row:hover { background: #1e293b; }
    .erd-row.fn { color: var(--fn); }
    .erd-row.type { color: var(--type); }
    .erd-row.const { color: var(--const); }
    .erd-row-badge {
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 3px;
      background: #0f172a;
      color: #64748b;
    }

    #trace-panel {
      position: absolute;
      bottom: 24px;
      left: 404px;
      right: 24px;
      background: rgba(17, 24, 39, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: none;
      z-index: 50;
    }
    #trace-panel h4 {
      margin: 0 0 8px 0;
      color: var(--accent);
      font-size: 14px;
    }
    .trace-flow {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      font-size: 12px;
    }
    .trace-step {
      background: #1e293b;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .trace-arrow { color: #64748b; font-weight: bold; }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="sidebar-header">
      <h2>Sanctuary Code-ERD</h2>
      <p>Select any file to inspect its internal columns (functions/types) and trace relations to bedrock.</p>
      <input type="text" id="search-box" placeholder="Search file, function, or type..." oninput="filterTree()">
    </div>
    <div id="file-tree"></div>
  </div>

  <div id="main">
    <div id="main-toolbar">
      <div id="current-file-label" style="font-size: 14px; font-weight: 600; color: #f1f5f9">
        Select a file from the sidebar
      </div>
      <div class="btn-group">
        <button class="btn" onclick="traceBedrock()">⚡ Trace to Bedrock (Downstream)</button>
        <button class="btn" onclick="traceUpstream()">🚀 Trace Callers (Upstream)</button>
        <button class="btn" onclick="clearHighlights()">Clear Filter</button>
      </div>
    </div>

    <div id="workspace"></div>

    <div id="trace-panel">
      <button style="float: right; background: transparent; border: none; color: #94a3b8; font-size: 16px; cursor: pointer" onclick="document.getElementById('trace-panel').style.display='none'">✕</button>
      <h4 id="trace-title">Lineage Trace</h4>
      <div class="trace-flow" id="trace-flow-content"></div>
    </div>
  </div>

SE_URL and EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY',\n    );\n  }\n}\n\nassertSecureApiUrl(supabaseUrl);\n\nconst supabaseOptions: any = {\n  auth: {\n    storage: supabaseAuthStorage,\n    autoRefreshToken: true,\n    persistSession: true,\n    detectSessionInUrl: typeof globalThis.window !== 'undefined',\n  },\n  global: {\n    fetch: (url: Parameters<typeof fetch>[0], options?: Parameters<typeof fetch>[1]) => {\n      const sanitizedUrl = sanitizeSupabaseUrl(url);\n      return secureApiFetch(sanitizedUrl, options);\n    },\n  },\n};\n\n/** Canonical client owned by the Supabase adapter boundary. */\nexport const supabaseClient = createClient(supabaseUrl, supabasePublishableKey, supabaseOptions);\n","layer":2,"isBedrock":false,"downstreamCount":2,"upstreamCount":2},{"path":"packages/core/src/api/highways.ts","name":"highways.ts","dir":"packages/core/src/api","loc":77,"fns":[{"name":"assertHighway","isExported":true,"params":"ruleName: string, actual: DataHighway"},{"name":"assertPowerSyncBootstrapReady","isExported":true,"params":""}],"interfaces":[],"types":[{"name":"DataHighway","isExported":true},{"name":"DataHighwayRule","isExported":true}],"constants":[{"name":"rule","isExported":false}],"imports":[],"content":"export type DataHighway = 'direct-api' | 'power-sync' | 'local-first';\n\nexport type DataHighwayRule = {\n  highway: DataHighway;\n  reason: string;\n  failLoudly?: boolean;\n};\n\nexport const DATA_HIGHWAYS: Record<string, DataHighwayRule> = {\n  identity_bootstrap: {\n    highway: 'direct-api',\n    reason:\n      'Session identity and onboarding gating should resolve directly from the authoritative API.',\n    failLoudly: true,\n  },\n  auth_session: {\n    highway: 'direct-api',\n    reason: 'Auth/session bootstrap must remain simple and deterministic across web and mobile.',\n    failLoudly: true,\n  },\n  workspace_sync: {\n    highway: 'power-sync',\n    reason: 'Workspace, classroom, and other replicated app data can benefit from offline sync.',\n  },\n  offline_queue: {\n    highway: 'local-first',\n    reason: 'Optimistic writes and deferred mutations need a local-first queue.',\n  },\n  profile_core: {\n    highway: 'direct-api',\n    reason: 'Profile updates used for onboarding and routing should stay authoritative and loud.',\n    failLoudly: true,\n  },\n  principal_notes_core: {\n    highway: 'direct-api',\n    reason:\n      'Principal notes are private authoritative records and must not bypass server authorization.',\n    failLoudly: true,\n  },\n  messaging_core: {\n    highway: 'direct-api',\n    reason: 'Private messages must use the server-owned participant and authorization boundary.',\n    failLoudly: true,\n  },\n  announcements_core: {\n    highway: 'direct-api',\n    reason: 'School announcements require server-side school scope and author derivation.',\n    failLoudly: true,\n  },\n  social_core: {\n    highway: 'direct-api',\n    reason: 'Notifications and safety controls require server-side user ownership checks.',\n    failLoudly: true,\n  },\n};\n\nexport function assertHighway(ruleName: string, actual: DataHighway) {\n  const rule = DATA_HIGHWAYS[ruleName];\n  if (!rule) return;\n\n  if (rule.highway !== actual && rule.failLoudly) {\n    throw new Error(\n      `[DataHighway] \"${ruleName}\" must use \"${rule.highway}\" but received \"${actual}\". ${rule.reason}`,\n    );\n  }\n}\n\nexport function assertPowerSyncBootstrapReady() {\n  // Hermes exposes `window` on React Native, but only browser runtimes provide\n  // `document`. Keep this guard scoped to actual web bootstrap.\n  if (typeof window === 'undefined' || typeof document === 'undefined') return;\n\n  throw new Error(\n    'PowerSync bootstrap guard: browser code touched PowerSync before the app was ready. Use the direct API highway for bootstrap and identity, and only enter PowerSync after the runtime is intentionally registered.',\n  );\n}\n","layer":0,"isBedrock":true,"downstreamCount":0,"upstreamCount":1},{"path":"packa teSchema,\n  real_class_count: z.number().int().nonnegative(),\n  profile: FacetedProfileSchema,\n});\n\nexport const ScopeBootstrapSchema = z.strictObject({\n  version: z.literal(1),\n  userId: CanonicalAccountIdSchema.nullable(),\n  name: z.string(),\n  primaryCapacity: z.string().nullable(),\n  selection: z.enum(['selected', 'needs_selection']),\n  activeScope: z\n    .strictObject({\n      bondId: z.uuid(),\n      entityId: z.string(),\n      entityType: z.string(),\n      roles: z.array(z.string()).min(1),\n    })\n    .nullable(),\n});\n\nconst BootstrapBondSchema = z.strictObject({\n  id: z.uuid(),\n  user_id: CanonicalAccountIdSchema,\n  entity_id: z.string(),\n  entity_type: z.enum([\n    'PLATFORM',\n    'SCHOOL',\n    'CLASSROOM',\n    'COMMUNITY',\n    'GROUP',\n    'PERSONAL',\n    'PERSONAL_CLASSROOM',\n  ]),\n  capacity: z.string(),\n  status: z.literal('active'),\n});\n\nexport const IdentityBootstrapSchema = IdentitySchema.omit({\n  id: true,\n  activeBond: true,\n  availableBonds: true,\n}).extend({\n  id: z.union([CanonicalAccountIdSchema, z.literal('anonymous')]),\n  activeBond: BootstrapBondSchema.nullable().optional(),\n  availableBonds: z.array(BootstrapBondSchema),\n  scopeBootstrap: ScopeBootstrapSchema,\n});\n\nexport type ScopeBootstrap = z.infer<typeof ScopeBootstrapSchema>;\n\nexport const CapabilityBootstrapSchema = z.strictObject({\n  schemaVersion: z.literal(1),\n  subjectId: CanonicalAccountIdSchema,\n  generatedAt: z.iso.datetime(),\n  expiresAt: z.iso.datetime(),\n  scopeBootstrap: ScopeBootstrapSchema,\n  features: z.array(\n    z.strictObject({\n      id: z.string().min(1),\n      status: z.enum(['available', 'locked', 'unavailable']),\n      reason: z.enum([\n        'available',\n        'scope_required',\n        'authorization_denied',\n        'authorization_unavailable',\n      ]),\n      allowedOperations: z.array(z.enum(['read', 'create'])),\n      storagePolicy: z.enum(['cloud', 'local-only']),\n      taskPolicy: z.enum(['single', 'modal']),\n    }),\n  ),\n});\n\nconst userAuthority = (action: 'resolve' | 'read' | 'update') =>\n  ({\n    policy: { action, subject: 'User' },\n  }) as const;\n\nexport const identityORPCContract = {\n  identifyActiveCitizen: {\n    method: 'get',\n    path: '/identity/resolveIdentity',\n    request: {},\n    responses: {\n      200: {\n        schema: IdentityBootstrapSchema,\n        description: 'Resolve identity and remembered scope',\n      },\n    },\n    metadata: userAuthority('resolve'),\n  },\n\n  fetchUserProfile: {\n    method: 'get',\n    path: '/identity/profile/:id',\n    request: { params: z.object({ id: CanonicalAccountIdSchema }) },\n    responses: {\n      200: { schema: IdentityBootstrapSchema, description: 'Get profile and remembered scope' },\n    },\n    metadata: userAuthority('read'),\n  },\n\n  selectActiveScope: {\n    method: 'put',\n    path: '/identity/active-scope',\n    request: { body: z.strictObject({ bondId: z.uuid() }) },\n    responses: {\n      200: { schema: IdentityBootstrapSchema, description: 'Persist a validated active scope' },\n    },\n    metadata: userAuthority('update'),\n  },\n\n  capabilityBootstrap: {\n    method: 'get',\n    path: '/capabilities/bootstrap/v1',\n    request: {\n      query: z.strictObject({\n        domain: z.enum(['self', 'workspace', 'community', 'library']),\n        platform: z.enum(['browser', 'native']),\n      }),\n    },\n    responses: {\n      200: {\n        schema: CapabilityBootstrapSchema,\n        description: 'Server-computed feature capabilities',\n      },\n    },\n    metadata: userAuthority('resolve'),\n  },\n\n  resolveWorkspaceContext: {\n    method: 'get',\n    path: '/identity/classroom-capacity-summary/:id',\n    request: {\n      params: z.object({ id: z.union([CanonicalAccountIdSchema, z.literal('anonymous')]) }),\n    },\n    responses: {\n      200: { schema: ClassroomCapacitySummarySchema, description: 'Get capacity summary' },\n    },\n    metadata: userAuthority('read'),\n  },\n\n  modifyUserProfile: {\n    method: 'patch',\n    path: '/identity/profile/:id',\n    request: {\n      params: z.object({ id: CanonicalAccountIdSchema }),\n      body: UserProfilePatchSchema,\n    },\n    responses: {\n      200: {\n        schema: IdentityBootstrapSchema,\n        description: 'Update profile and active-scope bootstrap',\n      },\n    },\n    metadata: userAuthority('update'),\n  },\n};\n\nexport type OnboardingState = z.infer<typeof OnboardingStateSchema>;\nexport type ClassroomCapacitySummary = z.infer<typeof ClassroomCapacitySummarySchema>;\n","layer":3,"isBedrock":false,"downstreamCount":3,"upstreamCount":3},{"path":"packages/core/src/api/orpcClient.ts","name":"orpcClient.ts","dir":"packages/core/src/api","loc":178,"fns":[],"interfaces":[{"name":"ClientContext","isExported":true}],"types":[{"name":"ClientRetryPluginContext","isExported":false},{"name":"SessionContinuity","isExported":false},{"name":"ORPCClient","isExported":true},{"name":"SafeORPCClient","isExported":true},{"name":"ORPCUtils","isExported":true}],"constants":[{"name":"originalToJSON","isExported":false},{"name":"json","isExported":false},{"name":"sampleLink","isExported":false},{"name":"codecProto","isExported":false},{"name":"originalDecodeResponse","isExported":false},{"name":"body","isExported":false},{"name":"json","isExported":false},{"name":"error","isExported":false},{"name":"runtimeDevelopmentFlag","isExported":false},{"name":"isDevelopmentRuntime","isExported":false},{"name":"sovereignOrigin","isExported":false},{"name":"link","isExported":false},{"name":"status","isExported":false}],"imports":[{"source":"./appContract","canonical":"packages/core/src/api/appContract.ts","isTypeOnly":true,"symbols":["AppContractClient","SafeAppContractClient"]},{"source":"./base","canonical":"packages/core/src/api/base.ts","isTypeOnly":false,"symbols":["SOVEREIGN_ORPC_URL"]},{"source":"./clientRuntime","canonical":"packages/core/src/api/clientRuntime.ts","isTypeOnly":false,"symbols":["authenticatedSovereignFetch","SessionContinuity"]}],"content":"import {\n  COMMON_ERROR_STATUS_MAP,\n  createORPCClient,\n  createSafeClient,\n  ORPCError,\n  safe,\n} from '@orpc/client';\nimport { RPCLink } from '@orpc/client/fetch';\nimport {\n  BatchLinkPlugin,\n  ClientRetryPlugin,\n  type ClientRetryPluginContext,\n  DedupeRequestsPlugin,\n} from '@orpc/client/plugins';\nimport type { RouterClient } from '@orpc/server';\nimport { createTanstackQueryUtils } from '@orpc/tanstack-query';\nimport type { AppContractClient, SafeAppContractClient } from './appContract';\nimport { SOVEREIGN_ORPC_URL } from './base';\nimport { authenticatedSovereignFetch, type SessionContinuity } from './clientRuntime';\n\n// Bridge ORPCError.prototype.status to COMMON_ERROR_STATUS_MAP for full backwards compatibility\nif (!Object.getOwnPropertyDescriptor(ORPCError.prototype, 'status')) {\n  Object.defineProperty(ORPCError.prototype, 'status', {\n    get(this: any) {\n      return this._status ?? (COMMON_ERROR_STATUS_MAP as Record<string, number>)[this.code] ?? 500;\n    },\n    set(this: any, val: number) {\n      this._status = val;\n      Object.defineProperty(this, 'status', {\n        value: val,\n        writable: true,\n        configurable: true,\n        enumerable: true,\n      });\n    },\n    configurable: true,\n    enumerable: true,\n  });\n\n  const originalToJSON = ORPCError.prototype.toJSON;\n  ORPCError.prototype.toJSON = function (this: any) {\n    const json = originalToJSON.call(this);\n    return {\n      ...json,\n      status: this.status,\n    };\n  };\n}\n\n// Resilient decode for RPCLinkCodec when backend/mocks include status in error json payload\nconst sampleLink = new RPCLink({ url: '/api' });\nconst codecProto = (sampleLink as any).codec?.constructor?.prototype;\nif (codecProto && !codecProto._resilientDecodePatched) {\n  const originalDecodeResponse = codecProto.decodeResponse;\n  codecProto.decodeResponse = async function (response: any, ...args: any[]) {\n    try {\n      return await originalDecodeResponse.call(this, response, ...args);\n    } catch (err: any) {\n      if (err?.name === 'MalformedResponseError') {\n        const body = err.response?.body;\n        const json = body?.json ?? body;\n        if (json && typeof json.code === 'string') {\n          const error = new ORPCError(json.code, {\n            message: json.message,\n            data: json.data,\n          });\n          (error as any).defined = Boolean(json.defined);\n          if (typeof json.status === 'number') {\n            (error as any).status = json.status;\n          } else if (typeof err.response?.status === 'number') {\n            (error as any).status = err.response.status;\n          }\n          return { kind: 'error', error };\n        }\n      }\n      throw err;\n    }\n  };\n  codecProto._resilientDecodePatched = true;\n}\n\nexport interface ClientContext extends ClientRetryPluginContext {\n  expectedAccountId?: string;\n  expectedSession?: SessionContinuity;\n  cache?: RequestCache;\n}\n\nconst runtimeDevelopmentFlag = (\n  globalThis as typeof globalThis & {\n    readonly __DEV__?: boolean;\n  }\n).__DEV__;\nconst isDevelopmentRuntime =\n  runtimeDevelopmentFlag === true || process.env.NODE_ENV === 'development';\n\nconst sovereignOrigin = SOVEREIGN_ORPC_URL.startsWith('http')\n  ? (new URL(SOVEREIGN_ORPC_URL).origin as `http://${string}` | `https://${string}`)\n  : undefined;\n\nconst link = new RPCLink<ClientContext>({\n  origin: sovereignOrigin,\n  url: '/api',\n  method: ({ context }) => {\n    if (context?.cache) {\n      return 'GET';\n    }\n    return 'POST';\n  },\n  plugins: [\n    new ClientRetryPlugin({\n      default: {\n        retry: isDevelopmentRuntime ? 0 : 2,\n        retryDelay: (options) =>\n          options.lastEventRetry ?? Math.min(250 * 2 ** options.attempt, 5000),\n        shouldRetry: (options) => {\n          if (!options.error) return false;\n          const status = (options.error as any)?.status;\n          // Do not retry synthetic offline 503s or non-server errors\n          if (status === 503) return false;\n          return status >= 500 || status === 429 || status === 408;\n        },\n      },\n    }),\n    new DedupeRequestsPlugin({\n      groups: [\n        {\n          condition: ({ context }) => context?.cache === 'force-cache',\n          context: { cache: 'force-cache' },\n        },\n        { condition: () => true, context: {} },\n      ],\n      filter: ({ request, context }) =>\n        request.method === 'GET' &&\n        context?.expectedSession === undefined &&\n        context?.expectedAccountId === undefined,\n    }),\n    new BatchLinkPlugin({\n      filter: ({ context }) =>\n        context?.expectedAccountId === undefined && context?.expectedSession === undefined,\n      groups: [\n        {\n          condition: ({ context }) => context?.cache === 'force-cache',\n          context: { cache: 'force-cache' },\n        },\n        { condition: () => true, context: {} },\n      ],\n    }),\n  ],\n  fetch: async (url, init, { context }) => {\n    return authenticatedSovereignFetch(\n      url,\n      {\n        ...init,\n        cache: context?.expectedSession ? 'no-store' : context?.cache,\n      },\n      context?.expectedAccountId,\n      context?.expectedSession,\n    );\n  },\n});\nexport const orpcClient: AppContractClient = createORPCClient(link) as any;\n\n/**\n * safeClient\n * Modern oRPC v2 functional safe client.\n * Returns Go/Rust-style `[error, data]` tuples instead of throwing unhandled exceptions.\n * Prevents try/catch boilerplate across repositories and components.\n */\nexport const safeClient: SafeAppContractClient = createSafeClient(orpcClient as any) as any;\n\nexport const orpc: any = createTanstackQueryUtils(orpcClient);\n\nexport type ORPCClient = typeof orpcClient;\nexport type SafeORPCClient = typeof safeClient;\nexport type ORPCUtils = typeof orpc;\n\nexport { createSafeClient, safe };\n","layer":9,"isBedrock":false,"downstreamCount":3,"upstreamCount":1},{"path":"packages/core/src/logic/ports/auth.port.ts","name":"auth.port.ts","dir":"packages/core/src/logic/ports","loc":222,"fns":[],"interfaces":[{"name":"AuthUser","isExported":true},{"name":"AuthSession","isExported":true},{"name":"AuthSubscription","isExported":true},{"name":"PasswordChangeConfirmation","isExported":true},{"name":"AuthMfaFactor","isExported":true},{"name":"AccountDeletionRequest","isExported":true},{"name":"AccountLifecycleStatus","isExported":true},{"name":"IAuthPort","isExported":true},{"name":"PhoneOtpRequest","isExported":true},{"name":"PhoneOtpVerification","isExported":true}],"types":[{"name":"AuthChangeEvent","isExported":true}],"constants":[],"imports":[],"content":"export interface AuthUser {\n  id: string;\n  email?: string | null;\n  phone?: string | null;\n  user_metadata?: Record<string, any>;\n  app_metadata?: Record<string, any>;\n  is_anonymous?: boolean | null;\n  created_at?: string;\n}\n\nexport interface AuthSession {\n  access_token: string;\n  refresh_token: string;\n  expires_in?: number;\n  expires_at?: number;\n  token_type?: string;\n  user: AuthUser;\n}\n\nexport type AuthChangeEvent =\n  | 'SIGNED_IN'\n  | 'SIGNED_OUT'\n  | 'USER_UPDATED'\n  | 'USER_DELETED'\n  | 'PASSWORD_RECOVERY'\n  | 'TOKEN_REFRESHED'\n  | 'MFA_CHALLENGE_VERIFIED';\n\nexport interface AuthSubscription {\n  unsubscribe: () => void;\n}\n\nexport interface PasswordChangeConfirmation {\n  currentPassword?: string;\n  nonce?: string;\n  /** Client continuity assertion; never an account selector or provider mutation attribute. */\n  expectedSubject?: string;\n}\n\nexport interface AuthMfaFactor {\n  id: string;\n  friendly_name?: string;\n  factor_type: 'totp' | 'phone' | 'webauthn';\n  status: 'verified' | 'unverified';\n  created_at: string;\n  updated_at: string;\n  last_challenged_at?: string;\n}\n\nexport interface AccountDeletionRequest {\n  status: 'pending_verification' | 'scheduled' | 'cancelled' | 'completed' | 'blocked';\n  request_id: string | null;\n  requested_at: string | null;\n  scheduled_for?: string | null;\n  reason: string;\n}\n\nexport interface AccountLifecycleStatus {\n  status:\n    | 'active'\n    | 'pending_verification'\n    | 'scheduled'\n    | 'deactivated'\n    | 'cancelled'\n    | 'completed'\n    | 'blocked';\n  deactivated_at: string | null;\n  request_id: string | null;\n  scheduled_for: string | null;\n  reason: string;\n}\n\nexport interface IAuthPort {\n  getSession(): Promise<AuthSession | null>;\n  getUser(): Promise<AuthUser | null>;\n\n  onAuthStateChange(\n    callback: (event: AuthChangeEvent, session: AuthSession | null) => void | Promise<void>,\n  ): { data: { subscription: AuthSubscription } };\n\n  signInWithPassword(\n    email: string,\n    password: string,\n  ): Promise<{ user: AuthUser | null; session: AuthSession | null }>;\n\n  signInWithOAuth(params: {\n    provider: 'google';\n    redirectTo?: string;\n    skipBrowserRedirect?: boolean;\n  }): Promise<{ url: string | null }>;\n\n  linkOAuthIdentity(params: {\n    provider: 'google';\n    redirectTo?: string;\n    skipBrowserRedirect?: boolean;\n  }): Promise<{ url: string | null }>;\n\n  /**\n   * Native Google Sign-In (One Tap / Credential Manager / iOS Google SDK).\n   * Exchanges an idToken (minted by the native Google SDK) for a Supabase session.\n   * Used when there is no existing session to link against.\n   */\n  signInWithGoogleIdToken(params: {\n    idToken: string;\n    accessToken?: string | null;\n  }): Promise<{ user: AuthUser | null; session: AuthSession | null }>;\n\n  /**\n   * Native Google Sign-In (One Tap / Credential Manager / iOS Google SDK).\n   * Links the Google identity to the *current* session (used to preserve an\n   * anonymous guest identity when a guest signs in with Google).\n   */\n  linkGoogleIdentity(params: {\n    idToken: string;\n    accessToken?: string | null;\n  }): Promise<{ user: AuthUser | null; session: AuthSession | null }>;\n\n  /**\n   * Sends a Supabase magic-link email. The link deep-redirects back into the app\n   * where the returned `code` is exchanged via `exchangeCodeForSession`.\n   */\n  signInWithMagicLink(\n    email: string,\n  ): Promise<{ user: AuthUser | null; session: AuthSession | null }>;\n\n  /** Sends a recovery link; the password is changed only after that link opens a recovery session. */\n  resetPasswordForEmail(email: string, redirectTo?: string): Promise<void>;\n\n  requestPasswordReauthentication(): Promise<void>;\n\n  unlinkIdentity(params: {\n    identityId: string;\n    expectedSubject?: string;\n  }): Promise<{ user: AuthUser | null }>;\n\n  signInWithPhoneOtp(params: PhoneOtpRequest): Promise<void>;\n\n  verifyPhoneOtp(params: PhoneOtpVerification): Promise<{\n    user: AuthUser;\n    session: AuthSession;\n  }>;\n\n  /**\n   * Exchanges a PKCE `code` (from a magic-link deep link) for a session.\n   */\n  exchangeCodeForSession(\n    code: string,\n  ): Promise<{ user: AuthUser | null; session: AuthSession | null }>;\n\n  signInWithPasskey(params?: {\n    redirectTo?: string;\n    skipBrowserRedirect?: boolean;\n  }): Promise<{ url: string | null }>;\n\n  registerPasskey(params?: {\n    redirectTo?: string;\n    skipBrowserRedirect?: boolean;\n  }): Promise<{ url: string | null }>;\n\n  listMfaFactors(): Promise<{ all: AuthMfaFactor[]; verified: AuthMfaFactor[] }>;\n\n  enrollTotp(params?: { friendlyName?: string }): Promise<{\n    factorId: string;\n    qrCode?: string | null;\n    secret?: string | null;\n    uri?: string | null;\n  }>;\n\n  challengeTotp(factorId: string): Promise<{ challengeId: string }>;\n\n  verifyTotp(params: {\n    factorId: string;\n    challengeId: string;\n    code: string;\n  }): Promise<{ user: AuthUser | null; session: AuthSession | null }>;\n\n  challengeAndVerifyTotp(params: {\n    factorId: string;\n    code: string;\n  }): Promise<{ user: AuthUser | null; session: AuthSession | ypeOnly":false,"symbols":["Capacity","CapacitySchema"]}],"content":"import { SafeZustandStorage } from '@repo/core/lib/storageWrapper';\nimport { type Capacity, CapacitySchema } from '@repo/core/logic/schemas/capacity.schema';\n\nconst GUEST_IDENTITY_PREFIX = 'gurudevi:guest-identity:';\n\nexport interface LocalGuestBond {\n  id: string;\n  user_id: string;\n  entity_id: string;\n  entity_type: 'PERSONAL';\n  capacity: string;\n  citizenship: 'THIRD_CLASS';\n  status: 'active';\n}\n\nexport interface LocalGuestIdentity {\n  id: string;\n  email: null;\n  display_name: string;\n  availableBonds: LocalGuestBond[];\n  activeBond: LocalGuestBond | null;\n  onboarding_completed: boolean;\n  citizenship: 'THIRD_CLASS';\n}\n\nexport interface GuestClaimIdentity {\n  displayName: string;\n  capacity: Capacity | null;\n}\n\nfunction key(userId: string) {\n  return `${GUEST_IDENTITY_PREFIX}${userId}`;\n}\n\nfunction initialIdentity(userId: string): LocalGuestIdentity {\n  return {\n    id: userId,\n    email: null,\n    display_name: '',\n    availableBonds: [],\n    activeBond: null,\n    onboarding_completed: false,\n    citizenship: 'THIRD_CLASS',\n  };\n}\n\nexport async function getLocalGuestIdentity(userId: string): Promise<LocalGuestIdentity> {\n  const raw = await SafeZustandStorage.getItem(key(userId));\n  if (!raw) return initialIdentity(userId);\n\n  try {\n    return { ...initialIdentity(userId), ...(JSON.parse(raw) as Partial<LocalGuestIdentity>) };\n  } catch {\n    return initialIdentity(userId);\n  }\n}\n\n/** Extracts the claimable identity facts from the local guest record only. */\nexport function getGuestClaimIdentity(identity: LocalGuestIdentity): GuestClaimIdentity {\n  return {\n    displayName: identity.display_name.trim() || 'Sanctuary User',\n    capacity: CapacitySchema.safeParse(identity.activeBond?.capacity).data ?? null,\n  };\n}\n\nexport async function updateLocalGuestIdentity(\n  userId: string,\n  updates: Partial<LocalGuestIdentity>,\n): Pro ient<InferDomainClient<typeof guardianAssessmentORPCContract>>;\n  identity: SafeDomainClient<InferDomainClient<typeof identityORPCContract>>;\n  library: SafeDomainClient<InferDomainClient<typeof libraryORPCContract>>;\n  mapping: SafeDomainClient<InferDomainClient<typeof mappingORPCContract>>;\n  messaging: SafeDomainClient<InferDomainClient<typeof messagingORPCContract>>;\n  onboarding: SafeDomainClient<InferDomainClient<typeof onboardingORPCContract>>;\n  planBridge: SafeDomainClient<InferDomainClient<typeof planBridgeORPCContract>>;\n  principalNotes: SafeDomainClient<InferDomainClient<typeof principalNotesORPCContract>>;\n  privacy: SafeDomainClient<InferDomainClient<typeof privacyORPCContract>>;\n  profile: SafeDomainClient<InferDomainClient<typeof profileORPCContract>>;\n  rewards: SafeDomainClient<InferDomainClient<typeof rewardsORPCContract>>;\n  social: SafeDomainClient<InferDomainClient<typeof socialORPCContract>>;\n  sync: SafeDomainClient<InferDomainClient<typeof syncORPCContract>>;\n  workspaceProvisioning: SafeDomainClient<\n    InferDomainClient<typeof workspaceProvisioningORPCContract>\n  >;\n} & Record<string, any>;\n\n/**\n * getMinifiedAppContract\n * Strips verbose Zod schema descriptions and validation ASTs from client contracts.\n * Critical scaling constraint: Protects low-memory Android devices (2GB RAM)\n * running the Hermes engine against bytecode bloat and GC pauses.\n */\nexport function getMinifiedAppContract() {\n  return minifyRouterContract(appContract as any);\n}\n","layer":8,"isBedrock":false,"downstreamCount":24,"upstreamCount":1},{"path":"packages/core/src/api/base.ts","name":"base.ts","dir":"packages/core/src/api","loc":65,"fns":[{"name":"ensureSecureUrl","isExported":true,"params":"url: string"}],"interfaces":[],"types":[{"name":"AppType","isExported":true}],"constants":[{"name":"SOVEREIGN_API_PUBLIC_URL","isExported":true},{"name":"localDevelopmentFallbackAllowed","isExported":false},{"name":"SOVEREIGN_API_URL","isExported": ent. Keep both contracts\n * explicit so one transport cannot silently address the other's routes.\n */\nexport const SOVEREIGN_ORPC_URL = SOVEREIGN_API_URL\n  ? SOVEREIGN_API_URL.replace(/\\/+$/, '').endsWith('/api')\n    ? SOVEREIGN_API_URL.replace(/\\/+$/, '')\n    : `${SOVEREIGN_API_URL.replace(/\\/+$/, '')}/api`\n  : '';\n\n/**\n * @deprecated Legacy Hono RPC client factory. Use `orpcClient` from `@repo/core/api/orpcClient`\n * for type-safe, contract-first communication with the Sanctuary API.\n */\nexport const createSovereignClient = <_T = unknown>(url: string): any => {\n  return createSovereignClientRaw(url) as any;\n};\n","layer":2,"isBedrock":false,"downstreamCount":1,"upstreamCount":1},{"path":"packages/core/src/api/clientRuntime.ts","name":"clientRuntime.ts","dir":"packages/core/src/api","loc":173,"fns":[{"name":"registerTokenResolver","isExported":true,"params":"resolver: ("},{"name":"registerActiveBondIdResolver","isExported":true,"params":"resolver: ("},{"name":"setPqcWireEnabled","isExported":true,"params":"enabled: boolean"},{"name":"registerPoaSigner","isExported":true,"params":"signer: (payload: string"},{"name":"assertActiveRequestAccount","isExported":true,"params":"expectedAccountId?: string"},{"name":"authenticatedSovereignFetch","isExported":true,"params":"input: RequestInfo | URL,\n  requestInit?: RequestInit,\n  expectedAccountId?: string,\n  expectedSession?: SessionContinuity,"}],"interfaces":[{"name":"SessionContinuity","isExported":true}],"types":[],"constants":[{"name":"requestUrl","isExported":false},{"name":"headers","isExported":false},{"name":"activeBondId","isExported":false},{"name":"poaSignature","isExported":false},{"name":"method","isExported":false},{"name":"idempotencyKey","isExported":false},{"name":"controller","isExported":false},{"name":"isNetworkFailure","isExported":false}],"imports":[{"source":"@repo/core/lib/accountScope","canonical":"packages/core/src/lib/accountScope.ts","isTypeOnly":false,"symbols":["getActiveAccountId"]},{"source":"./transportSecurity","canonical":"packages/core/src/api/transportSecurity.ts","isTypeOnly":false,"symbols":["assertSecureApiUrl","secureApiFetch"]}],"content":"import { getActiveAccountId } from '@repo/core/lib/accountScope';\nimport { hc } from 'hono/client';\nimport { v7 as uuidv7 } from 'uuid';\nimport { assertSecureApiUrl, secureApiFetch } from './transportSecurity';\n\nlet tokenResolver: (() => Promise<string | null>) | null = null;\nlet activeBondIdResolver: (() => Promise<string | null>) | null = null;\nlet pqcWireEnabled = true;\nlet poaSigner: ((payload: string) => Promise<string | null>) | null = null;\n\nexport interface SessionContinuity {\n  accessToken: string;\n  subject: string;\n}\n\nexport function registerTokenResolver(resolver: () => Promise<string | null>) {\n  tokenResolver = resolver;\n}\n\nexport function registerActiveBondIdResolver(resolver: () => Promise<string | null>) {\n  activeBondIdResolver = resolver;\n}\n\nexport function setPqcWireEnabled(enabled: boolean) {\n  pqcWireEnabled = enabled;\n}\n\nexport function registerPoaSigner(signer: (payload: string) => Promise<string | null>) {\n  poaSigner = signer;\n}\n\nexport function assertActiveRequestAccount(expectedAccountId?: string) {\n  if (expectedAccountId && getActiveAccountId() !== expectedAccountId) {\n    throw Object.assign(new Error('The owning account must remain active for this request.'), {\n      status: 401,\n    });\n  }\n}\n\n/**\n * Applies session and selected-context headers to every first-party API\n * transport. The server treats context as a hint and resolves authority from\n * its own relationship records.\n */\nexport async function authenticatedSovereignFetch(\n  input: RequestInfo | URL,\n  requestInit?: RequestInit,\n  expectedAccountId?: string,\n  expectedSession?: SessionContinuity,\n): Promise<Response> {\n  const requestUrl =\n    typeof input === 'string' || input instanceof URL\n      ? input\n      : typeof Request !== 'undefined' && input instanceof Request\n        ? input.url\n        : String(input);\n  assertSecureApiUrl(requestUrl);\n\n  let token: string | null = null;\n  if (tokenResolver) {\n    try {\n      token = await tokenResolver();\n    } catch {\n      console.warn('[Sovereign Client] Session token retrieval failed.');\n    }\n  }\n\n  const headers = new Headers(requestInit?.headers);\n  if (expectedSession) {\n    if (!token || token !== expectedSession.accessToken)\n      throw Object.assign(new Error('The authenticated session changed before dispatch.'), {\n        status: 401,\n      });\n    headers.set('X-Expected-Auth-Subject', expectedSession.subject);\n  }\n  if (token) headers.set('Authorization', `Bearer ${token}`);\n\n  // Leaning towards Post-Quantum Cryptography (PQC) & Zero-Trust Wire\n  if (pqcWireEnabled) {\n    headers.set('x-pqc-kem', 'ML-KEM-768+X25519');\n    headers.set('x-sovereign-epoch', String(Date.now()));\n  }\n\n  if (activeBondIdResolver) {\n    try {\n      const activeBondId = await activeBondIdResolver();\n      if (activeBondId) headers.set('X-Active-Bond-Id', activeBondId);\n    } catch {\n      console.warn('[Sovereign Client] Active bond context retrieval failed.');\n    }\n  }\n\n  assertActiveRequestAccount(expectedAccountId);\n\n  if (poaSigner && requestInit?.body && typeof requestInit.body === 'string') {\n    try {\n      const poaSignature = await poaSigner(requestInit.body);\n      if (poaSignature) headers.set('x-poa-sig', poaSignature);\n    } catch {\n      console.warn('[Sovereign Client] Proof-of-Authority signing failed.');\n    }\n  }\n\n  const method = (\n    requestInit?.method ?? (input instanceof Request ? input.method : 'GET')\n  ).toUpperCase();\n  if (['POST', 'PUT', 'PATCH', 'DELETE'].includes(method)) {\n    if (!headers.has('Idempotency-Key') && !headers.has('X-Idempotency-Key')) {\n      const idempotencyKey = uuidv7();\n      headers.set('Idempotency-Key', idempotencyKey);\n      headers.set('X-Idempotency-Key nferResponseType } from 'hono/client';\n","layer":1,"isBedrock":false,"downstreamCount":2,"upstreamCount":2},{"path":"packages/core/src/lib/storageWrapper.ts","name":"storageWrapper.ts","dir":"packages/core/src/lib","loc":37,"fns":[{"name":"observePersistenceFailure","isExported":false,"params":"operation: 'write' | 'remove',\n  result: Promise<void>,"}],"interfaces":[],"types":[],"constants":[{"name":"value","isExported":false}],"imports":[{"source":"@repo/core/lib/storage","canonical":"packages/core/src/lib/storage.ts","isTypeOnly":false,"symbols":["storage"]},{"source":"@repo/core/lib/devicePreferences","canonical":"packages/core/src/lib/devicePreferences.ts","isTypeOnly":false,"symbols":["ensureDeviceThemePreference"]}],"content":"import { storage } from '@repo/core/lib/storage';\nimport { ensureDeviceThemePreference } from '@repo/core/lib/devicePreferences';\nimport type { StateStorage } from 'zustand/middleware';\n\nfunction observePersistenceFailure(\n  operation: 'write' | 'remove',\n  result: Promise<void>,\n): Promise<void> {\n  void result.catch((error: unknown) => {\n    console.error(`Storage: Zustand persistence ${operation} failed`, error);\n  });\n  return result;\n}\n\n/**\n * A architecture-compliant storage wrapper for Zustand.\n * It utilizes the Sovereign StorageManager (Adapter Pattern) to ensure\n * persistence works across Web and Native without direct pollution.\n */\nexport const SafeZustandStorage: StateStorage = {\n  getItem: (name: string): string | null | Promise<string | null> => {\n    if (name === 'gurudevi-ui-storage') {\n      return ensureDeviceThemePreference().then(async () => (await storage.getStringAsync(name)) ?? null);\n    }\n    // Attempt sync retrieval (MMKV or Cached AsyncStorage)\n    const value = storage.getString(name);\n    if (value !== undefined) return value;\n\n    // Fallback to async retrieval through the manager\n    return storage.getStringAsync(name).then((v) => v ?? null);\n  },\n  setItem: (name: string, value: string): Promise<void> =>\n    observePersistenceFailure('write', storage.setAsync(name, value)),\n  removeItem: (name: string): Promise<void> =>\n    observePersistenceFailure('remove', storage.deleteAsync(name)),\n};\n","layer":2,"isBedrock":false,"downstreamCount":2,"upstreamCount":1},{"path":"packages/core/src/types/Errors.ts","name":"Errors.ts","dir":"packages/core/src/types","loc":191,"fns":[],"interfaces":[{"name":"ProblemDetails","isExported":true}],"types":[],"constants":[{"name":"isDevelopment","isExported":false}],"imports":[],"content":"/* eslint-disable no-var */\ndeclare var __DEV__: boolean | undefined;\n/* eslint-enable no-var */\n\n/**\n * Sovereign Error Architecture (2026 Standard)\n * -------------------------------------------\n * A tiered error system designed for Security, Observability, and Agentic Actionability.\n */\n\nexport enum ErrorTier {\n  USER = 'USER', // Consumer-facing (Warm, Generic)\n  DEV = 'DEV', // Architect-facing (Verbose, Raw)\n  AGENT = 'AGENT', // AI-facing (Semantic, Structured)\n  SYSTEM = 'SYSTEM', // Log-only (Internal)\n}\n\nexport enum ErrorCategory {\n  VALIDATION = 'VALIDATION',\n  AUTHORIZATION = 'AUTHORIZATION',\n  CITIZENSHIP = 'CITIZENSHIP',\n  NETWORK = 'NETWORK',\n  DATABASE = 'DATABASE',\n  UNKNOWN = 'UNKNOWN',\n}\n\n/**\n * RFC 9457 compliant error structure\n */\nexport interface ProblemDetails {\n  type: string; // URI identifying the error type\n  title: string; // Human-readable summary\n  status: number; // HTTP status code\n  detail?: string; // Safe explanation\n  instance?: string; // Correlation ID\n  category: ErrorCategory;\n  code: string; // Machine-readable code (e.g. CITIZENSHIP_RESTRICTED)\n\n  // Tiered Payloads\n  userMessage?: string; // Warm message for Toasts\n  devDetails?: any; // Stack traces, Schemas (Only in __DEV__)\n  agentAction?: {\n    // Instructions for AI Agents\n    suggestedAction: string;\n    parameters?: Record<string, any>;\n    retryAfter?: number;\n  };\n}\n\nexport class SovereignError extends Error {\n  public readonly details: ProblemDetails;\n  public override readonly cause?: unknown;\n\n  constructor(details: Partial<ProblemDetails>, cause?: unknown) {\n    super(details.title || 'An unexpected error occurred');\n    this.name = 'SovereignError';\n    this.cause = cause ?? details.devDetails;\n\n    this.details = {\n      type: 'https://polymath.network/errors/unknown',\n      title: 'Unknown Error',\n      status: 500,\n      category: ErrorCategory.UNKNOWN,\n      code: 'INTERNAL_ERROR',\n      ...details,\n    };\n\n    const isDevelopment =\n      (typeof __DEV__ !== 'undefined' && __DEV__) ||\n      (typeof process !== 'undefined' && process.env?.NODE_ENV === 'development');\n\n    // Auto-sanitize dev details if not in development\n    if (!isDevelopment) {\n      delete this.details.devDetails;\n    }\n  }\n\n  /**\n   * Factory for Validation Errors (Zod integration)\n   */\n  static validation(detail: string, issues?: any): SovereignError {\n    return new SovereignError({\n      title: 'Validation Failed',\n      detail,\n      status: 400,\n      category: ErrorCategory.VALIDATION,\n      code: 'INVALID_INPUT',\n      devDetails: issues,\n      userMessage: 'Please check the information you entered.',\n      agentAction: {\n        suggestedAction: 'CHECK_SCHEMA_AND_RETRY',\n      },\n    });\n  }\n\n  /**\n   * Factory for Authorization Errors (CASL/POA integration)\n   */\n  static unauthorized(action: string, subject: string): SovereignError {\n    return new SovereignError({\n      title: 'Access Denied',\n      detail: `You do not have permission to ${action} this ${subject}.`,\n      status: 403,\n      category: ErrorCategory.AUTHORIZATION,\n      code: 'UNAUTHORIZED',\n      userMessage: 'You are not authorized to perform this action.',\n      agentAction: {\n        suggestedAction: 'UPGRADE_CITIZENSHIP_OR_SWITCH_BOND',\n      },\n    });\n  }\n\n  static authenticationRequired(): SovereignError {\n    return new SovereignError({\n      type: 'https://polymath.network/errors/authentication-required',\n      title: 'Authentication Required',\n      detail: 'A valid authenticated session is required for this operation.',\n      status: 401,\n      category: ErrorCategory.AUTHORIZATION,\n      code: 'AUTHENTICATION_REQUIRED',\n      userMessage: 'Please sign in and try again.',\n      agentAction: { suggestedAction: 'AUTHENTICATE_AND_RETRY' },\n    });\n  }\n\n  static notFound(resource = 'Resource'): SovereignError {\n    return new SovereignError({\n      type: 'https://polymath.network/errors/not-found',\n      title: `${resource} Not Found`,\n      detail: 'The requested resource could not be found.',\n      status: 404,\n      category: ErrorCategory.UNKNOWN,\n      code: 'RESOURCE_NOT_FOUND',\n      userMessage: 'That resource is no longer available.',\n      agentAction: { suggestedAction: 'REFRESH_RESOURCE_AND_RETRY' },\n    });\n  }\n\n  static unavailable(code = 'DEPENDENCY_UNAVAILABLE'): SovereignError {\n    return new SovereignError({\n      type: 'https://polymath.network/errors/dependency-unavailable',\n      title: 'Service Unavailable',\n      detail: 'A required platform dependency is unavailable.',\n      status: 503,\n      category: ErrorCategory.NETWORK,\n      code,\n      userMessage: 'The service is temporarily unavailable. Please try again shortly.',\n      agentAction: { suggestedAction: 'RETRY_WITH_BACKOFF' },\n    });\n  }\n\n  static conflict(code = 'CONFLICT'): SovereignError {\n    return new SovereignError({\n      type: 'https://polymath.network/errors/conflict',\n      title: 'Conflict',\n      detail: 'The requested change conflicts with the current resource state.',\n      status: 409,\n      category: ErrorCategory.DATABASE,\n      code,\n      userMessage: 'That change could not be applied because the data has changed.',\n      agentAction: { suggestedAction: 'REFRESH_RESOURCE_AND_RETRY' },\n    });\n  }\n\n  static invalidInput(detail = 'One or more fields are invalid.'): SovereignError {\n    return new SovereignError({\n      type: 'https://polymath.network/errors/invalid-input',\n      title: 'Invalid Request',\n      detail,\n      status: 400,\n      category: ErrorCategory.VALIDATION,\n      code: 'INVALID_INPUT',\n      userMessage: 'Please check the information you entered.',\n      agentAction: { suggestedAction: 'CHECK_INPUT_AND_RETRY' },\n    });\n  }\n\n  static rateLimited(retryAfter?: number): SovereignError {\n    return new SovereignError({\n      type: 'https://polymath.network/errors/rate-limited',\n      title: 'Too Many Requests',\n      detail: 'The request rate limit has been exceeded.',\n      status: 429,\n      category: ErrorCategory.NETWORK,\n      code: 'RATE_LIMITED',\n      userMessage: 'Please wait a moment before trying again.',\n      agentAction: { suggestedAction: 'RETRY_WITH_BACKOFF', retryAfter },\n    });\n  }\n}\n","layer":0,"isBedrock":true,"downstreamCount":0,"upstreamCount":1},{"path":"packages/core/src/lib/storage.ts","name":"storage.ts","dir":"packages/core/src/lib","loc":40,"fns":[{"name":"buildPartitionedKey","isExported":true,"params":"options: PartitionKeyOptions"}],"interfaces":[{"name":"PartitionKeyOptions","isExported":true}],"types":[],"constants":[{"name":"StorageKeys","isExported":true},{"name":"tenant","isExported":false},{"name":"user","isExported":false},{"name":"entity","isExported":false},{"name":"version","isExported":false}],"imports":[],"content":"/**\n * Unified Storage Gateway\n *\n * This file serves as the public API for key-value storage.\n * It delegates to StorageDriver using the Port/Adapter pattern to maintain platform agnosticism.\n */\nexport { storage, storageDriver, StorageDriver } from '@repo/core/platform/drivers/storageDriver';\n\nexport const StorageKeys = {\n  USER_PREFERENCES: 'user_preferences',\n  LAST_SYNC: 'last_sync',\n  CACHED_COMMUNITY_POSTS: 'cached_community_posts',\n  CACHED_GROUPS: 'cached_groups',\n  DRAFT_FORM: 'draft_form',\n  DRAFT_STUDENTS: 'draft_students',\n  DRAFT_THOUGHT_RECORD: 'draft_thought_record',\n};\n\nexport interface PartitionKeyOptions {\n  tenantId?: string | null;\n  userId?: string | null;\n  entityId?: string | null;\n  feature: string;\n  version?: string;\n}\n\n/**\n * Generates a strictly partitioned storage key.\n * Prevents cross-tenant leaks, shared device bleed, and multi-classroom collisions.\n *\n * Format: `<tenant>:<user>:<entity>:<feature>:<version>`\n */\nexport function buildPartitionedKey(options: PartitionKeyOptions): string {\n  const tenant = options.tenantId?.trim() || 'global';\n  const user = options.userId?.trim() || 'guest';\n  const entity = options.entityId?.trim() || 'root';\n  const version = options.version?.trim() || 'v6';\n  return `${tenant}:${user}:${entity}:${options.feature}:${version}`;\n}\n","layer":0,"isBedrock":true,"downstreamCount":0,"upstreamCount":3},{"path":"packages/core/src/logic/utils/edloveUuidV8.ts","name":"edloveUuidV8.ts","dir":"packages/core/src/logic/utils","loc":199,"fns":[{"name":"hasKnownDomain","isExported":false,"params":"value: number"},{"name":"hasKnownMintOrigin","isExported":false,"params":"value: number"},{"name":"hasKnownSubtype","isExported":false,"params":"domain: EdloveUuidV8Domain, subtype: number"},{"name":"assertParts","isExported":false,"params":"parts: EdloveUuidV8Parts"},{"name":"formatUuid","isExported":false,"params":"bytes: Uint8Array"},{"name":"parseBytes","isExported":false,"params":"value: string"},{"name":"byteAt","isExported":false,"params":"bytes: Uint8Array, index: number"},{"name":"encodeEdloveUuidV8","isExported":true,"params":"parts: EdloveUuidV8Parts"},{"name":"parseEdloveUuidV8","isExported":true,"params":"value: string"},{"name":"isEdloveUuidV8","isExported":true,"params":"value: string"},{"name":"isEdloveAccountId","isExported":true,"params":"value: string"}],"interfaces":[],"types":[{"name":"ValueOf","isExported":false},{"name":"Edlove omain.education, value: 0x04 },\n  gradeMark: { domain: edloveUuidV8Domain.learningRecord, value: 0x01 },\n  attendance: { domain: edloveUuidV8Domain.learningRecord, value: 0x02 },\n  submission: { domain: edloveUuidV8Domain.learningRecord, value: 0x03 },\n  membershipBond: { domain: edloveUuidV8Domain.relationship, value: 0x01 },\n  guardianRelation: { domain: edloveUuidV8Domain.relationship, value: 0x02 },\n  delegation: { domain: edloveUuidV8Domain.relationship, value: 0x03 },\n  work: { domain: edloveUuidV8Domain.knowledge, value: 0x01 },\n  edition: { domain: edloveUuidV8Domain.knowledge, value: 0x02 },\n  collection: { domain: edloveUuidV8Domain.knowledge, value: 0x03 },\n  operationReceipt: { domain: edloveUuidV8Domain.operations, value: 0x01 },\n  auditEvent: { domain: edloveUuidV8Domain.operations, value: 0x02 },\n  outboxOperation: { domain: edloveUuidV8Domain.operations, value: 0x03 },\n  conformanceVector: { domain: edloveUuidV8Domain.test, value: 0x01 },\n} as const;\n\nexport const edloveUuidV8MintOrigin = {\n  centralProduction: 0x00,\n  nonProduction: 0x01,\n  edge: 0x02,\n  mobileOffline: 0x03,\n  browserOffline: 0x04,\n  agent: 0x05,\n  test: 0x3f,\n} as const;\n\ntype ValueOf<T> = T[keyof T];\n\nexport type EdloveUuidV8Domain = ValueOf<typeof edloveUuidV8Domain>;\nexport type EdloveUuidV8MintOrigin = ValueOf<typeof edloveUuidV8MintOrigin>;\nexport type EdloveUuidV8Subtype = ValueOf<typeof edloveUuidV8Subtype>;\n\nexport type EdloveUuidV8Parts = {\n  issuedAtUnixMilliseconds: number;\n  domain: EdloveUuidV8Domain;\n  subtype: EdloveUuidV8Subtype;\n  mintOrigin: EdloveUuidV8MintOrigin;\n  entropy: Uint8Array;\n};\n\nexport type ParsedEdloveUuidV8 = EdloveUuidV8Parts;\n\nconst UUID_BYTE_LENGTH = 16;\nconst ENTROPY_BYTE_LENGTH = 7;\nconst MAX_TIMESTAMP = 0xffff_ffff_ffff;\nconst UUID_TEXT_PATTERN = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;\n\nfunction hasKnownDomain(value: number): value is EdloveUuidV8Domain {\n  return Object.values(edloveUuidV8Domain).includes(value as EdloveUuidV8Domain);\n}\n\nfunction hasKnownMintOrigin(value: number): value is EdloveUuidV8MintOrigin {\n  return Object.values(edloveUuidV8MintOrigin).includes(value as EdloveUuidV8MintOrigin);\n}\n\nfunction hasKnownSubtype(domain: EdloveUuidV8Domain, subtype: number): boolean {\n  return Object.values(edloveUuidV8Subtype).some(\n    (candidate) => candidate.domain === domain && candidate.value === subtype,\n  );\n}\n\nfunction assertParts(parts: EdloveUuidV8Parts): void {\n  if (\n    !Number.isSafeInteger(parts.issuedAtUnixMilliseconds) ||\n    parts.issuedAtUnixMilliseconds < 0 ||\n    parts.issuedAtUnixMilliseconds > MAX_TIMESTAMP\n  ) {\n    throw new RangeError('issuedAtUnixMilliseconds must fit in the UUIDv8 48-bit timestamp field.');\n  }\n\n  if (!hasKnownDomain(parts.domain) || !hasKnownSubtype(parts.domain, parts.subtype.value)) {\n    throw new TypeError('domain and subtype must be a registered EdLove UUIDv8 entity kind.');\n  }\n\n  if (parts.subtype.domain !== parts.domain || !hasKnownMintOrigin(parts.mintOrigin)) {\n    throw new TypeError('subtype must belong to domain and mintOrigin must be registered.');\n  }\n\n  if (parts.entropy.length !== ENTROPY_BYTE_LENGTH) {\n    throw new RangeError('entropy must contain exactly 56 bits (7 bytes).');\n  }\n}\n\nfunction formatUuid(bytes: Uint8Array): string {\n  const hex = Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0')).join('');\n  return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;\n}\n\nfunction parseBytes(value: string): Uint8Array | null {\n  if (!UUID_TEXT_PATTERN.test(value)) return null;\n\n  const hex = value.replaceAll('-', '');\n  const bytes = new Uint8Array(UUID_BYTE_LENGTH);\n  for (let index = 0; index < UUID_BYTE_LENGTH; index += 1) {\n    bytes[index] = Number.parseInt(hex.slice(index * 2, index * 2 + 2), 16);\n  }\n  return bytes;\n}\n\nfunction byteAt(bytes: Uint8Array, index: number): number {\n  const byte = bytes[index];\n  if (byte === undefined) {\n    throw new RangeError('UUID byte array is unexpectedly incomplete.');\n  }\n  return byte;\n}\n\n/** Encodes vetted data. Only a trusted issuer may supply unpredictable entropy. */\nexport function encodeEdloveUuidV8(parts: EdloveUuidV8Parts): string {\n  assertParts(parts);\n\n  const bytes = new Uint8Array(UUID_BYTE_LENGTH);\n  let timestamp = BigInt(parts.issuedAtUnixMilliseconds);\n  for (let index = 5; index >= 0; index -= 1) {\n    bytes[index] = Number(timestamp & 0xffn);\n    timestamp >>= 8n;\n  }\n\n  bytes[6] = 0x80 | parts.domain;\n  bytes[7] = parts.subtype.value;\n  bytes[8] = 0x80 | parts.mintOrigin;\n  bytes.set(parts.entropy, 9);\n  return formatUuid(bytes);\n}\n\n/** Parses only IDs that conform to the active EdLove UUIDv8 registry. */\nexport function parseEdloveUuidV8(value: string): ParsedEdloveUuidV8 | null {\n  const bytes = parseBytes(value);\n  if (!bytes || byteAt(bytes, 6) >>> 4 !== 0x8 || byteAt(bytes, 8) >>> 6 !== 0x2) return null;\n\n  const domain = byteAt(bytes, 6) & 0x0f;\n  const subtypeValue = byteAt(bytes, 7);\n  const mintOrigin = byteAt(bytes, 8) & 0x3f;\n  if (\n    !hasKnownDomain(domain) ||\n    !hasKnownSubtype(domain, subtypeValue) ||\n    !hasKnownMintOrigin(mintOrigin)\n  ) {\n    return null;\n  }\n\n  const subtype = Object.values(edloveUuidV8Subtype).find(\n    (candidate) => candidate.domain === domain && candidate.value === subtypeValue,\n  );\n  if (!subtype) return null;\n\n  let issuedAtUnixMilliseconds = 0;\n  for (let index = 0; index < 6; index += 1) {\n    issuedAtUnixMilliseconds = issuedAtUnixMilliseconds * 256 + byteAt(bytes, index);\n  }\n\n  return {\n    issuedAtUnixMilliseconds,\n    domain,\n    subtype,\n    mintOrigin,\n    entropy: bytes.slice(9),\n  };\n}\n\nexport function isEdloveUuidV8(value: string): boolean {\n  return parseEdloveUuidV8(value) !== null;\n}\n\n/** Canonical accounts accept only the registered central Identity/account profile. */\nexport function isEdloveAccountId(value: string): boolean {\n  const parts = parseEdloveUuidV8(value);\n  return (\n    parts !== null &&\n    parts.domain === edloveUuidV8Domain.identity &&\n    parts.subtype.value === edloveUuidV8Subtype.account.value &&\n    (parts.mintOrigin === edloveUuidV8MintOrigin.centralProduction ||\n      parts.mintOrigin === edloveUuidV8MintOrigin.nonProduction)\n  );\n}\n","layer":0,"isBedrock":true,"downstreamCount":0,"upstreamCount":1},{"path":"packages/core/src/api/admin.orpc.contract.ts","name":"admin.orpc.contract.ts","dir":"packages/core/src/api","loc":3,"fns":[],"interfaces":[],"types":[],"constants":[{"name":"adminORPCContract","isExported":true}],"imports":[{"source":"./admin.contract","canonical":"packages/core/src/api/admin.contract.ts","isTypeOnly":false,"symbols":["adminContract"]}],"content":"import { adminContract } from './admin.contract';\nexport const adminORPCContract = adminContract;\n","layer":2,"isBedrock":false,"downstreamCount":1,"upstreamCount":1},{"path":"packages/core/src/api/agent.orpc.contract.ts","name":"agent.orpc.contract.ts","dir":"packages/core/src/api","loc":4,"fns":[],"interfaces":[],"types":[],"constants":[{"name":"agentORPCContract","isExported":true}],"imports":[{"source":"./agent.contract","canonical":"packages/core/src/api/agent.contract.ts","isTypeOnly":false,"symbols":["agentContract"]}],"content":"import { agentContract } from './agent.contract';\n\nexport const agentORPCContract = agentContract;\n","layer":2,"isBedrock":false,"downstreamCount":1,"upstreamCount":1},{"path":"packages/core/src/api/announcements.orpc.contract.ts","name":"announcements.orpc.contract.ts","dir":"packages/core/src/api","loc":42,"fns":[],"interfaces":[],"types":[],"constants":[{"name":"announcement","isExported":false},{"name":"announcementsORPCContract","isExported":true}],"imports":[],"content":"import { z } from 'zod';\n\nconst announcement = z.object({\n  id: z.string().uuid(),\n  school_id: z.string().uuid(),\n  author_id: z.string().uuid().nullable(),\n  title: z.string(),\n  content: z.string(),\n  is_pinned: z.boolean(),\n  created_at: z.string(),\n  author_name: z.string().nullable(),\n  author_avatar: z.string().nullable(),\n});\n\nexport const announcementsORPCContract = {\n  getAnnouncements: {\n    method: 'get',\n    path: '/announcements',\n    metadata: { policy: { action: 'read', subject: 'Announcement' } },\n    request: {\n      query: z.object({\n        schoolId: z.string().uuid(),\n      }),\n    },\n    responses: { 200: { schema: z.array(announcement), description: 'School announcements' } },\n  },\n  createAnnouncement: {\n    method: 'post',\n    path: '/announcements',\n    metadata: { policy: { action: 'create', subject: 'Announcement' } },\n    request: {\n      body: z.object({\n        schoolId: z.string().uuid(),\n        title: z.string(),\n        content: z.string(),\n        isPinned: z.boolean().optional(),\n      }),\n    },\n    responses: { 201: { schema: announcement, description: 'Created announcement' } },\n  },\n};\n","layer":0,"isBedrock":true,"downstreamCount":0,"upstreamCount":1},{"path":"packages/core/src/api/attendance.orpc.contract.ts","name":"attendance.orpc.contract.ts","dir":"packages/core/src/api","loc":290,"fns":[],"interfaces":[],"types":[],"constants":[{"name":"status","isExported":false},{"name":"sessionKind","isExported":false},{"name":"attendance","isExported":false},{"name":"sessionInput","isExported":false},{"name":"recordInput","isExported":false},{"name":"rosterStudent","isExported":false},{"name":"gradeClassSummary","isExported":false},{"name":"teachingGroupKind","isExported":false},{"name":"classroomLink","isExported":false},{"name":"attendanceRead","isExported":false},{"name":"ownSchoolRead","isExported":false},{"name":"attendanceWrite","isExported":false},{"name":"classroomRead","isExported":false},{"name":"classroomUpdate","isExported":false},{"name":"attendanceORPCContract","isExported":true}],"imports":[],"content":"import { z } from 'zod';\n\nconst status = z.enum(['present', 'absent', 'late', 'excused']);\nconst sessionKind = z.enum(['lesson', 'arrival', 'departure']);\n\nconst attendance = z.object({\n  id: z.uuid(),\n  student_id: z.uuid(),\n  grade_class_id: z.uuid(),\n  status,\n  attendance_date: z.string(),\n  created_at: z.string(),\n  updated_at: z.string(),\n  student_name: z.string().nullable(),\n  student_avatar_url: z.string().nullable(),\n  sessions: z.array(\n    z.object({\n      id: z.uuid(),\n      session_kind: sessionKind,\n      session_at: z.string(),\n      status,\n      teacher_id: z.uuid().nullable(),\n      subject_id: z.uuid().nullable(),\n      term_id: z.uuid().nullable(),\n    }),\n  ),\n});\n\nconst sessionInput = z.strictObject({\n  sessionKind: sessionKind.optional(),\n  sessionAt: z.iso.datetime().optional(),\n  teacherId: z.uuid().nullable().optional(),\n  subjectId: z.uuid().nullable().optional(),\n  termId: z.uuid().nullable().optional(),\n});\n\nconst recordInput = z\n  .strictObject({\n    gradeClassId: z.uuid(),\n    studentId: z.uuid(),\n    status,\n    date: z.string(),\n  })\n  .merge(sessionInput);\n\nconst rosterStudent = z.object({\n  enrollment_id: z.uuid(),\n  student_id: z.uuid(),\n  full_name: z.string().nullable(),\n  avatar_url: z.string().nullable(),\n});\n\nconst gradeClassSummary = z.object({\n  id: z.uuid(),\n  name: z.string(),\n  academic_cycle_id: z.uuid(),\n  role: z.string().nullable(),\n});\n\nconst teachingGroupKind = z.enum(['homeroom', 'subject', 'cohort']);\n\nconst classroomLink = z.object({\n  grade_class_id: z.uuid(),\n  name: z.string(),\n  academic_cycle_id: z.uuid(),\n});\n\nconst attendanceRead = { policy: { action: 'read', subject: 'DailyAttendance' } } as const;\n// Listing the caller's own grade classes is school-scoped; the handler filters to the caller.\nconst ownSchoolRead = { policy: { action: 'read', subject: 'School' } } as const;\nconst attendanceWrite = { policy: { action: 'create', subject: 'DailyAttendance' } } as const;\nconst classroomRead = { policy: { action: 'read', subject: 'Classroom' } } as const;\nconst classroomUpdate = { policy: { action: 'update', subject: 'Classroom' } } as const;\n\nexport const attendanceORPCContract = {\n  getByClassroom: {\n    method: 'get',\n    path: '/attendance/classroom',\n    request: {\n      query: z.strictObject({\n        gradeClassId: z.uuid(),\n        date: z.string().optional(),\n      }),\n    },\n    responses: { 200: { schema: z.array(attendance), description: 'Classroom attendance' } },\n    metadata: attendanceRead,\n  },\n  record: {\n    method: 'post',\n    path: '/attendance/record',\n    request: { body: recordInput },\n    metadata: attendanceWrite,\n    responses: { 201: { schema: attendance, description: 'Recorded attendance' } },\n  },\n  batchRecord: {\n    method: 'post',\n    path: '/attendance/batch-record',\n    request: { body: z.array(recordInput).min(1).max(500) },\n    metadata: attendanceWrite,\n    responses: { 201: { schema: z.array(attendance), description: 'Recorded attendance batch' } },\n  },\n  getSchoolPulse: {\n    method: 'get',\n    path: '/attendance/school-pulse',\n    request: {\n      query: z.strictObject({\n        schoolId: z.uuid(),\n        gradeClassId: z.uuid().optional(),\n        viewDate: z.string().optional(),\n      }),\n    },\n    responses: {\n      200: {\n        schema: z.object({\n          todayRate: z.number(),\n          yesterdayRate: z.number(),\n          atRiskCount: z.number().int().nonnegative(),\n        }),\n        description: 'School attendance pulse',\n      },\n    },\n    metadata: attendanceRead,\n  },\n  getReport: {\n    method: 'get',\n    path: '/attendance/report',\n    request: {\n      query: z.strictObject({\n        schoolId: z.uuid(),\n        startDate: z.string(),\n        endDate: z.string(),\n        gradeClassId: z.uuid().optional(),\n      }),\n    },\n    responses: {\n      200: {\n        schema: z.object({\n          trend: z.array(\n            z.object({\n              date: z.string(),\n              presentCount: z.number(),\n              absentCount: z.number(),\n              lateCount: z.number(),\n              totalCount: z.number(),\n              rate: z.number(),\n            }),\n          ),\n          overallRate: z.number(),\n          totalAbsences: z.number(),\n        }),\n        description: 'Attendance report',\n      },\n    },\n    metadata: attendanceRead,\n  },\n  getGradeClassRoster: {\n    method: 'get',\n    path: '/attendance/grade-class-roster',\n    request: {\n      query: z.strictObject({\n        gradeClassId: z.uuid(),\n        date: z.string().optional(),\n      }),\n    },\n    responses: {\n      200: { schema: z.array(rosterStudent), description: 'Active grade class enrollments' },\n    },\n    metadata: attendanceRead,\n  },\n  /**\n   * One student's attendance across days, newest first. Who may read it, and how much, is\n   * decided per school (schools.student_history_access); see the handler. `gradeClassId`\n   * is the class the caller views the student through (teachers must send one of their\n   * classes); it is authority context, not a filter.\n   */\n  getStudentHistory: {\n    method: 'get',\n    path: '/attendance/student-history',\n    request: {\n      query: z.strictObject({\n        studentId: z.uuid(),\n        gradeClassId: z.uuid().optional(),\n        from: z.iso.date().optional(),\n        to: z.iso.date().optional(),\n        limit: z.coerce.number().int().min(1).max(500).optional(),\n      }),\n    },\n    responses: {\n      200: {\n        schema: z.array(attendance),\n        description: 'Attendance history the caller may see for this student',\n      },\n    },\n    metadata: attendanceRead,\n  },\n  /**\n   * #149 teaching-group links: the grade classes a (legacy) classroom explicitly\n   * teaches. Clients use these before any name matching, a n  submitExcuse: {\n    method: 'post',\n    path: '/attendance/excuse',\n    request: {\n      body: z.strictObject({\n        studentId: z.uuid(),\n        gradeClassId: z.uuid(),\n        date: z.string(),\n        reason: z.string().trim().min(2).max(500),\n      }),\n    },\n    metadata: attendanceWrite,\n    responses: {\n      200: {\n        schema: z.object({ success: z.boolean() }),\n        description: 'Submitted excused absence note',\n      },\n    },\n  },\n};\n","layer":0,"isBedrock":true,"downstreamCount":0,"upstreamCount":1},{"path":"packages/core/src/api/channel.orpc.contract.ts","name":"channel.orpc.contract.ts","dir":"packages/core/src/api","loc":109,"fns":[{"name":"authority","isExported":false,"params":"action: 'read' | 'update'"}],"interfaces":[],"types":[],"constants":[{"name":"futureExpiry","isExported":false},{"name":"channelConsentInput","isExported":false},{"name":"channelDelegationInput","isExported":false},{"name":"channelORPCContract","isExported":true}],"imports":[{"source":"@repo/core/logic/omnichannel/channelAuthority","canonical":"packages/core/src/logic/omnichannel/channelAuthority.ts","isTypeOnly":false,"symbols":["ChannelConsentGrantSchema","ChannelDelegationSchema","ChannelIdentityLinkSchema","ChannelLinkInitiationSchema","ChannelResourceScopeSchema","ExternalChannelProviderSchema"]}],"content":"import {\n  ChannelConsentGrantSchema,\n  ChannelDelegationSchema,\n  ChannelIdentityLinkSchema,\n  ChannelLinkInitiationSchema,\n  ChannelResourceScopeSchema,\n  ExternalChannelProviderSchema,\n} from '@repo/core/logic/omnichannel/channelAuthority';\nimport { z } from 'zod';\n\nconst authority = (action: 'read' | 'update') => ({ policy: { action, subject: 'User' } }) as const;\n\nconst futureExpiry = z.iso\n  .datetime()\n  .nullable()\n  .refine(\n    (value) => value === null || new Date(value).getTime() > Date.now(),\n    'Expiry must be in the future.',\n  );\n\nconst channelConsentInput = z.strictObject({\n  purpose: z.string().
