t. */\nexport const ChannelResourceScopeSchema = z.strictObject({\n  schoolId: z.uuid().optional(),\n  resourceIds: z.array(z.uuid()).max(64).optional(),\n});\n\nconst Sha256FingerprintSchema = z.string().regex(/^[a-f0-9]{64}$/i);\n\n/**\n * Sanitised output of a provider adapter. `verificationRef` names a completed\n * provider verification step; it must never contain raw signature or token data.\n */\nexport const ChannelInboundEnvelopeSchema = z.strictObject({\n  provider: ExternalChannelProviderSchema,\n  providerEventId: z.string().min(1).max(256),\n  replayKey: Sha256FingerprintSchema,\n  externalSubjectKey: z.string().min(1).max(256),\n  endpointKind: ChannelEndpointKindSchema,\n  payloadKind: ChannelInboundPayloadKindSchema,\n  verificationRef: z.string().min(1).max(160),\n  payloadFingerprint: Sha256FingerprintSchema,\n  receivedAt: z.iso.datetime(),\n  correlationId: z.uuid(),\n});\n\n/**\n * Durable dispatch intent. Payload and recipient are stored behind server-side\n * references so receipts can be recovered without exposing content or addresses.\n */\nexport const ChannelDeliveryIntentSchema = z.strictObject({\n  id: z.uuid(),\n  accountId: z.uuid().nullable(),\n  provider: ExternalChannelProviderSchema,\n  channelIdentityId: z.uuid().nullable(),\n  endpointKind: ChannelEndpointKindSchema,\n  operationId: z.uuid().nullable(),\n  capability: z.string().min(1).max(160),\n  delegationAgentKey: z.string().min(1).max(160).nullable(),\n  resourceScope: ChannelResourceScopeSchema,\n  idempotencyKey: z.uuid(),\n  payloadRef: z.string().min(1).max(256),\n  status: ChannelDeliveryStatusSchema,\n  expiresAt: z.iso.datetime().nullable(),\n  createdAt: z.iso.datetime(),\n  updatedAt: z.iso.datetime(),\n});\n\n/**\n * Media workers may progress this record only through declared processing\n * states. The content remains behind `storageRef` until an explicit retention\n * policy promotes it.\n */\nexport const ChannelMediaJobSchema = z.strictObject({\n  id: z.uuid(),\n  ingressEventId: z.uuid(),\n  accountId: z.uuid().nullable(),\n  channelIdentityId: z.uuid().nullable(),\n  mediaKind: z.enum(['audio', 'image', 'document', 'video']),\n  storageRef: z.string().min(1).max(256),\n  contentFingerprint: Sha256FingerprintSchema,\n  status: ChannelMediaJobStatusSchema,\n  expiresAt: z.iso.datetime(),\n  createdAt: z.iso.datetime(),\n  updatedAt: z.iso.datetime(),\n});\n\n/**\n * AI output is a proposal reference until a separately bound human\n * confirmation settles a named capability through the normal Sanctuary API.\n */\nexport const ChannelAiProposalSchema = z.strictObject({\n  id: z.uuid(),\n  accountId: z.uuid().nullable(),\n  channelIdentityId: z.uuid().nullable(),\n  mediaJobId: z.uuid().nullable(),\n  capability: z.string().min(1).max(160),\n  proposalRef: z.string().min(1).max(256),\n  payloadFingerprint: Sha256FingerprintSchema,\n  status: ChannelAiProposalStatusSchema,\n  expiresAt: z.iso.datetime(),\n  confirmedAt: z.iso.datetime().nullable(),\n  createdAt: z.iso.datetime(),\n  updatedAt: z.iso.datetime(),\n});\n\nexport const ChannelIdentityLinkSchema = z.strictObject({\n  id: z.uuid(),\n  accountId: z.uuid().nullable(),\n  provider: ExternalChannelProviderSchema,\n  state: ChannelIdentityStateSchema,\n  confirmedAt: z.string().datetime().nullable(),\n  revokedAt: z.string().datetime().nullable(),\n});\n\nexport const ChannelLinkAttemptSchema = z\n  .strictObject({\n    id: z.uuid(),\n    accountId: z.uuid(),\n    provider: ExternalChannelProviderSchema,\n    state: ChannelLinkAttemptStatusSchema,\n    expiresAt: z.string().datetime(),\n    consumedAt: z.string().datetime().nullable(),\n  })\n  .superRefine((attempt, context) => {\n    if (attempt.consumedAt && attempt.state !== 'confirmed') {\n      context.addIssue({\n        code: 'custom',\n        path: ['consumedAt'],\n        message: 'Only a confirmed link attempt may be consumed.',\n      });\n    }\n  });\n\n/** Raw ceremony secret returned once to an authenticated Sanctuary session. */\nexport const ChannelLinkInitiationSchema = z.strictObject({\n  id: z.uuid(),\n  provider: ExternalChannelProviderSchema,\n  linkToken: z.string().min(32).max(128),\n  expiresAt: z.iso.datetime(),\n});\n\nexport const ChannelConsentGrantSchema = z.strictObject({\n  id: z.uuid(),\n  accountId: z.uuid(),\n  channelIdentityId: z.uuid(),\n  purpose: z.string().min(1).max(120),\n  capabilities: z.array(z.string().min(1).max(160)).min(1).max(64),\n  resourceScope: ChannelResourceScopeSchema,\n  status: ChannelConsentStatusSchema,\n  expiresAt: z.string().datetime().nullable(),\n  revokedAt: z.string().datetime().nullable(),\n});\n\nexport const ChannelDelegationSchema = z.strictObject({\n  id: z.uuid(),\n  accountId: z.uuid(),\n  agentKey: z.string().min(1).max(160),\n  capabilities: z.array(z.string().min(1).max(160)).min(1).max(64),\n  resourceScope: ChannelResourceScopeSchema,\n  status: ChannelDelegationStatusSchema,\n  expiresAt: z.string().datetime().nullable(),\n  revokedAt: z.string().datetime().nullable(),\n});\n\nexport type ChannelTransport = z.infer<typeof ChannelTransportSchema>;\nexport type ExternalChannelProvider = z.infer<typeof ExternalChannelProviderSchema>;\nexport type ChannelIdentityState = z.infer<typeof ChannelIdentityStateSchema>;\nexport type ChannelEndpointKind = z.infer<typeof ChannelEndpointKindSchema>;\nexport type ChannelInboundEnvelope = z.infer<typeof ChannelInboundEnvelopeSchema>;\nexport type ChannelDeliveryIntent = z.infer<typeof ChannelDeliveryIntentSchema>;\nexport type ChannelMediaJob = z.infer<typeof ChannelMediaJobSchema>;\nexport type ChannelAiProposal = z.infer<typeof ChannelAiProposalSchema>;\nexport type ChannelIdentityLink = z.infer<typeof ChannelIdentityLinkSchema>;\nexport type ChannelLinkAttempt = z.infer<typeof ChannelLinkAttemptSchema>;\nexport type ChannelLinkInitiation = z.infer<typeof ChannelLinkInitiationSchema>;\nexport type ChannelConsentGrant = z.infer<typeof ChannelConsentGrantSchema>;\nexport type ChannelDelegation = z.infer<typeof ChannelDelegationSchema>;\nexport type ChannelResourceScope = z.infer<typeof ChannelResourceScopeSchema>;\n","layer":0,"isBedrock":true,"downstreamCount":0,"upstreamCount":1},{"path":"packages/core/src/logic/schemas/chat-command.schema.ts","name":"chat-command.schema.ts","dir":"packages/core/src/logic/schemas","loc":23,"fns":[],"interfaces":[],"types":[{"name":"ChatChannel","isExported":true},{"name":"ChatSendCommand","isExported":true},{"name":"ChatSendReceipt","isExported":true}],"constants":[{"name":"CHAT_SEND_COMMAND","isExported":true},{"name":"ChatChannelSchema","isExported":true},{"name":"ChatSendCommandSchema","isExported":true},{"name":"ChatMessageResultSchema","isExported":true},{"name":"ChatSendReceiptSchema","isExported":true}],"imports":[],"content":"import { z } from 'zod';\n\nexport const CHAT_SEND_COMMAND = 'community.message.send';\nexport const ChatChannelSchema = z.strictObject({\n  kind: z.enum(['group', 'direct']),\n  id: z.uuid(),\n});\nexport const ChatSendCommandSchema = z.strictObject({\n  operationId: z.uuid(),\n  principalId: z.uuid(),\n  channel: ChatChannelSchema,\n  content: z.string().trim().min(1).max(4000),\n});\nexport const ChatMessageResultSchema = z.strictObject({ messageId: z.uuid() });\nexport const ChatSendReceiptSchema = ChatMessageResultSchema.extend({\n  operationId: z.uuid(),\n  receiptId: z.uuid(),\n  status: z.literal('completed'),\n});\nexport type ChatChannel = z.infer<typeof ChatChannelSchema>;\nexport type ChatSendCommand = z.infer<typeof ChatSendCommandSchema>;\nexport type ChatSendReceipt = z.infer<typeof ChatSendReceiptSchema>;\n","layer":0,"isBedrock":true,"downstreamCount":0,"upstreamCount":2},{"path":"packages/core/src/api/educational.contract.ts","name":"educational.contract.ts","dir":"packages/core/src/api","loc":676,"fns":[{"name":"classroomAuthority","isExported":false,"params":"action: 'create' | 'read' | 'update' | 'delete'"},{"name":"lessonAuthority","isExported":false,"params":"action: 'create' | 'read' | 'update' | 'delete'"},{"name":"userAuthority","isExported":false,"params":"action: 'create' | 'read' | 'update' | 'delete'"},{"name":"classroomNoteAuthority","isExported":false,"params":"action: 'create' | 'read' | 'update' | 'delete'"}],"interfaces":[],"types":[],"constants":[{"name":"ASSIGNMENT_SUBMISSION_CAPABILITY","isExported":true},{"name":"OperationReceiptResultSchema","isExported":true},{"name":"OperationReceiptResponseSchema","isExported":true},{"name":"classroomResponse","isExported":false},{"name":"classroomNoteResponse","isExported":false},{"name":"classroomNoteCreate","isExported":false},{"name":"classroomStudent","isExported":false},{"name":"material","isExported":false},{"name":"assignment","isExported":false},{"name":"submission","isExported":false},{"name":"educationalContract","isExported":true}],"imports":[{"source":"@repo/core/api/contracts","canonical":"packages/core/src/api/contracts.ts","isTypeOnly":true,"symbols":["SovereignContract"]},{"source":"@repo/core/logic/schemas/classroom.schema","canonical":"packages/core/src/logic/schemas/classroom.schema.ts","isTypeOnly":false,"symbols":["ClassroomSchema","LessonSchema"]},{"source":"@repo/core/logic/schemas/classroom-note.schema","canonical":"packages/core/src/logic/schemas/classroom-note.schema.ts","isTypeOnly":false,"symbols":["ClassroomNoteLifecycleEventSchema","ClassroomNoteSchema"]}],"content":"import type { SovereignContract } from '@repo/core/api/contracts';\nimport { ClassroomSchema, LessonSchema } from '@repo/core/logic/schemas/classroom.schema';\nimport {\n  ClassroomNoteLifecycleEventSchema,\n  ClassroomNoteSchema,\n} from '@repo/core/logic/schemas/classroom-note.schema';\nimport { z } from 'zod';\n\nexport const ASSIGNMENT_SUBMISSION_CAPABILITY = 'assignment.submit' as const;\nexport const OperationReceiptResultSchema = z.object({ submissionId: z.uuid() });\nexport const OperationReceiptResponseSchema = z.strictObject({\n  operationId: z.uuid(),\n  capability: z.literal(ASSIGNMENT_SUBMISSION_CAPABILITY),\n  status: z.enum(['pending', 'committed', 'failed', 'conflict']),\n  result: OperationReceiptResultSchema.nullable(),\n  errorCode: z.enum(['OPERATION_FAILED', 'OPERATION_CONFLICT']).nullable(),\n  createdAt: z.iso.datetime(),\n  updatedAt: z.iso.datetime(),\n});\n\nconst classroomResponse = ClassroomSchema.extend({\n  teacher_name: z.string().nullable(),\n  student_count: z.number().int().nonnegative().optional(),\n  lesson_count: z.number().int().nonnegative().optional(),\n});\n\nconst classroomNoteResponse = ClassroomNoteSchema.extend({\n  author_name: z.string().nullable(),\n});\n\nconst classroomAuthority = (action: 'create' | 'read' | 'update' | 'delete') =>\n  ({\n    policy: { action, subject: 'Classroom' },\n  }) as const;\n\nconst lessonAuthority = (action: 'create' | 'read' | 'update' | 'delete') =>\n  ({\n    policy: { action, subject: 'Lesson' },\n  }) as const;\n\nconst userAuthority = (action: 'create' | 'read' | 'update' | 'delete') =>\n  ({\n    policy: { action, subject: 'User' },\n  }) as const;\n\nconst classroomNoteCreate = ClassroomNoteSchema.omit({\n  id: true,\n  created_at: true,\n  updated_at: true,\n  author_id: true,\n  author: true,\n}).extend({\n  note_type: ClassroomNoteSchema.shape.note_type.optional(),\n  visibility: ClassroomNoteSchema.shape.visibility.optional(),\n  is_pinned: ClassroomNoteSchema.shape.is_pinned.optional(),\n});\n\nconst classroomNoteAuthority = (action: 'create' | 'read' | 'update' | 'delete') =>\n  ({\n    policy: { action, subject: 'ClassroomNote' },\n  }) as const;\n\nconst classroomStudent = z.object({\n  id: z.uuid(),\n  classroom_id: z.uuid(),\n  student_id: z.uuid().nullable(),\n  full_name: z.string().nullable(),\n  invite_code: z.string().nullable(),\n  roll_number: z.number().nullable(),\n  enrolled_at: z.string().nullable(),\n  claimed_at: z.string().nullable(),\n  class_id: z.uuid().optional(),\n});\n\nconst material = z.object({\n  id: z.uuid(),\n  classroom_id: z.uuid(),\n  lesson_id: z.uuid().nullable(),\n  title: z.string(),\n  type: z.string(),\n  url: z.string().nullable(),\n  content: z.string().nullable(),\n  is_pinned: z.boolean(),\n  created_at: z.string(),\n  updated_at: z.string(),\n});\n\nconst assignment = z.object({\n  id: z.uuid(),\n  classroom_id: z.uuid(),\n  lesson_id: z.uuid().nullable(),\n  title: z.string(),\n  description: z.string().nullable(),\n  due_date: z.string().nullable(),\n  max_points: z.number().int().positive(),\n  created_at: z.string(),\n  updated_at: z.string(),\n});\n\nconst submission = z.object({\n  id: z.uuid(),\n  assignment_id: z.uuid(),\n  student_id: z.uuid(),\n  classroom_id: z.uuid(),\n  content: z.string().nullable(),\n  submitted_at: z.string(),\n  grade: z.number().int().nullable(),\n  feedback: z.string().nullable(),\n  graded_at: z.string().nullable(),\n  idempotency_key: z.string().nullable(),\n});\n\n/**\n * Educational Port (Sovereign RPC)\n * Framework-agnostic definition of the Educational API.\n * Updated: Zod v4 + Hono alignment.\n * [LOUD-FAILURE] Methods must be explicitly mapped in the contract to be exposed via POA.\n */\nexport const educationalContract = {\n  getOperationReceipt: {\n    method: 'get',\n    path: '/educational/operations/:operationId',\n    request: { params: z.strictObject({ operationId: z.uuid() }) },\n    responses: {\n      200: {\n        schema: OperationReceiptResponseSchema,\n        description: 'Account-owned operation outcome',\n      },\n    },\n    metadata: { policy: { action: 'read', subject: 'OperationReceipt' } },\n  },\n  getOperationReceiptByKey: {\n    method: 'get',\n    path: '/educational/operation-receipts/by-key',\n    request: {\n      query: z.strictObject({\n        capability: z.literal(ASSIGNMENT_SUBMISSION_CAPABILITY),\n        idempotencyKey: z.uuid(),\n      }),\n    },\n    responses: {\n      200: {\n        schema: OperationReceiptResponseSchema,\n        description: 'Account-owned outcome by caller-known key',\n      },\n    },\n    metadata: { policy: { action: 'read', subject: 'OperationReceipt' } },\n  },\n  getByTeacher: {\n    method: 'get',\n    path: '/educational/classrooms/by-teacher',\n    request: {\n      query: z.strictObject({\n        teacher_id: z.uuid(),\n        limit: z.coerce.number().optional(),\n        offset: z.coerce.number().optional(),\n      }),\n    },\n    responses: {\n      200: {\n        schema: z.array(classroomResponse),\n        description: 'Retrieve classrooms by teacher',\n      },\n    },\n    metadata: classroomAuthority('read'),\n  },\n\n  getByStudent: {\n    method: 'get',\n    path: '/educational/classrooms/by-student',\n    request: {\n      query: z.strictObject({\n        student_id: z.uuid(),\n      }),\n    },\n    responses: {\n      200: {\n        schema: z.array(classroomResponse),\n        description: 'Retrieve classrooms by student',\n      },\n    },\n    metadata: classroomAuthority('read'),\n  },\n\n  getTeacherStats: {\n    method: 'get',\n    path: '/educational/classrooms/stats/teacher/:id',\n    request: {\n      params: z.strictObject({ id: z.uuid() }),\n    },\n    responses: {\n      200: {\n        schema: z.strictObject({\n          active_classes: z.number(),\n          total_students: z.number(),\n          average_pulse: z.number().optional(),\n        }),\n        description: 'Get statistics for a teacher',\n      },\n    },\n    metadata: classroomAuthority('read'),\n  },\n\n  getById: {\n    method: 'get',\n    path: '/educational/classrooms/:id',\n    request: {\n      params: z.strictObject({ id: z.uuid() }),\n    },\n    responses: {\n      200: {\n        schema: classroomResponse,\n        description: 'Retrieve a single classroom',\n      },\n    },\n    metadata: classroomAuthority('read'),\n  },\n\n  createClassroom: {\n    method: 'post',\n    path: '/educational/classrooms',\n    request: {\n      body: z.strictObject({\n        name: z.string().min(1),\n        teacherId: z.uuid(),\n        schoolId: z.uuid().optional().nullable(),\n        gradeId: z.uuid().optional().nullable(),\n        sectionId: z.uuid().optional().nullable(),\n        subject: z.string().optional().nullable(),\n        description: z.string().optional().nullable(),\n        handle: z.string().optional().nullable(),\n        colorTheme: z.string().optional().nullable(),\n        academicYear: z.string().optional().nullable(),\n      }),\n    },\n    responses: { 201: { schema: classroomResponse, description: 'Create classroom' } },\n    metadata: classroomAuthority('create'),\n  },\n\n  updateClassroom: {\n    method: 'patch',\n    path: '/educational/classrooms/:id',\n    request: {\n      params: z.strictObject({ id: z.uuid() }),\n      body: z.strictObject({\n        name: z.string().optional(),\n        teacherId: z.uuid().optional().nullable(),\n        schoolId: z.uuid().optional().nullable(),\n        gradeId: z.uuid().optional().nullable(),\n        sectionId: z.uuid().optional().nullable(),\n        subject: z.string().optional().nullable(),\n        description: z.string().optional().nullable(),\n        handle: z.string().optional().nullable(),\n        colorTheme: z.string().optional().nullable(),\n        isArchived: z.boolean().optional(),\n      }),\n    },\n    responses: { 200: { schema: classroomResponse, description: 'Update classroom' } },\n    metadata: classroomAuthority('update'),\n  },\n\n  deleteClassroom: {\n    method: 'delete',\n    path: '/educational/classrooms/:id',\n    request: { params: z.strictObject({ id: z.uuid() }) },\n    responses: {\n      200: { schema: z.object({ success: z.literal(true) }), description: 'Delete classroom' },\n    },\n    metadata: classroomAuthority('delete'),\n  },\n\n  getClassroomResources: {\n    method: 'get',\n    path: '/educational/classrooms/:classroomId/resources',\n    request: {\n      params: z.strictObject({ classroomId: z.uuid() }),\n    },\n    responses: {\n      200: {\n        schema: z.array(z.any()), // Simplified for now to avoid schema drift\n        description: 'Retrieve classroom resources',\n      },\n    },\n    metadata: classroomAuthority('read'),\n  },\n\n  createLesson: {\n    method: 'post',\n    path: '/educational/lessons',\n    request: {\n      body: LessonSchema.omit({ id: true, created_at: true }),\n    },\n    responses: {\n      201: {\n        schema: LessonSchema,\n        description: 'Lesson created successfully',\n      },\n    },\n    metadata: lessonAuthority('create'),\n  },\n\n  getClassroomStudents: {\n    method: 'get',\n    path: '/educational/classrooms/:classroomId/students',\n    request: { params: z.strictObject({ classroomId: z.uuid() }) },\n    responses: {\n      200: { schema: z.array(classroomStudent), description: 'List classroom students' },\n    },\n    metadata: classroomAuthority('read'),\n  },\n\n  enrollStudent: {\n    method: 'post',\n    path: '/educational/classrooms/:classroomId/students/enroll',\n    request: {\n      params: z.strictObject({ classroomId: z.uuid() }),\n      body: z.strictObject({ studentId: z.uuid(), rollNumber: z.number().optional().nullable() }),\n    },\n    responses: { 200: { schema: classroomStudent, description: 'Enroll a student' } },\n    metadata: classroomAuthority('update'),\n  },\n\n  addShadowStudent: {\n    method: 'post',\n    path: '/educational/classrooms/:classroomId/students/shadow',\n    request: {\n      params: z.strictObject({ classroomId: z.uuid() }),\n      body: z.strictObject({\n        fullName: z.string().trim().min(1).max(200),\n        rollNumber: z.number().optional().nullable(),\n      }),\n    },\n    responses: {\n      201: { schema: classroomStudent, description: 'Add an unclaimed classroom student' },\n    },\n    metadata: classroomAuthority('create'),\n  },\n\n  updateClassroomStudent: {\n    method: 'patch',\n    path: '/educational/classroom-students/:id',\n    request: {\n      params: z.strictObject({ id: z.uuid() }),\n      body: z.strictObject({\n        classroomId: z.uuid().optional(),\n        fullName: z.string().trim().min(1).max(200).optional(),\n        rollNumber: z.number().optional().nullable(),\n      }),\n    },\n    responses: { 200: { schema: classroomStudent, description: 'Update a classroom student' } },\n    metadata: classroomAuthority('update'),\n  },\n\n  removeClassroomStudent: {\n    method: 'delete',\n    path: '/educational/classroom-students/:id',\n    request: {\n      params: z.strictObject({ id: z.uuid() }),\n      body: z.strictObject({ classroomId: z.uuid().optional() }),\n    },\n    responses: {\n      200: {\n        schema: z.object({ success: z.literal(true) }),\n        description: 'Remove a classroom student',\n      },\n    },\n    metadata: classroomAuthority('delete'),\n  },\n\n  claimShadowStudent: {\n    method: 'post',\n    path: '/educational/classroom-students/claim',\n    request: {\n      body: z.strictObject({ inviteCode: z.string().trim().min(8).max(128) }),\n    },\n    responses: { 200: { schema: classroomStudent, description: 'Claimed classroom student' } },\n    metadata: userAuthority('update'),\n  },\n\n  getMaterials: {\n    method: 'get',\n    path: '/educational/classrooms/:classroomId/materials',\n    request: {\n      params: z.strictObject({ classroomId: z.uuid() }),\n      query: z.strictObject({}).optional(),\n    },\n    responses: { 200: { schema: z.array(material), description: 'Classroom materials' } },\n    metadata: classroomAuthority('read'),\n  },\n\n  getLessonMaterials: {\n    method: 'get',\n    path: '/educational/lessons/:lessonId/materials',\n    request: {\n      params: z.strictObject({ lessonId: z.uuid() }),\n      query: z.strictObject({}).optional(),\n    },\n    responses: { 200: { schema: z.array(material), description: 'Lesson materials' } },\n    metadata: lessonAuthority('read'),\n  },\n\n  createMaterial: {\n    method: 'post',\n    path: '/educational/materials',\n    request t: z.iso.datetime(),\n});\n\nconst UserProfileSchema = z.record(z.string(), z.any());\n\nconst RewardsSnapshotSchema = z.strictObject({\n  id: z.uuid().optional(),\n  user_id: z.uuid().optional(),\n  points: z.number(),\n  badges: z.array(z.string()),\n  created_at: z.iso.datetime().nullable().optional(),\n  updated_at: z.iso.datetime().nullable().optional(),\n});\n\nconst UserGrowthStateSchema = z.record(z.string(), z.any());\n\nconst WhisperedMomentSchema = z.strictObject({\n  key: z.string(),\n  name_en: z.string(),\n  name_si: z.string(),\n  awarded_at: z.iso.datetime(),\n});\n\nconst JourneySnapshotSchema = z.strictObject({\n  as_of: z.string().nullable(),\n  rewards: RewardsSnapshotSchema.nullable(),\n  growth: UserGrowthStateSchema.nullable(),\n  whispered_moments: z.array(WhisperedMomentSchema),\n});\n\nconst _JourneyEventSchema = z.strictObject({\n  id: z.uuid(),\n  timestamp: z.iso.datetime(),\n  source: z.enum(['reward', 'growth', 'moment']),\n  operation: z.enum(['insert', 'update', 'delete']).optional(),\n  title: z.string(),\n  metadata: z.record(z.string(), z.any()).optional(),\n  snapshot: z.record(z.string(), z.any()).optional(),\n});\n\nconst _ProfileHistoryEntrySchema = z.strictObject({\n  id: z.uuid(),\n  operation: z.enum(['insert', 'update', 'delete']),\n  recorded_at: z.iso.datetime(),\n  recorded_by: z.uuid().nullable().optional(),\n  snapshot: z.record(z.string(), z.any()),\n});\n\nconst _CommunityProfileSchema = z.strictObject({\n  id: z.uuid(),\n  name: z.string(),\n  description: z.string().nullable().optional(),\n  visibility: z.string().nullable().optional(),\n  member_count: z.number().nullable().optional(),\n  creator_id: z.uuid().nullable().optional(),\n});\n\nconst PulseMetricsSchema = z.strictObject({\n  resonance_score: z.number(),\n  aggregated_mood: z.enum(['joy', 'peace', 'focus', 'struggle', 'unknown']),\n  trend: z.enum(['rising', 'stable', 'failing']),\n  participation_rate: z.number(),\n  top_subjects: z.array(z.string()),\n  interaction_volume: z.number(),\n});\n\n/**\n * Profile Domain Port\n */\nexport const profileContract = {\n  getUserProfile: {\n    method: 'get',\n    path: '/profile/users/:id',\n    request: {\n      params: z.strictObject({ id: z.uuid() }),\n    },\n    responses: {\n      200: { schema: UserProfileSchema.nullable(), description: 'User profile retrieved' },\n    },\n    metadata: profileAuthority('read', 'User'),\n  },\n\n  updateProfile: {\n    method: 'patch',\n    path: '/profile/users/:id',\n    request: {\n      params: z.strictObject({ id: CanonicalAccountIdSchema }),\n      body: UserProfilePatchSchema,\n    },\n    responses: {\n      200: { schema: UserProfileSchema, description: 'User profile updated' },\n    },\n    metadata: profileAuthority('update', 'User'),\n  },\n\n  getJourneySnapshot: {\n    method: 'get',\n    path: '/profile/users/:id/journey',\n    request: {\n      params: z.strictObject({ id: z.uuid() }),\n      query: z.strictObject({\n        at: z.string().optional(),\n        view_date: z.string().optional(),\n        view_scale: z.enum(['day', 'week', 'month', 'year', 'custom']).optional(),\n      }),\n    },\n    responses: {\n      200: { schema: JourneySnapshotSchema, description: 'Journey snapshot retrieved' },\n    },\n    metadata: profileAuthority('read', 'User'),\n  },\n\n  getSchoolPulse: {\n    method: 'get',\n    path: '/profile/schools/:id/pulse',\n    request: {\n      params: z.strictObject({ id: z.uuid() }),\n      query: z.strictObject({\n        view_date: z.string(),\n        view_scale: z.enum(['day', 'week', 'month', 'year', 'custom']).optional(),\n      }),\n    },\n    responses: {\n      200: { schema: PulseMetricsSchema, description: 'School pulse metrics retrieved' },\n    },\n    metadata: profileAuthority('read', 'School'),\n  },\n} as const satisfies SovereignContract;\n","layer":2,"isBedrock":false,"downstreamCount":3,"upstreamCount":1},{"path":"packages/core/src/logic/workspace/layoutPatch.ts","name":"layoutPatch.ts","dir":"packages/core/src/logic/workspace","loc":255,"fns":[{"name":"hashWorkspaceLayoutPatchGroup","isExported":true,"params":"value: WorkspaceLayoutPatchValues[WorkspaceLayoutPatchGroup],"}],"interfaces":[{"name":"WorkspaceLayoutPatchAssessment","isExported":true}],"types":[{"name":"WorkspaceLayoutPatchGroup","isExported":true},{"name":"WorkspaceLayoutPatchValues","isExported":true},{"name":"WorkspaceLayoutPatch","isExported":true},{"name":"WorkspaceLayoutPatchSource","isExported":true}],"constants":[{"name":"WorkspaceLayoutPatchGroupSchema","isExported":true},{"name":"WorkspaceLayoutPatchZoneValueSchema","isExported":true},{"name":"WorkspaceLayoutArrangementSchema","isExported":true},{"name":"WorkspaceLayoutPatchAppearanceSchema","isExported":true},{"name":"WorkspaceLayoutPatchValuesSchema","isExported":true},{"name":"WorkspaceLayoutPatchChangeSchema","isExported":false},{"name":"WorkspaceLayoutPatchSchema","isExported":true},{"name":"parsed","isExported":false},{"name":"baselineValues","isExported":false},{"name":"candidateValues","isExported":false},{"name":"baselineHash","isExported":false},{"name":"candidateHash","isExported":false},{"name":"parsedPatch","isExported":false},{"name":"currentValues","isExported":false},{"name":"changedGroups","isExported":false},{"name":"currentHash","isExported":false},{"name":"parsedPatch","isExported":false},{"name":"appearanceChange","isExported":false},{"name":"nextAppearance","isExported":false},{"name":"baseValues","isExported":false},{"name":"currentValues","isExported":false}],"imports":[{"source":"@repo/core/lib/sync/idempotency","canonical":"packages/core/src/lib/sync/idempotency.ts","isTypeOnly":false,"symbols":["getConsistentIdempotencyKey"]},{"source":"@repo/core/logic/schemas/workspace-layout.schema","canonical":"packages/core/src/logic/schemas/workspace-layout.schema.ts","isTypeOnly":false,"symbols":["WorkspaceAppearanceSchema","WorkspaceLayoutTargetSchema","WorkspaceWallpaperSchema"]},{"source":"@repo/core/types","canonical":"packages/core/src/types/index.ts","isTypeOnly":true,"symbols":["WorkspaceAppearance","WorkspaceLayout"]}],"content":"import { getConsistentIdempotencyKey } from '@repo/core/lib/sync/idempotency';\nimport {\n  WorkspaceAppearanceSchema,\n  WorkspaceLayoutTargetSchema,\n  WorkspaceWallpaperSchema,\n} from '@repo/core/logic/schemas/workspace-layout.schema';\nimport type { WorkspaceAppearance, WorkspaceLayout } from '@repo/core/types';\nimport { z } from 'zod';\n\nexport const WorkspaceLayoutPatchGroupSchema = z.enum(['arrangement', 'appearance', 'groups']);\n\n/**\n * Retains the legacy row contract while patch migration is in progress. The\n * server must reject invalid values before applying a patch; projection must\n * never silently discard them.\n */\nexport const WorkspaceLayoutPatchZoneValueSchema = z.union([z.string(), z.number().finite()]);\n\nexport const WorkspaceLayoutArrangementSchema = z.object({\n  order: z.array(z.string()),\n  hidden: z.array(z.string()),\n  pinned: z.array(z.string()),\n  zoneBySurface: z.record(z.string(), WorkspaceLayoutPatchZoneValueSchema),\n});\n\nexport const WorkspaceLayoutPatchAppearanceSchema = z.object({\n  preset: WorkspaceAppearanceSchema.shape.preset,\n  motion: WorkspaceAppearanceSchema.shape.motion,\n  wallpaper: WorkspaceWallpaperSchema.nullable(),\n});\n\nexport const WorkspaceLayoutPatchValuesSchema = z.object({\n  arrangement: WorkspaceLayoutArrangementSchema,\n  appearance: WorkspaceLayoutPatchAppearanceSchema,\n  groups: z.array(z.string()),\n});\n\nconst WorkspaceLayoutPatchChangeSchema = z.object({\n  baseHash: z.string().regex(/^[a-f0-9]{64}$/),\n  value: z.unknown(),\n});\n\nexport const WorkspaceLayoutPatchSchema = z\n  .object({\n    userId: z.uuid(),\n    workspaceId: z.string().min(1),\n    layoutTarget: WorkspaceLayoutTargetSchema,\n    operationId: z.uuid(),\n    idempotencyKey: z.string().trim().min(1).max(256),\n    inputHash: z.string().regex(/^[a-f0-9]{64}$/),\n    baseRevision: z.number().int().nonnegative(),\n    changes: z\n      .object({\n        arrangement: WorkspaceLayoutPatchChangeSchema.extend({\n          value: WorkspaceLayoutArrangementSchema,\n        }).optional(),\n        appearance: WorkspaceLayoutPatchChangeSchema.extend({\n          value: WorkspaceLayoutPatchAppearanceSchema,\n        }).optional(),\n        groups: WorkspaceLayoutPatchChangeSchema.extend({\n          value: z.array(z.string()),\n        }).optional(),\n      })\n      .strict(),\n  })\n  .strict()\n  .refine((patch) => Object.keys(patch.changes).length > 0, {\n    message: 'A workspace layout patch must change at least one named group.',\n    path: ['changes'],\n  });\n\nexport type WorkspaceLayoutPatchGroup = z.infer<typeof WorkspaceLayoutPatchGroupSchema>;\nexport type WorkspaceLayoutPatchValues = z.infer<typeof WorkspaceLayoutPatchValuesSchema>;\nexport type WorkspaceLayoutPatch = z.infer<typeof WorkspaceLayoutPatchSchema>;\n\nexport type WorkspaceLayoutPatchSource<TSurfaceId extends string = string> = Omit<\n  WorkspaceLayout<TSurfaceId>,\n  'appearance' | 'zoneBySurface'\n> & {\n  zoneBySurface: Partial<Record<TSurfaceId, string | number>>;\n  appearance?: WorkspaceAppearance | WorkspaceLayoutPatchValues['appearance'];\n};\n\nexport interface WorkspaceLayoutPatchAssessment {\n  safe: boolean;\n  conflictingGroups: WorkspaceLayoutPatchGroup[];\n  currentHashes: Partial<Record<WorkspaceLayoutPatchGroup, string>>;\n}\n\nexport function projectWorkspaceLayoutPatchValues<TSurfaceId extends string>(\n  layout: WorkspaceLayoutPatchSource<TSurfaceId>,\n): WorkspaceLayoutPatchValues {\n  return WorkspaceLayoutPatchValuesSchema.parse({\n    arrangement: {\n      order: [...layout.order],\n      hidden: [...layout.hidden],\n      pinned: [...layout.pinned],\n      zoneBySurface: Object.fromEntries(\n        Object.entries(layout.zoneBySurface).map(([surfaceId, zone]) => {\n          const parsed = WorkspaceLayoutPatchZoneValueSchema.safeParse(zone);\n          if (!parsed.success) {\n            throw new TypeError(`Workspace layout zone is not patch-compatible: ${surfaceId}`);\n          }\n          return [surfaceId, parsed.data];\n        }),\n      ),\n    },\n    appearance: {\n      ...WorkspaceAppearanceSchema.parse(\n        layout.appearance?.wallpaper === null\n          ? { ...layout.appearance, wallpaper: undefined }\n          : (layout.appearance ?? {}),\n      ),\n      wallpaper: layout.appearance?.wallpaper ?? null,\n    },\n    groups: [...(layout.groupOrder ?? [])],\n  });\n}\n\nexport function projectWorkspaceLayoutPatchGroup<TSurfaceId extends string>(\n  layout: WorkspaceLayoutPatchSource<TSurfaceId>,\n  group: WorkspaceLayoutPatchGroup,\n): WorkspaceLayoutPatchValues[WorkspaceLayoutPatchGroup] {\n  return projectWorkspaceLayoutPatchValues(layout)[group];\n}\n\nexport async function hashWorkspaceLayoutPatchGroup(\n  value: WorkspaceLayoutPatchValues[WorkspaceLayoutPatchGroup],\n): Promise<string> {\n  return getConsistentIdempotencyKey(value, 'workspace-layout-group');\n}\n\nexport async function findChangedWorkspaceLayoutPatchGroups<TSurfaceId extends string>(\n  baseline: WorkspaceLayoutPatchSource<TSurfaceId>,\n  candidate: WorkspaceLayoutPatchSource<TSurfaceId>,\n): Promise<WorkspaceLayoutPatchGroup[]> {\n  const baselineValues = projectWorkspaceLayoutPatchValues(baseline);\n  const candidateValues = projectWorkspaceLayoutPatchValues(candidate);\n  const changed: WorkspaceLayoutPatchGroup[] = [];\n  for (const group of ['arrangement', 'appearance', 'groups'] as const) {\n    const baselineHash = await hashWorkspaceLayoutPatchGroup(baselineValues[group]);\n    const candidateHash = await hashWorkspaceLayoutPatchGroup(candidateValues[group]);\n    if (baselineHash !== candidateHash) changed.push(group);\n  }\n  return changed;\n}\n\n/**\n * Recomputes group hashes from the authoritative row. The server must call\n * this while holding its row lock; clients may use it only for preview UX.\n */\nexport async function assessWorkspaceLayoutPatch<TSurfaceId extends string>(\n  layout: WorkspaceLayoutPatchSource<TSurfaceId>,\n  patch: WorkspaceLayoutPatch,\n): Promise<WorkspaceLayoutPatchAssessment> {\n  const parsedPatch = WorkspaceLayoutPatchSchema.parse(patch);\n  const currentValues = projectWorkspaceLayoutPatchValues(layout);\n  const changedGroups = Object.keys(parsedPatch.changes) as WorkspaceLayoutPatchGroup[];\n  const currentHashes: Partial<Record<WorkspaceLayoutPatchGroup, string>> = {};\n  const conflictingGroups: WorkspaceLayoutPatchGroup[] = [];\n\n  for (const group of changedGroups) {\n    const currentHash = await hashWorkspaceLayoutPatchGroup(currentValues[group]);\n    currentHashes[group] = currentHash;\n    if (currentHash !== parsedPatch.changes[group]?.baseHash) {\n      conflictingGroups.push(group);\n    }\n  }\n\n  return {\n    safe: conflictingGroups.length === 0,\n    conflictingGroups,\n    currentHashes,\n  };\n}\n\nexport function applyWorkspaceLayoutPatchValues<TSurfaceId extends string>(\n  layout: WorkspaceLayoutPatchSource<TSurfaceId>,\n  patch: WorkspaceLayoutPatch,\n): WorkspaceLayoutPatchSource {\n  const parsedPatch = WorkspaceLayoutPatchSchema.parse(patch);\n  const appearanceChange = parsedPatch.changes.appearance?.value;\n  const nextAppearance = appearanceChange\n    ? appearanceChange.wallpaper === null\n      ? { preset: appearanceChange.preset, motion: appearanceChange.motion, wallpaper: null }\n      : {\n          preset: appearanceChange.preset,\n          motion: appearanceChange.motion,\n          wallpaper: appearanceChange.wallpaper,\n        }\n    : undefined;\n  return {\n    ...layout,\n    ...(parsedPatch.changes.arrangement\n      ? {\n          order: [...parsedPatch.changes.arrangement.value.order],\n          hidden: [...parsedPatch.changes.arrangement.value.hidden],\n          pinned: [...parsedPatch.changes.arrangement.value.pinned],\n          zoneBySurface: { ...parsedPatch.changes.ar mpotencyKey(\n  scope: string,\n  eventType: string,\n  variables: unknown,\n  studentId?: string,\n): Promise<string> {\n  const salt = studentId ? `${studentId}:${eventType}` : eventType;\n  const stableVars = sortObject(variables);\n  const inputString = `${scope}:${salt}:${JSON.stringify(stableVars)}`;\n\n  const encoder = new TextEncoder();\n  const data = encoder.encode(inputString);\n  const hashBuffer = await crypto.subtle.digest('SHA-256', data);\n\n  // Convert buffer to hex string\n  const hashArray = Array.from(new Uint8Array(hashBuffer));\n  return hashArray.map((b) => b.toString(16).padStart(2, '0')).join('');\n}\n\n/**\n * Produces the canonical deterministic key for a retryable batch. Objects are\n * recursively key-sorted so equivalent payloads produce the same key.\n */\nexport async function getConsistentIdempotencyKey(\n  payload: IdempotencyPayload,\n  namespace?: string,\n): Promise<string> {\n  const stablePayload = sortObject(payload);\n  const input = `${namespace ?? 'default'}:${JSON.stringify(stablePayload)}`;\n  const data = new TextEncoder().encode(input);\n  const hashBuffer = await crypto.subtle.digest('SHA-256', data);\n  return Array.from(new Uint8Array(hashBuffer))\n    .map((byte) => byte.toString(16).padStart(2, '0'))\n    .join('');\n}\n\n/**\n * Deeply sorts an object's keys to ensure identical stringification.\n */\nfunction sortObject(obj: unknown): unknown {\n  if (obj === null || typeof obj !== 'object') {\n    return obj;\n  }\n\n  if (Array.isArray(obj)) {\n    return obj.map(sortObject);\n  }\n\n  const typedObj = obj as Record<string, unknown>;\n  // Own JSON keys such as __proto__ must remain data, not invoke a setter.\n  return Object.fromEntries(\n    Object.keys(typedObj)\n      .sort()\n      .map((key) => [key, sortObject(typedObj[key])]),\n  );\n}\n","layer":0,"isBedrock":true,"downstreamCount":0,"upstreamCount":1},{"path":"packages/core/src/logic/schemas/workspace-layout.schema.ts","name":"workspace-layout.schema n    isAnonymous: input.isAnonymous ?? false,\n    hasGlobalAccess: input.hasGlobalAccess ?? false,\n    isPersonal: input.isPersonal ?? false,\n  };\n};\n\nexport const UserContextSchema = z.preprocess(\n  normalizeUserContextInput,\n  z.object({\n    userId: z.string().nullish().default(null),\n    email: z.string().email().nullish().default(null),\n\n    // Sovereign ReBAC Context\n    bonds: z\n      .array(BondSchema)\n      .nullish()\n      .transform((value) => value ?? []),\n\n    primaryCapacity: z.string().nullish().default(null),\n    activeBond: BondSchema.nullish().default(null),\n    activeEntityId: z.string().nullish().default(null),\n    activeEntityType: z.string().nullish().default(null),\n    schoolType: z.string().nullish().default(null),\n    onboarding_completed: z.boolean().nullish().default(false),\n    effective_entitlement_scope: z\n      .enum(['individual', 'active_bond', 'active_entity', 'add_on'])\n      .nullish()\n      .default('individual'),\n    effective_entitlement_tier: z.enum(['FREE', 'PRO', 'INSTITUTIONAL']).nullish().default('FREE'),\n    capacity: CapacitySchema.nullish().default(null),\n    traits: z.array(z.string()).nullish().default([]),\n\n    schoolId: z.uuid().nullish().default(null),\n    tenancyName: z.string().nullish().default(null),\n    tenancy: z\n      .object({\n        kind: TenantKindSchema.default('customer'),\n        isPersonal: z.boolean().default(false),\n      })\n      .nullish()\n      .default(null),\n    tenantKind: TenantKindSchema.nullish().default('customer'),\n\n    sectionId: z.uuid().nullish().default(null),\n    gradeId: z.uuid().nullish().default(null),\n    classroomId: z.uuid().nullish().default(null),\n\n    // Metadata & Flags\n    isAnonymous: z.boolean().nullish().default(false),\n    isLocalOnly: z.boolean().nullish().default(false),\n    hasGlobalAccess: z.boolean().nullish().default(false),\n    isPersonal: z.boolean().nullish().default(false),\n\n    tier: z.string().nullish().default('free'),\n    citizenship: z\n      .preprocess(\n        (value) => (value === 'WANDERER' ? 'THIRD_CLASS' : value),\n        z.enum(['THIRD_CLASS', 'SECOND_CLASS', 'FIRST_CLASS']),\n      )\n      .default('SECOND_CLASS'),\n    pricing_tier: z.enum(['FREE', 'PRO', 'INSTITUTIONAL']).default('FREE'),\n    features: z\n      .array(z.string())\n      .nullish()\n      .transform((value) => value ?? []),\n    flags: z\n      .record(z.string(), z.union([z.boolean(), z.string()]))\n      .nullish()\n      .transform((value) => value ?? {}),\n  }),\n);\n\nexport type UserContext = z.infer<typeof UserContextSchema>;\nexport type TenantKind = z.infer<typeof TenantKindSchema>;\n","layer":2,"isBedrock":false,"downstreamCount":1,"upstreamCount":1}];

    const nodeMap = new Map();
    for (const n of nodes) nodeMap.set(n.path, n);

    let activeFilePath = nodes[0].path;

    function renderTree(filterText = '') {
      const tree = document.getElementById('file-tree');
      tree.innerHTML = '';
      const filtered = nodes.filter(n => 
        n.name.toLowerCase().includes(filterText.toLowerCase()) ||
        n.fns.some(f => f.name.toLowerCase().includes(filterText.toLowerCase())) ||
        n.types.some(t => t.name.toLowerCase().includes(filterText.toLowerCase()))
      );

      for (const n of filtered) {
        const item = document.createElement('div');
        item.className = 'tree-item' + (n.path === activeFilePath ? ' active' : '');
        item.onclick = () => selectFile(n.path);
        item.innerHTML = `
          <span class="tree-name">${n.name}</span>
          <span class="tree-badge ${n.isBedrock ? 'bedrock' : ''}">
            ${n.isBedrock ? 'BEDROCK' : 'L' + n.layer}
          </span>
        `;
        tree.appendChild(item);
      }
    }

    function filterTree() {
      const q = document.getElementById('search-box').value;
      renderTree(q);
    }

    function selectFile(filePath) {
      activeFilePath = filePath;
      renderTree(document.getElementById('search-box').value);
      renderWorkspace();
    }

    function renderWorkspace() {
      const ws = document.getElementById('workspace');
      ws.innerHTML = '';
      const focusNode = nodeMap.get(activeFilePath);
      if (!focusNode) return;

      document.getElementById('current-file-label').innerHTML = `
        Focus: <span style="color:#38bdf8">${focusNode.name}</span> 
        <span style="font-size:12px; color:#94a3b8; font-weight:normal; margin-left: 10px;">
          (Layer ${focusNode.layer} • ${focusNode.loc} lines • ${focusNode.downstreamCount} imports • ${focusNode.upstreamCount} callers)
        </span>
      `;

      // Render Focus ERD Table
      ws.appendChild(createERDTable(focusNode, 'focused'));

      // Render 1-hop downstream tables
      const downstreamFiles = edges.filter(e => e.from === focusNode.path).map(e => e.to);
      const uniqueDown = [...new Set(downstreamFiles)];
      for (const dPath of uniqueDown) {
        const dNode = nodeMap.get(dPath);
        if (dNode) ws.appendChild(createERDTable(dNode, 'downstream'));
      }
    }

    function createERDTable(node, statusClass = '') {
      const card = document.createElement('div');
      card.className = 'erd-table ' + statusClass;
      card.id = 'erd-' + node.path.replace(/[^a-zA-Z0-9]/g, '_');

      let fnsHtml = '';
      if (node.fns.length > 0) {
        fnsHtml = '<div class="erd-section"><div class="erd-section-title">Functions (' + node.fns.length + ')</div>' +
          node.fns.map(f => `<div class="erd-row fn"><span>${f.name}()</span><span class="erd-row-badge">${f.isExported ? 'pub' : 'priv'}</span></div>`).join('') +
          '</div>';
      }

      let typesHtml = '';
      const allTypes = [...node.interfaces, ...node.types];
      if (allTypes.length > 0) {
        typesHtml = '<div class="erd-section"><div class="erd-section-title">Types & Interfaces (' + allTypes.length + ')</div>' +
          allTypes.map(t => `<div class="erd-row type"><span>${t.name}</span><span class="erd-row-badge">${t.isExported ? 'pub' : 'priv'}</span></div>`).join('') +
          '</div>';
      }

      let importsHtml = '';
      if (node.imports.length > 0) {
        importsHtml = '<div class="erd-section"><div class="erd-section-title">Imports (' + node.imports.length + ')</div>' +
          node.imports.map(i => `<div class="erd-row" style="color:#94a3b8" onclick="selectFile('${i.canonical}')"><span>${i.canonical.split('/').pop()}</span><span class="erd-row-badge">${i.symbols.length} sym</span></div>`).join('') +
          '</div>';
      }

      card.innerHTML = `
        <div class="erd-header">
          <span class="erd-title">${node.name}</span>
          <span class="erd-layer">${node.isBedrock ? 'BEDROCK' : 'Layer ' + node.layer}</span>
        </div>
        ${fnsHtml}
        ${typesHtml}
        ${importsHtml}
      `;

      return card;
    }

    function traceBedrock() {
      const panel = document.getElementById('trace-panel');
      const content = document.getElementById('trace-flow-content');
      document.getElementById('trace-title').innerText = 'Downstream Lineage Trace to Bedrock for: ' + nodeMap.get(activeFilePath).name;

      const visitedPaths = [];
      function crawl(p, currentLineage) {
        const nexts = edges.filter(e => e.from === p).map(e => e.to);
        if (nexts.length === 0) {
          visitedPaths.push([...currentLineage, p]);
          return;
        }
        for (const nxt of nexts) {
          if (!currentLineage.includes(nxt)) {
            crawl(nxt, [...currentLineage, p]);
          }
        }
      }
      crawl(activeFilePath, []);

      content.innerHTML = visitedPaths.slice(0, 5).map(line => 
        '<div style="margin: 6px 0; width: 100%">' +
        line.map((step, idx) => {
          const n = nodeMap.get(step);
          return `<span class="trace-step ${n?.isBedrock ? 'style="border-color:#10b981; color:#34d399"' : ''}">${n?.name || step} (L${n?.layer ?? '?'})</span>` +
            (idx < line.length - 1 ? ' <span class="trace-arrow">➔</span> ' : '');
        }).join('') +
        '</div>'
      ).join('') || '<div>This file is already at bedrock! (0 downstream dependencies)</div>';

      panel.style.display = 'block';
    }

    function traceUpstream() {
      const panel = document.getElementById('trace-panel');
      const content = document.getElementById('trace-flow-content');
      document.getElementById('trace-title').innerText = 'Upstream Callers for: ' + nodeMap.get(activeFilePath).name;

      const callers = edges.filter(e => e.to === activeFilePath).map(e => nodeMap.get(e.from));
      content.innerHTML = callers.length > 0
        ? callers.map(c => `<span class="trace-step" style="border-color:#f59e0b; color:#fbbf24" onclick="selectFile('${c.path}')">${c.name} (Layer ${c.layer})</span>`).join('')
        : '<div>No upstream files in this subsystem import this file directly.</div>';

      panel.style.display = 'block';
    }

    function clearHighlights() {
      document.getElementById('trace-panel').style.display = 'none';
      renderWorkspace();
    }

    // Init
    renderTree();
    selectFile(activeFilePath);
  </script>
