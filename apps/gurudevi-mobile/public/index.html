<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Gurudevi</title>
    <!-- Expo reset -->
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>

    <!-- ─────────────────────────────────────────────────────────────
         Sanctuary Web Polish
         Design tokens: Saffron #D4843A · Vellum #F5EDD6 · Ink #2A2318
         Shadow Violet rgba(107,100,128,x) — no grey/black shadows
         ───────────────────────────────────────────────────────────── -->
    <style id="sanctuary-web">

      /* Smooth scrolling globally */
      * { scroll-behavior: smooth; }

      /* ── Saffron focus ring (replaces browser default blue) ─────── */
      *:focus-visible {
        outline: 2.5px solid #D4843A;
        outline-offset: 3px;
        border-radius: 6px;
      }
      *:focus:not(:focus-visible) { outline: none; }

      /* ── Text selection colours ──────────────────────────────────── */
      ::selection {
        background-color: rgba(212, 132, 58, 0.25);
        color: #2A2318;
      }

      /* ── Custom scrollbar — Saffron thumb on Vellum track ────────── */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgba(212, 132, 58, 0.35);
        border-radius: 100px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(212, 132, 58, 0.65);
      }
      /* Firefox */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(212, 132, 58, 0.35) transparent;
      }

      /* ── Cursor improvements ─────────────────────────────────────── */
      [role="button"], button, [tabindex] { cursor: pointer; }

      /* ── Prevent text size adjustment on mobile web ──────────────── */
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

      /* ── Smooth font rendering ───────────────────────────────────── */
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      /* ── Disable tap highlight on mobile web ─────────────────────── */
      * { -webkit-tap-highlight-color: transparent; }

      /* ── Input autofill — match Vellum palette ───────────────────── */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus {
        -webkit-box-shadow: 0 0 0 1000px #FAF7ED inset;
        -webkit-text-fill-color: #2A2318;
        caret-color: #2A2318;
        transition: background-color 5000s ease-in-out 0s;
      }

    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run Gurudevi.</noscript>
    <div id="root"></div>
  </body>
</html>
