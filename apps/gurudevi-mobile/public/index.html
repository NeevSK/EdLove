    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Gurudevi Education Ecology Platform",

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "NeevSK",
        "url": "https://gurudevi.app",

    <!-- ── Zero-Flash Theme Init ─────────────────────────────────────────── -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('gurudevi-theme-preference');
          var theme = stored || 'system';
          var resolved = theme;
          if (theme === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.colorScheme = resolved;
          document.documentElement.classList.toggle('dark', resolved === 'dark');

          // Semantic Web & Machine Discovery Engine
          window.__GURUDEVI_ECOSYSTEM__ = {
            version: '2026.1.0',
            domain: 'education-ecology',
            sovereignty: 'zero-telemetry-default',
            capabilities: [
              'local-first-storage',
              'offline-resilience',
              'community-resonance',
              'knowledge-sanctuary',
              'ai-pedagogical-assistance'
            ],
            manifesto: 'https://gurudevi.app/about',
            agent_policy: 'empower'
          };
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts — loaded here (not inside React) to prevent FOUC on theme change -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" />

    <!-- Expo root element reset -->
    <style id="expo-reset">
      html, body { height: 100%; margin: 0; padding: 0; }
      /* Changed from overflow:clip to overflow:hidden - clip was blocking pointer events */
      body { overflow: hidden; pointer-events: auto; }
      #root { display: flex; height: 100%; flex: 1; flex-direction: column; pointer-events: auto; }
    </style>

    <!--
    =========================================================================
    GURUDEVI SANCTUARY WEB POLISH
    Design laws:
      Background: Vellum #F5EDD6  never pure white
      Text: Ink #2A2318  never pure black
      Primary: Saffron #D4843A
      Shadows: rgba(107,100,128,x)  ONLY Shadow Violet, never grey/black
    =========================================================================
    -->
    <style id="sanctuary-web">

      /* Global */
      * { scroll-behavior: smooth; box-sizing: border-box; }
      /* Global font stack with Sinhala/Tamil fallbacks */
      :root {
        --font-main: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        --font-sinhala: 'Noto Sans Sinhala', sans-serif;
        --font-tamil: 'Noto Sans Tamil', sans-serif;
      }

      * { 
        font-family: var(--font-main);
      }

      /* Native script support */
      :lang(si) { font-family: var(--font-sinhala); }
      :lang(ta) { font-family: var(--font-tamil); }

      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      * { -webkit-tap-highlight-color: transparent; }

      /* Skip to content link - screen reader and keyboard accessibility */
      .skip-link {
        position: absolute;
        top: -100px;
        left: 16px;
        z-index: 50;
        padding: 8px 16px;
        background: #D4843A;
        color: #F5EDD6;
        border-radius: 0 0 8px 8px;
        font-weight: 700;
        font-size: 14px;
        text-decoration: none;
        transition: top 0.15s;
      }
      .skip-link:focus { top: 0; }

      /* Saffron focus ring */
      *:focus-visible {
        outline: 2.5px solid #D4843A;
        outline-offset: 3px;
        border-radius: 6px;
      }
      *:focus:not(:focus-visible) { outline: none; }

      /* Text selection - warm saffron tint */
      ::selection { background-color: rgba(212,132,58,0.22); color: #2A2318; }

      /* Custom scrollbar - saffron thumb on transparent track */
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgba(212,132,58,0.30);
        border-radius: 100px;
        transition: background 0.2s;
      }
      ::-webkit-scrollbar-thumb:hover { background: rgba(212,132,58,0.60); }
      * { scrollbar-width: thin; scrollbar-color: rgba(212,132,58,0.30) transparent; }



      /* Input autofill - stay warm */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus {
        -webkit-box-shadow: 0 0 0 1000px #FAF7ED inset;
        -webkit-text-fill-color: #2A2318;
        caret-color: #2A2318;
        transition: background-color 5000s ease-in-out 0s;
      }

      /*
      ========================================================================
      TEMPORAL LIVING BACKGROUND
      Phase-aware gradient that shifts with the time of day.
      Transitions smoothly over 10 seconds when phase changes.
      ========================================================================
      */
      html {
        transition: background 10s ease;
        background: linear-gradient(160deg, #F5EDD6 0%, #FAF7ED 100%);
      }
      html.phase-predawn   { background: linear-gradient(160deg, #1A1610 0%, #0F0D0A 60%, #1A1610 100%); }
      html.phase-dawn      { background: linear-gradient(160deg, #FFF0D0 0%, #F5E8C0 40%, #F5EDD6 100%); }
      html.phase-morning   { background: linear-gradient(160deg, #F5EDD6 0%, #FAF7ED 60%, #F0EBD8 100%); }
      html.phase-midday    { background: linear-gradient(160deg, #EEF4F5 0%, #F5EDD6 50%, #FAF7ED 100%); }
      html.phase-afternoon { background: linear-gradient(160deg, #FAF3E0 0%, #F5EDD6 50%, #FDF0D8 100%); }
      html.phase-evening   { background: linear-gradient(160deg, #F5E8C8 0%, #F0D8A8 40%, #E8D0A0 100%); }
      html.phase-dusk      { background: linear-gradient(160deg, #3D2E1C 0%, #2A2318 60%, #1A1610 100%); }
      html.phase-night     { background: linear-gradient(160deg, #1A1610 0%, #0F0D0A 50%, #1A1610 100%); }

      /*
      ========================================================================
      SANCTUARY BREATHING - background layer only, not the React app

      The breathing animation targets ONLY #bg-breathe - a fixed element
      sitting behind #root with pointer-events:none.

      KEY CHANGE from the previous version:
        OLD: filter:brightness() on body  => entire React tree repainted => "earthquake"
        NEW: opacity on isolated bg div   => GPU-composited, zero layout impact

      Duration 14s (was 5s), amplitude 0.97-1.0 (was 1.0-1.018):
      A whisper, not a shout.
      ========================================================================
      */
      @keyframes sanctuaryBreathe {
        0%   { opacity: 1.00; }
        50%  { opacity: 0.97; }
        100% { opacity: 1.00; }
      }

      #bg-breathe {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background: inherit;
        animation: sanctuaryBreathe 14s ease-in-out infinite;
        will-change: opacity;
      }



      /*
      ========================================================================
      ACCESSIBILITY - prefers-reduced-motion
      Users who have requested reduced motion (vestibular disorders, motion
      sensitivity) get a calmer experience: no particles, no breathing,
      instant background transitions.
      ========================================================================
      */
      @media (prefers-reduced-motion: reduce) {
        html { transition: none; }
        #bg-breathe { animation: none; }
        * { scroll-behavior: auto; }
      }

    </style>

    <!--
    =========================================================================
    DARK MODE FOUC PREVENTION
    Reads themeMode from Zustand's persisted localStorage BEFORE React mounts.
    Sets data-theme="dark" on <html> so CSS variables resolve correctly on
    the very first paint \u2014 zero flash of wrong theme.
    =========================================================================
    -->
    <script>
      (() => {
        try {
          var raw = localStorage.getItem('gurudevi-storage');
          if (raw) {
            var state = JSON.parse(raw);
            var mode = (state?.state?.themeMode) || 'system';
            if (mode === 'dark') {
              document.documentElement.setAttribute('data-theme', 'dark');
            } else if (mode === 'light') {
              document.documentElement.setAttribute('data-theme', 'light');
            } else {
              // system \u2014 match prefers-color-scheme
              if (window.matchMedia?.('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
              }
            }
          }
        } catch (e) {}
      })();
    </script>

    <!--
    =========================================================================
    TEMPORAL PHASE INITIALISER
    Reads the current hour BEFORE React loads and sets the correct phase
    class on <html> - zero first-paint flicker.
    =========================================================================
    -->
    <script>
      (() => {
        var h = new Date().getHours();
        var phase =
          h < 4  ? 'night'     :
          h < 6  ? 'predawn'   :
          h < 8  ? 'dawn'      :
          h < 12 ? 'morning'   :
          h < 15 ? 'midday'    :
          h < 18 ? 'afternoon' :
          h < 20 ? 'evening'   :
          h < 22 ? 'dusk'      : 'night';
        document.documentElement.classList.add(`phase-${phase}`);
      })();
    </script>

    <!--
    =========================================================================
    SPA DEEP LINK RESTORER (companion to public/404.html)
    When GitHub Pages serves 404.html for a deep link, that page encodes the
    original path as ?p=<encoded> and redirects to root.  This script detects
    that param and uses history.replaceState() to restore the original URL
    BEFORE React/React-Navigation mounts, so the linking config resolves the
    correct screen on first paint.
    =========================================================================
    -->
    <script>
      (() => {
        var search = window.location.search;
        if (search) {
          var match = search.match(/[?&]p=([^&]+)/);
          if (match) {
            var path = decodeURIComponent(match[1]);
            window.history.replaceState(null, '', path);
          }
        }
      })();
    </script>

  </head>

  <body>
    <!-- Skip-to-content link - first focusable element for keyboard users -->
    <a href="#root" class="skip-link">Skip to content</a>

    <!-- Background breathing layer - behind #root, opacity-only animation (no layout impact) -->
    <div id="bg-breathe" aria-hidden="true"></div>



    <noscript>

    <div id="root"></div>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((reg) => {
              console.log('[Gurudevi SW] Registered:', reg.scope);
            })
            .catch((err) => {
              console.warn('[Gurudevi SW] Registration failed:', err);
            });
        });
      }
    </script>
    <script>
      // Capture beforeinstallprompt for an in-app install button
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        document.dispatchEvent(new CustomEvent('pwa-installable'));
      });
      window.addEventListener('appinstalled', () => {
        window.__pwaInstallPrompt = null;
        document.dispatchEvent(new CustomEvent('pwa-installed'));
      });
    </script>
  </body>
</html>
