<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gurudevi</title>
    <!--
      Single-Page App redirect for GitHub Pages.

      When a user navigates directly to a deep link (e.g. /self, /library)
      GitHub Pages returns this 404.html instead of the SPA's index.html.

      This script stores the full path in sessionStorage, then redirects to
      the root (/) which loads the React app. The app's NavigationContainer
      linking config reads window.location and resolves the correct screen.

      Technique from: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var l = window.location;
      // Keep the full path so React Navigation can deep-link after mount
      var path = l.pathname + l.search + l.hash;
      // Redirect to root, passing the original path as query param
      l.replace(
        l.protocol + '//' + l.host + l.pathname.split('/').slice(0, 1).join('/') +
        '/?p=' + encodeURIComponent(path)
      );
    </script>
  </head>
  <body>
    <!-- Fallback while JS redirects -->
    <noscript>
      <p style="font-family:sans-serif;text-align:center;padding:40px;color:#2A2318">
        Redirecting to <a href="/">Gurudevi</a>…
      </p>
    </noscript>
  </body>
</html>
