name: gurudevi_flutter
description: "Gurudevi Flutter Client — Daily operational haven for teachers, students, and school leaders"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^18.1.4
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  powersync: ^2.6.2
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  drift_sqlite_async: ^0.3.0
  path_provider: ^2.1.4
  path: ^1.9.0
  dzod: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
