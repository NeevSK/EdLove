# Adds YAML Schema support for VSCode users with the YAML extension installed. This enables features like validation and autocompletion based on the provided schema.
# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json

# See https://docs.powersync.com/sync/advanced/compatibility
config:
  edition: 3

# Define Sync Streams to control which data is synced to each user
# Docs: https://docs.powersync.com/sync/streams/overview
streams:
  identity:
    auto_subscribe: true
    queries:
      - SELECT * FROM bonds WHERE user_id = auth.user_id()
      - SELECT * FROM school_memberships WHERE user_id = auth.user_id()
      - SELECT * FROM classroom_students WHERE student_id = auth.user_id()

  classroom_roster:
    auto_subscribe: true
    query: |
      SELECT cs.*
      FROM classroom_students cs
      JOIN classrooms c ON c.id = cs.classroom_id
      WHERE c.teacher_id = auth.user_id()
         OR cs.student_id = auth.user_id()
         OR EXISTS (
              SELECT 1
              FROM bonds b
              WHERE b.user_id = auth.user_id()
                AND b.entity_type = 'PLATFORM'
                AND b.capacity = 'admin'
            )
         OR EXISTS (
              SELECT 1
              FROM bonds b
              WHERE b.user_id = auth.user_id()
                AND b.entity_type = 'SCHOOL'
                AND b.entity_id = c.school_id
                AND b.capacity IN ('principal', 'sectionHead', 'section_head')
            )
